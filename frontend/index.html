function ThemePicker() {
  const themes = (window.GCTheme && window.GCTheme.THEMES) || [];
  const [open, setOpen] = useState(false);
  const [state, setState] = useState(() => (window.GCTheme ? window.GCTheme.getState() : { id: "petroleo", accent: null }));

  /* Esc fecha o painel do tema — é o que ele pediu. O clique de fora já tinha o
     véu fixed logo abaixo do botão, mas teclado precisa de listener no window:
     preso no painel, o Esc só fecharia se o foco estivesse dentro dele, e quem
     abre com o mouse nunca coloca foco lá. Mesmo desenho do menu de filtro e do
     menu de status. */
  useEffect(() => {
    if (!open) return undefined;
    const tecla = event => { if (event.key === "Escape") setOpen(false); };
    window.addEventListener("keydown", tecla);
    return () => window.removeEventListener("keydown", tecla);
  }, [open]);

  const current = themes.find(t => t.id === state.id) || themes[0];
  const accentColor = state.accent || (current && current.tokens["--accent"]) || "#2C5F72";
  const sync = () => setState(window.GCTheme.getState());

  const chooseTheme = (id) => { if (window.GCTheme.applyTheme(id)) sync(); };
  const chooseAccent = (hex) => { if (window.GCTheme.isValid(hex) && window.GCTheme.applyAccent(hex)) sync(); };
  const resetTheme = () => { window.GCTheme.reset(); sync(); };

  return (
    <div className="relative">
      <IconButton icon={Palette} label="Tema da tela" active={open} onClick={() => setOpen(v => !v)} />
      {open && (
        <>
          <div className="fixed inset-0 z-20" onClick={() => setOpen(false)} />
          <div className="absolute right-0 top-11 w-[calc(100vw-1.5rem)] sm:w-80 rounded-xl z-30 gc-pop-in gc-scroll overflow-y-auto" style={{ maxHeight: "min(72vh, 540px)", background: "var(--surface)", border: "1px solid var(--line)", boxShadow: "0 12px 32px rgba(0,0,0,0.2)" }}>
            <div className="px-4 py-3 font-semibold text-sm gc-display flex items-center justify-between gap-2" style={{ borderBottom: "1px solid var(--line)", position: "sticky", top: 0, background: "var(--surface)", zIndex: 1 }}>
              <span>Tema da tela</span>
              <button type="button" onClick={resetTheme} className="text-xs gc-focus rounded px-1.5 py-0.5" style={{ color: "var(--slate)" }}>Restaurar padrão</button>
            </div>
            <div className="p-4">
              <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 10 }}>
                {themes.map(t => <ThemeSwatch key={t.id} theme={t} active={t.id === state.id} onClick={() => chooseTheme(t.id)} />)}
              </div>
              <div style={{ borderTop: "1px solid var(--line)", marginTop: 16, paddingTop: 12 }}>
                <div className="text-xs font-medium" style={{ color: "var(--slate)", marginBottom: 8 }}>Cor de destaque</div>
                <label className="flex items-center gap-3 rounded-lg px-3 py-2 cursor-pointer" style={{ border: "1px solid var(--line-strong)" }}>
                  <input type="color" value={/^#[0-9a-fA-F]{6}$/.test(accentColor) ? accentColor : "#2C5F72"}
                    onChange={(e) => chooseAccent(e.target.value)}
                    className="gc-focus shrink-0"
                    style={{ width: 36, height: 36, padding: 0, borderRadius: 9999, background: "transparent", border: "1px solid var(--line-strong)", cursor: "pointer" }}
                    aria-label="Cor de destaque personalizada" />
                  <span className="text-sm" style={{ color: "var(--ink-soft)" }}>Personalizada</span>
                  <span className="ml-auto text-xs gc-mono" style={{ color: "var(--slate)" }}>{String(accentColor).toUpperCase()}</span>
                </label>
                {state.accent && (
                  <button type="button" onClick={() => { window.GCTheme.clearAccent(); sync(); }} className="text-xs gc-focus rounded px-1.5 py-1" style={{ color: "var(--slate)", marginTop: 8 }}>
                    Usar a cor de destaque do tema
                  </button>
                )}
              </div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* =========================================================================
   TROCA DE SENHA DEPOIS DE ENTRAR
   O formulário existe uma vez só e é usado em dois lugares: no painel que abre
   embaixo do nome no topo (qualquer tela) e na faixa do topo de quem ainda está
   com a senha inicial. Ele nunca abre janela por cima da tela que a pessoa está
   usando — os campos aparecem ali mesmo, embaixo do botão.
   Quem troca a senha continua logado: /auth/change-password devolve uma sessão
   nova, e a changePasswordThroughApi() já guarda essa sessão no lugar da antiga.
   ========================================================================= */
function PasswordChangeForm({ userId, onSuccess, onCancel, autoFocus }) {
  const [atual, setAtual] = useState("");
  const [nova, setNova] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);

  const enviar = async (event) => {
    event.preventDefault();
    if (salvando) return;
    if (!atual) { setErro("Informe sua senha atual."); return; }
    if (nova.length < 8) { setErro("A nova senha deve ter pelo menos 8 caracteres."); return; }
    if (nova !== confirmar) { setErro("A confirmação da senha não coincide."); return; }
    setErro("");
    setSalvando(true);
    try {
      const apiResult = await changePasswordThroughApi(userId, atual, nova);
      if (apiResult === null) {
        /* Backend em silêncio (modo local sem API): neste modo a senha mora no
           próprio navegador, então é aqui também que ela é trocada. */
        const conferido = await verifyPassword(userId, atual);
        if (!conferido.matches) {
          setErro("Senha atual incorreta.");
          return;
        }
        await savePermanentPassword(userId, nova);
      } else if (!apiResult.ok) {
        setErro(apiResult.message || "Não foi possível alterar a senha.");
        return;
      }
      /* Limpa as três caixas antes de avisar: nada fica digitado na tela. */
      setAtual(""); setNova(""); setConfirmar("");
      onSuccess();
    } catch (err) {
      console.error("Erro ao trocar senha:", err);
      setErro("Não foi possível salvar a nova senha. Tente novamente.");
    } finally {
      setSalvando(false);
    }
  };

  return (
    <form onSubmit={enviar} className="space-y-2.5">
      <Field label="Senha atual" required>
        <TextInput type="password" value={atual} onChange={(e) => setAtual(e.target.value)} autoFocus={autoFocus} placeholder="Digite sua senha atual" autoComplete="current-password" />
      </Field>
      <Field label="Nova senha" required hint="Mínimo de 8 caracteres.">
        <TextInput type="password" value={nova} onChange={(e) => setNova(e.target.value)} placeholder="Digite a nova senha" autoComplete="new-password" />
      </Field>
      <Field label="Confirmar nova senha" required>
        <TextInput type="password" value={confirmar} onChange={(e) => setConfirmar(e.target.value)} placeholder="Repita a nova senha" autoComplete="new-password" />
      </Field>
      {erro && <div className="text-xs" style={{ color: "var(--danger)" }}>{erro}</div>}
      <div className="flex items-center gap-2">
        <Button type="submit" className="flex-1" disabled={salvando || !atual || !nova || !confirmar}>
          {salvando ? "Salvando..." : "Salvar nova senha"}
        </Button>
        {onCancel && (
          <Button type="button" variant="ghost" size="sm" onClick={onCancel}>Cancelar</Button>
        )}
      </div>
    </form>
  );
}

/* Painel embaixo do nome: os dois botões têm rótulo escrito, porque ícone
   sozinho neste tamanho a pessoa não enxerga. */
function UserMenuPanel({ currentUser, onLogout, onPasswordChanged, onClose }) {
  const [abrindoSenha, setAbrindoSenha] = useState(false);
  /* Esc, como no painel do tema: se o formulário de senha estiver aberto ele
     volta para os dois botões; se já está nos botões, fecha o painel. O ouvinte
     mora aqui (e não no Topbar) porque só este componente sabe qual dos dois
     estados está na tela. */
  useEffect(() => {
    const tecla = event => {
      if (event.key !== "Escape") return;
      if (abrindoSenha) setAbrindoSenha(false); else onClose();
    };
    window.addEventListener("keydown", tecla);
    return () => window.removeEventListener("keydown", tecla);
  }, [abrindoSenha, onClose]);
  return (
    <div className="absolute right-0 top-11 rounded-xl z-30 gc-pop-in overflow-y-auto" style={{ width: "min(20rem, calc(100vw - 1.5rem))", maxHeight: 460, background: "var(--surface)", border: "1px solid var(--line)", boxShadow: "0 12px 32px rgba(23,25,28,0.12)" }}>
      <div className="px-4 py-3 flex items-center gap-2.5" style={{ borderBottom: "1px solid var(--line)" }}>
        <span className="w-8 h-8 rounded-full flex items-center justify-center font-semibold text-xs shrink-0" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}>
          {userName(currentUser)[0]}
        </span>
        <span className="min-w-0">
          <span className="block text-sm font-medium truncate">{userName(currentUser)}</span>
          <span className="block text-xs" style={{ color: "var(--slate)" }}>Sua conta neste CRM</span>
        </span>
        <button type="button" onClick={onClose} aria-label="Fechar" className="ml-auto w-7 h-7 rounded-lg flex items-center justify-center gc-focus shrink-0" style={{ color: "var(--slate)" }}>
          <X size={14} />
        </button>
      </div>
      {abrindoSenha ? (
        <div className="p-4">
          <div className="text-sm font-medium mb-3">Trocar senha</div>
          <PasswordChangeForm
            userId={currentUser}
            autoFocus
            onCancel={() => setAbrindoSenha(false)}
            onSuccess={() => { onPasswordChanged(); onClose(); }}
          />
        </div>
      ) : (
        <div className="p-1.5">
          <button type="button" onClick={() => setAbrindoSenha(true)}
            className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium text-left gc-focus gc-row-hover"
            style={{ color: "var(--ink)", background: "transparent", border: "none" }}>
            <LockIcon size={15} style={{ color: "var(--slate)" }} />
            <span className="flex-1">Trocar senha</span>
            <span className="text-xs" style={{ color: "var(--slate)" }}>Criar a minha</span>
          </button>
          <button type="button" onClick={onLogout}
            className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium text-left gc-focus gc-row-hover"
            style={{ color: "var(--ink-soft)", background: "transparent", border: "none" }}>
            <LogOut size={15} style={{ color: "var(--slate)" }} />
            <span className="flex-1">Sair</span>
            <span className="text-xs" style={{ color: "var(--slate)" }}>Escolher outro</span>
          </button>
        </div>
      )}
    </div>
  );
}

      </div>
      <div className="text-xs mt-2" style={{ color: "var(--slate)" }}>{label}</div>
      {sub && <div className="text-[11px] mt-0.5 gc-mono" style={{ color: "var(--slate)" }}>{sub}</div>}
    </button>
  );
}

const ATTENTION_ICON = { followup_overdue: Clock, followup_today: Clock, demo_expiring: Timer, proposal_stale: FileText, hot_no_action: Flame };

function AttentionCard({ item, lead, onOpenLead, onCompleteFollowup }) {
  const Icon = ATTENTION_ICON[item.type] || AlertTriangle;
  const tone = item.tone === "red" ? "danger" : "warn";
  return (
    <div className="rounded-xl p-4 gc-card gc-card-hover" style={{ background: "var(--surface)", border: "1px solid var(--line)" }}>
      <div className="flex items-start gap-3">
        <span className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style={{ background: `var(--${tone}-bg)`, color: `var(--${tone})` }}>
          <Icon size={15} />
        </span>
        <button onClick={() => onOpenLead(item.leadId, tabForAttentionType(item.type))} className="min-w-0 flex-1 text-left gc-focus rounded">
          <span className="block text-sm font-semibold truncate">{item.text}</span>
          <span className="block text-xs mt-0.5" style={{ color: "var(--slate)" }}>{item.sub}</span>
        </button>
      </div>
      <div className="flex items-center gap-1.5 flex-wrap mt-3 pl-11">
        {lead?.whatsapp && <QuickAction icon={MessageCircle} label="WhatsApp" href={waLink(lead.whatsapp)} />}
        {lead?.phone && <QuickAction icon={Phone} label="Ligar" href={telLink(lead.phone)} />}
        {item.type === "proposal_stale" && <QuickAction icon={FileText} label="Abrir proposta" onClick={() => onOpenLead(item.leadId, "proposta")} />}
        {(item.type === "followup_overdue" || item.type === "followup_today") && <QuickAction icon={CheckCircle2} label="Concluir" onClick={() => onCompleteFollowup(item)} />}
        {item.type === "hot_no_action" && <QuickAction icon={ArrowRight} label="Definir ação" onClick={() => onOpenLead(item.leadId, "geral")} />}
      </div>
    </div>
  );
}

function PipelineFunnel({ stages, onOpenStage }) {
  const max = Math.max(1, ...stages.map(s => s.count));
  return (
    <SectionCard title="Funil comercial">
      <div className="px-5 py-4 space-y-2.5">
        {stages.map(s => (
          <button key={s.key} onClick={() => onOpenStage(s.key)} className="w-full flex items-center gap-3 gc-focus rounded-lg py-1.5 px-1 -mx-1 gc-row-hover">
            <span className="text-sm w-24 shrink-0 text-left truncate">{s.label}</span>
            <div className="flex-1"><Bar value={s.count} max={max} tone={s.key === "perdido" ? "danger" : s.key === "fechado" ? "success" : "accent"} /></div>
            <span className="gc-mono text-sm w-5 text-right shrink-0">{s.count}</span>
            <span className="gc-mono text-xs w-20 text-right shrink-0 hidden sm:block" style={{ color: "var(--slate)" }}>{s.value > 0 ? fmtMoney(s.value) : ""}</span>
          </button>
        ))}
      </div>
    </SectionCard>
  );
}

/* Bloco de agenda no Dashboard: as mesmas informações do menu Agenda (eventos
   + retornos) resumidas para a tela inicial — contadores e a lista do que está
   atrasado, de hoje e dos próximos 7 dias, com concluir/cancelar num clique. */
function DashboardAgenda({ sel, leadById, onOpenLead, onOpenAgenda, dispatch, notify }) {
  const MAX_ROWS = 8;
  const items = sel.agendaHighlights;
  const visible = items.slice(0, MAX_ROWS);
  const hidden = items.length - visible.length;

  const counters = [
    { label: "Hoje", value: sel.agendaToday.length, tone: sel.agendaToday.length ? "blue" : "slate" },
    { label: "Atrasados", value: sel.agendaOverdue.length, tone: sel.agendaOverdue.length ? "red" : "slate" },
    { label: "Próximos 7 dias", value: sel.agendaUpcoming.length, tone: "slate" },
    { label: "Concluídos hoje", value: sel.agendaCompletedToday.length, tone: sel.agendaCompletedToday.length ? "green" : "slate" },
  ];

  return (
    <SectionCard
      title="Agenda"
      action={(
        <button type="button" onClick={onOpenAgenda} className="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-full gc-focus gc-pressable"
          style={{ background: "var(--surface-sunken)", color: "var(--ink-soft)", border: "1px solid var(--line)" }}>
          Abrir agenda <ArrowRight size={12} />
        </button>
      )}
    >
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 px-5 py-4" style={{ borderBottom: "1px solid var(--line)" }}>
        {counters.map(c => (
          <div key={c.label} className="rounded-xl px-3 py-2.5" style={{ background: "var(--surface-sunken)" }}>
            <div className="gc-mono text-lg font-medium leading-none" style={{ color: `var(--tone-${c.tone}-fg)` }}>{c.value}</div>
            <div className="text-[11px] mt-1.5" style={{ color: "var(--slate)" }}>{c.label}</div>
          </div>
        ))}
      </div>

      {visible.length === 0 ? (
        <EmptyState icon={CalendarDays} title="Nenhum evento pendente" hint="Agende reuniões, demonstrações, retornos, tarefas e compromissos no menu Agenda — eles aparecem aqui." />
      ) : visible.map(entry => {
        const lead = leadById[entry.leadId];
        const late = isAgendaOverdue(entry);
        const today = isAgendaToday(entry);
        return (
          <div key={`${entry.source}-${entry.id}`} className="flex items-start gap-3 px-5 py-3.5 flex-wrap sm:flex-nowrap" style={{ borderBottom: "1px solid var(--line)" }}>
            <div className="w-20 shrink-0">
              <div className="gc-mono text-xs font-medium" style={{ color: late ? "var(--danger)" : "var(--ink-soft)" }}>
                {today ? "Hoje" : fmtDate(entry.eventAt)}
              </div>
              <div className="gc-mono text-xs mt-1" style={{ color: "var(--slate)" }}>{fmtTime(entry.eventAt)}</div>
            </div>
            <div className="flex-1 min-w-0 space-y-1">
              <div className="flex items-center gap-2 flex-wrap">
                <Pill tone={agendaTypeTone(entry.type)}>{agendaTypeLabel(entry.type)}</Pill>
                {late && <Pill tone="red">Atrasado</Pill>}
                <span className="text-sm font-medium truncate">{entry.title}</span>
              </div>
              {lead ? (
                <button type="button" onClick={() => onOpenLead(lead.id, entry.source === "followup" ? "followups" : "geral")} className="text-xs gc-focus rounded block truncate" style={{ color: "var(--accent-ink)" }}>
                  {lead.company}
                </button>
              ) : null}
              {entry.notes && <p className="text-xs truncate" style={{ color: "var(--slate)" }}>{entry.notes}</p>}
              {entry.owner && <p className="text-[11px]" style={{ color: "var(--slate)" }}>Responsável: {userName(entry.owner)}</p>}
            </div>
            <div className="flex items-center gap-1 shrink-0 ml-auto">
              <IconButton icon={CheckCircle2} label="Concluir" onClick={() => setAgendaEntryStatus(dispatch, notify, entry, "concluido")} />
              <IconButton icon={Ban} label="Cancelar evento" onClick={() => setAgendaEntryStatus(dispatch, notify, entry, "cancelado")} />
            </div>
          </div>
        );
      })}

      {hidden > 0 && (
        <button type="button" onClick={onOpenAgenda} className="w-full text-center text-xs py-3 gc-focus gc-row-hover" style={{ color: "var(--accent-ink)" }}>
          +{hidden} evento(s) na agenda — ver todos
        </button>
      )}
    </SectionCard>
  );
}

function Dashboard({ db, sel, currentUser, onOpenLead, setView, setLeadsFilter, setLeadsViewMode, dispatch, notify }) {
  const tiles = [
    { label: "Leads abertos", value: sel.openLeads.length, icon: Users, onClick: () => { setLeadsFilter({ open: true }); setView("leads"); } },
    { label: "Oportunidades quentes", value: sel.hotLeads.length, tone: sel.hotLeads.length ? "hot" : undefined, icon: Flame, onClick: () => { setLeadsFilter({ temperature: "Quente" }); setView("leads"); } },
    {
      label: "Agenda de hoje",
      value: sel.agendaToday.length,
      sub: sel.agendaOverdue.length
        ? `${sel.agendaOverdue.length} atrasado(s)`
        : sel.agendaUpcoming.length
          ? `${sel.agendaUpcoming.length} nos próximos 7 dias`
          : sel.agendaToday.length
            ? "nada após hoje"
            : "nada pendente",
      tone: sel.agendaOverdue.length ? "danger" : undefined,
      icon: CalendarDays,
      onClick: () => setView("agenda"),
    },
    { label: "Propostas em aberto", value: sel.proposalsPending.length, icon: FileText, onClick: () => setView("proposals") },
    { label: "Valor em negociação", value: fmtMoney(sel.negotiationValue), icon: TrendingUp, onClick: () => setView("proposals") },
    { label: "Vendas fechadas", value: sel.closedLeads.length, sub: sel.closedValue > 0 ? fmtMoney(sel.closedValue) : undefined, tone: "success", icon: CheckCircle2, onClick: () => setView("clients") },
  ];

  const todayLabel = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });

  const handleCompleteFollowup = (item) => {
    dispatch({ type: "UPDATE_FOLLOWUP", id: item.refId, patch: { status: "concluido" } });
    notify(`Follow-up concluído — ${item.text}`);
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="gc-display text-xl font-semibold capitalize">{todayLabel}</h1>
        <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>Olá, {userName(currentUser)}. Aqui está o que precisa de você agora.</p>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
        {tiles.map((t, i) => <StatTile key={i} {...t} />)}
      </div>

      <div>
        <h2 className="gc-display text-[15px] font-semibold mb-3">Central de atenção</h2>
        {sel.attention.length === 0 ? (
          <SectionCard><EmptyState icon={CheckCircle2} title="Tudo em dia" hint="Follow-ups atrasados, demos expirando, propostas paradas e leads quentes sem próxima ação aparecem aqui." /></SectionCard>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {sel.attention.map(item => (
              <AttentionCard key={item.id} item={item} lead={sel.leadById[item.leadId]} onOpenLead={onOpenLead} onCompleteFollowup={handleCompleteFollowup} />
            ))}
          </div>
        )}
      </div>

      <DashboardAgenda
        sel={sel}
        leadById={sel.leadById}
        onOpenLead={onOpenLead}
        onOpenAgenda={() => setView("agenda")}
        dispatch={dispatch}
        notify={notify}
      />

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <SectionCard title="Ações de hoje">
          {sel.todaysActions.length === 0 ? (
            <EmptyState icon={CheckCircle2} title="Nada agendado para hoje" hint="Follow-ups e demos que vencem hoje aparecem aqui." />
          ) : (
            <div>
              {sel.todaysActions.map(a => (
                <button key={`${a.kind}_${a.id}`} onClick={() => onOpenLead(a.leadId, a.kind === "demo" ? "demo" : "followups")} className="w-full flex items-center gap-3 px-5 py-3 text-left gc-row-hover" style={{ borderBottom: "1px solid var(--line)" }}>
                  <span className="gc-mono text-sm font-medium w-12 shrink-0" style={{ color: "var(--accent-ink)" }}>{fmtTime(a.date)}</span>
                  <span className="min-w-0 flex-1">
                    <span className="block text-sm font-medium truncate">{sel.leadById[a.leadId]?.company}</span>
                    <span className="block text-xs mt-0.5 truncate" style={{ color: "var(--slate)" }}>{a.label}</span>
                  </span>
                  {a.kind === "demo" ? <Timer size={14} style={{ color: "var(--slate)" }} /> : <Clock size={14} style={{ color: "var(--slate)" }} />}
                </button>
              ))}
            </div>
          )}
        </SectionCard>

        <PipelineFunnel stages={sel.pipelineStages} onOpenStage={() => { setLeadsViewMode("pipeline"); setView("leads"); }} />
      </div>
    </div>
  );
}

/* =========================================================================
   LEADS — list, filters, creation
   ========================================================================= */

function matchesLead(lead, search) {
  if (!search) return true;
  const q = search.toLowerCase();
  return [lead.company, lead.city, lead.segment, lead.contactName].some(v => (v || "").toLowerCase().includes(q));
}

function FilterChip({ label, active, onClick, title }) {
  return (
    <button onClick={onClick} title={title} className="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap gc-focus"
      style={{ background: active ? "var(--accent)" : "var(--surface)", color: active ? "#fff" : "var(--ink-soft)", border: active ? "none" : "1px solid var(--line-strong)" }}>
      {label}
    </button>
  );
}

function TooltipText({ value, className = "", style = {}, children, nativeTooltip = true, ...props }) {
  const text = value == null ? "" : String(value);
  return (
    <span
      {...props}
      className={className}
      style={style}
      title={nativeTooltip && text ? text : undefined}
      aria-label={text || undefined}
      data-tooltip={text || undefined}
    >
      {children !== undefined ? children : (text || "—")}
    </span>
  );
}

function LeadRow({ lead, onEdit, onDelete, deleting, onWhatsApp, onOpenHistory, history, onCellMouseEnter, onCellMouseMove, onCellMouseLeave, onCellFocus, onCellBlur, gridTemplateColumns, waStatus, onChangeWaStatus }) {
  const [waSaving, setWaSaving] = useState(false);
  const cellTooltipProps = {
    nativeTooltip: false,
    onMouseEnter: onCellMouseEnter,
    onMouseMove: onCellMouseMove,
    onMouseLeave: onCellMouseLeave,
    onFocus: onCellFocus,
    onBlur: onCellBlur,
  };
  const whatsAppButton = lead.whatsapp && onWhatsApp ? (
    <button
      type="button"
      onClick={(e) => { e.stopPropagation(); onWhatsApp(lead); }}
      className="w-10 h-10 rounded-lg gc-focus hover:brightness-90 hover:scale-105 transition-transform shrink-0 inline-flex items-center justify-center shadow-sm"
      style={{ background: "#25D366", color: "#FFFFFF" }}
      title={`WhatsApp — ${lead.contactName || lead.company}`}
      aria-label={`Abrir WhatsApp de ${lead.company}`}
    >
      <MessageCircle size={21} />
    </button>
  ) : null;

  /* Um status por linha. O lead que tem conversa de WhatsApp mostra o status do
     atendimento, com o mesmo menu do chat — gravar é gravar na conversa, a fonte
     do dado. O funil comercial continua existindo atrás (na ficha ele aparece ao
     lado, e os filtros de etapa não mudaram) e é ele que aparece nos leads sem
     conversa, como sempre. */
  const statusCell = onChangeWaStatus && waStatus?.status ? (
    <ConversationStatusChanger
      conversation={waStatus}
      canOpen={false}
      saving={waSaving}
      floating
      stopRowClick
      onChange={async (nextStatus) => {
        setWaSaving(true);
        try { await onChangeWaStatus(lead, nextStatus); }
        finally { setWaSaving(false); }
      }}
    />
  ) : (
    <StatusPill status={lead.status} />
  );
  return (
    <div
      onClick={() => onEdit && onEdit(lead)}
      className="w-full text-left gc-row-hover px-5 py-3.5 cursor-pointer block"
      style={{ borderBottom: "1px solid var(--line)" }}
      role="button"
      tabIndex={0}
      aria-label={`Editar lead ${lead.company}`}
      onKeyDown={(e) => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); if (onEdit) onEdit(lead); } }}
    >
      {/* Mobile: stacked card */}
      <div className="md:hidden space-y-2">
        <div className="flex items-start justify-between gap-2">
          <div className="flex items-center gap-2 min-w-0">
            {whatsAppButton}
            <span className="min-w-0">
              <TooltipText {...cellTooltipProps} value={lead.company} className="block text-sm font-medium truncate" />
              <TooltipText {...cellTooltipProps} value={`${lead.city} · ${lead.segment}`} className="block text-xs mt-0.5 truncate" style={{ color: "var(--slate)" }} />
            </span>
          </div>
          <div className="flex items-center gap-1.5 shrink-0">
            <TempPill temperature={lead.temperature} />
            {onEdit && (
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onEdit(lead); }}
                className="p-1.5 rounded-md gc-focus hover:opacity-75 transition-opacity"
                style={{ color: "var(--slate)", background: "var(--surface-sunken)" }}
                title="Editar lead"
                aria-label="Editar lead"
              >
                <Edit size={13} />
              </button>
            )}
            {onDelete && <button type="button" disabled={deleting}
              onClick={(e) => { e.stopPropagation(); onDelete(lead); }}
              className="p-1.5 rounded-md text-xs gc-focus disabled:opacity-40"
              style={{ color: "var(--danger)", background: "var(--danger-bg)" }}
              aria-label={`Excluir lead ${lead.company}`}>
              {deleting ? "Excluindo..." : "Excluir"}
            </button>}
          </div>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          {statusCell}
          <button
            type="button"
            onClick={(e) => { e.stopPropagation(); if (onOpenHistory) onOpenHistory(lead); }}
            className="min-w-0 text-left gc-focus rounded-md truncate"
            aria-label={`Ver histórico de ${lead.company}`}
          >
            <TooltipText {...cellTooltipProps} value={history ? timelineEventText(history) : "Sem histórico"} className="text-xs truncate" style={{ color: "var(--slate)" }} />
          </button>
        </div>
      </div>
      {/* Desktop: grid row */}
      <div className="hidden md:grid items-center gap-3 min-w-0" style={{ gridTemplateColumns }}>
        <span className="min-w-0 flex items-center">
          {whatsAppButton}
        </span>
        <span className="min-w-0">
          <TooltipText {...cellTooltipProps} value={lead.company} className="block text-sm font-medium truncate" />
          <TooltipText {...cellTooltipProps} value={`${lead.city} · ${lead.segment}`} className="block text-xs mt-0.5 truncate" style={{ color: "var(--slate)" }} />
        </span>
        <span className="min-w-0 flex items-start gap-1">
          {statusCell}
        </span>
        <button
          type="button"
          onClick={(e) => { e.stopPropagation(); if (onOpenHistory) onOpenHistory(lead); }}
          className="min-w-0 text-left gc-focus rounded-md"
          aria-label={`Ver histórico de ${lead.company}`}
        >
          {history ? (
            <>
              <TooltipText {...cellTooltipProps} value={timelineEventText(history)} className="block text-sm truncate" style={{ color: "var(--ink-soft)" }} />
              <span className="block gc-mono text-xs mt-0.5 truncate" style={{ color: "var(--slate)" }}>{fmtDateTime(history.date)}</span>
            </>
          ) : <span className="text-sm" style={{ color: "var(--slate)" }}>—</span>}
        </button>
        <TooltipText
          {...cellTooltipProps}
          value={lead.lastContactAt ? fmtDateTime(lead.lastContactAt) : "Sem contato"}
          className="gc-mono text-xs truncate min-w-0"
          style={{ color: "var(--slate)" }}
        />
        <span className="min-w-0 flex justify-end items-center">
          {onEdit && (
            <button
              type="button"
              onClick={(e) => { e.stopPropagation(); onEdit(lead); }}
              className="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium gc-focus hover:opacity-80 transition-opacity"
              style={{ background: "var(--surface-sunken)", color: "var(--ink-soft)", border: "1px solid var(--line)" }}
              title="Editar lead"
            >
              <Edit size={12} />
              <span>Editar</span>
            </button>
          )}
          {onDelete && <button type="button" disabled={deleting}
            onClick={(e) => { e.stopPropagation(); onDelete(lead); }}
            className="ml-1 px-2 py-1 rounded-md text-xs font-medium gc-focus disabled:opacity-40"
            style={{ color: "var(--danger)", background: "var(--danger-bg)" }}
            aria-label={`Excluir lead ${lead.company}`}>
            {deleting ? "Excluindo..." : "Excluir"}
          </button>}
        </span>
      </div>
    </div>
  );
}

function ViewToggle({ mode, setMode }) {
  return (
    <div className="inline-flex items-center rounded-lg p-0.5 shrink-0" style={{ background: "var(--surface-sunken)" }}>
      <button onClick={() => setMode("list")} className="flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium gc-focus gc-pressable"
        style={{ background: mode === "list" ? "var(--surface)" : "transparent", color: mode === "list" ? "var(--ink)" : "var(--slate)", boxShadow: mode === "list" ? "0 1px 2px rgba(23,25,28,0.08)" : "none" }}>
        <List size={13} /> Lista
      </button>
      <button onClick={() => setMode("pipeline")} className="flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium gc-focus gc-pressable"
        style={{ background: mode === "pipeline" ? "var(--surface)" : "transparent", color: mode === "pipeline" ? "var(--ink)" : "var(--slate)", boxShadow: mode === "pipeline" ? "0 1px 2px rgba(23,25,28,0.08)" : "none" }}>
        <LayoutGrid size={13} /> Pipeline
      </button>
    </div>
  );
}

function KanbanCard({ lead, proposal, daysInStage, onClick, waStatus }) {
  const bucket = actionBucket(lead.nextAction?.date);
  return (
    <button onClick={onClick} className="w-full text-left rounded-xl p-3.5 gc-focus gc-card gc-card-hover gc-pressable space-y-2" style={{ background: "var(--surface)", border: "1px solid var(--line)" }}>
      <div className="flex items-start justify-between gap-2">
        <span className="min-w-0">
          <TooltipText value={lead.company} className="block text-sm font-semibold truncate" />
          <TooltipText value={lead.contactName || lead.segment} className="block text-xs truncate" style={{ color: "var(--slate)" }} />
        </span>
        <TempPill temperature={lead.temperature} />
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <PriorityMark priority={lead.priority} />
        <span className="text-xs" style={{ color: "var(--slate)" }}>· {lead.segment}</span>
        <ConversationBadge conversation={waStatus} />
      </div>
      {proposal && (
        <div className="gc-mono text-sm font-medium" style={{ color: "var(--accent-ink)" }}>{fmtMoney(proposal.implementationValue)}</div>
      )}
      {lead.nextAction ? (
        <div className="flex items-center gap-1.5 text-xs">
          {bucket === "atrasado" && <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: "var(--danger)" }} />}
          <span className="gc-mono shrink-0" style={{ color: bucket === "atrasado" ? "var(--danger)" : "var(--slate)" }}>{fmtDate(lead.nextAction.date)}</span>
          <TooltipText value={lead.nextAction.note} className="truncate" style={{ color: "var(--ink-soft)" }} />
        </div>
      ) : (
        <div className="text-xs" style={{ color: "var(--slate)" }}>Sem próxima ação</div>
      )}
      <div className="text-[11px] pt-1" style={{ color: "var(--slate)", borderTop: "1px solid var(--line)" }}>
        {daysInStage <= 0 ? "Entrou na etapa hoje" : `${daysInStage} dia(s) nesta etapa`}
      </div>
    </button>
  );
}

function PipelineBoard({ leads, statusHistory, proposalValueByLead, onOpenLead, waStatusByLead }) {

function SortableHeader({ label, sortKey, sortBy, sortDirection, onSort }) {
  const active = sortBy === sortKey;
  const indicator = active ? (sortDirection === "asc" ? "↑" : "↓") : "↕";
  return (
    <button
      type="button"
      onClick={() => onSort(sortKey)}
      className="w-full flex items-center justify-center gap-1 text-center gc-focus"
      style={{ color: active ? "var(--accent-ink)" : "var(--slate)" }}
      title={`Ordenar por ${label}`}
      aria-label={`Ordenar por ${label}`}
    >
      <span>{label}</span>
      <span className="gc-mono text-[10px]" style={{ color: active ? "var(--accent)" : "var(--slate)" }}>{indicator}</span>
    </button>
  );
}

function ResizableHeader({ label, sortKey, sortBy, sortDirection, onSort, columnIndex, onResizeStart, onResizeKeyDown, onResizeReset, children }) {
  return (
    <div className="relative min-w-0 flex items-center justify-center gap-2">
      {children || <SortableHeader label={label} sortKey={sortKey} sortBy={sortBy} sortDirection={sortDirection} onSort={onSort} />}
      <div
        className="gc-column-resize-handle"
        role="separator"
        aria-orientation="vertical"
        aria-label={`Redimensionar coluna ${label}`}
        title={`Arraste para afinar ou alargar "${label}" · duplo clique volta ao tamanho original`}
        tabIndex={0}
        onPointerDown={(event) => onResizeStart(event, columnIndex)}
        onKeyDown={(event) => onResizeKeyDown(event, columnIndex)}
        onDoubleClick={(event) => { event.preventDefault(); event.stopPropagation(); if (onResizeReset) onResizeReset(); }}
      />
    </div>
  );
}

/* =========================================================================
   FILTRO EM MENU (usado pelas etapas do funil e pelo status do atendimento)
   Antes eram 14 chips soltos em duas filas acima da tabela — tomavam duas
   linhas de tela e em monitor menor ainda quebravam. Agora são dois botões na
   mesma linha, cada um abre uma lista e aceita mais de uma marcação de uma vez
   ("mostra quem está em Negociação OU Proposta enviada").

   O filtro guarda vetor quando tem mais de um, e os códigos antigos (e o card
   "Leads abertos" do Painel) ainda podem passar um valor sozinho — por isso
   valueList() aceita os dois formatos e nada mais precisa mudar.
   ========================================================================= */
const valueList = value => (value == null || value === false ? [] : Array.isArray(value) ? value.filter(Boolean) : [value]);

function toggleInList(previous, option) {
  const current = valueList(previous);
  const next = current.includes(option) ? current.filter(item => item !== option) : [...current, option];
  return next.length > 1 ? next : next[0] || null;
}

/* O menu é position:fixed de propósito: o painel de filtros (.gc-collapse > *)
   tem overflow:hidden e cortaria qualquer menu absoluto que passar da altura da
   fila — o mesmo motivo do `floating` no status do atendimento da tabela. */
function FilterMenu({ label, title, options, selected, onToggle, onClear }) {
  const [open, setOpen] = useState(false);
  const [menuPos, setMenuPos] = useState(null);
  const triggerRef = useRef(null);
  const chosen = valueList(selected);

  useEffect(() => {
    if (!open) return undefined;
    const close = () => setOpen(false);
    /* Clique fora fecha (o menu é filho do botão, então contains() também vale
       para as opções) e Esc fecha — ele usa muito o teclado no CRM. Rolar ou
       redimensionar solta o menu do botão, então ele se fecha junto. */
    const fora = event => {
      if (triggerRef.current && !triggerRef.current.contains(event.target)) setOpen(false);
    };
    const tecla = event => { if (event.key === "Escape") setOpen(false); };
    window.addEventListener("scroll", close, true);
    window.addEventListener("resize", close);
    window.addEventListener("pointerdown", fora, true);
    window.addEventListener("keydown", tecla);
    return () => {
      window.removeEventListener("scroll", close, true);
      window.removeEventListener("resize", close);
      window.removeEventListener("pointerdown", fora, true);
      window.removeEventListener("keydown", tecla);
    };
  }, [open]);

  const toggle = () => {
    if (!open && triggerRef.current) {
      const rect = triggerRef.current.getBoundingClientRect();
      setMenuPos({
        left: Math.max(12, Math.min(rect.left, window.innerWidth - 244)),
        top: rect.bottom + 6,
        maxHeight: Math.max(180, window.innerHeight - rect.bottom - 18),
      });
    }
    setOpen(value => !value);
  };

  const shown = chosen.length
    ? chosen.length === 1
      ? (options.find(item => item.key === chosen[0])?.short || chosen[0])
      : `${label} (${chosen.length})`
    : label;

  return (
    <div className="relative shrink-0" ref={triggerRef}>
      <button
        type="button"
        onClick={toggle}
        aria-haspopup="menu"
        aria-expanded={open}
        title={title}
        className="inline-flex items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-medium whitespace-nowrap gc-focus"
        style={chosen.length
          ? { background: "var(--accent-soft)", color: "var(--accent-ink)", border: "1px solid var(--line-strong)" }
          : { background: "var(--surface)", color: "var(--ink-soft)", border: "1px solid var(--line-strong)" }}
      >
        {shown}
        <ChevronDown size={13} style={{ transform: open ? "rotate(180deg)" : "none", transition: "transform 0.2s ease" }} />
      </button>
      {open && menuPos && (
        <div
          role="menu"
          aria-label={label}
          className="rounded-xl gc-fade-in gc-scroll overflow-y-auto"
          style={{ position: "fixed", left: menuPos.left, top: menuPos.top, width: 232, maxHeight: menuPos.maxHeight, zIndex: 60, background: "var(--surface)", border: "1px solid var(--line)", boxShadow: "0 12px 32px rgba(23,25,28,0.14)" }}
        >
          {options.map(option => {
            const isActive = chosen.includes(option.key);
            return (
              <button
                key={option.key}
                type="button"
                role="menuitemcheckbox"
                aria-checked={isActive}
                title={option.hint || option.key}
                onClick={() => onToggle(option.key)}
                className="w-full text-left px-3 py-1.5 gc-row-hover flex items-center gap-2"
                style={{ background: isActive ? "var(--accent-soft)" : "transparent" }}
              >
                {option.emoji ? <span className="text-sm shrink-0" aria-hidden="true" style={{ lineHeight: "16px" }}>{option.emoji}</span> : null}
                <span className="min-w-0 flex-1 truncate text-xs" style={{ color: "var(--ink)" }}>{option.key}</span>
                <span
                  className="w-2 h-2 rounded-full shrink-0"
                  aria-hidden="true"
                  style={isActive ? { background: "var(--accent)" } : { border: "1px solid var(--line-strong)" }}
                />
              </button>
            );
          })}
          {chosen.length > 0 && (
            <button
              type="button"
              onClick={() => { onClear(); setOpen(false); }}
              className="w-full text-left px-3 py-1.5 gc-row-hover text-[11px]"
              style={{ color: "var(--slate)", borderTop: "1px solid var(--line)" }}
            >
              Limpar {label.toLowerCase()}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* Sem a coluna "Próxima ação": spacer, Empresa, Status, Histórico,
   Último contato, Ação. Quem ordena por "Próxima ação" no menu "Ordenar:"
   continua ordenando — o que saiu foi a coluna, não o dado.

   Estas seis larguras são o padrão medido no print que ele mandou como "página
   padronizada" (2026-10-18, à noite). A janela do print tem 1274px e a escala é
   1:1 — confirmado pela coluna Ação, que é a única sem alça e fechou em 128px,
   exatamente o valor do código. Bordas direitas das células, lidas das marcas "||"
   do cabeçalho: Empresa 441,5 · Status 629,5 · Histórico 941,5 · Último contato
   1108,5 · fim da tabela 1249. Com gap de 12px entre colunas isso dá
   Empresa 338 · Status 176 · Histórico 300 · Último contato 155 · Ação 128.
   Empresa é a coluna que estica (min 240): no print ela tem 338 porque come a
   sobra da janela, e é assim que ela se comporta em qualquer tela maior.

   Estes números são o PONTO DE PARTIDA e também o que o duplo clique na alça
   devolve. O que ele arrastar depois disso fica salvo no navegador
   (CHAVE_LARGURAS_LEADS) e volta na próxima abertura da página. */
const LARGURAS_PADRAO_LEADS = [52, 240, 176, 300, 155, 128];
const COLUNAS_ESTICAM_PADRAO = [1];
const CHAVE_LARGURAS_LEADS = "crm:largura-colunas-leads";

/* O que estiver salvo tem que ser uma tabela de 6 números positivos e uma lista
   de índices — senão (chave antiga, edição manual, JSON quebrado) o app abre no
   padrão em vez de montar uma tabela torta. */
function lerLargurasSalvas() {
  try {
    const bruto = localStorage.getItem(CHAVE_LARGURAS_LEADS);
    if (!bruto) return null;
    const salvo = JSON.parse(bruto);
    if (!salvo || !Array.isArray(salvo.larguras) || !Array.isArray(salvo.esticaveis)) return null;
    if (salvo.larguras.length !== LARGURAS_PADRAO_LEADS.length) return null;
    if (!salvo.larguras.every(n => Number.isFinite(n) && n >= 32 && n <= 2000)) return null;
    return {
      larguras: salvo.larguras.map(n => Math.round(n)),
      esticaveis: salvo.esticaveis.filter(i => Number.isInteger(i) && i >= 0 && i < LARGURAS_PADRAO_LEADS.length),
    };
  } catch (err) { return null; }
}

function LeadsView({ db, sel, search, filter, setFilter, onOpenLead, onEditLead, onDeleteLead, deletingLeadId, onCreateLead, onImportLeads, currentUser, viewMode, setViewMode, dispatch, waStatusByLead, onChangeWaStatus }) {
  const [sortBy, setSortBy] = useState("next_action");
  const [sortDirection, setSortDirection] = useState("asc");
  const [cellTooltip, setCellTooltip] = useState(null);
  const [historyLead, setHistoryLead] = useState(null);
  const [filtersOpen, setFiltersOpen] = useState(true);
  /* Lido uma vez, na montagem da tela: é isto que faz a página "já carregar
     padronizada" depois que ele ajustou as colunas uma vez. */
  const [salvas] = useState(lerLargurasSalvas);
  const [columnWidths, setColumnWidths] = useState(() => (salvas ? salvas.larguras : [...LARGURAS_PADRAO_LEADS]));
  const clinicaMessageText = "Olá, bom dia/boa tarde!!\nConsigo falar com a {{nome}} por esse número?";

  const columnWidthsRef = useRef(columnWidths);
  const minColumnWidth = 64;
  const maxColumnWidth = 900;
  /* O problema do minmax(largura, 1fr) usado nas elásticas é que ele engole o
     arraste para a esquerda: a coluna pode estar ocupando 460px na tela enquanto
     o número guardado é 200 — afinar de 200 para 150 não muda nada no que ele vê,
     e a alça parece morta. Por isso, no momento em que a alça é pega, a largura
     REAL da célula é medida (getBoundingClientRect) e a coluna sai desta lista:
     a partir daí o número guardado volta a mandar e os dois lados do arraste
     funcionam. Duplo clique na alça devolve tudo ao tamanho original. */
  const [esticaveis, setEsticaveis] = useState(() => (salvas ? salvas.esticaveis : [...COLUNAS_ESTICAM_PADRAO]));
  const esticaveisRef = useRef(esticaveis);
  const gridTemplateColumns = useMemo(() => columnWidths
    .map((width, index) => (esticaveis.includes(index) ? `minmax(${width}px, 1fr)` : `${width}px`))
    .join(" "), [columnWidths, esticaveis]);
  /* Toda mudança de largura vai para o navegador. Assim a página carrega do jeito
     que ele deixou na última vez, em vez de voltar ao padrão a cada F5. Se o
     localStorage estiver bloqueado (modo privado cheio), a tabela funciona do mesmo
     jeito — só não lembra na próxima abertura. */
  useEffect(() => {
    try {
      localStorage.setItem(CHAVE_LARGURAS_LEADS, JSON.stringify({ larguras: columnWidths, esticaveis }));
    } catch (err) { /* sem memória local: segue sem travar a tela */ }
  }, [columnWidths, esticaveis]);
  const setColumnWidth = useCallback((columnIndex, width) => {
    setColumnWidths(previous => {
      if (columnIndex >= previous.length - 1) return previous;
      const next = [...previous];
      const min = columnIndex === 0 ? 40 : minColumnWidth;
      next[columnIndex] = Math.round(Math.min(maxColumnWidth, Math.max(min, width)));
      columnWidthsRef.current = next;
      return next;
    });
  }, []);
  /* A alça é filha direta da célula do cabeçalho, então o pai dela tem exatamente
     a largura que a coluna ocupa na tela — é esse número que o arraste precisa
     respeitar, senão ele parte de um valor que não é o que está sendo visto. */
  const larguraNaTela = (event) => {
    const celula = event.currentTarget && event.currentTarget.parentElement;
    const medida = celula ? Math.round(celula.getBoundingClientRect().width) : 0;
    return medida > 0 ? medida : null;
  };
  const fixarColuna = useCallback((columnIndex, width) => {
    if (esticaveisRef.current.includes(columnIndex)) {
      esticaveisRef.current = esticaveisRef.current.filter(index => index !== columnIndex);
      setEsticaveis(esticaveisRef.current);
    }
    setColumnWidth(columnIndex, width);
  }, [setColumnWidth]);
  const restaurarColunas = useCallback(() => {
    columnWidthsRef.current = [...LARGURAS_PADRAO_LEADS];
    esticaveisRef.current = [...COLUNAS_ESTICAM_PADRAO];
    setColumnWidths([...LARGURAS_PADRAO_LEADS]);
    setEsticaveis([...COLUNAS_ESTICAM_PADRAO]);
  }, []);
  const startColumnResize = useCallback((event, columnIndex) => {
    if (event.button !== 0 || columnIndex >= columnWidthsRef.current.length - 1) return;
    event.preventDefault();
    event.stopPropagation();
    const startX = event.clientX;
    const medida = larguraNaTela(event);
    const startWidth = medida === null ? columnWidthsRef.current[columnIndex] : medida;
    fixarColuna(columnIndex, startWidth);
    const target = event.currentTarget;
    const handleMove = (moveEvent) => {
      setColumnWidth(columnIndex, startWidth + moveEvent.clientX - startX);
    };
    const handleStop = () => {
      window.removeEventListener("pointermove", handleMove);
      window.removeEventListener("pointerup", handleStop);
      window.removeEventListener("pointercancel", handleStop);
    };
    window.addEventListener("pointermove", handleMove);
    window.addEventListener("pointerup", handleStop);
    window.addEventListener("pointercancel", handleStop);
    if (target.setPointerCapture) {
      try { target.setPointerCapture(event.pointerId); } catch (err) { /* pointer sintético/sem captura disponível */ }
    }
  }, [setColumnWidth, fixarColuna]);
  const handleResizeKeyDown = useCallback((event, columnIndex) => {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    event.stopPropagation();
    const medida = larguraNaTela(event);
    const atual = medida === null ? columnWidthsRef.current[columnIndex] : medida;
    fixarColuna(columnIndex, atual + (event.key === "ArrowRight" ? 16 : -16));
  }, [fixarColuna]);
  const bucketRank = { atrasado: 0, hoje: 1, proximo: 2 };

  /* Mesmo conjunto de eventos da aba Histórico do drawer — a coluna "Histórico"
     da lista mostra o evento mais recente de cada lead. Só eventos que já
     aconteceram: follow-up agendado para o futuro não pode esconder a mudança
     de status registrada agora. */
  const latestHistoryByLead = useMemo(() => {
    const map = {};
    const now = Date.now();
    db.leads.forEach(l => {
      const events = buildLeadTimeline(l.id, db).filter(e => {
        const t = new Date(e.date).getTime();
        return !Number.isNaN(t) && t <= now;
      });
      if (events.length) map[l.id] = events[0];
    });
    return map;
  }, [db]);

  const showCellTooltip = useCallback((event) => {
    const target = event.currentTarget;
    const text = target.getAttribute("data-tooltip");
    const isTruncated = target.scrollWidth > target.clientWidth + 1;
    if (!text || !isTruncated) {
      setCellTooltip(null);
      return;
    }

    const rect = target.getBoundingClientRect();
    const margin = 8;
    const maxLeft = Math.max(margin, window.innerWidth - 496);
    const left = Math.max(margin, Math.min(rect.left, maxLeft));
    const above = rect.top > 120;
    setCellTooltip({
      text,
      left,
      top: above ? rect.top - margin : rect.bottom + margin,
      above,
    });
  }, []);
  const hideCellTooltip = useCallback(() => setCellTooltip(null), []);

  const getSortValue = (lead, key) => {
    switch (key) {
      case "company":
        return (lead.company || "").toLocaleLowerCase("pt-BR");
      case "status":
        return STATUS_LIST.indexOf(lead.status);
      case "temperature":
        return TEMP_RANK[lead.temperature] ?? -1;
      case "owner":
        return userName(lead.owner).toLocaleLowerCase("pt-BR");
      case "history": {
        const event = latestHistoryByLead[lead.id];
        if (!event) return null;
        const timestamp = new Date(event.date).getTime();
        return Number.isNaN(timestamp) ? null : timestamp;
      }
      case "next_action": {
        const date = lead.nextAction?.date;
        if (!date) return null;
        const timestamp = new Date(date).getTime();
        if (Number.isNaN(timestamp)) return null;
        return [bucketRank[actionBucket(date)] ?? 3, timestamp];
      }
      case "last_contact": {
        const timestamp = lead.lastContactAt ? new Date(lead.lastContactAt).getTime() : NaN;
        return Number.isNaN(timestamp) ? null : timestamp;
      }
      default:
        return null;
    }
  };

  const compareSortValues = (a, b) => {
    if (Array.isArray(a) && Array.isArray(b)) return a[0] - b[0] || a[1] - b[1];
    if (typeof a === "number" && typeof b === "number") return a - b;
    return String(a).localeCompare(String(b), "pt-BR", { numeric: true, sensitivity: "base" });
  };

  const handleSort = (key) => {
    if (sortBy === key) {
      setSortDirection(direction => direction === "asc" ? "desc" : "asc");
    } else {
      setSortBy(key);
      setSortDirection("asc");
    }
  };

  const openLeadForEdit = (lead) => {
    onOpenLead(lead.id);
    onEditLead(lead);
  };

  const openLeadWhatsApp = (lead) => {
    if (!lead.whatsapp) return;
    const name = lead.contactName || lead.company;
    const message = personalizeMessage(clinicaMessageText, name);
    window.open(`https://wa.me/${lead.whatsapp.replace(/\D/g, "")}?text=${encodeURIComponent(message)}`, "_blank");
    /* As etapas "Novo" e "Contatado" saíram do funil: abrir a saudação no
       WhatsApp continua contando como contato feito, e o lead passa direto
       para "Contato pendente". Leads que ainda vierem com um rótulo extinto também
       entram nessa regra, para não ficarem fora do funil. */
    if (!lead.status || lead.status === "Contato pendente" || RETIRED_FUNNEL_STATUSES.includes(lead.status)) {
      dispatch({ type: "CHANGE_STATUS", id: lead.id, status: "Contato pendente", user: currentUser });
    }
  };

  const filtered = useMemo(() => {
    let list = db.leads.filter(l => matchesLead(l, search));
    /* Um ou vários status marcados no menu: valueList aceita o valor sozinho
       (como o Painel sempre passou) e o vetor do filtro múltiplo. */
    if (valueList(filter.status).length) list = list.filter(l => valueList(filter.status).includes(l.status));
    /* Status do atendimento não é campo do lead: vem da conversa de WhatsApp
       ligada a ele, o mesmo mapa que desenha a pílula da coluna Status. Por
       isso este filtro só alcança os leads que têm conversa. */
    if (valueList(filter.waStatus).length) list = list.filter(l => valueList(filter.waStatus).includes(waStatusByLead?.[l.id]?.status));
    if (filter.temperature) list = list.filter(l => l.temperature === filter.temperature);
    if (filter.owner) list = list.filter(l => l.owner === filter.owner);
    if (filter.priority) list = list.filter(l => l.priority === filter.priority);
    if (filter.recent) list = list.filter(l => daysSince(l.createdAt) <= 3);
    if (filter.noMovement) list = list.filter(l => sel.noMovement.some(nm => nm.id === l.id));
    if (filter.open) list = list.filter(l => l.status !== "Fechado" && l.status !== "Perdido");

    list = [...list].sort((a, b) => {
      const aValue = getSortValue(a, sortBy);
      const bValue = getSortValue(b, sortBy);
      if (aValue === null && bValue === null) return 0;
      if (aValue === null) return 1;
      if (bValue === null) return -1;
      const comparison = compareSortValues(aValue, bValue);
      return sortDirection === "asc" ? comparison : -comparison;
    });
    return list;
  }, [db.leads, search, filter, sortBy, sortDirection, sel.noMovement, latestHistoryByLead, waStatusByLead]);

  /* Conta filtros ligados somando as marcações de cada grupo — um vetor de 3
     status no menu vale 3, e nada aqui conta um vetor vazio como "ligado". */
  const activeFilterCount = Object.values(filter).reduce((total, value) => total + valueList(value).length, 0);
  const clearable = activeFilterCount > 0;

  return (
    /* Gap 12 no lugar de space-y-4 (16): a tela de Leads é a que ele mais usa e
       cada linha aqui é linha de lead na lista. */
    <div className="flex flex-col" style={{ gap: "12px" }}>
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div>
          <h1 className="gc-display text-xl font-semibold">Leads</h1>
          <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>{filtered.length} de {db.leads.length} leads</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap justify-end">
          <button
            type="button"
            onClick={() => setFiltersOpen(open => !open)}
            aria-expanded={filtersOpen}
            aria-controls="leads-filter-panel"
            title={filtersOpen ? "Recolher filtros" : "Expandir filtros"}
            className="inline-flex items-center justify-center gap-1.5 text-sm font-medium rounded-lg px-3.5 py-2 gc-focus"
            style={{ background: "var(--surface)", color: "var(--ink)", border: "1px solid var(--line-strong)" }}
          >
            <Filter size={16} />
            Filtros
            {activeFilterCount > 0 && (
              <span className="min-w-[18px] h-[18px] px-1 rounded-full text-[10px] leading-[18px] font-semibold text-center gc-mono" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}>
                {activeFilterCount}
              </span>
            )}
            <ChevronDown size={14} style={{ transform: filtersOpen ? "rotate(180deg)" : "none", transition: "transform 0.2s ease" }} />
          </button>
          <ViewToggle mode={viewMode} setMode={setViewMode} />
          <Button icon={FileText} variant="secondary" onClick={onImportLeads}>Importar TXT</Button>
          <Button icon={Plus} onClick={onCreateLead}>Novo lead</Button>
        </div>
      </div>

      <div id="leads-filter-panel" className={`gc-collapse${filtersOpen ? "" : " collapsed"}`}>
        {/* Uma fila só no lugar das três de antes. As etapas do funil e os oito
            estados do atendimento viraram dois botões com menu (marque um ou
            vários), porque 14 chips empilhados em duas filas tiravam duas linhas
            de tela da lista de leads — e em monitor menor ainda quebravam.
            "Em andamento" deixou de ser chip: continua sendo o filtro filter.open
            que o card "Leads abertos" do Painel aplica. */}
        <div className="flex items-center gap-2 pb-1 overflow-x-auto gc-scroll">
          <FilterMenu
            label="Etapa"
            title="Etapa do funil — marque uma ou várias"
            options={STATUS_LIST.map(s => ({ key: s, short: ETAPA_CURTA[s] || s }))}
            selected={filter.status}
            onToggle={option => setFilter(f => ({ ...f, status: toggleInList(f.status, option) }))}
            onClear={() => setFilter(f => ({ ...f, status: null }))}
          />
          {/* Filtrar por atendimento é perguntar "quem está parado na minha mão?",
              e não "em que etapa de venda eu estou" — os mesmos oito estados da
              pílula da coluna Status e do menu do chat. */}
          <FilterMenu
            label="Atendimento"
            title="Status do atendimento — marque um ou vários"
            options={CONVERSATION_STATUSES.map(item => ({ key: item.key, emoji: item.emoji, hint: item.hint }))}
            selected={filter.waStatus}
            onToggle={option => setFilter(f => ({ ...f, waStatus: toggleInList(f.waStatus, option) }))}
            onClear={() => setFilter(f => ({ ...f, waStatus: null }))}
          />
          <span className="w-px h-5 shrink-0" style={{ background: "var(--line-strong)" }} />
          {TEMPERATURES.map(t => (
            <FilterChip key={t} label={t} active={filter.temperature === t} onClick={() => setFilter(f => ({ ...f, temperature: f.temperature === t ? null : t }))} />
          ))}
          <span className="w-px h-5 shrink-0" style={{ background: "var(--line-strong)" }} />
          {USERS.map(u => (
            <FilterChip key={u.id} label={u.name} active={filter.owner === u.id} onClick={() => setFilter(f => ({ ...f, owner: f.owner === u.id ? null : u.id }))} />
          ))}
          <span className="w-px h-5 shrink-0" style={{ background: "var(--line-strong)" }} />
          <FilterChip label="Sem movimentação" active={!!filter.noMovement} onClick={() => setFilter(f => ({ ...f, noMovement: !f.noMovement }))} />
          {clearable && (
            <button
              type="button"
              onClick={() => setFilter({})}
              className="shrink-0 text-[11px] gc-focus"
              /* underline não existe no Tailwind congelado: vai de estilo mesmo. */
              style={{ color: "var(--slate)", textDecoration: "underline", textUnderlineOffset: "2px" }}
              title="Tirar todos os filtros"
            >
              Limpar ({activeFilterCount})
            </button>
          )}
          <div className="ml-auto flex items-center gap-1.5 shrink-0 pl-2">
            <span className="text-xs" style={{ color: "var(--slate)" }}>Ordenar:</span>
            <Select
              value={sortBy}
              onChange={(e) => { setSortBy(e.target.value); setSortDirection("asc"); }}
              style={{ width: "auto", padding: "6px 10px", fontSize: 12 }}
              aria-label="Selecionar coluna para ordenação"
            >
              <option value="company">Empresa</option>
              <option value="status">Status</option>
              <option value="history">Histórico</option>
              <option value="next_action">Próxima ação</option>
              <option value="last_contact">Último contato</option>
            </Select>
            <Button
              size="sm"
              variant="secondary"
              onClick={() => setSortDirection(direction => direction === "asc" ? "desc" : "asc")}
              >
                {sortDirection === "asc" ? "Crescente" : "Decrescente"}
              </Button>
            </div>
        </div>
      </div>

      {viewMode === "pipeline" ? (
        filtered.length === 0 ? (
          <SectionCard><EmptyState icon={Search} title="Nenhum lead encontrado" hint="Ajuste os filtros ou a busca para ver mais resultados." /></SectionCard>
        ) : (
          <PipelineBoard leads={filtered} statusHistory={db.statusHistory} proposalValueByLead={sel.proposalValueByLead} onOpenLead={onOpenLead} waStatusByLead={waStatusByLead} />
        )
      ) : (
        <SectionCard>
          <div className="gc-table-scroll">
            <div className="hidden md:grid gap-3 px-5 py-2.5 text-xs font-medium" style={{ gridTemplateColumns, color: "var(--slate)", borderBottom: "1px solid var(--line)" }}>
              <span className="min-w-0" />
              <ResizableHeader label="Empresa" sortKey="company" sortBy={sortBy} sortDirection={sortDirection} onSort={handleSort} columnIndex={1} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown} onResizeReset={restaurarColunas} />
              <ResizableHeader label="Status" sortKey="status" sortBy={sortBy} sortDirection={sortDirection} onSort={handleSort} columnIndex={2} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown} onResizeReset={restaurarColunas} />
              <ResizableHeader label="Histórico" sortKey="history" sortBy={sortBy} sortDirection={sortDirection} onSort={handleSort} columnIndex={3} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown} onResizeReset={restaurarColunas} />
              <ResizableHeader label="Último contato" sortKey="last_contact" sortBy={sortBy} sortDirection={sortDirection} onSort={handleSort} columnIndex={4} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown} onResizeReset={restaurarColunas} />
              <span className="min-w-0 text-center">Ação</span>
            </div>
            {filtered.length === 0 ? (
              <EmptyState icon={Search} title="Nenhum lead encontrado" hint="Ajuste os filtros ou a busca para ver mais resultados." />
            ) : filtered.map(l => <LeadRow key={l.id} lead={l} onEdit={openLeadForEdit} onDelete={onDeleteLead} deleting={deletingLeadId === l.id} onWhatsApp={openLeadWhatsApp} onOpenHistory={setHistoryLead} history={latestHistoryByLead[l.id] || null} onCellMouseEnter={showCellTooltip} onCellMouseMove={showCellTooltip} onCellMouseLeave={hideCellTooltip} onCellFocus={showCellTooltip} onCellBlur={hideCellTooltip} gridTemplateColumns={gridTemplateColumns} waStatus={waStatusByLead?.[l.id] || null} onChangeWaStatus={onChangeWaStatus} />)}
          </div>
        </SectionCard>
      )}
      {historyLead && <LeadHistoryModal lead={historyLead} db={db} onClose={() => setHistoryLead(null)} />}
      {cellTooltip && (
        <div
          className={`gc-cell-tooltip${cellTooltip.above ? " above" : ""}`}
          style={{ left: cellTooltip.left, top: cellTooltip.top }}
          role="tooltip"
        >
          {cellTooltip.text}
        </div>
      )}
    </div>
  );
}

const LEAD_SCORE_FIELDS = [["dor", "Dor"], ["facilidade", "Facilidade de contato"], ["pagamento", "Capacidade de pagamento"], ["recorrencia", "Potencial de recorrência"]];

/* LeadForm é o formulário de lead, usado em dois lugares:
   - dentro da Modal "Novo lead" (LeadFormModal), com showCommercial={false}:
     só o cadastro inicial, como sempre foi em Captar leads;
   - dentro da aba "Visão geral" da ficha (LeadDetail), já que o lead existe:
     ali ele é a própria tela, com o bloco Comercial, sem modal por cima.
   Sem `initialLead` criamos um lead novo; com ele, salvamos sobre o lead aberto.
   O status padrão é a primeira entrada de STATUS_LIST ("Contato pendente") e a
   próxima ação vem pré-agendada para o dia seguinte às 17h. */
function LeadForm({ onSave, onCancel, currentUser, initialLead, hint, showCommercial = true }) {
  const isEditing = !!initialLead;
  const [form, setForm] = useState({
    company: initialLead?.company || "",
    contactName: initialLead?.contactName || "",
    phone: initialLead?.phone || "",
    whatsapp: initialLead?.whatsapp || "",
    instagram: initialLead?.instagram || "",
    gmaps: initialLead?.gmaps || "",
    currentSite: initialLead?.currentSite || "",
    city: initialLead?.city || "",
    neighborhood: initialLead?.neighborhood || "",
    segment: initialLead?.segment || SEGMENTS[0],
    notes: initialLead?.notes || "",
    owner: initialLead?.owner || currentUser || USERS[0].id,
    priority: initialLead?.priority || "Média",
    temperature: initialLead?.temperature || "Frio",
    source: initialLead?.source || SOURCES[0],
  });
  const [commercial, setCommercial] = useState({
    status: initialLead?.status || STATUS_LIST[0],
    lossReason: initialLead?.lossReason || LOSS_REASONS[0],
    nextActionDate: toLocalDateTimeInput(initialLead?.nextAction?.date)
      || toLocalDateTimeInput(daysFromNow(1, 17, 0)),
    nextActionNote: initialLead?.nextAction?.note
      ?? (isEditing ? "" : "Primeiro contato"),
    score: initialLead?.score || null,
  });
  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));
  const setC = (k) => (e) => setCommercial(c => ({ ...c, [k]: e.target.value }));
  const canSave = form.company.trim().length > 0;
  const save = () => {
    if (!canSave) return;
    onSave({
      ...form,
      status: commercial.status,
      lossReason: commercial.lossReason,
      nextActionDate: commercial.nextActionDate,
      nextActionNote: commercial.nextActionNote,
      ...(commercial.score ? { score: commercial.score } : {}),
    });
    onCancel?.();
  };
  useEffect(() => {
    const handleKeyDown = (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        save();
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [canSave, save]);
  return (
    <>
      <div className="space-y-4">
        {hint && <p className="text-xs -mt-1" style={{ color: "var(--slate)" }}>{hint}</p>}
        <Field label="Nome da empresa" required><TextInput autoFocus={!isEditing} value={form.company} onChange={set("company")} placeholder="Ex.: Padaria Ponto Doce" /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Contato"><TextInput value={form.contactName} onChange={set("contactName")} placeholder="Nome do responsável" /></Field>
          <Field label="Segmento"><Select value={form.segment} onChange={set("segment")}>{SEGMENTS.map(s => <option key={s}>{s}</option>)}</Select></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="WhatsApp"><TextInput value={form.whatsapp} onChange={set("whatsapp")} placeholder="(31) 90000-0000" /></Field>
          <Field label="Instagram"><TextInput value={form.instagram} onChange={set("instagram")} placeholder="@empresa" /></Field>
        </div>
        <Field label="Cidade"><TextInput value={form.city} onChange={set("city")} placeholder="Ex.: Ipatinga" /></Field>

        <div className="space-y-4 gc-fade-in">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Telefone"><TextInput value={form.phone} onChange={set("phone")} placeholder="(31) 3000-0000" /></Field>
            <Field label="Site atual"><TextInput value={form.currentSite} onChange={set("currentSite")} placeholder="https://exemplo.com.br" /></Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Bairro"><TextInput value={form.neighborhood} onChange={set("neighborhood")} placeholder="Bairro" /></Field>
            <Field label="Google Maps (link)"><TextInput value={form.gmaps} onChange={set("gmaps")} placeholder="https://maps.app.goo.gl/..." /></Field>
          </div>
          <div className="grid grid-cols-3 gap-3">
            <Field label="Responsável interno"><Select value={form.owner} onChange={set("owner")}>{USERS.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</Select></Field>
            <Field label="Prioridade"><Select value={form.priority} onChange={set("priority")}>{PRIORITIES.map(p => <option key={p}>{p}</option>)}</Select></Field>
            <Field label="Temperatura"><Select value={form.temperature} onChange={set("temperature")}>{TEMPERATURES.map(t => <option key={t}>{t}</option>)}</Select></Field>
          </div>
          <Field label="Origem"><Select value={form.source} onChange={set("source")}>{SOURCES.map(s => <option key={s}>{s}</option>)}</Select></Field>
          <Field label="Observações"><TextArea value={form.notes} onChange={set("notes")} placeholder="Anotações gerais..." /></Field>

          {showCommercial && (
          <div className="space-y-4 pt-4" style={{ borderTop: "1px solid var(--line)" }}>
            <div className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>Comercial</div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Status"><Select value={commercial.status} onChange={setC("status")}>{STATUS_LIST.map(s => <option key={s}>{s}</option>)}</Select></Field>
              {commercial.status === "Perdido" ? (
                <Field label="Motivo da perda"><Select value={commercial.lossReason} onChange={setC("lossReason")}>{LOSS_REASONS.map(r => <option key={r}>{r}</option>)}</Select></Field>
              ) : null}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Próxima ação — data e hora"><TextInput type="datetime-local" value={commercial.nextActionDate} onChange={setC("nextActionDate")} /></Field>
              <Field label="Próxima ação — o que fazer"><TextInput value={commercial.nextActionNote} onChange={setC("nextActionNote")} placeholder="Ex.: Retornar amanhã às 10h" /></Field>
            </div>
            {commercial.score && (
              <div className="space-y-2">
                <div className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>Score comercial</div>
                {LEAD_SCORE_FIELDS.map(([key, label]) => (
                  <ScoreBar key={key} label={label} value={commercial.score[key] || 0} onChange={(v) => setCommercial(c => ({ ...c, score: { ...c.score, [key]: v } }))} />
                ))}
              </div>
            )}
          </div>
          )}
        </div>

        <div className="flex justify-end gap-2 pt-2">
          <Button variant="secondary" onClick={onCancel}>Cancelar</Button>
          <Button disabled={!canSave} onClick={save}>{isEditing ? "Salvar alterações" : "Salvar lead"}</Button>
        </div>
      </div>
    </>
  );
}

/* Casca em Modal — só para cadastro de lead novo ("Novo lead" na lista e
   "Criar lead em branco" em Captar leads). Sem bloco Comercial: status e
   próxima ação entram com os padrões e se ajustam na ficha. */
function LeadFormModal({ onClose, onSave, currentUser }) {

    <Modal title="Novo lead" onClose={onClose} width={520} draggable>
      <LeadForm
        currentUser={currentUser}
        onSave={onSave}
