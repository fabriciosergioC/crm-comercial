const USERS = [
  { id: "erick", name: "Erick" },

const DEFAULT_PASSWORD = "Crm@2026!Inicial";
const AUTH_STORAGE_PREFIX = "crm_auth_";
const AUTH_SESSION_KEY = "crm_auth_session";

function readAuthRecord(userId) {
  try {
    const value = window.localStorage.getItem(AUTH_STORAGE_PREFIX + userId);
    return value ? JSON.parse(value) : null;
  } catch (error) {
    return null;
  }
}

function writeAuthRecord(userId, record) {
  try {
    window.localStorage.setItem(AUTH_STORAGE_PREFIX + userId, JSON.stringify(record));
  } catch (error) {
    return null;
  }
}

function readSessionUserId() {
  try {
    const value = window.localStorage.getItem(AUTH_SESSION_KEY);
    const session = value ? JSON.parse(value) : null;
    return session && USERS.some((user) => user.id === session.userId) ? session.userId : null;
  } catch (error) {
    return null;
  }
}

function writeSessionUserId(userId) {
  try {
    window.localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({ userId }));
  } catch (error) {
    return null;
  }
}

function clearSessionUserId() {
  try {
    window.localStorage.removeItem(AUTH_SESSION_KEY);
  } catch (error) {
    return;
  }
}

function createAuthSalt() {
  const bytes = new Uint8Array(16);
  globalThis.crypto.getRandomValues(bytes);
  return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
}

async function hashPassword(password, salt) {
  const data = new TextEncoder().encode(`${salt}:${password}`);
  const digest = await globalThis.crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
}

async function ensureAuthRecord(userId) {
  const current = readAuthRecord(userId);
  if (current && typeof current.salt === "string" && typeof current.passwordHash === "string") {
    return {
      salt: current.salt,
      passwordHash: current.passwordHash,
      mustChangePassword: current.mustChangePassword !== false,
    };
  }

  const salt = createAuthSalt();
  const record = {
    salt,
    passwordHash: await hashPassword(DEFAULT_PASSWORD, salt),
    mustChangePassword: true,
  };
  writeAuthRecord(userId, record);
  return record;
}

async function verifyPassword(userId, password) {
  const record = await ensureAuthRecord(userId);
  const hash = await hashPassword(password, record.salt);
  return { record, matches: hash === record.passwordHash };
}

async function savePermanentPassword(userId, password) {
  const current = await ensureAuthRecord(userId);
  const record = {
    salt: current.salt,
    passwordHash: await hashPassword(password, current.salt),
    mustChangePassword: false,
  };
  writeAuthRecord(userId, record);
  return record;
}

async function saveLocalPassword(userId, password, mustChangePassword) {
  const current = await ensureAuthRecord(userId);
  const record = {
    salt: current.salt,
    passwordHash: await hashPassword(password, current.salt),
    mustChangePassword,
  };
  writeAuthRecord(userId, record);
  return record;
}

async function authStatusThroughApi(userId) {
  const response = await crmApi.auth.status(userId);
  if (!response.ok || !response.data) return null;
  return response.data;
}

async function loginThroughApi(userId, password) {
  const response = await crmApi.auth.login(userId, password);
  if (response.status === 401 || response.status === 403) {
    return { ok: false, message: response.message || "Usuário ou senha incorretos." };
  }
  if (!response.ok || !response.data) return null;
  return { ok: true, data: response.data };
}

async function changePasswordThroughApi(userId, currentPassword, newPassword) {
  const response = await crmApi.auth.changePassword(userId, currentPassword, newPassword);
  if (response.status === 401 || response.status === 403) {
    return { ok: false, message: response.message || "Não foi possível alterar a senha." };
  }
  if (!response.ok || !response.data) return null;
  return { ok: true, data: response.data };
}

/* =========================================================================
   DATE / FORMAT UTILITIES
   ========================================================================= */

const pad = (n) => String(n).padStart(2, "0");
const daysAgo = (n, h = 9, m = 0) => { const d = new Date(); d.setDate(d.getDate() - n); d.setHours(h, m, 0, 0); return d.toISOString(); };
const daysFromNow = (n, h = 9, m = 0) => { const d = new Date(); d.setDate(d.getDate() + n); d.setHours(h, m, 0, 0); return d.toISOString(); };
const hoursFromNow = (n) => new Date(Date.now() + n * 3600000).toISOString();
const hoursAgo = (n) => new Date(Date.now() - n * 3600000).toISOString();

function fmtDate(d) { if (!d) return "—"; const dt = new Date(d); return `${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}`; }
function fmtDateFull(d) { if (!d) return "—"; const dt = new Date(d); return `${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}/${dt.getFullYear()}`; }
function fmtTime(d) { if (!d) return ""; const dt = new Date(d); return `${pad(dt.getHours())}:${pad(dt.getMinutes())}`; }
function fmtDateTime(d) { if (!d) return "—"; return `${fmtDate(d)} · ${fmtTime(d)}`; }
function toLocalDateTimeInput(iso) {
  if (!iso) return "";
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return "";
  return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}
function fmtMoney(v) {
  if (v === null || v === undefined || v === "") return "—";
  return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
}
function startOfDay(d) { const dt = new Date(d); dt.setHours(0, 0, 0, 0); return dt; }
function daysDiff(a, b) { return Math.round((startOfDay(a).getTime() - startOfDay(b).getTime()) / 86400000); }
function actionBucket(date) {
  if (!date) return null;
  const diff = daysDiff(date, new Date());
  if (diff < 0) return "atrasado";
  if (diff === 0) return "hoje";
  return "proximo";
}
function daysSince(d) { if (!d) return null; return daysDiff(new Date(), d); }

function demoUrgency(demo) {
  if (demo.deactivated) return "desativada";
  if (!demo.sentAt) return "criada";
  const ms = new Date(demo.expiresAt).getTime() - Date.now();
  if (ms <= 0) return "expirada";
  if (ms <= 3600000) return "critica";
  if (ms <= 6 * 3600000) return "atencao";
  return "ativa";
}
function remainingLabel(demo) {
  if (demo.deactivated) return "Desativada manualmente";
  if (!demo.sentAt) return "Ainda não enviada ao cliente";
  const ms = new Date(demo.expiresAt).getTime() - Date.now();
  const abs = Math.abs(ms);
  const h = Math.floor(abs / 3600000);
  const m = Math.floor((abs % 3600000) / 60000);
  return ms <= 0 ? `Expirou há ${h}h ${pad(m)}min` : `Expira em ${h}h ${pad(m)}min`;
}

function userName(id) { return (USERS.find(u => u.id === id) || {}).name || id; }

/* Most recent status-history entry marks when the lead entered its current
   status; falls back to createdAt for leads that never changed status. */
function daysInCurrentStage(lead, statusHistory) {
  const entries = statusHistory.filter(s => s.leadId === lead.id).sort((a, b) => new Date(b.date) - new Date(a.date));
  const ref = entries.length ? entries[0].date : lead.createdAt;
  return daysSince(ref);
}

/* The "value" of an open opportunity is never invented — it only exists
   once a real proposal has been sent. Picks the most recent proposal. */
function latestProposalForLead(leadId, proposals) {
  const list = proposals.filter(p => p.leadId === leadId).sort((a, b) => new Date(b.proposalDate) - new Date(a.proposalDate));
  return list[0] || null;
}

/* Bump temperature upward only, never automatically downgrade it. */
function suggestTemperature(current, result) {
  const hot = ["Demonstrou interesse", "Pediu preço", "Pediu proposta"];
  const warm = ["Atendeu", "Pediu retorno", "Respondeu", "Demo enviada"];
  let suggested = current;
  if (hot.includes(result)) suggested = "Quente";
  else if (warm.includes(result)) suggested = current === "Frio" ? "Morno" : current;
  return TEMP_RANK[suggested] > TEMP_RANK[current] ? suggested : current;
}

function getApiBaseUrl() {
  if (typeof window !== "undefined") {
    if (window.CRM_API_URL && window.CRM_API_URL.trim()) {
      return window.CRM_API_URL.trim().replace(/\/+$/, "");
    }
    const stored = localStorage.getItem("crm_api_url");
    if (stored && stored.trim()) {
      return stored.trim().replace(/\/+$/, "");
    }
    // Quando aberto diretamente do disco local (file://)
    if (window.location.protocol === "file:") {
      return "http://localhost:3001/api";
    }
    // Desenvolvimento local em porta separada (ex.: Live Server 5500)
    if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
      return window.location.port === "3001" ? "/api" : "http://localhost:3001/api";
    }
    // Na Vercel ou em produção na nuvem: usa caminho relativo /api do mesmo domínio
    return "/api";
  }
  return "/api";
}

let CRM_API_BASE = getApiBaseUrl();

const crmApi = {
  getBaseUrl() {
    return CRM_API_BASE;
  },
  setBaseUrl(url) {
    if (url && url.trim()) {
      const clean = url.trim().replace(/\/+$/, "");
      CRM_API_BASE = clean;
      localStorage.setItem("crm_api_url", clean);
    } else {
      localStorage.removeItem("crm_api_url");
      CRM_API_BASE = getApiBaseUrl();
    }
  },
  async health() {
    try {
      const res = await fetch(`${CRM_API_BASE}/health`);
      if (!res.ok) return { ok: false };
      const data = await res.json();
      return { ok: true, ...data };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  },

  async authRequest(path, body, method = "POST") {
    try {
      const res = await fetch(`${CRM_API_BASE}${path}`, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body === null ? undefined : JSON.stringify(body),
      });
      let json = null;
      try { json = await res.json(); } catch (error) { json = null; }
      return {
        status: res.status,
        ok: res.ok,
        data: json && json.data ? json.data : null,
        message: json && json.message ? json.message : "",
      };
    } catch (error) {
      return { status: 0, ok: false, data: null, message: error.message };
    }

// Os dados cadastrais vêm do lead; os dados do contrato continuam no cliente.
function syncClientsWithLeads(db) {
  const leadsById = new Map(db.leads.map(lead => [lead.id, lead]));
  return {
    ...db,
    clients: db.clients.map(client => {
      const lead = leadsById.get(client.leadId);
      if (!lead) return client;
      const patch = {};
      for (const field of ["company", "contactName", "owner"]) {
        if (lead[field] !== undefined) patch[field] = lead[field];
      }
      return { ...client, ...patch };
    }),
  };
}

function dbReducer(db, action) {
  switch (action.type) {
    case "SET_DB": {
      return syncClientsWithLeads({ ...db, ...action.db });
    }
    case "ADD_LEAD": {
      return { ...db, leads: [action.lead, ...db.leads] };
    }
    case "DELETE_LEAD": {
      if (db.clients.some(c => c.leadId === action.id)) return db;
      const next = { ...db, leads: db.leads.filter(l => l.id !== action.id) };
      for (const collection of ["statusHistory", "interactions", "followups", "demos", "proposals"]) {
        next[collection] = db[collection].filter(item => item.leadId !== action.id);
      }
      return next;
    }
    case "UPDATE_LEAD": {
      return syncClientsWithLeads({ ...db, leads: db.leads.map(l => l.id === action.id ? { ...l, ...action.patch } : l) });
    }
    case "CHANGE_STATUS": {
      const lead = db.leads.find(l => l.id === action.id);
      if (!lead) return db;
      const entry = { id: `sh_${Date.now()}`, leadId: action.id, from: lead.status, to: action.status, date: new Date().toISOString(), user: action.user };
      return {
        ...db,
        leads: db.leads.map(l => l.id === action.id ? { ...l, status: action.status } : l),
        statusHistory: [entry, ...db.statusHistory],
      };
    }
    case "ADD_INTERACTION": {
      const lead = db.leads.find(l => l.id === action.leadId);
      const nextTemp = lead ? suggestTemperature(lead.temperature, action.interaction.result) : undefined;
      return {
        ...db,
        interactions: [action.interaction, ...db.interactions],
        leads: db.leads.map(l => l.id === action.leadId
          ? { ...l, lastContactAt: action.interaction.date, temperature: nextTemp }
          : l),
      };
    }
    case "SET_NEXT_ACTION": {
      return { ...db, leads: db.leads.map(l => l.id === action.leadId ? { ...l, nextAction: action.nextAction } : l) };
    }
    case "ADD_FOLLOWUP": {
      return { ...db, followups: [action.followup, ...db.followups] };
    }
    case "UPDATE_FOLLOWUP": {
      return { ...db, followups: db.followups.map(f => f.id === action.id ? { ...f, ...action.patch } : f) };
    }
    case "ADD_DEMO": {
      return { ...db, demos: [action.demo, ...db.demos] };
    }
    case "UPDATE_DEMO": {
      return { ...db, demos: db.demos.map(d => d.id === action.id ? { ...d, ...action.patch } : d) };
    }
    case "ADD_PROPOSAL": {
      return { ...db, proposals: [action.proposal, ...db.proposals] };
    }
    case "UPDATE_PROPOSAL": {
      return { ...db, proposals: db.proposals.map(p => p.id === action.id ? { ...p, ...action.patch } : p) };
    }
    case "CONVERT_TO_CLIENT": {
      return { ...db, clients: [action.client, ...db.clients] };
    }
    case "ADD_CLIENT_UPDATE": {
      return { ...db, clientUpdates: [action.update, ...db.clientUpdates] };
    }
    case "SET_LOSS_REASON": {
      return { ...db, leads: db.leads.map(l => l.id === action.id ? { ...l, lossReason: action.reason } : l) };
    }
    default:
      return db;
  }
}

  if (hour < 12) return { lower: "bom dia", upper: "Bom dia" };
  if (hour < 18) return { lower: "boa tarde", upper: "Boa tarde" };
  return { lower: "boa noite", upper: "Boa noite" };
}

function resolveGreeting(text) {
  if (!text) return "";
  const greeting = currentGreeting();
  return text.replace(/bom dia\s*(?:\/|ou)\s*boa tarde(?:\s*(?:\/|ou)\s*boa noite)?/gi, (match) =>
    match.charAt(0) === match.charAt(0).toUpperCase() ? greeting.upper : greeting.lower
  );
}

function personalizeMessage(text, name) {
  if (!text) return "";
  const out = resolveGreeting(text);
  const contact = (name || "").trim();
  if (out.includes("{{nome}}")) return out.replace(/\{\{nome\}\}/g, contact);
  if (!contact) return out;
  const breakIdx = out.indexOf("\n");
  const firstLine = breakIdx >= 0 ? out.slice(0, breakIdx) : out;
  const rest = breakIdx >= 0 ? out.slice(breakIdx) : "";
  if (/(ol[aá]|oi|bom dia|boa tarde|boa noite)/i.test(firstLine) && firstLine.includes(",")) {
    const comma = firstLine.indexOf(",");
    return `${firstLine.slice(0, comma)}, ${contact}${firstLine.slice(comma)}${rest}`;
  }
  return out;
}

function personalizeOverride(text, name) {
  if (!text) return "";
  return resolveGreeting(text).replace(/\{\{nome\}\}/g, (name || "").trim());
}

/* =========================================================================
   TOASTS — lightweight feedback after actions (lead salvo, status alterado,
   follow-up criado, proposta atualizada, demo enviada...). Plain prop
   drilling of `notify` from the root, no context needed at this app's size.
   ========================================================================= */

function useToastStack() {
  const [toasts, setToasts] = useState([]);
  const notify = (message, tone = "success") => {
    const id = `t_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    setToasts((t) => [...t.slice(-2), { id, message, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3000);
  };
  return { toasts, notify };
}

function ToastStack({ toasts }) {
  if (toasts.length === 0) return null;
  return (
    <div className="fixed bottom-4 left-1/2 -translate-x-1/2 sm:left-auto sm:right-4 sm:translate-x-0 z-[100] flex flex-col gap-2 items-center sm:items-end pointer-events-none w-[calc(100%-2rem)] sm:w-auto">
      {toasts.map((t) => {
        const tone = t.tone === "error" ? "danger" : t.tone === "info" ? "accent" : "success";
        const Icon = t.tone === "error" ? AlertTriangle : CheckCircle2;
        return (
          <div key={t.id} className="pointer-events-auto gc-toast-in flex items-center gap-2 rounded-xl px-4 py-3 text-sm font-medium max-w-sm"
            style={{ background: "var(--ink)", color: "#fff", boxShadow: "0 12px 28px rgba(23,25,28,0.25)" }}>
            <Icon size={16} style={{ color: tone === "danger" ? "#F0B4A3" : tone === "accent" ? "#9FD3E8" : "#A9DBB0", flexShrink: 0 }} />
            <span className="truncate">{t.message}</span>
          </div>
        );
      })}
    </div>
  );
}

/* =========================================================================
   SELECTORS — derived data, computed fresh from `db` on every render.
   Nothing here is stored; counts/statuses are always calculated so the UI
   never gets out of sync with the underlying records.
   ========================================================================= */

function useSelectors(db) {
  return useMemo(() => {
    const leadById = Object.fromEntries(db.leads.map(l => [l.id, l]));
    const openLeads = db.leads.filter(l => l.status !== "Fechado" && l.status !== "Perdido");

    const pendingFollowups = db.followups.filter(f => f.status === "pendente");
    const followupsToday = pendingFollowups.filter(f => actionBucket(f.dueDate) === "hoje");
    const followupsOverdue = pendingFollowups.filter(f => actionBucket(f.dueDate) === "atrasado");
    const followupsUpcoming = pendingFollowups.filter(f => actionBucket(f.dueDate) === "proximo");

    const demosActive = db.demos.filter(d => ["ativa", "atencao"].includes(demoUrgency(d)));
    const demosExpiringSoon = db.demos.filter(d => demoUrgency(d) === "atencao" || demoUrgency(d) === "critica");
    const demosExpired = db.demos.filter(d => demoUrgency(d) === "expirada");
    const demosDraft = db.demos.filter(d => demoUrgency(d) === "criada");

    const proposalsPending = db.proposals.filter(p => ["Enviada", "Em negociação"].includes(p.status));
    const proposalsStale = proposalsPending.filter(p => daysSince(p.proposalDate) >= 4);

    const hotLeads = openLeads.filter(l => l.temperature === "Quente");
    const hotNoNextAction = hotLeads.filter(l => !l.nextAction);
    const closedLeads = db.leads.filter(l => l.status === "Fechado");
    const lostLeads = db.leads.filter(l => l.status === "Perdido");
    const newLeads = db.leads.filter(l => daysSince(l.createdAt) <= 3);

    const noMovement = openLeads.filter(l => {
      const ref = l.lastContactAt || l.createdAt;
      return daysSince(ref) >= 4;
    });

    /* Opportunity value never gets invented — it only exists once a real
       proposal has been sent, so leads without one simply carry no value. */
    const proposalValueByLead = {};
    db.leads.forEach(l => {
      const p = latestProposalForLead(l.id, db.proposals);
      if (p) proposalValueByLead[l.id] = p;
    });
    const negotiationValue = db.proposals
      .filter(p => ["Enviada", "Em negociação"].includes(p.status))
      .reduce((sum, p) => sum + (p.implementationValue || 0), 0);
    const closedValue = db.clients.reduce((sum, c) => sum + (c.contractedValue || 0), 0);

    /* Shared by the Dashboard funnel and the Pipeline (Kanban) view. */
    const pipelineStages = STAGE_GROUPS.map(g => {
      const stageLeads = db.leads.filter(l => g.statuses.includes(l.status));
      const value = stageLeads.reduce((sum, l) => {
        const p = proposalValueByLead[l.id];
        return sum + (p ? (p.implementationValue || 0) : 0);
      }, 0);
      return { ...g, leads: stageLeads, count: stageLeads.length, value };
    });

    /* "Ações de hoje" — every dated commitment due today, ordered by time. */
    const todaysActions = [
      ...followupsToday.map(f => ({ kind: "followup", id: f.id, leadId: f.leadId, date: f.dueDate, label: f.note })),
      ...db.demos.filter(d => demoUrgency(d) !== "expirada" && demoUrgency(d) !== "desativada" && demoUrgency(d) !== "criada" && new Date(d.expiresAt).toDateString() === new Date().toDateString())
        .map(d => ({ kind: "demo", id: d.id, leadId: d.leadId, date: d.expiresAt, label: `Demo de ${leadById[d.leadId]?.company || "lead"} expira` })),
    ].sort((a, b) => new Date(a.date) - new Date(b.date));

    /* "Central de atenção" — the five categories called out in the brief,
       each carrying enough context for the UI to offer a one-tap action. */
    const attention = [
      ...followupsOverdue.map(f => ({ id: `fu_${f.id}`, type: "followup_overdue", tone: "red", text: leadById[f.leadId]?.company || "Lead removido", sub: `Follow-up atrasado há ${Math.abs(daysDiff(f.dueDate, new Date()))} dia(s) — ${f.note}`, leadId: f.leadId, refId: f.id })),
      ...followupsToday.map(f => ({ id: `ft_${f.id}`, type: "followup_today", tone: "amber", text: leadById[f.leadId]?.company || "Lead removido", sub: `Follow-up hoje às ${fmtTime(f.dueDate)} — ${f.note}`, leadId: f.leadId, refId: f.id })),
      ...demosExpiringSoon.map(d => ({ id: `dc_${d.id}`, type: "demo_expiring", tone: demoUrgency(d) === "critica" ? "red" : "amber", text: leadById[d.leadId]?.company || "Lead removido", sub: `Demo próxima de expirar — ${remainingLabel(d)}`, leadId: d.leadId, refId: d.id })),
      ...proposalsStale.map(p => ({ id: `pp_${p.id}`, type: "proposal_stale", tone: "amber", text: leadById[p.leadId]?.company || "Lead removido", sub: `Proposta sem retorno há ${daysSince(p.proposalDate)} dias`, leadId: p.leadId, refId: p.id })),
      ...hotNoNextAction.map(l => ({ id: `hn_${l.id}`, type: "hot_no_action", tone: "amber", text: l.company, sub: "Lead quente sem próxima ação definida", leadId: l.id })),
    ];
    const attentionSorted = [...attention].sort((a, b) => (a.tone === "red" ? 0 : 1) - (b.tone === "red" ? 0 : 1));

    const bySegment = groupCount(db.leads, l => l.segment);
    const byCity = groupCount(db.leads, l => l.city);
    const byOwner = groupCount(db.leads, l => userName(l.owner));
    const bySource = groupCount(db.leads, l => l.source);

    const funnel = [
      { label: "Leads", value: db.leads.length },
      { label: "Contatados", value: db.leads.filter(l => db.interactions.some(i => i.leadId === l.id)).length },
      { label: "Respostas", value: db.leads.filter(l => db.interactions.some(i => i.leadId === l.id && ["Respondeu", "Atendeu", "Pediu preço", "Pediu proposta", "Demonstrou interesse"].includes(i.result))).length },
      { label: "Demos enviadas", value: db.demos.filter(d => d.sentAt).length },
      { label: "Propostas", value: db.proposals.length },
      { label: "Fechados", value: closedLeads.length },
    ];

    const lossByReason = groupCount(db.leads.filter(l => l.status === "Perdido"), l => l.lossReason || "Não informado");

    const channelStats = CHANNELS.map(ch => {
      const total = db.interactions.filter(i => i.channel === ch).length;
      const responded = db.interactions.filter(i => i.channel === ch && ["Respondeu", "Atendeu", "Pediu preço", "Pediu proposta", "Demonstrou interesse", "Demo enviada"].includes(i.result)).length;
      return { channel: ch, total, responded };
    }).filter(c => c.total > 0);

    const perOwner = USERS.map(u => {
      const leads = db.leads.filter(l => l.owner === u.id);
      const contacts = db.interactions.filter(i => i.user === u.id).length;
      const responses = db.interactions.filter(i => i.user === u.id && ["Respondeu", "Atendeu", "Pediu preço", "Pediu proposta", "Demonstrou interesse"].includes(i.result)).length;
      const proposals = db.proposals.filter(p => leads.some(l => l.id === p.leadId)).length;
      const closed = leads.filter(l => l.status === "Fechado").length;
      return { user: u.name, leads: leads.length, contacts, responses, proposals, closed, conversion: leads.length ? Math.round((closed / leads.length) * 100) : 0 };
    });

    return {
      leadById, openLeads, pendingFollowups, followupsToday, followupsOverdue, followupsUpcoming,
      demosActive, demosExpiringSoon, demosExpired, demosDraft, proposalsPending, proposalsStale,
      hotLeads, hotNoNextAction, closedLeads, lostLeads, newLeads, noMovement, todaysActions,
      attention: attentionSorted, proposalValueByLead, negotiationValue, closedValue, pipelineStages,
      bySegment, byCity, byOwner, bySource, funnel, lossByReason, channelStats, perOwner,
    };
  }, [db]);
}

function groupCount(items, keyFn) {
  const map = {};
  items.forEach(item => { const k = keyFn(item) || "—"; map[k] = (map[k] || 0) + 1; });
  return Object.entries(map).sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value }));
}

/* Which lead-detail tab an alert or search result should land on. */
function tabForAttentionType(type) {
  if (type === "demo_expiring") return "demo";
  if (type === "proposal_stale") return "proposta";
  if (type === "followup_overdue" || type === "followup_today") return "followups";
  return "geral";
}

/* Global search across the entities the brief calls out explicitly:
   empresa, contato, cidade, telefone, proposta, cliente. */
function globalSearch(query, db) {
  const q = (query || "").trim().toLowerCase();
  if (q.length < 1) return [];
  const results = [];
  db.leads.forEach(l => {
    const hay = [l.company, l.contactName, l.city, l.phone, l.whatsapp, l.segment].filter(Boolean).join(" ").toLowerCase();
    if (hay.includes(q)) results.push({ id: `sl_${l.id}`, leadId: l.id, tab: "geral", title: l.company, sub: `${l.city} · ${l.segment}`, icon: Building2 });
  });
  db.clients.forEach(c => {
    if ((c.company || "").toLowerCase().includes(q) && !results.some(r => r.leadId === c.leadId)) {
      results.push({ id: `sc_${c.id}`, leadId: c.leadId, tab: "geral", title: c.company, sub: "Cliente ativo", icon: UserCheck });
    }
  });
  db.proposals.forEach(p => {
    if ((p.plan || "").toLowerCase().includes(q)) {
      const lead = db.leads.find(l => l.id === p.leadId);
      if (lead) results.push({ id: `sp_${p.id}`, leadId: p.leadId, tab: "proposta", title: lead.company, sub: `Proposta — ${p.plan}`, icon: FileText });
    }
  });
  return results.slice(0, 8);
}

function LoginScreen({ onLogin }) {
  const [selectedUser, setSelectedUser] = useState(null);
  const [password, setPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [changeError, setChangeError] = useState("");
  const [loading, setLoading] = useState(false);
  const [changingPassword, setChangingPassword] = useState(false);
  const [requiresPasswordChange, setRequiresPasswordChange] = useState(false);

  const chooseUser = async (user) => {
    setSelectedUser(user);
    setPassword("");
    setNewPassword("");
    setConfirmPassword("");
    setError("");
    setChangeError("");
    setChangingPassword(false);
    setRequiresPasswordChange(false);
    if (!user) return;
    try {
      const apiStatus = await authStatusThroughApi(user.id);
      if (apiStatus) {
        setRequiresPasswordChange(apiStatus.mustChangePassword);
      } else {
        const record = await ensureAuthRecord(user.id);
        setRequiresPasswordChange(record.mustChangePassword);
          }
    } catch (err) {
      const record = await ensureAuthRecord(user.id);
      setRequiresPasswordChange(record.mustChangePassword);
      }
  };

  const handleLogin = async (event) => {
    event.preventDefault();
    if (!selectedUser) return;
    setLoading(true);
    setError("");
    try {
      const apiResult = await loginThroughApi(selectedUser.id, password);
      if (apiResult === null) {
        const result = await verifyPassword(selectedUser.id, password);
        if (!result.matches) {
          setError("Senha incorreta.");
          return;
        }
        if (result.record.mustChangePassword) {
          setRequiresPasswordChange(true);
          setChangingPassword(true);
          return;
        }
        writeSessionUserId(selectedUser.id);
        onLogin(selectedUser.id);
        return;
      }
      if (!apiResult.ok) {
        setError(apiResult.message || "Usuário ou senha incorretos.");
        return;
      }
      if (apiResult.data.mustChangePassword) {
        await saveLocalPassword(selectedUser.id, password, true);
        setRequiresPasswordChange(true);
        setChangingPassword(true);
        return;
      }
      await saveLocalPassword(selectedUser.id, password, false);
      writeSessionUserId(selectedUser.id);
      onLogin(selectedUser.id);
    } catch (err) {
      setError("Não foi possível validar o acesso. Tente novamente.");
      console.error("Erro no login:", err);
    } finally {
      setLoading(false);
    }
  };

  const handleChangePassword = async (event) => {
    event.preventDefault();
    if (!selectedUser) return;
    if (newPassword.length < 8) {
      setChangeError("A nova senha deve ter pelo menos 8 caracteres.");
      return;
    }
    if (newPassword !== confirmPassword) {
      setChangeError("A confirmação da senha não coincide.");
      return;
    }
    setLoading(true);
    setChangeError("");
    try {
      const apiResult = await changePasswordThroughApi(selectedUser.id, password, newPassword);
      if (apiResult === null) {
        await savePermanentPassword(selectedUser.id, newPassword);
      } else if (!apiResult.ok) {
        setChangeError(apiResult.message || "Não foi possível alterar a senha.");
        return;
      } else {
        await saveLocalPassword(selectedUser.id, newPassword, false);
      }
      writeSessionUserId(selectedUser.id);
      onLogin(selectedUser.id);
    } catch (err) {
      setChangeError("Não foi possível salvar a nova senha. Tente novamente.");
      console.error("Erro ao trocar senha:", err);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="gc-root min-h-screen flex items-center justify-center px-4">
      <Tokens />
      <div className="w-full max-w-sm">
        <div className="mb-8 text-center">
          <div className="w-11 h-11 rounded-xl mx-auto mb-4 flex items-center justify-center gc-display font-semibold text-white" style={{ background: "var(--accent)" }}>GC</div>
          <h1 className="gc-display text-xl font-semibold">Gestão Comercial</h1>
          <p className="text-sm mt-1" style={{ color: "var(--slate)" }}>
            {selectedUser ? "Informe seus dados de acesso" : "Quem está acessando?"}
          </p>
        </div>

        {!selectedUser ? (
          <>
            <div className="space-y-2">
              {USERS.map((user) => (
                <label key={user.id} onClick={() => chooseUser(user)}
                  className="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl gc-focus text-left transition-colors cursor-pointer"
                  style={{ background: "var(--surface)", border: "1px solid var(--line)" }}>
                  <span className="w-9 h-9 rounded-full flex items-center justify-center font-semibold text-sm" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}>
                    {user.name[0]}
                  </span>
                  <span className="font-medium text-sm flex-1">{user.name}</span>
                </label>
              ))}
            </div>
          </>
        ) : !changingPassword ? (
          <form onSubmit={handleLogin} className="space-y-4">
            <div className="rounded-xl px-4 py-3 text-sm" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)", border: "1px solid var(--accent-soft-strong)" }}>
              <strong>{selectedUser.name}</strong>
              {requiresPasswordChange && <span className="block text-xs mt-1">Depois de acessar, crie sua senha permanente.</span>}
            </div>
            <Field label={requiresPasswordChange ? "Senha inicial" : "Senha"} required>
              <TextInput type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoFocus placeholder={requiresPasswordChange ? "Digite a senha inicial" : "Digite sua senha"} autoComplete="current-password" />
            </Field>
            {error && <div className="text-sm text-center" style={{ color: "var(--danger)" }}>{error}</div>}
            <Button type="submit" className="w-full" disabled={loading || !password}>
              {loading ? "Validando..." : "Acessar"}
            </Button>
            <button type="button" onClick={() => chooseUser(null)} className="w-full text-center text-sm gc-focus rounded py-1" style={{ color: "var(--slate)" }}>
              Escolher outro usuário
            </button>
          </form>
        ) : (
          <form onSubmit={handleChangePassword} className="space-y-4">
            <div className="rounded-xl px-4 py-3 text-sm" style={{ background: "var(--warn-bg)", color: "var(--warn)", border: "1px solid var(--line)" }}>
              Primeiro acesso confirmado. Crie uma senha permanente para continuar.
            </div>
            <Field label="Nova senha" required hint="Mínimo de 8 caracteres.">
              <TextInput type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} autoFocus placeholder="Digite a nova senha" autoComplete="new-password" />
            </Field>
            <Field label="Confirmar nova senha" required>
              <TextInput type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} placeholder="Repita a nova senha" autoComplete="new-password" />
            </Field>
            {changeError && <div className="text-sm text-center" style={{ color: "var(--danger)" }}>{changeError}</div>}
            <Button type="submit" className="w-full" disabled={loading || !newPassword || !confirmPassword}>
              {loading ? "Salvando..." : "Salvar senha e acessar"}
            </Button>
            <button type="button" onClick={() => { setChangingPassword(false); setPassword(""); setError(""); }} className="w-full text-center text-sm gc-focus rounded py-1" style={{ color: "var(--slate)" }}>
              Voltar para a senha
            </button>
          </form>
        )}

        <p className="text-xs text-center mt-6" style={{ color: "var(--slate)" }}>
          Não há cadastro nesta tela. O acesso é liberado apenas para usuários existentes.
        </p>
      </div>
    </div>
  );
}
