function LeadImportModal({ onClose, onImport }) {
  const [records, setRecords] = useState([]);
  const [fileName, setFileName] = useState("");
  const [parseError, setParseError] = useState("");
  const [importing, setImporting] = useState(false);
  const [result, setResult] = useState(null);

  const parseLine = (line, delimiter) => {
    const values = [];
    let value = "";
    let quoted = false;
    for (let index = 0; index < line.length; index += 1) {
      const character = line[index];
      if (character === '"' && line[index + 1] === '"' && quoted) {
        value += '"';
        index += 1;
      } else if (character === '"') {
        quoted = !quoted;
      } else if (character === delimiter && !quoted) {
        values.push(value.trim());
        value = "";
      } else {
        value += character;
      }
    }
    values.push(value.trim());
    return values;
  };

  const readFile = async (event) => {
    const file = event.target.files?.[0];
    setRecords([]);
    setResult(null);
    setParseError("");
    setFileName(file?.name || "");
    if (!file) return;
    if (!file.name.toLowerCase().endsWith(".txt")) {
      setParseError("Selecione um arquivo com extensão .txt.");
      return;
    }
    if (file.size > 2 * 1024 * 1024) {
      setParseError("O arquivo deve ter no máximo 2 MB.");
      return;
    }

    const text = (await file.text()).replace(/^\uFEFF/, "");
    const allLines = text.split(/\r?\n/);
    const lines = allLines.filter(line => line.trim());
    if (lines.length < 2) {
      setParseError("O arquivo precisa ter um cabeçalho e pelo menos um lead.");
      return;
    }
    const numberedEntries = allLines.map((line, index) => ({ line, row: index + 1 }))
      .filter(item => /^\s*\d+[.)]\s+\S/.test(item.line));
    if (numberedEntries.length) {
      const title = lines[0];
      const cityMatch = title.match(/\bem\s+(.+)$/i);
      const city = cityMatch ? cityMatch[1].replace(/[.!]+$/, "").trim() : "";
      const isEsthetics = /est[eé]tica|beleza|cl[ií]nica/i.test(title);
      const entries = numberedEntries.map((entry, index) => {
        const nextRow = numberedEntries[index + 1]?.row || allLines.length + 1;
        const block = allLines.slice(entry.row - 1, nextRow - 1);
        const company = entry.line.replace(/^\s*\d+[.)]\s+/, "").trim();
        const record = {
          row: entry.row,
          company,
          city,
          ...(isEsthetics ? { segment: "Estética" } : {}),
          source: "Google",
        };
        const notes = [];
        block.slice(1).forEach(line => {
          const match = line.match(/^\s*([^:]+):\s*(.*)$/);
          if (!match) return;
          const label = match[1].trim().toLocaleLowerCase("pt-BR");
          const value = match[2].trim();
          if (!value) return;
          if (["telefone", "tel"].includes(label)) {
            record.phone = value;
            record.whatsapp = record.whatsapp || value;
          } else if (label === "whatsapp") {
            record.whatsapp = value;
            record.phone = record.phone || value;
          }
          else if (label === "instagram") record.instagram = value;
          else if (["cidade", "city"].includes(label)) record.city = value;
          else if (["bairro", "neighborhood"].includes(label)) record.neighborhood = value;
          else if (["site", "endereço", "endereco", "avaliação", "avaliacao", "avaliações", "avaliacoes"].includes(label)) {
            notes.push(`${match[1].trim()}: ${value}`);
          } else if (label === "contato") record.contactName = value;
        });
        if (notes.length) record.notes = notes.join(" | ");
        return record;
      });
      setRecords(entries);
      return;
    }

    /* Formato em blocos com rótulos (exportações do Google Maps), separados
       por linha em branco:
         Nome da empresa : X
         Cidade: Y
         Telefone: Z
         WhatsApp: W */
    if (/^\s*nome\s+da\s+empresa\s*:/im.test(text) || /^\s*empresa\s*:/im.test(text)) {
      const labelAliases = {
        "nome da empresa": "company", "empresa": "company", "company": "company",
        "contato": "contactName", "contact": "contactName", "nome": "contactName",
        "cidade": "city", "city": "city", "bairro": "neighborhood", "neighborhood": "neighborhood",
        "telefone": "phone", "tel": "phone", "phone": "phone",
        "whatsapp": "whatsapp", "whats": "whatsapp", "zap": "whatsapp",
        "instagram": "instagram", "insta": "instagram",
        "segmento": "segment", "segment": "segment",
        "site": "currentSite", "endereço": "currentSite", "endereco": "currentSite",
        "google maps": "gmaps", "maps": "gmaps", "gmaps": "gmaps",
        "observações": "notes", "observacoes": "notes", "notas": "notes", "notes": "notes",
      };
      const entries = [];
      let current = null;
      const closeBlock = () => { if (current) entries.push(current); current = null; };
      allLines.forEach((line, index) => {
        if (!line.trim()) { closeBlock(); return; }
        const match = line.match(/^\s*([^:]{1,40}?)\s*:\s*(.*)$/);
        const field = match ? labelAliases[match[1].trim().toLocaleLowerCase("pt-BR")] : null;
        if (match && field) {
          const value = match[2].trim();
          if (!value) return;
          if (!current) current = { row: index + 1 };
          if (field === "company" && current.company) closeBlock();
          if (!current) current = { row: index + 1 };
          current[field] = value;
          return;
        }
        if (current && !current.company) current.company = line.trim();
      });
      closeBlock();
      const blockRecords = entries.map((record) => ({
        ...record,
        phone: record.phone || record.whatsapp || "",
        whatsapp: record.whatsapp || record.phone || "",
        ...(/est[eé]tica|beleza|cl[ií]nica|dermatologia|spa/i.test(record.company || "") ? { segment: "Estética" } : {}),
        source: record.source || "Google",
      }));
      if (!blockRecords.some((record) => record.company)) {
        setParseError("Não encontrei blocos com \"Nome da empresa :\" no arquivo.");
        return;
      }
      setRecords(blockRecords);
      return;
    }

    const delimiter = [";", "\t", ","].sort((a, b) => lines[0].split(b).length - lines[0].split(a).length)[0];
    const normalize = value => value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
    const aliases = {
      empresa: "company", nome_da_empresa: "company", nome_empresa: "company", company: "company",
      contato: "contactName", nome: "contactName", contact: "contactName", contact_name: "contactName", contato_nome: "contactName",
      telefone: "phone", phone: "phone", whatsapp: "whatsapp", instagram: "instagram",
      cidade: "city", city: "city", bairro: "neighborhood", neighborhood: "neighborhood",
      segmento: "segment", segment: "segment", observacoes: "notes", notas: "notes", notes: "notes",
      site: "currentSite", current_site: "currentSite", gmaps: "gmaps", origem: "source", source: "source",
      prioridade: "priority", priority: "priority", responsavel: "owner", owner: "owner",
    };
    const headers = parseLine(lines[0], delimiter).map(header => aliases[normalize(header)] || null);
    if (!headers.includes("company")) {
      setParseError("Não encontrei a coluna Empresa. Use cabeçalhos como empresa;contato;whatsapp;cidade.");
      return;
    }

    const parsed = lines.slice(1).map((line, index) => {
      const values = parseLine(line, delimiter);
      const record = {};
      headers.forEach((header, column) => {
        if (header && values[column]) record[header] = values[column];
      });
      if (!record.whatsapp && record.phone) record.whatsapp = record.phone;
      return { row: index + 2, ...record };
    });
    setRecords(parsed);
  };

  const importRecords = async () => {
    const validRecords = records.filter(record => record.company?.trim());
    if (!validRecords.length) return;
    setImporting(true);
    try {
      setResult(await onImport(validRecords));
    } catch (error) {
      setResult({ succeeded: 0, failures: [{ row: "-", message: error.message || "Falha ao concluir a importação." }] });
    } finally {
      setImporting(false);
    }
  };

  const validCount = records.filter(record => record.company?.trim()).length;
  return (
    <Modal title="Importar leads de TXT" onClose={importing ? () => {} : onClose} width={620}>
      <div className="space-y-4">
        <p className="text-sm" style={{ color: "var(--ink-soft)" }}>

/* Status do atendimento dentro da ficha do lead: os MESMOS oito estados e o
   MESMO menu do chat, gravados na própria conversa (ela é a fonte). O funil
   comercial do StatusChanger de cima não muda — aqui o que muda é o ciclo de
   vida da conversa, que vira "Aguardando resposta" ao enviar e "Respondido"
   quando o cliente responde, nas duas telas ao mesmo tempo.

   `floating` é para a tabela de Leads: a linha mora dentro de um contêiner com
   overflow-x:auto, e esse contêiner corta qualquer menu absoluto que passe da
   altura da linha. Com floating o menu sai do fluxo e é fixado na tela, logo
   abaixo do botão. `stopRowClick` impede que abrir o menu também abra a ficha. */
function ConversationStatusChanger({ conversation, canOpen, saving, onChange, floating = false, stopRowClick = false }) {
  const [open, setOpen] = useState(false);
  const [menuPos, setMenuPos] = useState(null);
  const triggerRef = useRef(null);
  const status = conversation?.status || "";
  const meta = conversationStatusMeta(status);

  /* Rolar a tabela ou redimensionar a janela deixa o menu pendurado no nada,
     então ele se fecha sozinho nesses dois casos. */
  useEffect(() => {
    if (!open || !floating) return undefined;
    const close = () => setOpen(false);
    window.addEventListener("scroll", close, true);
    window.addEventListener("resize", close);
    return () => {
      window.removeEventListener("scroll", close, true);
      window.removeEventListener("resize", close);
    };
  }, [open, floating]);

  const toggle = (event) => {
    if (stopRowClick && event) event.stopPropagation();
    const next = !open;
    if (next && floating && triggerRef.current) {
      const rect = triggerRef.current.getBoundingClientRect();
      setMenuPos({
        left: Math.min(rect.left, window.innerWidth - 224),
        top: rect.bottom + 6,
        maxHeight: Math.max(180, window.innerHeight - rect.bottom - 18),
      });
    }
    setOpen(next);
  };
  /* Sem conversa e sem telefone não há onde guardar o status: o aviso aparece
     sem menu para não prometer um clique que não faria nada. */
  if (!status && !canOpen) {
    return (
      <span
        className="inline-flex items-center gap-1.5 rounded-full text-xs font-medium px-2 py-1 whitespace-nowrap"
        style={TONE_STYLE("slate")}
        title="Cadastre um telefone ou WhatsApp no lead para o status do atendimento acompanhar o chat."
      >
        <MessageCircle size={12} />
        Sem conversa
      </span>
    );
  }
  return (
    <div className="relative">
      <button
        ref={triggerRef}
        type="button"
        onClick={toggle}
        disabled={saving}
        aria-haspopup="menu"
        aria-expanded={open}
        title={status
          ? "Status do atendimento — o mesmo do menu do chat"
          : "Escolher o status abre a conversa deste lead no WhatsApp e passa a segui-la"}
        className="gc-focus rounded-full inline-flex items-center gap-1.5 disabled:opacity-60"
      >
        <span className="inline-flex items-center gap-1.5 rounded-full text-xs font-medium px-2 py-1 whitespace-nowrap" style={TONE_STYLE(status ? meta.tone : "slate")}>
          <span aria-hidden="true">{status ? meta.emoji : "⚪"}</span>
          {status || "Sem atendimento"}
        </span>
        <ChevronDown size={13} style={{ color: "var(--slate)" }} />
      </button>
      {open && (
        <div
          className={`${floating ? "" : "absolute left-0 top-8 z-20"} w-52 rounded-xl py-1.5 gc-fade-in gc-scroll overflow-y-auto`}
          style={floating
            ? { position: "fixed", left: menuPos?.left ?? 0, top: menuPos?.top ?? 0, maxHeight: menuPos?.maxHeight ?? 300, zIndex: 60, background: "var(--surface)", border: "1px solid var(--line)", boxShadow: "0 12px 32px rgba(23,25,28,0.14)" }
            : { maxHeight: 300, background: "var(--surface)", border: "1px solid var(--line)", boxShadow: "0 12px 32px rgba(23,25,28,0.14)" }}
        >
          <div className="px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>Status do atendimento</div>
          {CONVERSATION_STATUSES.map(option => {
            const isActive = option.key === status;
            return (
              <button
                key={option.key}
                type="button"
                role="menuitemradio"
                aria-checked={isActive}
                disabled={saving}
                onClick={(event) => { if (stopRowClick && event) event.stopPropagation(); onChange(option.key); setOpen(false); }}
                className="w-full text-left px-3 py-1.5 gc-row-hover flex items-start gap-2 disabled:opacity-60"
                style={{ background: isActive ? "var(--accent-soft)" : "transparent" }}
              >
                <span className="text-sm leading-5 shrink-0" aria-hidden="true">{option.emoji}</span>
                <span className="min-w-0 flex-1">
                  <span className="block text-xs font-semibold" style={{ color: "var(--ink)" }}>{option.key}</span>
                  <span className="block text-[11px] leading-4" style={{ color: "var(--slate)" }}>{option.hint}</span>
                </span>
                <span
                  className="w-2 h-2 rounded-full mt-1.5 shrink-0"
                  aria-hidden="true"
                  style={isActive
                    ? { background: `var(--tone-${option.tone}-fg, var(--slate))` }
                    : { border: "1px solid var(--line-strong)" }}
                />
              </button>
            );
          })}
          <div className="px-3 py-1.5 text-[11px] leading-4" style={{ background: "var(--surface-sunken)", color: "var(--slate)" }}>
            É o status do chat: muda sozinho quando a mensagem chega ou é enviada.
          </div>
        </div>
      )}
    </div>
  );
}

/* Chronological, cross-entity timeline — the brief's explicit ask so the
   whole story of a lead reads without hopping between tabs. Only events we
   actually have real timestamps for are shown (never a fabricated date). */
function buildLeadTimeline(leadId, db) {
  const events = [];
  db.interactions.filter(i => i.leadId === leadId).forEach(i => events.push({ type: "interaction", date: i.date, data: i }));
  db.statusHistory.filter(s => s.leadId === leadId).forEach(s => events.push({ type: "status", date: s.date, data: s }));
  db.followups.filter(f => f.leadId === leadId).forEach(f => events.push({ type: "followup", date: f.dueDate, data: f }));
  db.demos.filter(d => d.leadId === leadId).forEach(d => {
    events.push({ type: "demo_created", date: d.createdAt, data: d });
    if (d.sentAt) events.push({ type: "demo_sent", date: d.sentAt, data: d });
  });
  db.proposals.filter(p => p.leadId === leadId).forEach(p => events.push({ type: "proposal", date: p.proposalDate, data: p }));
  return events.sort((a, b) => new Date(b.date) - new Date(a.date));
}

function timelineEventText(event) {
  const { type, data } = event;
  if (type === "status") return `${userName(data.user)}: ${data.from || "—"} → ${data.to}`;
  if (type === "followup") return `Follow-up ${data.status}`;
  if (type === "demo_created") return `Demo criada — ${userName(data.owner)}`;
  if (type === "demo_sent") return `Demo enviada — ${userName(data.owner)}`;
  if (type === "proposal") return `Proposta — ${data.plan}`;
  return `${userName(data.user)} · ${data.channel}: ${data.result}`;
}

function dayLabel(date) {
  const d = daysSince(date);
  if (d === 0) return "Hoje";
  if (d === 1) return "Ontem";
  if (d === -1) return "Amanhã";
  if (d < -1) return `Em ${Math.abs(d)} dias`;
  return fmtDateFull(date);
}

    return (

          {type === "demo_sent" ? <Send size={11} /> : <Timer size={11} />}
        </span>
        <span className="text-xs gc-mono shrink-0" style={{ color: "var(--slate)" }}>{fmtTime(date)}</span>
        <span className="text-xs" style={{ color: "var(--ink-soft)" }}>{type === "demo_sent" ? "Demo enviada ao cliente" : "Demo criada"} — {userName(data.owner)}</span>
      </div>
    );
  }
  if (type === "proposal") {
    return (
      <div className="flex items-center gap-2.5 py-2">
        <span className="w-6 h-6 rounded-full flex items-center justify-center shrink-0" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}><FileText size={11} /></span>
        <span className="text-xs gc-mono shrink-0" style={{ color: "var(--slate)" }}>{fmtTime(date)}</span>
        <span className="text-xs" style={{ color: "var(--ink-soft)" }}>Proposta enviada — {data.plan} · {fmtMoney(data.implementationValue)}</span>
      </div>
    );
  }
  const Icon = CHANNEL_ICON[data.channel] || MoreHorizontal;
  return (
    <div className="relative py-3" style={{ borderLeft: "2px solid var(--line-strong)", paddingLeft: 14, marginLeft: 11 }}>
      <span className="absolute -left-[7px] top-3.5 w-3 h-3 rounded-full" style={{ background: "var(--accent)", border: "2px solid var(--paper)" }} />
      <div className="flex items-center gap-2 text-xs" style={{ color: "var(--slate)" }}>

        <span className="flex items-center gap-1"><Icon size={12} />{data.channel}</span>
        <Pill tone="slate">{data.result}</Pill>
      </div>
      {data.note && <div className="text-sm mt-1.5">{data.note}</div>}
    </div>
  );
}

function UnifiedTimeline({ leadId, db, onAdd }) {
  const events = useMemo(() => buildLeadTimeline(leadId, db), [leadId, db]);
  const grouped = useMemo(() => {
    const groups = [];
    events.forEach(e => {
      const label = dayLabel(e.date);
      let g = groups.find(g => g.label === label);
      if (!g) { g = { label, events: [] }; groups.push(g); }
      g.events.push(e);
    });
    return groups;
  }, [events]);

  return (
    <div className="space-y-4">
      <AddInteractionForm onSave={onAdd} />
      {events.length === 0 ? (
        <EmptyState icon={Clock} title="Nenhum evento registrado" hint="Interações, follow-ups, demos e propostas aparecem aqui em ordem cronológica." />
      ) : (
        <div className="space-y-4">
          {grouped.map((g, gi) => (
            <div key={gi}>
              <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--slate)" }}>{g.label}</div>
              <div className="rounded-xl px-3" style={{ background: "var(--surface)", border: "1px solid var(--line)" }}>
                {g.events.map((e, i) => <TimelineEvent key={i} event={e} />)}
              </div>
            </div>
          ))}
        </div>
      )}

  );
}

function LeadHistoryModal({ lead, db, onClose }) {
  const events = useMemo(() => buildLeadTimeline(lead.id, db), [lead.id, db]);
  const grouped = useMemo(() => {
    const groups = [];
    events.forEach(e => {
      const label = dayLabel(e.date);
      let g = groups.find(g => g.label === label);
      if (!g) { g = { label, events: [] }; groups.push(g); }
      g.events.push(e);
    });
    return groups;
  }, [events]);
  return (
    <Modal title={`Histórico — ${lead.company}`} onClose={onClose} width={560}>
      {events.length === 0 ? (
        <EmptyState icon={Clock} title="Nenhum evento registrado" hint="Interações, follow-ups, demos e propostas aparecem aqui em ordem cronológica." />
      ) : (
        <div className="space-y-4">
          {grouped.map((g, gi) => (
            <div key={gi}>
              <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--slate)" }}>{g.label}</div>
              <div className="rounded-xl px-3" style={{ background: "var(--surface-sunken)", border: "1px solid var(--line)" }}>
                {g.events.map((e, i) => <TimelineEvent key={i} event={e} />)}
              </div>
            </div>
          ))}
        </div>
      )}
    </Modal>
  );
}

function LeadDetail({ leadId, db, onClose, currentUser, dispatch, notify, initialTab, onEditLead, onDeleteLead, waConversation, onChangeWaStatus }) {
  const [tab, setTab] = useState(initialTab || "geral");
  useEffect(() => { setTab(initialTab || "geral"); }, [leadId]);
  const [showLoss, setShowLoss] = useState(false);
  const [showConvert, setShowConvert] = useState(false);
  const [waSaving, setWaSaving] = useState(false);

  /* Ctrl+Delete apaga o lead desta ficha aberta. Vai pelo mesmo caminho do botão
     "Excluir" — inclusive a janela de confirmação, então o atalho nunca apaga
     sozinho. Dentro de campo de texto o Ctrl+Delete é edição (apaga a palavra à
     frente da posição), por isso ali ele não mexe no lead. */
  useEffect(() => {
    if (!onDeleteLead) return undefined;
    const atalho = (eventObject) => {
      if (!(eventObject.ctrlKey || eventObject.metaKey) || eventObject.altKey || eventObject.shiftKey) return;
      if (eventObject.key !== "Delete") return;
      const alvo = eventObject.target;
      const tag = String(alvo && alvo.tagName ? alvo.tagName : "").toLowerCase();
      if (["input", "textarea", "select"].includes(tag) || (alvo && alvo.isContentEditable)) return;
      eventObject.preventDefault();
      const leadAberto = db.leads.find((l) => l.id === leadId);
      if (leadAberto) onDeleteLead(leadAberto);
    };
    window.addEventListener("keydown", atalho);
    return () => window.removeEventListener("keydown", atalho);
  }, [db, leadId, onDeleteLead]);

  const lead = db.leads.find(l => l.id === leadId);
  if (!lead) return null;

  const interactions = db.interactions.filter(i => i.leadId === leadId);
  const followups = db.followups.filter(f => f.leadId === leadId).sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
  const demos = db.demos.filter(d => d.leadId === leadId).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const proposals = db.proposals.filter(p => p.leadId === leadId).sort((a, b) => new Date(b.proposalDate) - new Date(a.proposalDate));
  const client = db.clients.find(c => c.leadId === leadId);

  const changeStatus = (status) => {
    if (status === "Perdido") { setShowLoss(true); return; }
    dispatch({ type: "CHANGE_STATUS", id: leadId, status, user: currentUser });
    notify(`Status alterado para "${status}"`);
    if (status === "Fechado" && !client) setShowConvert(true);
  };

  /* Status do atendimento: grava na conversa de WhatsApp (o App faz o pedido e
     devolve a conversa atualizada), nunca no funil comercial de cima. */
  const changeWaStatus = async (status) => {
    if (!onChangeWaStatus) return;
    setWaSaving(true);
    try { await onChangeWaStatus(lead, status); }
    finally { setWaSaving(false); }
  };

  const addInteraction = (data) => {
    dispatch({ type: "ADD_INTERACTION", leadId, interaction: { id: `i_${Date.now()}`, leadId, date: new Date().toISOString(), user: currentUser, ...data } });
  };

  const markDemoSent = (demo) => {
    const now = new Date().toISOString();
    dispatch({ type: "UPDATE_DEMO", id: demo.id, patch: { sentAt: now, expiresAt: hoursFromNow(demo.validityHours || 24) } });
    addInteraction({ channel: "WhatsApp", result: "Demo enviada", note: "Demonstração enviada." });
    const etapa = stageAfterDemoSent(lead);
    if (etapa) dispatch({ type: "CHANGE_STATUS", id: leadId, status: etapa, user: currentUser });
    notify("Demo enviada.");
  };

  const scoreAvg = lead.score ? Math.round(((lead.score.dor + lead.score.facilidade + lead.score.pagamento + lead.score.recorrencia) / 4) * 10) / 10 : null;

  /* Salvar da própria ficha: o formulário é a aba "Visão geral", então não há
     janela para fechar — só persistir e avisar. */
  const saveLead = (form) => {
    const company = (form.company || "").trim();
    const contactName = (form.contactName && form.contactName.trim()) ? form.contactName.trim() : company;
    const { status, lossReason, nextActionDate, nextActionNote, score, ...rest } = form;
    const patch = { ...rest, company, contactName };
    if (score) patch.score = score;
    if (status === "Perdido" && lossReason) patch.lossReason = lossReason;
    dispatch({ type: "UPDATE_LEAD", id: leadId, patch });
    if (status && status !== lead.status) {
      dispatch({ type: "CHANGE_STATUS", id: leadId, status, user: currentUser });
    }
    const dateStr = nextActionDate || "";
    const noteStr = (nextActionNote || "").trim();
    const prevDateStr = toLocalDateTimeInput(lead.nextAction?.date);
    const prevNoteStr = (lead.nextAction?.note || "").trim();
    if (dateStr !== prevDateStr || noteStr !== prevNoteStr) {
      const nextAction = (!dateStr && !noteStr) ? null : { date: dateStr ? new Date(dateStr).toISOString() : null, note: noteStr };
      dispatch({ type: "SET_NEXT_ACTION", leadId, nextAction });
    }
    notify("Lead atualizado com sucesso.");
  };

  return (
    <Drawer
      title={lead.company}
      subtitle={`${lead.city}${lead.neighborhood ? " · " + lead.neighborhood : ""} · ${lead.segment}`}
      onClose={onClose}
      headerRight={
        <div className="flex items-center gap-2">
          {onDeleteLead && (
            <Button size="sm" variant="danger" icon={Trash2} onClick={() => onDeleteLead(lead)} title="Excluir este lead — atalho: Ctrl+Delete">
              Excluir <Kbd>Ctrl+Del</Kbd>
            </Button>
          )}
          {lead.status === "Fechado" && !client ? <Button size="sm" onClick={() => setShowConvert(true)}>Converter em cliente</Button> : null}
        </div>
      }
    >
      <div className="flex items-center gap-3 flex-wrap mb-4">
        <StatusChanger lead={lead} onChange={changeStatus} />
        <span className="flex items-center gap-1.5">
          <span className="text-[11px] uppercase tracking-wide" style={{ color: "var(--slate)" }}>Atendimento</span>
          <ConversationStatusChanger
            conversation={waConversation}
            canOpen={Boolean(waLeadPhone(lead))}
            saving={waSaving}
            onChange={changeWaStatus}
          />
        </span>
        <TempPill temperature={lead.temperature} />
        <PriorityMark priority={lead.priority} />
        <span className="text-xs ml-auto" style={{ color: "var(--slate)" }}>Responsável: <strong style={{ color: "var(--ink-soft)" }}>{userName(lead.owner)}</strong></span>
      </div>

      <QuickActionsBar lead={lead} demos={demos} onGoTab={setTab} />
      <NextActionBanner lead={lead} onOpen={() => setTab("geral")} />

      {client && (
        <div className="rounded-xl px-4 py-3 mb-5 flex items-center gap-2 text-sm" style={{ background: "var(--success-bg)", color: "var(--success)" }}>
          <UserCheck size={16} /> Convertido em cliente ativo
        </div>
      )}
      {lead.status === "Perdido" && lead.lossReason && (
        <div className="rounded-xl px-4 py-3 mb-5 flex items-center gap-2 text-sm" style={{ background: "var(--danger-bg)", color: "var(--danger)" }}>
          <Ban size={16} /> Perdido — {lead.lossReason}
        </div>
      )}

      <div className="flex items-center gap-1 overflow-x-auto gc-scroll mb-5" style={{ borderBottom: "1px solid var(--line)" }}>
        {LEAD_TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} className="px-3 py-2.5 text-sm font-medium whitespace-nowrap gc-focus"
            style={{ color: tab === t.id ? "var(--accent-ink)" : "var(--slate)", borderBottom: tab === t.id ? "2px solid var(--accent)" : "2px solid transparent", transition: "color 0.15s ease, border-color 0.15s ease" }}>
            {t.label}
          </button>
        ))}
      </div>

      {tab === "geral" && (
        <div className="space-y-5 gc-fade-in">
          {/* Lead já cadastrado: a própria ficha é a tela de edição. Um único
              formulário com todos os campos, sem div de leitura separada. */}
          <LeadForm
            key={`${lead.id}|${lead.status}|${lead.temperature}|${lead.priority}|${lead.nextAction?.date || ""}`}
            currentUser={currentUser}
            initialLead={lead}
            onSave={saveLead}
            hint="Todos os dados do lead nesta tela — altere o que precisar e salve."
          />
          {lead.score && (
            <SectionCard title={`Score comercial${scoreAvg !== null ? ` · ${scoreAvg}/5` : ""}`}>
              <div className="px-5 py-4 space-y-3">
                <ScoreBar label="Dor" value={lead.score.dor} onChange={(v) => dispatch({ type: "UPDATE_LEAD", id: leadId, patch: { score: { ...lead.score, dor: v } } })} />
                <ScoreBar label="Facilidade de contato" value={lead.score.facilidade} onChange={(v) => dispatch({ type: "UPDATE_LEAD", id: leadId, patch: { score: { ...lead.score, facilidade: v } } })} />
                <ScoreBar label="Capacidade de pagamento" value={lead.score.pagamento} onChange={(v) => dispatch({ type: "UPDATE_LEAD", id: leadId, patch: { score: { ...lead.score, pagamento: v } } })} />
                <ScoreBar label="Potencial de recorrência" value={lead.score.recorrencia} onChange={(v) => dispatch({ type: "UPDATE_LEAD", id: leadId, patch: { score: { ...lead.score, recorrencia: v } } })} />
              </div>
            </SectionCard>
          )}
        </div>
      )}

      {tab === "historico" && <div className="gc-fade-in"><UnifiedTimeline leadId={leadId} db={db} onAdd={addInteraction} /></div>}

      {tab === "followups" && (
        <div className="space-y-4 gc-fade-in">
          <NewFollowupForm onSave={(data) => { dispatch({ type: "ADD_FOLLOWUP", followup: { id: `f_${Date.now()}`, leadId, status: "pendente", createdBy: currentUser, ...data } }); notify("Follow-up criado."); }} />
          {followups.length === 0 ? <EmptyState icon={Clock} title="Nenhum follow-up para este lead" /> : (
            <SectionCard>
              {followups.map(f => (
                <FollowupRow key={f.id} f={f}
                  onComplete={(id) => dispatch({ type: "UPDATE_FOLLOWUP", id, patch: { status: "concluido" } })}
                  onReschedule={(id) => dispatch({ type: "UPDATE_FOLLOWUP", id, patch: { dueDate: daysFromNow(1, 9, 0), status: "pendente" } })}
                  onCancel={(id) => dispatch({ type: "UPDATE_FOLLOWUP", id, patch: { status: "cancelado" } })} />
              ))}
            </SectionCard>
          )}
        </div>
      )}

      {tab === "demo" && (
        <div className="space-y-4 gc-fade-in">
          <NewDemoForm onSave={({ url, hours, sendNow }) => {
            const now = new Date().toISOString();
            const id = `d_${Date.now()}`;
            if (sendNow) {
              dispatch({ type: "ADD_DEMO", demo: { id, leadId, url, createdAt: now, sentAt: now, validityHours: hours, expiresAt: hoursFromNow(hours), owner: currentUser, deactivated: false, views: null, lastViewedAt: null } });
              addInteraction({ channel: "WhatsApp", result: "Demo enviada", note: "Demonstração enviada." });
              const etapa = stageAfterDemoSent(lead);
              if (etapa) dispatch({ type: "CHANGE_STATUS", id: leadId, status: etapa, user: currentUser });
              notify("Demo enviada.");
            } else {
              dispatch({ type: "ADD_DEMO", demo: { id, leadId, url, createdAt: now, sentAt: null, validityHours: hours, expiresAt: null, owner: currentUser, deactivated: false, views: null, lastViewedAt: null } });
              notify("Demo salva como rascunho.");
            }
          }} />
          {demos.length === 0 ? <EmptyState icon={Timer} title="Nenhuma demo criada" hint="Prévias ficam disponíveis por até 24h após o envio." /> : (
            <div className="space-y-3">{demos.map(d => <DemoCard key={d.id} demo={d} onDeactivate={(id) => { dispatch({ type: "UPDATE_DEMO", id, patch: { deactivated: true } }); notify("Demo desativada."); }} onMarkSent={markDemoSent} />)}</div>
          )}
        </div>
      )}

      {tab === "proposta" && (
        <div className="space-y-4 gc-fade-in">
          <NewProposalForm onSave={(form) => {
            const now = new Date().toISOString();
            dispatch({ type: "ADD_PROPOSAL", proposal: { id: `p_${Date.now()}`, leadId, plan: form.plan, implementationValue: Number(form.implementationValue) || 0, monthlyValue: Number(form.monthlyValue) || 0, proposalDate: now, validUntil: daysFromNow(Number(form.validDays) || 7), notes: form.notes, status: "Enviada" } });
            if (!["Proposta enviada", "Negociação", "Fechado"].includes(lead.status)) dispatch({ type: "CHANGE_STATUS", id: leadId, status: "Proposta enviada", user: currentUser });
            notify("Proposta atualizada.");
          }} />
          {proposals.length === 0 ? <EmptyState icon={FileText} title="Nenhuma proposta enviada" /> : (
            <div className="space-y-3">{proposals.map(p => <ProposalCard key={p.id} proposal={p} onUpdateStatus={(id, status) => { dispatch({ type: "UPDATE_PROPOSAL", id, patch: { status } }); notify("Proposta atualizada."); }} />)}</div>
          )}
        </div>
      )}

      {showLoss && <LossReasonModal onClose={() => setShowLoss(false)} onSave={(reason) => { dispatch({ type: "CHANGE_STATUS", id: leadId, status: "Perdido", user: currentUser }); dispatch({ type: "SET_LOSS_REASON", id: leadId, reason }); notify("Status alterado para \"Perdido\""); setShowLoss(false); }} />}
      {showConvert && (
        <ConvertClientModal lead={lead} onClose={() => setShowConvert(false)} onSave={(form) => {
          dispatch({
            type: "CONVERT_TO_CLIENT", client: {
              id: `c_${Date.now()}`, leadId, company: lead.company, contactName: lead.contactName, plan: form.plan,
              contractedValue: Number(form.contractedValue) || 0, monthlyValue: Number(form.monthlyValue) || 0,
              closingDate: new Date().toISOString(), publishDate: form.publishDate ? new Date(form.publishDate).toISOString() : null,
              domain: form.domain, owner: lead.owner, notes: "", status: "Ativo",
            }
          });
          notify("Cliente convertido!");
          setShowConvert(false);
        }} />
      )}
    </Drawer>
  );
}

const AGENDA_TYPES = [
  { id: "reuniao", label: "Reunião" },
  { id: "demonstracao", label: "Demonstração" },
  { id: "retorno", label: "Retorno" },
  { id: "tarefa", label: "Tarefa" },
  { id: "compromisso", label: "Compromisso" },
];
const AGENDA_STATUSES = [
  { id: "agendado", label: "Agendados" },
  { id: "concluido", label: "Concluídos" },
  { id: "cancelado", label: "Cancelados" },
];

function AgendaEventForm({ event, leads, currentUser, onSave, onCancel }) {
  const [form, setForm] = useState(() => ({
    type: event?.type || "reuniao",
    title: event?.title || "",
    eventAt: toLocalDateTimeInput(event?.eventAt || daysFromNow(0, 10, 0)),
    leadId: event?.leadId || "",
    owner: event?.owner || currentUser,
    notes: event?.notes || "",
  }));
  const set = key => value => setForm(current => ({ ...current, [key]: value }));

  return (
    <form
      className="rounded-xl p-4 space-y-3"
      style={{ background: "var(--surface-sunken)", border: "1px solid var(--line)" }}
      onSubmit={eventObject => {
        eventObject.preventDefault();
        onSave({ ...form, leadId: form.leadId || null, eventAt: new Date(form.eventAt).toISOString() });
      }}
    >
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Tipo" required>
          <Select value={form.type} onChange={eventObject => set("type")(eventObject.target.value)}>
            {AGENDA_TYPES.filter(type => type.id !== "retorno" || !event).map(type => <option key={type.id} value={type.id}>{type.label}</option>)}
          </Select>
        </Field>
        <Field label="Data e horário" required>
          <TextInput type="datetime-local" value={form.eventAt} onChange={eventObject => set("eventAt")(eventObject.target.value)} required />
        </Field>
      </div>
      <Field label="Título" required>
        <TextInput value={form.title} onChange={eventObject => set("title")(eventObject.target.value)} maxLength={200} placeholder="Ex.: Apresentar proposta comercial" required />
      </Field>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Lead relacionado" required={form.type === "retorno"}>
          <Select value={form.leadId} onChange={eventObject => set("leadId")(eventObject.target.value)} required={form.type === "retorno"}>
            <option value="">Sem lead relacionado</option>
            {leads.map(lead => <option key={lead.id} value={lead.id}>{lead.company}</option>)}
          </Select>
        </Field>
        <Field label="Responsável">
          <Select value={form.owner} onChange={eventObject => set("owner")(eventObject.target.value)}>
            {USERS.map(user => <option key={user.id} value={user.id}>{user.name}</option>)}
          </Select>
        </Field>
      </div>
      <Field label="Observações">
        <TextArea value={form.notes} onChange={eventObject => set("notes")(eventObject.target.value)} maxLength={2000} rows={2} placeholder="Detalhes opcionais" />
      </Field>
      <div className="flex justify-end gap-2">
        <Button type="button" variant="secondary" size="sm" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" size="sm" icon={CheckCircle2}>{event ? "Salvar alterações" : "Adicionar à agenda"}</Button>
      </div>
    </form>
  );
}

function AgendaView({ db, currentUser, onOpenLead, dispatch, notify }) {
  const [typeFilter, setTypeFilter] = useState("todos");
  const [statusFilter, setStatusFilter] = useState("agendado");
  const [periodFilter, setPeriodFilter] = useState("todos");
  const [showForm, setShowForm] = useState(false);
  const [editingEvent, setEditingEvent] = useState(null);
  const [notifyStatus, setNotifyStatus] = useState(null);
  const [sendingTest, setSendingTest] = useState(false);
  const leadsById = useMemo(() => Object.fromEntries(db.leads.map(lead => [lead.id, lead])), [db.leads]);
  /* Mesma fonte do bloco de Agenda do Dashboard — ver agendaEntriesOf(). */
  const entries = useMemo(() => agendaEntriesOf(db), [db.agendaEvents, db.followups]);

  const filteredEntries = useMemo(() => entries
    .filter(entry => typeFilter === "todos" || entry.type === typeFilter)
    .filter(entry => statusFilter === "todos" || entry.eventStatus === statusFilter)
    .filter(entry => {
      if (periodFilter === "todos") return true;
      const date = new Date(entry.eventAt);
      const now = new Date();
      if (periodFilter === "hoje") return date.toDateString() === now.toDateString();
      if (periodFilter === "atrasados") return entry.eventStatus === "agendado" && startOfDay(date) < startOfDay(now);
      const end = new Date(now);
      end.setDate(end.getDate() + 7);
      return entry.eventStatus === "agendado" && date >= startOfDay(now) && date <= end;
    })
    .sort((a, b) => new Date(a.eventAt) - new Date(b.eventAt)), [entries, periodFilter, statusFilter, typeFilter]);

  const saveEntry = data => {
    if (data.type === "retorno") {
      const note = [data.title.trim(), data.notes.trim()].filter(Boolean).join(" — ");
      if (editingEvent?.source === "followup") {
        dispatch({ type: "UPDATE_FOLLOWUP", id: editingEvent.id, patch: { dueDate: data.eventAt, note } });
      } else {
        dispatch({
          type: "ADD_FOLLOWUP",
          followup: {
            id: `f_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            leadId: data.leadId,
            dueDate: data.eventAt,
            note,
            status: "pendente",
            createdBy: data.owner,
          },
        });
      }
    } else if (editingEvent) {
      dispatch({ type: "UPDATE_AGENDA_EVENT", id: editingEvent.id, patch: data });
    } else {
      dispatch({
        type: "ADD_AGENDA_EVENT",
        event: { id: `a_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, ...data, status: "agendado" },
      });
    }
    notify(editingEvent ? "Evento atualizado." : "Evento adicionado à agenda.");
    setShowForm(false);
    setEditingEvent(null);
  };

  const updateEntryStatus = (entry, status) => setAgendaEntryStatus(dispatch, notify, entry, status);

  const rescheduleFollowup = entry => {
    const newDate = window.prompt("Informe a nova data e hora no formato AAAA-MM-DD HH:MM:", `${toLocalDateTimeInput(daysFromNow(1, 9, 0)).replace("T", " ")}`);
    if (!newDate) return;
    const parsed = new Date(newDate.replace(" ", "T"));
    if (Number.isNaN(parsed.getTime())) {
      notify("Data inválida. Use o formato AAAA-MM-DD HH:MM.", "danger");
      return;
    }
    dispatch({ type: "UPDATE_FOLLOWUP", id: entry.id, patch: { dueDate: parsed.toISOString(), status: "pendente" } });
    notify("Retorno reagendado.");
  };

  /* Lembretes no Windows: quem dispara é o agendador do backend local
     (backend/services/agendaNotifier.js), então falamos com ele pela mesma base
     usada no WhatsApp — em produção, http://localhost:3001/api. */
  useEffect(() => {
    let alive = true;
    fetch(`${getWhatsAppApiBaseUrl()}/agenda/notify/status`)
      .then(res => (res.ok ? res.json() : Promise.reject(new Error("sem resposta"))))
      .then(payload => { if (alive) setNotifyStatus(payload && payload.data ? payload.data : null); })
      .catch(() => { if (alive) setNotifyStatus(null); });
    return () => { alive = false; };
  }, []);

  const sendTestNotification = async () => {
    setSendingTest(true);
    try {
      const res = await fetch(`${getWhatsAppApiBaseUrl()}/agenda/notify-test`, { method: "POST" });
      const payload = await res.json().catch(() => null);
      if (!res.ok || !payload || !payload.success) throw new Error((payload && payload.message) || "O backend local não respondeu.");
      if (payload.data && payload.data.ok === false) throw new Error(payload.data.reason || "O Windows recusou a notificação.");
      notify("Notificação enviada ao Windows — olhe no canto direito da tela.");
    } catch (error) {
      notify(`Não foi possível notificar: ${error.message} Confirme que o run-crm.bat está aberto.`, "danger");
    } finally {
      setSendingTest(false);
    }
  };

  return (
    <div className="space-y-5">
      <div className="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <h1 className="gc-display text-xl font-semibold">Agenda</h1>
          <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>
            Reuniões, demonstrações, retornos, tarefas e compromissos em um só lugar.
          </p>
        </div>
        <Button icon={Plus} onClick={() => { setEditingEvent(null); setShowForm(value => !value); }}>
          Novo evento
        </Button>
      </div>

      {/* Só aparece com o backend local no ar (é dele o agendador do Windows). */}
      {notifyStatus && notifyStatus.windows && (
        <div className="flex items-center gap-3 flex-wrap rounded-xl px-4 py-3" style={{ background: "var(--surface-sunken)", border: "1px solid var(--line)" }}>
          <Pill tone={notifyStatus.enabled ? "green" : "slate"}>
            {notifyStatus.enabled ? "Lembretes no Windows ativos" : "Lembretes desativados"}
          </Pill>
          <span className="text-xs min-w-0 flex-1" style={{ color: "var(--slate)" }}>
            {notifyStatus.enabled ? (
              <>Cada agendamento avisa {notifyStatus.leadMin} min antes, na hora marcada e {notifyStatus.lateMin} min depois de atrasar{notifyStatus.summary ? ", além do resumo do dia ao abrir o CRM" : ""}. Varredura a cada {notifyStatus.intervalMin} min — cada aviso sai uma só vez.</>
            ) : (
              <>Para ligar, troque AGENDA_NOTIFY_ENABLED para true no backend/.env e reabra o run-crm.bat.</>
            )}
          </span>
          <Button size="sm" variant="secondary" icon={Bell} onClick={sendTestNotification} disabled={sendingTest}>
            {sendingTest ? "Enviando..." : "Testar notificação"}
          </Button>
        </div>
      )}

      {(showForm || editingEvent) && (
        <AgendaEventForm
          key={editingEvent?.id || "new-agenda-event"}
          event={editingEvent}
          leads={db.leads}
          currentUser={currentUser}
          onSave={saveEntry}
          onCancel={() => { setShowForm(false); setEditingEvent(null); }}
        />
      )}

      <div className="flex items-center gap-2 overflow-x-auto gc-scroll pb-1">
        <FilterChip label="Todos os tipos" active={typeFilter === "todos"} onClick={() => setTypeFilter("todos")} />
        {AGENDA_TYPES.map(type => (
          <FilterChip key={type.id} label={type.label} active={typeFilter === type.id} onClick={() => setTypeFilter(type.id)} />
        ))}
      </div>

      <div className="flex items-center gap-2 overflow-x-auto gc-scroll pb-1">
        <FilterChip label="Todos os status" active={statusFilter === "todos"} onClick={() => setStatusFilter("todos")} />
        {AGENDA_STATUSES.map(status => (
          <FilterChip key={status.id} label={status.label} active={statusFilter === status.id} onClick={() => setStatusFilter(status.id)} />
        ))}
        <span className="w-px h-5 shrink-0 mx-1" style={{ background: "var(--line-strong)" }} />
        {[["todos", "Qualquer data"], ["hoje", "Hoje"], ["proximos", "Próximos 7 dias"], ["atrasados", "Atrasados"]].map(([id, label]) => (
          <FilterChip key={id} label={label} active={periodFilter === id} onClick={() => setPeriodFilter(id)} />
        ))}
      </div>

      <SectionCard title={`Eventos · ${filteredEntries.length}`}>
        {filteredEntries.length === 0 ? (
          <div className="px-5 py-8">
            <EmptyState icon={CalendarDays} title="Nenhum evento neste período" hint="Adicione uma reunião, demonstração, retorno, tarefa ou compromisso." />
          </div>
        ) : filteredEntries.map(entry => {
          const lead = leadsById[entry.leadId];
          const typeLabel = agendaTypeLabel(entry.type);
          const completed = entry.eventStatus !== "agendado";
          const late = !completed && startOfDay(entry.eventAt) < startOfDay(new Date());
          return (
            <div key={`${entry.source}-${entry.id}`} className="flex items-start gap-3 px-4 py-3.5 flex-wrap sm:flex-nowrap" style={{ borderBottom: "1px solid var(--line)", opacity: completed ? 0.7 : 1 }}>
              <div className="w-24 shrink-0">
                <div className="gc-mono text-xs font-medium" style={{ color: late ? "var(--danger)" : "var(--ink-soft)" }}>{fmtDate(entry.eventAt)}</div>
                <div className="gc-mono text-xs mt-1" style={{ color: "var(--slate)" }}>{fmtTime(entry.eventAt)}</div>
              </div>
              <div className="flex-1 min-w-0 space-y-1">
                <div className="flex items-center gap-2 flex-wrap">
                  <Pill tone={agendaTypeTone(entry.type)}>{typeLabel}</Pill>
                  {late && <Pill tone="red">Atrasado</Pill>}
                  {completed && <Pill tone={entry.eventStatus === "concluido" ? "green" : "slate"}>{entry.eventStatus === "concluido" ? "Concluído" : "Cancelado"}</Pill>}
                  <span className={`text-sm font-medium ${completed ? "line-through" : ""}`}>{entry.title}</span>
                </div>
                {lead ? (
                  <button type="button" onClick={() => onOpenLead(lead.id, entry.source === "followup" ? "followups" : "geral")} className="text-xs gc-focus rounded" style={{ color: "var(--accent-ink)" }}>
                    {lead.company}
                  </button>
                ) : null}
                {entry.notes && <p className="text-xs whitespace-pre-wrap" style={{ color: "var(--slate)" }}>{entry.notes}</p>}
                {entry.owner && <p className="text-[11px]" style={{ color: "var(--slate)" }}>Responsável: {userName(entry.owner)}</p>}
              </div>
              {!completed ? (
                <div className="flex items-center gap-1 shrink-0 ml-auto">
                  {entry.source === "followup" ? (
                    <>
                      <IconButton icon={CheckCircle2} label="Concluir retorno" onClick={() => updateEntryStatus(entry, "concluido")} />
                      <IconButton icon={RotateCcw} label="Reagendar retorno" onClick={() => rescheduleFollowup(entry)} />
                    </>
                  ) : (
                    <>
                      <IconButton icon={CheckCircle2} label="Concluir evento" onClick={() => updateEntryStatus(entry, "concluido")} />
                      <IconButton icon={Edit} label="Editar evento" onClick={() => { setShowForm(false); setEditingEvent(entry); }} />
                    </>
                  )}
                  <IconButton icon={Ban} label="Cancelar evento" onClick={() => updateEntryStatus(entry, "cancelado")} />
                </div>
              ) : entry.source === "agenda" ? (
                <Button size="sm" variant="secondary" onClick={() => updateEntryStatus(entry, "agendado")}>Reabrir</Button>
              ) : null}
            </div>
          );
        })}
      </SectionCard>
    </div>
  );
}

      <div>
        <h1 className="gc-display text-xl font-semibold">Follow-ups</h1>
        <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>{sel.pendingFollowups.length} pendentes no total</p>

const DEMO_URGENCY_LABEL = { ativa: "Enviada", atencao: "Próxima de expirar", critica: "Expirando", expirada: "Expirada", desativada: "Desativada", criada: "Criada — não enviada" };
const DEMO_URGENCY_TONE = { ativa: "green", atencao: "amber", critica: "amber", expirada: "red", desativada: "slate", criada: "blue" };

function DemosView({ db, sel, onOpenLead, notify, dispatch }) {
  const [filter, setFilter] = useState(null);
  const list = useMemo(() => {
    let l = [...db.demos].sort((a, b) => new Date(a.expiresAt || a.createdAt) - new Date(b.expiresAt || b.createdAt));
    if (filter) l = l.filter(d => demoUrgency(d) === filter);
    return l;
  }, [db.demos, filter]);

  const markSent = (demo) => {
    const now = new Date().toISOString();
    dispatch({ type: "UPDATE_DEMO", id: demo.id, patch: { sentAt: now, expiresAt: hoursFromNow(demo.validityHours || 24) } });
    dispatch({ type: "ADD_INTERACTION", leadId: demo.leadId, interaction: { id: `i_${Date.now()}`, leadId: demo.leadId, date: now, user: sel.leadById[demo.leadId]?.owner, channel: "WhatsApp", result: "Demo enviada", note: "Demonstração enviada." } });
    notify("Demo enviada.");
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="gc-display text-xl font-semibold">Demonstrações</h1>
        <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>{sel.demosDraft.length > 0 ? `${sel.demosDraft.length} aguardando envio · v` : "V"}alidade padrão de 24 horas após o envio.</p>
      </div>
      <div className="flex items-center gap-2 overflow-x-auto gc-scroll pb-1">
        <FilterChip label="Todas" active={!filter} onClick={() => setFilter(null)} />
        {["criada", "ativa", "atencao", "critica", "expirada", "desativada"].map(u => (
          <FilterChip key={u} label={DEMO_URGENCY_LABEL[u]} active={filter === u} onClick={() => setFilter(f => f === u ? null : u)} />
        ))}
      </div>
      {list.length === 0 ? <EmptyState icon={Timer} title="Nenhuma demo encontrada" /> : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {list.map(d => {
            const lead = sel.leadById[d.leadId];
            const urgency = demoUrgency(d);
            return (
              <div key={d.id} className="rounded-xl p-4 gc-card gc-card-hover space-y-2" style={{ background: "var(--surface)", border: "1px solid var(--line)" }}>
                <button onClick={() => onOpenLead(d.leadId, "demo")} className="w-full text-left gc-focus rounded space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-medium text-sm truncate">{lead?.company}</span>

/* =========================================================================
   FINANCEIRO VIEW — vendas, recebimentos e comissões.

   Nada do resto do CRM é copiado para aqui de propósito: a venda que nasce de
   um Cliente fechado é lida do próprio db.clients na hora (valor contratado +
   mensalidade), e só as vendas avulsas moram em finance_sales. Assim o número
   só tem um dono. Enquanto as tabelas novas não existem no Supabase, a tela
   continua mostrando o que dá para ver (as vendas herdadas dos clientes) e o
   aviso diz exatamente qual SQL colar, em vez de sumir com tudo.
   ========================================================================= */

const FINANCE_KINDS_UI = ["Implementação", "Mensalidade", "Serviço avulso", "Outro"];
const FINANCE_METHODS_UI = ["PIX", "Boleto", "Cartão", "Dinheiro", "Transferência"];
const FINANCE_MESES_UI = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
  "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

/* As três guias dos recebimentos, uma por tipo de cobrança: mensalidade é a
   rotina do mês, implantação é o valor único do projeto e "avulsos" agrega
   serviço avulso + outro. O tipo gravado no lançamento decide a guia, e um
   lançamento sem tipo cai em Avulsos de propósito: ele aparece na tela em vez
   de ficar invisível. */
const ABAS_RECEBIMENTO = [["mensalidades", "Mensalidades"], ["implantacao", "Implantação"], ["avulsos", "Avulsos"]];
function ehImplementacao(kind) {
  const normalizado = String(kind || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  return normalizado.includes("implement") || normalizado.includes("implant");
}
function abaDoTipo(kind) {
  const k = String(kind || "").trim();
  if (k === "Mensalidade") return "mensalidades";
  if (k === "Implementação") return "implantacao";
  return "avulsos";
}
function rotuloAba(aba) {
  const a = ABAS_RECEBIMENTO.find(x => x[0] === aba);
  return a ? a[1] : "Avulsos";
}
/* Caminho inverso, para o formulário já abrir com o tipo da guia em que ele está. */
function tipoDaAba(aba) {
  if (aba === "implantacao") return "Implementação";
  if (aba === "avulsos") return "Serviço avulso";
  return "Mensalidade";
}
/* O que dizer quando a guia está vazia — cada guia tem um jeito próprio de encher. */
const HINT_ABA_RECEBIMENTO = {
  mensalidades: "Use “Gerar mensalidades” para lançar a parcela do mês de cada cliente ativo, ou “Novo recebimento” com tipo Mensalidade.",
  implantacao: "Nada de implantação com este filtro. Lance pelo “Novo recebimento” com tipo Implementação — a linha cai nesta guia.",
  avulsos: "Nada de serviço avulso nem “Outro” com este filtro. Lance pelo “Novo recebimento” escolhendo um destes tipos.",
};

/* 'YYYY-MM' / 'YYYY-MM-DD' locais, sem depender de locale nem de UTC. */
function currentMonthKey() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function shiftMonthKey(key, delta) {
  const m = /^(\d{4})-(\d{2})/.exec(String(key || ""));
  const d = m ? new Date(Number(m[1]), Number(m[2]) - 1 + delta, 1) : new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function monthLabelUi(key) {
  const m = /^(\d{4})-(\d{2})/.exec(String(key || ""));
  if (!m) return "—";
  return `${FINANCE_MESES_UI[Number(m[2]) - 1] || m[2]}/${m[1]}`;
}
/* Coluna `date` do banco volta como 'YYYY-MM-DD' e tem que ser lida como dia:
   se virar Date, o fuso empurra a parcela do dia 1 para o mês anterior. */
function dayKeyOf(value) {
  if (!value) return "";
  const texto = String(value).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) return texto;
  const d = new Date(texto);
  if (isNaN(d.getTime())) return "";
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function monthKeyOf(value) { const k = dayKeyOf(value); return k ? k.slice(0, 7) : ""; }
function somaLista(lista, pega) { return (lista || []).reduce((acc, item) => acc + (Number(pega(item)) || 0), 0); }
/* Quantos dias o lançamento está atrasado, contando por dia de calendário e não
   por objeto Date: "2026-10-18" vence em 18/10 e no dia 18 ainda não é atraso.
   Comparar Date() com new Date("YYYY-MM-DD") mistura UTC com o fuso de Ipatinga
   e o dia de vencimento aparecia como "Atrasado 1d" no próprio dia. */
function diasAtraso(vencimento, hoje) {
  if (!vencimento || !hoje || vencimento >= hoje) return 0;
  const [a1, m1, d1] = String(vencimento).split("-").map(Number);
  const [a2, m2, d2] = String(hoje).split("-").map(Number);
  const dias = Math.round((Date.UTC(a2, m2 - 1, d2) - Date.UTC(a1, m1 - 1, d1)) / 86400000);
  return dias > 0 ? dias : 0;
}

/* Uma peça da faixa de soma da guia: o rótulo, o valor e quantos lançamentos
   formam aquele valor — para o número nunca aparecer sozinho sem saber de onde
   ele veio. */
function ItemSomaGuia({ label, valor, qtd, cor }) {
  return (
    <span className="flex items-center gap-1.5 whitespace-nowrap">
      <span>{label}</span>
      <span className="gc-mono font-medium" style={{ color: cor || "var(--ink)" }}>{fmtMoney(valor)}</span>
      <span style={{ color: "var(--slate)" }}>({qtd} {qtd === 1 ? "lançamento" : "lançamentos"})</span>
    </span>
  );
}

/* Janelas de período da guia Vendas do Financeiro. "todas" devolve null (sem
   filtro) e a janela é SEMPRE contada a partir do mês escolhido no topo, nunca de
   hoje — voltar para Setembro/2026 e clicar "Este ano" tem que mostrar 2026. */
const JANELAS_VENDAS_UI = [["mes", "Deste mês"], ["trimestre", "Últimos 3 meses"], ["ano", "Este ano"], ["todas", "Todas as vendas"]];
const CHAVE_FILTRO_VENDAS = "crm:filtro-periodo-vendas";

function mesesDaJanelaVendas(filtro, mes) {
  if (filtro === "todas") return null;
  if (filtro === "trimestre") return [shiftMonthKey(mes, -2), shiftMonthKey(mes, -1), mes];
  if (filtro === "ano") {
    const ano = String(mes).slice(0, 4);
    return Array.from({ length: 12 }, (_, i) => `${ano}-${pad(i + 1)}`);
  }
  return [mes];
}

/* A última janela escolhida fica no navegador (mesma ideia do ajuste das colunas
   dos Leads): ele abre o Financeiro amanhã e continua no período que deixou. Um
   valor salvo que não é uma das janelas conhecidas volta para "Deste mês", em vez
   de deixar a lista vazia por um filtro fantasma. */
function lerFiltroVendasSalvo() {
  try {
    const salvo = localStorage.getItem(CHAVE_FILTRO_VENDAS);
    return JANELAS_VENDAS_UI.some(janela => janela[0] === salvo) ? salvo : "mes";
  } catch (err) { return "mes"; }
}
function salvarFiltroVendasEscolhido(filtro) {
  try { localStorage.setItem(CHAVE_FILTRO_VENDAS, filtro); } catch (err) { /* sem memória local: segue sem travar a tela */ }
}

/* O campo de confirmação com senha, igual dentro da linha do recebimento e
   dentro da linha da venda: nome, valor, o que vai acontecer, a senha escrita na
   própria linha e "Voltar". Ele não aceita janela no meio da tela, e a senha é
   conferida no servidor. */
function CampoConfirmacaoSenha({ pedido, senha, onSenha, onConfirmar, onVoltar, ocupado }) {
  return (
    <div className="mt-1 rounded-lg px-3 py-2.5 space-y-2 gc-fade-in" style={{ background: "var(--surface-sunken)", border: "1px solid var(--line-strong)" }}>
      <p className="text-xs leading-relaxed" style={{ color: "var(--ink-soft)" }}>{pedido.texto}</p>
      <div className="flex items-center gap-2 flex-wrap">
        <TextInput type="password" autoFocus autoComplete="new-password" value={senha} placeholder="Sua senha do CRM"
          onChange={(e) => onSenha(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") onConfirmar(); }}
          style={{ width: 220, padding: "6px 8px", fontSize: 13 }} />
        <Button size="sm" variant={pedido.acao === "desfazer" ? "secondary" : "danger"} icon={LockIcon}
          disabled={!senha || ocupado} onClick={onConfirmar}>
          {ocupado ? "Conferindo senha…" : ROTULO_ACACO_SENHA[pedido.acao]}
        </Button>
        <Button size="sm" variant="ghost" icon={X} disabled={ocupado} onClick={onVoltar}>Voltar</Button>
      </div>
      <p className="text-[11px]" style={{ color: "var(--slate)" }}>
        {pedido.acao === "excluir"
          ? "A senha é conferida no servidor antes de apagar. Errar não mexe em nada, e ela não fica salva no navegador."
          : "A senha é conferida no servidor antes de mudar o valor. Errar não mexe em nada, e ela não fica salva no navegador."}
      </p>
    </div>
  );
}

/* Uma linha de recebimento. Cancelar guarda o histórico (vira 'Cancelado' e sai
   das somas); Excluir apaga mesmo, e só serve para lançamento digitado errado.
   Os dois atos sem volta (Excluir e Desfazer, e Cancelar de um lançamento que já
   entrou) abrem o campo de senha NA LINHA — sem janela por cima da tela, e sem
   pedir a senha de novo para ajustar vencimento ou método. */
const ROTULO_ACACO_SENHA = {
  excluir: "Confirmar exclusão",
  desfazer: "Confirmar desfazer",
  cancelar: "Confirmar cancelamento",
};
function RecebimentoRow({ p, hoje, onPatch, onAbrirFicha, onEdit, onPedir, pedido, senha, onSenha, onConfirmar, onVoltar, ocupado, foco }) {
  const pago = p.status === "Pago";
  const cancelado = p.status === "Cancelado";
  const vencimento = dayKeyOf(p.dueDate);
  const tone = cancelado ? "slate" : "amber";
  const rotulo = cancelado ? "Cancelado" : "A receber";

  return (
    <div data-lancamento={p.id} className="px-5 py-3 space-y-2" style={{ borderBottom: "1px solid var(--line)", background: foco ? "var(--tone-blue-bg)" : undefined }}>
      <div className="flex items-start gap-3 flex-wrap">
        <div className="min-w-0 flex-1">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-sm font-medium truncate">{p.company || "—"}</span>
            {!pago && <Pill tone={tone} dot>{rotulo}</Pill>}
            {p.kind && <Pill tone="slate">{p.kind}</Pill>}
          </div>
          <div className="text-xs mt-1" style={{ color: "var(--slate)" }}>
            {p.description || "Sem descrição"}
            {p.method ? ` · ${p.method}` : ""}
            {p.period ? ` · parcela de ${monthLabelUi(dayKeyOf(p.period).slice(0, 7))}` : ""}
            {p.paidAt ? ` · entrou em ${fmtDateFull(p.paidAt)}` : ""}
          </div>
        </div>
        <span className="gc-mono text-sm font-medium" style={{ color: pago ? "var(--success)" : cancelado ? "var(--slate)" : "var(--ink)" }}>
          {fmtMoney(p.amount)}
        </span>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <span className="text-xs" style={{ color: "var(--slate)" }}>Vence</span>
        <TextInput type="date" value={vencimento} onChange={(e) => onEdit(p, "dueDate", e.target.value)} style={{ width: 148, padding: "5px 8px", fontSize: 12 }} />
        <Select value={p.method || ""} onChange={(e) => onEdit(p, "method", e.target.value)} style={{ width: "auto", padding: "5px 8px", fontSize: 12 }}>
          {!p.method && <option value="" disabled>Sem método</option>}
