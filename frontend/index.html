  const [outcomeQuery, setOutcomeQuery] = useState("");
  /* Impressão: "printing" faz a lista de empresas sair inteira no papel (sem o
     corte de 15) e o título da aba vira o nome sugerido do arquivo PDF. */
  const [printing, setPrinting] = useState(false);
  const tituloAba = useRef(null);

  const period = PERF_PERIODS.find(p => p.days === periodDays) || PERF_PERIODS[1];

  const handlePrint = () => {
    const agora = new Date();
    tituloAba.current = document.title;
    document.title = `Relatorio de leads - ${period.days ? `ultimos ${period.days} dias` : "historico completo"} - ${pad(agora.getDate())}-${pad(agora.getMonth() + 1)}-${agora.getFullYear()}`;
    setPrinting(true);
    /* Pequena espera para o React entregar a lista completa antes de o
       navegador fotografar a página. */
    setTimeout(() => window.print(), 180);
  };

  useEffect(() => {
    function restaurar() {
      setPrinting(false);
      if (tituloAba.current !== null) {
        document.title = tituloAba.current;
        tituloAba.current = null;
      }
    }
    window.addEventListener("afterprint", restaurar);
    return () => window.removeEventListener("afterprint", restaurar);
  }, []);

  /* Ctrl/Cmd+P aqui dentro faz a mesma coisa que o botão. Sem isso, o atalho
     nativo imprimiria a tela com a lista cortada em 15 empresas. */
  useEffect(() => {
    function atalho(eventObject) {
      if ((eventObject.ctrlKey || eventObject.metaKey) && !eventObject.altKey && eventObject.key.toLowerCase() === "p") {
        eventObject.preventDefault();
        handlePrint();
      }
    }
    window.addEventListener("keydown", atalho);
    return () => window.removeEventListener("keydown", atalho);
  });

  const perf = useMemo(() => {
    const outcomes = buildPerfOutcomes(db);
    return {
      outcomes,
      stats: perfStats(outcomes, periodDays),
      baseline: periodDays ? perfStats(outcomes, 0) : null,

  return (
    <div className="space-y-5">

        </div>
        <div className="flex flex-col items-end gap-1 gc-no-print">
          <Button variant="secondary" icon={Printer} onClick={handlePrint}>Imprimir / PDF</Button>
          <span className="text-[11px]" style={{ color: "var(--slate)" }}>No destino, escolha &quot;Salvar como PDF&quot;.</span>
        </div>
      </div>

      {/* Cabeçalho que só aparece no papel / no PDF. */}
      <div className="gc-print-only flex items-end justify-between gap-3 pb-2" style={{ borderBottom: "2px solid var(--ink)" }}>
        <div>
          <div className="gc-display text-[17px] font-semibold">Relatório de leads — Gestão Comercial</div>
          <div className="text-[11px] mt-0.5" style={{ color: "var(--slate)" }}>Período analisado: {period.label.toLowerCase()} · recorte da lista: {PERF_FILTERS.find(f => f.key === outcomeFilter)?.label?.toLowerCase()}</div>
        </div>
        <div className="text-right text-[11px]" style={{ color: "var(--slate)" }}>
          Emitido em {fmtDateFull(new Date())}<br />{db.leads.length} {db.leads.length === 1 ? "empresa" : "empresas"} cadastradas
        </div>

      <PerfSummary stats={perf.stats} baseline={perf.baseline} period={period} setPeriodDays={setPeriodDays} />

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">

  const [importing, setImporting] = useState(false);
  const [enriching, setEnriching] = useState(() => new Set());
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);
  const [activeLeadKey, setActiveLeadKey] = useState(null);
  const [onlyContact, setOnlyContact] = useState(true);

  const results = result?.resultados || [];
  const isGooglePlaces = result?.origem === "Google Places";
  const hasContact = (i) => Boolean(isGooglePlaces ? i.telefone : i.whatsapp);
  const visible = onlyContact ? results.filter(hasContact) : results;
  const keyOf = (item) => `${item.osm_type}:${item.osm_id}`;

  const runSearch = async () => {
    if (!city.trim() || !term.trim()) {
      setError("Informe a cidade e o termo de busca.");
      return;
    }
    setLoading(true);
    setError(null);
    setResult(null);
    setActiveLeadKey(null);
    try {
      const data = await window.CRMEnrichment.search({
        city: city.trim(),
        state: (state.trim() || "MG").toUpperCase(),
        radius: Number(radius) || 10000,
        term: term.trim(),
        source
      });
      setResult(data);
    } catch (e) {
      setError(e.message || "Falha na busca. O backend está rodando?");
    } finally {
      setLoading(false);
    }
  };

  const toRecord = (item) => ({
    company: item.nome,
    contactName: item.nome,
    phone: item.telefone || "",
    whatsapp: item.whatsapp || "",
    instagram: item.instagram || "",
    currentSite: item.site || "",
    city: item.cidade || city.trim(),
    source: "Prospecção ativa",
    gmaps: (item.latitude != null && item.longitude != null)
      ? `https://www.google.com/maps?q=${item.latitude},${item.longitude}`
      : "",
    notes: [
      item.endereco,
      item.email && `Email: ${item.email}`,
      `Fonte: ${item.fonte || "OpenStreetMap"}`,
      item.whatsapp_nao_verificado && "WhatsApp não verificado (telefone comercial do Google Places)"
    ].filter(Boolean).join(" · ")
  });

  const searchInstagram = async (item) => {
    const key = keyOf(item);
    setEnriching(prev => new Set(prev).add(key));
    try {
      const response = await window.CRMEnrichment.enrich([item], city.trim());
      const enriched = response.resultados?.[0];
      if (!enriched) throw new Error("A busca não retornou um resultado para esta empresa.");
      setResult(prev => prev && ({
        ...prev,
        resultados: prev.resultados.map(record =>
          keyOf(record) === key ? { ...record, ...enriched } : record
        )
      }));
      notify(
        enriched.instagram
          ? `Instagram encontrado: ${enriched.instagram}`
          : "Não encontramos um perfil de Instagram confiável para esta empresa.",
        enriched.instagram ? "success" : "info"
      );
    } catch (e) {
      notify(e.message || "Falha ao buscar o Instagram.", "error");
    } finally {
      setEnriching(prev => {
        const next = new Set(prev);
        next.delete(key);
        return next;
      });
    }
  };

  const doImport = async (items) => {
    if (!items.length) return;
    if (isGooglePlaces) {
      notify("Os resultados do Google Places são temporários e não podem ser importados.", "error");
      return;
    }
    setImporting(true);
    try {
      const outcome = await onImportRecords(items.map(toRecord));
      const failures = outcome?.failures || [];
      if (failures.length) {
        notify(
          `${outcome.succeeded || 0} leads salvos; ${failures.length} não puderam ser adicionados. Tente novamente ou confira a conexão.`,
          "error"
        );
      }
    } catch (e) {
      notify(e.message || "Falha ao importar.", "error");
    } finally {
      setImporting(false);
    }
  };

  const card = { background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 14 };

  return (
    <div className="space-y-4">
      <style>{`@keyframes gc-spin { to { transform: rotate(360deg); } } .gc-spin { animation: gc-spin 0.8s linear infinite; }`}</style>

      <div className="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <h1 className="gc-display text-xl font-semibold">Enriquecimento de leads</h1>
            <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>
              Busque empresas e contatos pelo Google Places. Os resultados são temporários e não são importados automaticamente.
          </p>
        </div>
        <span className="inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full" style={{ background: "var(--surface-sunken)", color: "var(--slate)" }}>
          <Globe size={14} /> {result?.instagram_provedor
            ? `${result.origem} + ${result.instagram_provedor}`
            : result?.origem || "Google Places"}
        </span>
      </div>

      <div className="p-4" style={card}>
        <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))" }}>
          <Field label="UF" required>
            <Select
              value={state}
              onChange={e => {
                const uf = e.target.value;
                setState(uf);
                const cidades = (window.BRASIL_MUNICIPIOS || {})[uf] || [];
                setCity(prev => cidades.includes(prev) ? prev : "");
              }}
            >
              <option value="">Selecione a UF</option>
              {(window.BRASIL_UFS || []).map(u => <option key={u.sigla} value={u.sigla}>{u.sigla} — {u.nome}</option>)}
            </Select>
          </Field>
          <Field label="Cidade" required>
            <Select value={city} onChange={e => setCity(e.target.value)} disabled={!state}>
              <option value="">Selecione a cidade</option>
              {((window.BRASIL_MUNICIPIOS || {})[state] || []).map(c => <option key={c} value={c}>{c}</option>)}
            </Select>
          </Field>
          <Field label="Termo / categoria" required>
            <Select value={term} onChange={e => setTerm(e.target.value)}>
              <option value="barbearia">Barbearia</option>
              <option value="salão de beleza">Salão de beleza</option>
              <option value="estética">Estética</option>
              <option value="clínica">Clínica / saúde</option>
              <option value="restaurante">Restaurante / alimentação</option>
              <option value="padaria">Padaria</option>
              <option value="delivery">Delivery</option>
              <option value="academia">Academia / fitness</option>
              <option value="pet shop">Pet shop / veterinária</option>
              <option value="imobiliária">Imobiliária</option>
              <option value="advocacia">Advocacia</option>
              <option value="contabilidade">Contabilidade</option>
              <option value="arquitetura">Arquitetura / engenharia</option>
              <option value="móveis">Móveis / marcenaria</option>
              <option value="oficina mecânica">Oficina / automotivo</option>
            </Select>
          </Field>
          <Field label="Raio (metros)">
            <TextInput type="number" value={radius} onChange={e => setRadius(e.target.value)} min="1000" step="1000" />
          </Field>
          <Field label="Fonte de busca">
            <Select
              value={source}
              onChange={e => {
                setSource(e.target.value);
                setResult(null);
                setActiveLeadKey(null);
                setError(null);
              }}
            >
              <option value="google_places">Google Places — consulta temporária</option>
            </Select>
          </Field>
        </div>
        <div className="flex items-center gap-2 mt-3 flex-wrap">
          <Button icon={loading ? Loader2 : Search} onClick={runSearch} disabled={loading} className={loading ? "gc-spin" : ""}>
            {loading ? "Buscando…" : "Buscar empresas"}
          </Button>
          {results.length > 0 && isGooglePlaces && (
            <span className="text-xs" style={{ color: "var(--slate)" }}>
              Consulta temporária · importação desativada
            </span>
          )}
          {results.length > 0 && (
            <label className="inline-flex items-center gap-2 text-sm" style={{ color: "var(--ink-soft)" }}>
              <input type="checkbox" checked={onlyContact} onChange={e => setOnlyContact(e.target.checked)} />
              {isGooglePlaces ? "Somente com telefone comercial" : "Somente com WhatsApp"}
            </label>
          )}
        </div>
        {isGooglePlaces && (
          <p className="mt-3 text-xs" style={{ color: "var(--slate)" }} role="note">
            Google Maps · Os dados desta busca não são copiados para o CRM. Use “Criar lead em branco” para preencher manualmente.
          </p>
        )}
        {!isGooglePlaces && result?.origem === "OpenStreetMap + Overpass" && (
          <p className="mt-3 text-xs" style={{ color: "var(--slate)" }} role="note">
            Use “Adicionar ao Leads” na linha da empresa.
          </p>
        )}
        {error && (
          <div className="mt-3 text-sm px-3 py-2 rounded-lg" style={{ background: "var(--danger-bg)", color: "var(--danger)" }}>
            {error}
          </div>
        )}
      </div>

      {loading ? (
        <div className="p-6" style={card}><EmptyState icon={Loader2} title="Buscando empresas e contatos…" hint="A busca usa o Google Places; configure GOOGLE_PLACES_API_KEY em backend/.env." /></div>
      ) : result ? (
        <div style={card}>
          <div className="flex items-center justify-between px-4 py-3" style={{ borderBottom: "1px solid var(--line)" }}>
            <span className="text-sm font-medium">
              {onlyContact
                ? `${visible.length} de ${result.total} ${isGooglePlaces ? "com telefone comercial" : "com WhatsApp"}`
                : `${result.total} ${result.total === 1 ? "empresa encontrada" : "empresas encontradas"}`}
            </span>
          </div>
          {visible.length === 0 ? (
            <EmptyState
              icon={Search}
              title={results.length ? `Nenhuma empresa com ${isGooglePlaces ? "telefone comercial" : "WhatsApp"}` : "Nenhuma empresa encontrada"}
              hint={results.length
                ? `Desmarque o filtro para ver também empresas sem ${isGooglePlaces ? "telefone comercial" : "contato"}.`
                : "Tente outro termo ou aumentar o raio de busca."}
            />
          ) : (
            <div className="enrichment-results">
              <table>
                <thead>
                  <tr style={{ color: "var(--slate)" }}>
                    <th>Empresa</th>
                    <th>Categoria</th>
                    <th>Contato</th>
                    <th>Cidade</th>
                    <th style={{ width: 220 }}></th>
                  </tr>
                </thead>
                <tbody>
                  {visible.map(item => {
                    const k = keyOf(item);
                    return (
                      <tr
                        key={k}
                        className={activeLeadKey === k ? "is-selected" : ""}
                        aria-selected={activeLeadKey === k}
                        tabIndex={0}
                        onClick={event => {
                          if (event.target.closest("input")) return;
                          setActiveLeadKey(k);
                        }}
                        onKeyDown={event => {
                          if (event.target !== event.currentTarget || !["Enter", " "].includes(event.key)) return;
                          event.preventDefault();
                          setActiveLeadKey(k);
                        }}
                      >
                        <td>
                          <div className="flex items-center gap-1.5">
                            <span className="font-medium">{item.nome}</span>
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                copyToClipboard(item.nome, "Nome da empresa", notify);
                              }}
                              className="inline-flex items-center justify-center p-1 rounded hover:bg-black/5"
                              title="Copiar nome da empresa"
                              style={{ color: "var(--slate)" }}
                            >
                              <Copy size={13} />
                            </button>
                          </div>
                          {item.endereco && (
                            <div className="flex items-center gap-1.5 text-xs" style={{ color: "var(--slate)" }}>
                              <span className="min-w-0">{item.endereco}</span>
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  copyToClipboard(item.endereco, "Endereço", notify);
                                }}
                                className="inline-flex items-center justify-center gap-1 px-1.5 py-0.5 rounded text-[10px] shrink-0 gc-focus"
                                title="Copiar endereço"
                                style={{
                                  color: "var(--ink-soft)",
                                  background: "var(--surface-sunken)",
                                  border: "1px solid var(--line-strong)"
                                }}
                              >
                                <Copy size={11} /> Copiar
                              </button>
                            </div>
                          )}
                        </td>
                        <td className="text-xs" style={{ color: "var(--ink-soft)" }}>{item.categoria || "—"}</td>
                        <td>
                          <div className="flex items-center gap-2 flex-wrap text-xs">
                            {item.whatsapp && (
                              item.whatsapp_link ? (
                                <a
                                  className="inline-flex items-center gap-1"
                                  style={{ color: "var(--accent-ink)" }}
                                  href={item.whatsapp_link}
                                  target="_blank"
                                  rel="noreferrer"
                                  title={item.whatsapp_nao_verificado ? "Telefone comercial do Google Places; cadastro no WhatsApp não verificado" : "Abrir WhatsApp"}
                                >
                                  <MessageCircle size={12} /> {item.whatsapp}
                                  {item.whatsapp_nao_verificado && " · não verificado"}
                                </a>
                              ) : (
                                <span
                                  className="inline-flex items-center gap-1"
                                  style={{ color: "var(--accent-ink)" }}
                                  title={item.whatsapp_nao_verificado ? "Telefone comercial do Google Places; cadastro no WhatsApp não verificado" : undefined}
                                >
                                  <MessageCircle size={12} /> {item.whatsapp}
                                  {item.whatsapp_nao_verificado && " · não verificado"}
                                </span>
                              )
                            )}
                            {item.telefone && (
                              <span className="inline-flex items-center gap-1">
                                <Phone size={12} /> {item.telefone}
                                <button
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    copyToClipboard(item.telefone, "Telefone", notify);
                                  }}
                                  className="inline-flex items-center justify-center p-0.5 rounded hover:bg-black/5 ml-0.5"
                                  title="Copiar telefone"
                                  style={{ color: "var(--slate)" }}
                                >
                                  <Copy size={11} />
                                </button>
                              </span>
                            )}
                            {item.instagram && (
                              <a className="inline-flex items-center gap-1" style={{ color: "var(--accent-ink)" }} href={igLink(item.instagram)} target="_blank" rel="noreferrer">
                                <Instagram size={12} /> {item.instagram}
                              </a>
                            )}
                            {item.email && <span className="inline-flex items-center gap-1"><Mail size={12} /> {item.email}</span>}
                            {item.site && <a className="inline-flex items-center gap-1" style={{ color: "var(--accent-ink)" }} href={item.site} target="_blank" rel="noreferrer"><Link2 size={12} /> site</a>}
                            {!item.telefone && !item.whatsapp && !item.instagram && !item.email && !item.site && <span style={{ color: "var(--slate)" }}>sem contato</span>}
                          </div>
                        </td>
                        <td className="text-xs">
                          <div className="flex items-center gap-1.5">
                            <span className="min-w-0">{item.cidade || city}</span>
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                copyToClipboard(item.cidade || city, "Cidade", notify, true);
                              }}
                              className="inline-flex items-center justify-center gap-1 px-1.5 py-0.5 rounded text-[10px] shrink-0 gc-focus"
                              title="Copiar cidade"
                              style={{
                                color: "var(--ink-soft)",
                                background: "var(--surface-sunken)",
                                border: "1px solid var(--line-strong)"
                              }}
                            >
                              <Copy size={11} /> Copiar
                            </button>
                          </div>
                        </td>
                        <td>
                          <div className="flex items-center gap-1.5">
                            {!item.instagram && !isGooglePlaces && (
                              <Button
                                size="sm"
                                variant="secondary"
                                icon={enriching.has(k) ? Loader2 : Instagram}
                                disabled={importing || enriching.has(k)}
                                onClick={() => searchInstagram(item)}
                                className={enriching.has(k) ? "gc-spin" : ""}
                              >
                                {enriching.has(k) ? "Buscando…" : "Buscar Instagram"}
                              </Button>
                            )}
                            <Button
                              size="sm"
                              variant="secondary"
                              icon={importing && !isGooglePlaces ? Loader2 : Plus}
                              disabled={importing || enriching.has(k)}
                              onClick={() => {
                                const record = toRecord(item);
                                const params = new URLSearchParams({
                                  company: record.company || "",
                                  contactName: record.contactName || "",
                                  phone: record.phone || "",
                                  whatsapp: record.whatsapp || "",
                                  instagram: record.instagram || "",
                                  currentSite: record.currentSite || "",
                                  city: record.city || "",
                                  gmaps: record.gmaps || "",
                                  notes: record.notes || ""
                                });
                                window.open(`index.html?action=new-lead&${params.toString()}`, "_blank");
                              }}
                              className={importing ? "gc-spin" : ""}
                              title="Cadastrar lead em uma nova guia do navegador"
                            >
                              Cadastrar lead
                            </Button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      ) : (
        <div style={card}><EmptyState icon={Sparkles} title="Faça uma busca para começar" hint="Informe cidade e termo, depois clique em Buscar empresas." /></div>
      )}
    </div>
  );
}

/* Áudio que o CLIENTE mandou no WhatsApp.
   O backend guarda a nota de voz no Supabase e devolve o texto transcrito na
   própria mensagem, marcado com o mesmo "🎧 " que o backend usa
   (backend/services/whatsapp/incomingAudioService.js). Aqui isso vira um player de
   um clique com a fala dele escrita embaixo, porque o CRM já mostrava só
   "[Áudio]" e ninguém ouvia nada pela tela.
   A URL do arquivo é pedida no primeiro toque (e fica guardada): a conversa é
   recarregada a cada sincronização, e cada assinatura no Supabase é um pedido. */
const AUDIO_PREFIX = "🎧 ";

function formatAudioTime(value) {
  const total = Math.max(0, Math.round(Number(value) || 0));
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
}

function voiceNoteOf(content) {
  const texto = String(content || "");
  if (!texto.startsWith(AUDIO_PREFIX)) return null;
  const corpo = texto.slice(AUDIO_PREFIX.length).trim();
  /* "[Áudio do cliente — transcrição indisponível]" não é fala: é o aviso de que
     a Groq não conseguiu transcrever, então o player aparece sem o "ele disse". */
  return { spoken: corpo.startsWith("[") ? "" : corpo };
}

/* Quantas mensagens antigas pedir ao celular em cada clique. O WhatsApp entrega
   em lote, e um pedido maior só atrasa a resposta do telefone. */
const MENSAGENS_ANTIGAS_POR_PEDIDO = 100;
/* Rótulo que o backend grava em quem saiu do APP do WhatsApp, e não do CRM. É o
   que diferencia "eu mandei por aqui" de "ele mandou pelo celular". */
const ENVIADA_PELO_CELULAR = "WhatsApp do celular";

function VoiceNote({ conversationId, message }) {
  /* hasAudio vem do backend (marcação conferida na leitura da conversa); o
     marcador no texto é o caminho de sempre. Um dos dois basta para o player
   aparecer. */
  const nota = voiceNoteOf(message.content) || { spoken: "" };
  const audioRef = useRef(null);
  const pedidoRef = useRef(null);
  const [url, setUrl] = useState("");
  const [carregando, setCarregando] = useState(false);
  const [tocando, setTocando] = useState(false);
  const [progresso, setProgresso] = useState(0);
  const [duracao, setDuracao] = useState(0);
  const [posicao, setPosicao] = useState(0);
  const [erro, setErro] = useState("");

  /* Sair da conversa no meio do áudio não pode deixar ele tocando escondido. */
  useEffect(() => () => {
    const el = audioRef.current;
    if (el) { el.pause(); el.src = ""; }
  }, []);

  const buscarUrl = async () => {
    if (url) return url;
    if (!pedidoRef.current) {
      setCarregando(true);
      setErro("");
      pedidoRef.current = crmApi.whatsapp.audioUrl(conversationId, message.id)
        .then(data => String(data?.url || ""))
        .catch(error => {
          pedidoRef.current = null;
          setErro(error?.message || "Não foi possível abrir o áudio deste cliente.");
          return "";
        })
        .finally(() => setCarregando(false));
    }
    const endereco = await pedidoRef.current;
    if (endereco) setUrl(endereco);
    return endereco;
  };

  const alternar = async () => {
    const existente = audioRef.current;
    if (existente && !existente.paused) { existente.pause(); return; }
    const endereco = await buscarUrl();
    if (!endereco) return;
    let el = existente;
    if (!el || el.src !== endereco) {
      if (el) el.pause();
      el = new Audio(endereco);
      el.preload = "metadata";
      audioRef.current = el;
      el.addEventListener("playing", () => setTocando(true));
      el.addEventListener("pause", () => setTocando(false));
      el.addEventListener("ended", () => { setTocando(false); setProgresso(0); setPosicao(0); });
      el.addEventListener("loadedmetadata", () => setDuracao(Number.isFinite(el.duration) ? el.duration : 0));
      el.addEventListener("timeupdate", () => {
        const tempo = el.duration && Number.isFinite(el.duration) ? el.duration : 0;
        setPosicao(el.currentTime || 0);
        setProgresso(tempo ? Math.min(1, (el.currentTime || 0) / tempo) : 0);
      });
      el.addEventListener("error", () => { setTocando(false); setErro("Este áudio não abriu no navegador. Toque de novo em alguns segundos."); });
    }
    if (el.paused) {
      try { await el.play(); setErro(""); }
      catch (_) { setErro("O navegador travou a reprodução. Toque outra vez — o gesto libera o som."); }
    } else {
      el.pause();
    }
  };

  /* Áudio servido em streaming não traz duração fixa (o Chrome devolve Infinity);
     sem duração conhecida, o que aparece é o tempo que já correu. */
  const tempoExibido = formatAudioTime(duracao || posicao);
  return (
    <div style={{ marginTop: 6 }}>
      <div className="flex items-center rounded-lg px-2 py-1" style={{ gap: 8, background: "var(--surface)", border: "1px solid var(--line)" }}>
        <button
          type="button"
          onClick={alternar}
          disabled={carregando}
          aria-label={tocando ? "Pausar o áudio do cliente" : "Tocar o áudio do cliente"}
          title={tocando ? "Pausar o áudio" : "Tocar o áudio que ele mandou"}
          className="w-7 h-7 rounded-full flex items-center justify-center shrink-0 transition-colors"
          style={{ background: "var(--accent)", color: "#FFFFFF", opacity: carregando ? 0.6 : 1 }}
        >
          {carregando
            ? <Loader2 size={13} style={{ animation: "gc-spin 0.8s linear infinite" }} />
            : tocando ? <Pause size={13} /> : <Play size={13} />}
        </button>
        <div className="flex-1 overflow-hidden rounded-full" style={{ height: 4, background: "var(--line)" }}>
          <div className="h-full rounded-full" style={{ width: `${Math.round((duracao ? progresso : Math.min(1, posicao / 60)) * 100)}%`, background: "var(--accent)", minWidth: posicao > 0 ? 4 : 0 }} />
        </div>
        <span style={{ fontSize: 10, color: "var(--slate)" }}>{tempoExibido}</span>
      </div>
      {nota.spoken ? (
        <p className="text-[11px] leading-4" style={{ marginTop: 4, color: "var(--ink-soft)" }}>
          <span className="font-semibold">Ele disse: </span>{nota.spoken}
        </p>
      ) : (
        <p className="text-[11px] leading-4" style={{ marginTop: 4, color: "var(--warn)" }}>
          Áudio disponível para tocar, mas a transcrição não chegou — a IA não consegue ler o que ele falou.
        </p>
      )}
      {erro && <p className="text-[11px] leading-4" style={{ marginTop: 4, color: "var(--danger)" }}>{erro}</p>}
    </div>
  );
}

function WhatsAppView({ currentUser }) {
  const MAX_MEDIA_BYTES = 8 * 1024 * 1024;
  const [status, setStatus] = useState(null);
  const [databaseReady, setDatabaseReady] = useState(false);
  const [conversations, setConversations] = useState([]);
  const [leads, setLeads] = useState([]);
  const [conversation, setConversation] = useState(null);
  const [sidebarView, setSidebarView] = useState("conversations");
  const [leadSearch, setLeadSearch] = useState("");
  const [conversationSearch, setConversationSearch] = useState("");
  const [loadingLeads, setLoadingLeads] = useState(false);
  const [openingLeadId, setOpeningLeadId] = useState(null);
  const [removingConversationId, setRemovingConversationId] = useState(null);
  const [draft, setDraft] = useState("");
  const [generatedAudioUrl, setGeneratedAudioUrl] = useState("");
  const [generatedAudioBlob, setGeneratedAudioBlob] = useState(null);
  const [generatingAudio, setGeneratingAudio] = useState(false);
  const [sendingGeneratedAudio, setSendingGeneratedAudio] = useState(false);
  const [voiceProfiles, setVoiceProfiles] = useState([]);
  const [voiceProfile, setVoiceProfile] = useState(() => localStorage.getItem("gc_wa_voice") || "");
  const [attachment, setAttachment] = useState(null);
  const [attachmentKind, setAttachmentKind] = useState(null);
  const [quickRepliesOpen, setQuickRepliesOpen] = useState(false);
  const [suggestions, setSuggestions] = useState([]);
  const [suggestionsOpen, setSuggestionsOpen] = useState(false);
  const [suggesting, setSuggesting] = useState(false);
  const [aiInfo, setAiInfo] = useState(null);
  const [recording, setRecording] = useState(false);
  const [phoneNumber, setPhoneNumber] = useState("");
  const [loading, setLoading] = useState(true);
  const [sending, setSending] = useState(false);
  const [connecting, setConnecting] = useState(false);
  const [error, setError] = useState("");
  /* Marca que o texto atual do erro veio de uma rodada de carregamento (backend
     fechado, timeout) e não de uma ação do usuário: a próxima rodada boa limpa só
     esse tipo, para nenhuma mensagem velha de "sem conexão" ficar pendurada. */
  const erroDeConexaoRef = useRef(false);
  const messagesEndRef = useRef(null);
  const selectedConversationIdRef = useRef(null);
  const conversationSelectionVersionRef = useRef(0);
  const conversationLoadVersionRef = useRef(0);
  const conversationSelectionPendingRef = useRef(false);
  const prevIncomingRef = useRef(new Map());
  const initializedIncomingRef = useRef(false);
  const [freshIds, setFreshIds] = useState(() => new Set());
  const [soundOn, setSoundOn] = useState(() => localStorage.getItem("gc_wa_sound") !== "off");
  const [statusMenuOpen, setStatusMenuOpen] = useState(false);
  const [statusMenuPos, setStatusMenuPos] = useState(null);
  const [savingStatus, setSavingStatus] = useState(false);
  /* Estado do "puxar mensagens antigas": o pedido volta na hora, mas as
     mensagens chegam depois, então a conversa é reaberta algumas vezes. */
  const [historico, setHistorico] = useState({ buscando: false, aviso: "", erro: "" });
  const historicoTimerRef = useRef(null);
  /* O estado historico.buscando não segura clique duplo: entre dois cliques no
     mesmo tick o React ainda não re-renderizou, então ele continua lendo false.
     Essa ref é sincrona e é ela que barra o segundo pedido. */
  const historicoEmAndamentoRef = useRef(false);
  /* A IA de resposta rápida é chamada UMA vez por mensagem nova: o ref síncrono
     barra o clique duplo no mesmo tick (estado do React ainda está velho) e a
     chave guarda para qual última mensagem o pedido já foi feito. */
  const sugestaoEmAndamentoRef = useRef(false);
  const sugeridaParaRef = useRef("");
  /* As sugestões já geradas ficam na memória da tela, indexadas pela última
     mensagem: reabrir a mesma conversa sai na hora, sem chamar a Groq de novo. */
  const sugestoesPorChaveRef = useRef(new Map());
  const statusMenuRef = useRef(null);
  const imageInputRef = useRef(null);
  const audioInputRef = useRef(null);
  const recorderRef = useRef(null);
  const mediaStreamRef = useRef(null);
  const recordingChunksRef = useRef([]);
  const attachmentPreviewUrl = useMemo(() => attachment ? URL.createObjectURL(attachment) : "", [attachment]);

  useEffect(() => () => {
    if (attachmentPreviewUrl) URL.revokeObjectURL(attachmentPreviewUrl);
  }, [attachmentPreviewUrl]);

  useEffect(() => {
    setAttachment(null);
    setAttachmentKind(null);
    setQuickRepliesOpen(false);
    setSuggestions([]);
    setSuggestionsOpen(false);
    setGeneratedAudioUrl("");
    setGeneratedAudioBlob(null);
    /* Trocou de conversa: o pedido de histórico anterior não vale mais, e o aviso
       também não. */
    window.clearInterval(historicoTimerRef.current);
    historicoTimerRef.current = null;
    historicoEmAndamentoRef.current = false;
    setHistorico({ buscando: false, aviso: "", erro: "" });
  }, [conversation?.id]);

  useEffect(() => () => {
    if (generatedAudioUrl) URL.revokeObjectURL(generatedAudioUrl);
  }, [generatedAudioUrl]);

  useEffect(() => () => {
    if (recorderRef.current?.state === "recording") recorderRef.current.stop();
    mediaStreamRef.current?.getTracks().forEach(track => track.stop());
  }, []);

  /* Carrega os tipos de voz do backend; se a API estiver fora, o botão único continua funcionando. */
  useEffect(() => {
    let alive = true;
    crmApi.whatsapp.voiceProfiles()
      .then(profiles => {
        if (!alive || !profiles.length) return;
        setVoiceProfiles(profiles);
        setVoiceProfile(current => (
          profiles.some(p => p.key === current) ? current
            : (profiles.find(p => p.isDefault) || profiles[0]).key
        ));
      })
      .catch(() => { if (alive) setVoiceProfiles([]); });
    return () => { alive = false; };
  }, []);

  /* Consulta se a IA de sugestões está configurada, para o botão poder avisar
     antes de clicar (sem backend aberto ele só fica no escuro mesmo). */
  useEffect(() => {
    let alive = true;
    crmApi.whatsapp.suggestStatus()
      .then(info => { if (alive) setAiInfo(info); })
      .catch(() => { if (alive) setAiInfo({ enabled: false, model: "", quantity: 0 }); });
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (voiceProfile) localStorage.setItem("gc_wa_voice", voiceProfile);
    setGeneratedAudioUrl("");
    setGeneratedAudioBlob(null);
  }, [voiceProfile]);

  const activeVoiceProfile = voiceProfiles.find(profile => profile.key === voiceProfile);

  const loadConversation = async id => {
    const loadVersion = ++conversationLoadVersionRef.current;
    const selectionVersion = conversationSelectionVersionRef.current;
    const selected = await crmApi.whatsapp.conversation(id);
    if (
      loadVersion !== conversationLoadVersionRef.current ||
      selectionVersion !== conversationSelectionVersionRef.current ||
      selectedConversationIdRef.current !== id
    ) return;
    setConversation(selected);
  };

  /* "Puxar mensagens antigas": o celular responde em outro momento, então aqui
     só dispara o pedido e reabre a conversa até a contagem de mensagens mudar.
     Se nada chegar em ~40 s, o aviso explica o que conferir. */
  const puxarMensagensAntigas = async () => {
    if (!conversation || historicoEmAndamentoRef.current || historico.buscando) return;
    historicoEmAndamentoRef.current = true;
    const id = conversation.id;
    const antes = conversation.messages?.length || 0;
    window.clearInterval(historicoTimerRef.current);
    setHistorico({ buscando: true, aviso: "Pedindo as mensagens antigas ao celular…", erro: "" });
    try {
      await crmApi.whatsapp.fetchHistory(id, MENSAGENS_ANTIGAS_POR_PEDIDO);
    } catch (requestError) {
      historicoEmAndamentoRef.current = false;
      setHistorico({ buscando: false, aviso: "", erro: requestError.message || "O WhatsApp não aceitou o pedido." });
      return;
    }
    let rodadas = 0;
    historicoTimerRef.current = window.setInterval(async () => {
      rodadas += 1;
      let agora = antes;
      try {
        const atual = await crmApi.whatsapp.conversation(id);
        agora = atual?.messages?.length || 0;
        if (selectedConversationIdRef.current === id) setConversation(atual);
      } catch (_) { /* a próxima rodada tenta de novo */ }
      if (agora > antes) {
        window.clearInterval(historicoTimerRef.current);
        historicoTimerRef.current = null;
        historicoEmAndamentoRef.current = false;
        const chegaram = agora - antes;
        setHistorico({
          buscando: false,
          aviso: `Chegaram ${chegaram} ${chegaram === 1 ? "mensagem" : "mensagens"} antiga${chegaram === 1 ? "" : "s"}.` +
            (chegaram >= MENSAGENS_ANTIGAS_POR_PEDIDO ? " Clique de novo para voltar mais atrás." : ""),
          erro: "",
        });
        return;
      }
      if (rodadas >= 10) {
        window.clearInterval(historicoTimerRef.current);
        historicoTimerRef.current = null;
        historicoEmAndamentoRef.current = false;
        setHistorico({
          buscando: false,
          aviso: "",
          erro: "O celular não mandou nada novo. Ele precisa estar com internet e com o WhatsApp aberto. Se a conversa já está toda aqui, não vem nada mesmo.",
        });
      }
    }, 4000);
  };

  useEffect(() => () => window.clearInterval(historicoTimerRef.current), []);

  const loadLeads = async () => {
    setLoadingLeads(true);
    try {
      setLeads(await crmApi.leads.list());
    } catch (requestError) {
      setError(requestError.message || "Não foi possível carregar os leads.");
    } finally {
      setLoadingLeads(false);
    }
  };

  const refresh = async (keepLoading = false) => {
    const selectionVersion = conversationSelectionVersionRef.current;
    try {
      const nextStatus = await crmApi.whatsapp.status();
      setStatus(nextStatus);
      const nextConversations = await crmApi.whatsapp.conversations();
      setConversations(nextConversations);
      /* A rodada de 2,5 s é também a vigilância do backend: se ela passou, o erro
         de conexão anterior perde o sentido e sai da tela. Erro de ação do usuário
         (envio, exclusão) fica, porque não foi a rodada que causou. */
      if (erroDeConexaoRef.current) {
        setError("");
        erroDeConexaoRef.current = false;
      }
      if (selectionVersion !== conversationSelectionVersionRef.current || conversationSelectionPendingRef.current) return;
      const activeId = selectedConversationIdRef.current || nextConversations[0]?.id;
      if (activeId && nextConversations.some(item => item.id === activeId)) {
        if (!selectedConversationIdRef.current) selectedConversationIdRef.current = activeId;
        await loadConversation(activeId);
      }
      else {
        setConversation(null);
        selectedConversationIdRef.current = null;
      }
    } catch (requestError) {
      erroDeConexaoRef.current = true;
      setError(requestError.message || "Não foi possível carregar o WhatsApp.");
    } finally {
      if (!keepLoading) setLoading(false);
    }
  };

  useEffect(() => {
    let mounted = true;
    let timer;

    async function initialize() {
      const health = await crmApi.health();
      if (!mounted) return;
      if (!health.ok || health.database !== "configurado") {
        erroDeConexaoRef.current = true;
        setError(
          health.ok
            ? "Configure SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY em backend/.env para usar o WhatsApp."
            : "A API do backend está indisponível."
        );
        setLoading(false);
        return;
      }

      setDatabaseReady(true);
      await refresh();
      await loadLeads();
      if (mounted) timer = window.setInterval(() => refresh(true), 2500);
    }

    initialize();
    return () => {
      mounted = false;
      window.clearInterval(timer);
    };
  }, []);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [conversation?.messages?.length]);

  /* Detecta novas mensagens RECEBIDAS comparando o timestamp da última
     mensagem "incoming" de cada conversa entre polls. Na primeira carga apenas
     memoriza o estado (sem tocar som nem destacar), para não notificar
     histórico antigo. Depois, qualquer conversa com lastMessage incoming mais
     recente dispara o som e o destaque temporário. */
  useEffect(() => {
    if (!conversations.length) return;
    const prev = prevIncomingRef.current;
    const next = new Map();
    const changed = [];
    for (const item of conversations) {
      const isIncoming = item.lastMessage?.direction === "incoming";
      const stamp = isIncoming ? item.lastMessage?.timestamp : null;
      next.set(item.id, stamp || null);
      if (!initializedIncomingRef.current) continue;
      const before = prev.get(item.id) ?? null;
      if (stamp && stamp !== before) changed.push(item.id);
    }
    prevIncomingRef.current = next;
    if (!initializedIncomingRef.current) {
      initializedIncomingRef.current = true;
      return;
    }
    if (!changed.length) return;
    if (soundOn) messageSound.play();
    setFreshIds(previous => {
      const updated = new Set(previous);
      changed.forEach(id => updated.add(id));
      return updated;
    });
    window.setTimeout(() => {
      setFreshIds(previous => {
        const updated = new Set(previous);
        changed.forEach(id => updated.delete(id));
        return updated;
      });
    }, 9000);
  }, [conversations, soundOn]);

  const toggleSound = () => {
    /* Toca o som em todo clique: o gesto já destrava o AudioContext e serve de
       teste audível imediato para o usuário confirmar que o alerta funciona. */
    messageSound.play();
    setSoundOn(previous => {
      const next = !previous;
      localStorage.setItem("gc_wa_sound", next ? "on" : "off");
      return next;
    });
  };

  const clearFresh = id => {
    if (!id) return;
    setFreshIds(previous => {
      if (!previous.has(id)) return previous;
      const updated = new Set(previous);
      updated.delete(id);
      return updated;
    });
  };

  /* O menu de status fecha ao clicar fora ou apertar Esc. */
  useEffect(() => {
    if (!statusMenuOpen) return undefined;
    const onPointerDown = event => {
      if (statusMenuRef.current && !statusMenuRef.current.contains(event.target)) setStatusMenuOpen(false);
    };
    const onKeyDown = event => { if (event.key === "Escape") setStatusMenuOpen(false); };
    /* O menu é posicionado em relação ao viewport: fecha em resize/scroll
       externo para não descolar do botão que o abriu. A rolagem interna da
       lista de status deve permanecer aberta. */
    const onViewportChange = () => setStatusMenuOpen(false);
    const onScroll = event => {
      const target = event.target;
      if (!(target instanceof Node) || !statusMenuRef.current?.contains(target)) setStatusMenuOpen(false);
    };
    document.addEventListener("pointerdown", onPointerDown);
    document.addEventListener("keydown", onKeyDown);
    window.addEventListener("resize", onViewportChange);
    window.addEventListener("scroll", onScroll, true);
    return () => {
      document.removeEventListener("pointerdown", onPointerDown);
      document.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("resize", onViewportChange);
      window.removeEventListener("scroll", onScroll, true);
    };
  }, [statusMenuOpen]);

  /* Mudança manual do status pelo atendente — o backend valida os estados. */
  const changeConversationStatus = async nextStatus => {
    if (!conversation || savingStatus) return;
    setStatusMenuOpen(false);
    if (nextStatus === conversation.status) return;
    setError("");
    setSavingStatus(true);
    try {
      setConversation(await crmApi.whatsapp.updateConversationStatus(conversation.id, nextStatus));
      setConversations(await crmApi.whatsapp.conversations());
    } catch (requestError) {
      setError(requestError.message || "Não foi possível mudar o status desta conversa.");
    } finally {
      setSavingStatus(false);
    }
  };

  /* A segunda metade do menu muda a ETAPA DO FUNIL do lead, não o status do chat.
     São eixos diferentes e continuam gravados em lugares diferentes (a conversa e
     o lead), mas ele atende por aqui, então é aqui que precisa decidir o estágio
     da venda sem voltar na tela de Leads. O mesmo POST /leads/:id/status da tela
     de Leads grava o histórico, então a mudança aparece no funil e no Laudo. */
  const changeLeadStage = async nextStage => {
    if (!activeLead || savingStatus) return;
    setStatusMenuOpen(false);
    if (nextStage === activeLead.status) return;
    setError("");
    setSavingStatus(true);
    try {
      const response = await crmApi.leads.changeStatus(activeLead.id, nextStage, currentUser);
      if (!response || !response.success) throw new Error(response?.error?.message || "Não foi possível alterar a etapa deste lead.");
      await loadLeads();
    } catch (requestError) {
      setError(requestError.message || "Não foi possível alterar a etapa deste lead.");
      setSavingStatus(false);
      return;
    }
    setSavingStatus(false);
  };

  /* Abre o menu com position: fixed calculado pelo retângulo do botão — assim
     o overflow-hidden da seção do chat não corta os últimos itens (Resolvido,
     Cancelado, Arquivado e as etapas do funil). Quando falta espaço abaixo, vira
     para cima; e o maxHeight com rolagem interna cabe na tela, mesmo agora com
     os 8 status do chat mais as 6 etapas do funil. */
  const toggleStatusMenu = () => {
    if (statusMenuOpen) {
      setStatusMenuOpen(false);
      return;
    }
    const rect = statusMenuRef.current?.getBoundingClientRect();
    if (rect) {
      const GAP = 8;
      const MIN_VISIBLE = 240;
      const spaceBelow = window.innerHeight - rect.bottom - GAP - 8;
      const spaceAbove = rect.top - GAP - 8;
      const above = spaceBelow < MIN_VISIBLE && spaceAbove > spaceBelow;
      const maxHeight = Math.max(180, Math.min(above ? spaceAbove : spaceBelow, window.innerHeight - 32));
      setStatusMenuPos({
        ...(above
          ? { bottom: Math.max(8, window.innerHeight - rect.top + GAP) }
          : { top: rect.bottom + GAP }),
        right: Math.max(8, window.innerWidth - rect.right),
        maxHeight,
      });
    }
    setStatusMenuOpen(true);
  };

  const changeConnection = async () => {
    setError("");
    setConnecting(true);
    try {
      if (["CONNECTED", "CONNECTING", "RECONNECTING", "QR_READY", "PAIRING_READY"].includes(status?.status)) {
        await crmApi.whatsapp.disconnect();
      } else {
        const nextStatus = await crmApi.whatsapp.connect(phoneNumber);
        setStatus(nextStatus);
      }
      await refresh(true);
    } catch (requestError) {
      setError(
        requestError.name === "TimeoutError"
          ? "O backend demorou para responder. Atualize o estado da conexão e tente novamente."
          : requestError.message || "Não foi possível conectar o WhatsApp via Baileys."
      );
    } finally {
      setConnecting(false);
    }
  };

  const switchToPairingCode = async () => {
    const digits = phoneNumber.replace(/\D/g, "");
    if (digits.length < 10 || digits.length > 15) {
      setError("Informe o número completo com DDI, por exemplo 55 + DDD + número.");
      return;
    }

    setError("");
    setConnecting(true);
    try {
      await crmApi.whatsapp.disconnect();
      const nextStatus = await crmApi.whatsapp.connect(phoneNumber);
      setStatus(nextStatus);
      await refresh(true);
    } catch (requestError) {
      setError(
        requestError.name === "TimeoutError"
          ? "O backend demorou para responder. Atualize o estado da conexão e tente novamente."
          : requestError.message || "Não foi possível solicitar o código de pareamento."
      );
    } finally {
      setConnecting(false);
    }
  };

  const selectConversation = async id => {
    const selectionVersion = ++conversationSelectionVersionRef.current;
    conversationLoadVersionRef.current += 1;
    selectedConversationIdRef.current = id;
    conversationSelectionPendingRef.current = true;
    setError("");
    clearFresh(id);
    try {
      /* Abrir a conversa é um evento de atendimento: o backend aproveita para
         aplicar a transição de abertura (Novo/Respondido ->
         Atendimento iniciado) antes de devolver o histórico. */
      try {
        const selected = await crmApi.whatsapp.openConversation(id);
        if (selectionVersion === conversationSelectionVersionRef.current) setConversation(selected);
      } catch (openError) {
        /* Compatibilidade: um backend ainda sem a rota /open continua abrindo
           a conversa em modo leitura — melhor do que travar o atendimento. */
        await loadConversation(id);
      }
      if (selectionVersion === conversationSelectionVersionRef.current) {
        setConversations(await crmApi.whatsapp.conversations());
      }
    } catch (requestError) {
      if (selectionVersion === conversationSelectionVersionRef.current) {
        setError(requestError.message || "Não foi possível abrir esta conversa.");
      }
    } finally {
      if (selectionVersion === conversationSelectionVersionRef.current) conversationSelectionPendingRef.current = false;
    }
  };

  const openLeadConversation = async lead => {
    const selectionVersion = ++conversationSelectionVersionRef.current;
    conversationLoadVersionRef.current += 1;
    selectedConversationIdRef.current = null;
    conversationSelectionPendingRef.current = true;
    setError("");
    setOpeningLeadId(lead.id);
    try {
      const selected = await crmApi.whatsapp.openLeadConversation(lead.id);
      if (selectionVersion !== conversationSelectionVersionRef.current) return;
      setConversation(selected);
      selectedConversationIdRef.current = selected.id;
      clearFresh(selected.id);
      setConversations(await crmApi.whatsapp.conversations());
      setSidebarView("conversations");
    } catch (requestError) {
      if (selectionVersion === conversationSelectionVersionRef.current) {
        setError(requestError.message || "Não foi possível abrir a conversa deste lead.");
      }
    } finally {
      if (selectionVersion === conversationSelectionVersionRef.current) {
        conversationSelectionPendingRef.current = false;
        setOpeningLeadId(null);
      }
    }
  };

  const removeConversation = async item => {
    const label = item.contact?.name || item.contact?.company || item.contact?.phone || "esta conversa";
    const confirmed = window.confirm(
      `Excluir a conversa de "${label}" da lista do WhatsApp?\n\nAs mensagens salvas desta conversa serão apagadas. O lead continua no CRM: uma nova conversa aparece de novo se o contato escrever.`
    );
    if (!confirmed) return;
    setError("");
    setRemovingConversationId(item.id);
    try {
      await crmApi.whatsapp.removeConversation(item.id);
      if (selectedConversationIdRef.current === item.id) {
        conversationSelectionVersionRef.current += 1;
        conversationLoadVersionRef.current += 1;
        conversationSelectionPendingRef.current = false;
        selectedConversationIdRef.current = null;
        setConversation(null);
      }
      await refresh(true);
    } catch (requestError) {
      setError(requestError.message || "Não foi possível excluir esta conversa.");
    } finally {
      setRemovingConversationId(null);
    }
  };

  /* A chave da última mensagem é o que diz se a IA precisa ler de novo: mudou a
     conversa, chegou mensagem nova, ou mudou o quem-falou-por-último. O clique
     manual sempre pode repetir. */
  const chaveUltimaMensagem = useMemo(() => {
    const lista = conversation?.messages || [];
    const ultima = lista[lista.length - 1];
    if (!ultima) return "";
    return [conversation?.id, lista.length, ultima.timestamp || ultima.date || "", String(ultima.content || "").slice(0, 60)].join("|");
  }, [conversation?.id, conversation?.messages]);

  /* Pede as respostas rápidas à IA. Ela vê só a última mensagem e o pouco de
     contexto que cabe no pedido, e devolve texto para o rascunho — enviar
     continua sendo decisão do atendente, e nada aqui envia sozinho. */
  const requestSuggestions = async () => {
    if (!conversation || sugestaoEmAndamentoRef.current || suggesting || sending || generatingAudio || sendingGeneratedAudio) return;
    sugestaoEmAndamentoRef.current = true;
    sugeridaParaRef.current = chaveUltimaMensagem;
    setError("");
    setSuggesting(true);
    setSuggestionsOpen(true);
    try {
      const data = await crmApi.whatsapp.suggestReplies({
        conversationId: conversation.id,
        senderName: status?.accountName || userName(currentUser),
        lead: activeLead ? {
          contactName: activeLead.contactName,
          company: activeLead.company,
          city: activeLead.city,
          status: activeLead.status,
          segment: activeLead.segment,
          notes: activeLead.notes,
        } : null,
        conversation: {
          status: conversation.status,
          contact: {
            name: conversation.contact?.name,
            company: conversation.contact?.company,
          },
          messages: (conversation.messages || []).slice(-14).map(message => ({
            direction: message.direction,
            content: message.content,
            /* O horário da última mensagem é o que diz para a IA se é caso de
               silêncio (retomar orientando) ou de resposta imediata. */
            timestamp: message.timestamp || message.date || null,
          })),
        },
      });
      const sugestoesRecebidas = Array.isArray(data?.suggestions) ? data.suggestions : [];
      setSuggestions(sugestoesRecebidas);
      if (sugestoesRecebidas.length) {
        if (sugestoesPorChaveRef.current.size > 40) {
          /* Map guarda a ordem de inclusão: o primeiro é o mais velho. */
          sugestoesPorChaveRef.current.delete(sugestoesPorChaveRef.current.keys().next().value);
        }
        sugestoesPorChaveRef.current.set(chaveUltimaMensagem, sugestoesRecebidas);
      }
    } catch (requestError) {
      setSuggestions([]);
      /* O aviso vermelho já explica o que fazer; fechar o painel evita a tela
         dizer duas coisas ao mesmo tempo ("não devolveu sugestões" + o erro). */
      setSuggestionsOpen(false);
      setError(requestError.message || "Não foi possível gerar sugestões por IA.");
    } finally {
      sugestaoEmAndamentoRef.current = false;
      setSuggesting(false);
    }
  };

  /* "Sempre analisar a última mensagem": ao abrir a conversa — e quando chega
     mensagem nova nela — a IA já lê e mostra as respostas curtas, sem ele ter de
     clicar. O botão continua lá para pedir outras. */
  useEffect(() => {
    /* O "connected" de baixo ainda não existe aqui (React lê o corpo todo na
       ordem), então olhamos o status cru direto — é a mesma informação. */
    if (!chaveUltimaMensagem || status?.status !== "CONNECTED") return;
    if (aiInfo && aiInfo.enabled === false) return;
    if (sugeridaParaRef.current === chaveUltimaMensagem) return;
    const guardadas = sugestoesPorChaveRef.current.get(chaveUltimaMensagem);
    if (guardadas && guardadas.length) {
      /* Reabriu a mesma conversa com a mesma última mensagem: mostra na hora,
         sem gastar outro pedido da cota. */
      sugeridaParaRef.current = chaveUltimaMensagem;
      setSuggestions(guardadas);
      setSuggestionsOpen(true);
      return;
    }
    requestSuggestions();
  }, [chaveUltimaMensagem, status?.status, aiInfo?.enabled]);

  /* Igual às respostas rápidas: preenche o campo e fecha o painel, sem enviar. */
  const useSuggestion = text => {
    setDraft(text);
    setGeneratedAudioUrl("");
    setGeneratedAudioBlob(null);
    setSuggestionsOpen(false);
  };

  const generateDraftAudio = async () => {
    if (!conversation || !draft.trim() || generatingAudio || sendingGeneratedAudio || !connected) return;
    setError("");
    setGeneratingAudio(true);
    try {
      const blob = await crmApi.whatsapp.generateAudioPreview(draft.trim(), voiceProfile);
      const nextUrl = URL.createObjectURL(blob);
      setGeneratedAudioBlob(blob);
      setGeneratedAudioUrl(nextUrl);
    } catch (requestError) {
      setError(requestError.message || "Não foi possível gerar o áudio por IA.");
    } finally {
      setGeneratingAudio(false);
    }
  };

  const sendGeneratedDraftAudio = async () => {
    if (!conversation || !draft.trim() || !generatedAudioBlob || sendingGeneratedAudio || generatingAudio || !connected) return;
    const conversationId = conversation.id;
    setError("");
    setSendingGeneratedAudio(true);
    try {
      const audioFile = new File([generatedAudioBlob], `voz-ia-${Date.now()}.mp3`, { type: "audio/mpeg" });
      await crmApi.whatsapp.sendMedia(conversationId, audioFile, "voice", "", currentUser || "Usuário");
      setDraft("");
      setGeneratedAudioUrl("");
      setGeneratedAudioBlob(null);
      await refresh(true);
    } catch (requestError) {
      setError(requestError.message || "Não foi possível enviar a nota de voz.");
    } finally {
      setSendingGeneratedAudio(false);
    }
  };

  const send = async event => {
    event?.preventDefault();
    if (!conversation || (!draft.trim() && !attachment) || sending) return;
    const conversationId = conversation.id;
    conversationLoadVersionRef.current += 1;
    setSending(true);
    setError("");
    try {
      if (attachment) {
        const kind = attachmentKind || (attachment.type.startsWith("image/") ? "image" : "audio");
        if (kind === "audio" && draft.trim()) {
          await crmApi.whatsapp.sendText(conversationId, draft.trim(), currentUser || "Usuário");
          setDraft("");
        }
        await crmApi.whatsapp.sendMedia(
          conversationId,
          attachment,
          kind,
          kind === "image" ? draft.trim() : "",
          currentUser || "Usuário"
        );
        setAttachment(null);
      } else {
        await crmApi.whatsapp.sendText(conversationId, draft, currentUser || "Usuário");
      }
      setDraft("");
      await refresh(true);
    } catch (requestError) {
      setError(requestError.message || "Não foi possível enviar a mensagem.");
    } finally {
      setSending(false);
    }
  };

  const selectAttachment = (file, kind) => {
    if (!file) return;
    const validType = kind === "image"
      ? ["image/jpeg", "image/png", "image/webp"].includes(file.type)
      : ["audio/ogg", "audio/mpeg", "audio/mp4", "audio/webm", "audio/wav", "audio/x-wav", "audio/aac"].includes(file.type.split(";")[0]);
    if (!validType) {
      setError(kind === "image" ? "Escolha uma imagem JPEG, PNG ou WebP." : "Escolha um áudio OGG, MP3, M4A, WebM ou WAV.");
      return;
    }
    if (file.size > MAX_MEDIA_BYTES) {
      setError("O arquivo excede o limite de 8 MB.");
      return;
    }
    setError("");
    setAttachment(file);
    setAttachmentKind(kind);
  };

  const toggleAudioRecording = async () => {
    if (recording) {
      recorderRef.current?.stop();
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined") {
      setError("Este navegador não permite gravar áudio. Selecione um arquivo de áudio.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaStreamRef.current = stream;
      const supportedType = ["audio/ogg;codecs=opus", "audio/webm;codecs=opus", "audio/mp4"]
        .find(type => MediaRecorder.isTypeSupported(type));
      const recorder = new MediaRecorder(stream, supportedType ? { mimeType: supportedType } : undefined);
      recordingChunksRef.current = [];
      recorder.ondataavailable = event => {
        if (event.data.size > 0) recordingChunksRef.current.push(event.data);
      };
      recorder.onerror = () => {
        setRecording(false);
        setError("Não foi possível gravar o áudio. Tente novamente ou selecione um arquivo.");
        stream.getTracks().forEach(track => track.stop());
        mediaStreamRef.current = null;
        recorderRef.current = null;
      };
      recorder.onstop = () => {
        const mimeType = recorder.mimeType || supportedType || "audio/webm";
        const blob = new Blob(recordingChunksRef.current, { type: mimeType });
        const extension = mimeType.includes("ogg") ? "ogg" : mimeType.includes("mp4") ? "m4a" : "webm";
        const file = new File([blob], `audio-${Date.now()}.${extension}`, { type: mimeType });
        stream.getTracks().forEach(track => track.stop());
        mediaStreamRef.current = null;
        recorderRef.current = null;
        setRecording(false);
        selectAttachment(file, "voice");
      };
      recorderRef.current = recorder;
      recorder.start();
      setRecording(true);
      setError("");
    } catch (requestError) {
      setError(requestError.name === "NotAllowedError"
        ? "Permita o acesso ao microfone para gravar áudio."
        : requestError.message || "Não foi possível iniciar a gravação de áudio.");
    }
  };

  const selectQuickReply = reply => {
    const contactName = conversation?.contact?.name;
    const phone = String(conversation?.contact?.phone || "").replace(/\D/g, "");
    const company = conversation?.contact?.company || "empresa";
    const hasName = Boolean(contactName) && String(contactName).replace(/\D/g, "") !== phone;
    const greeting = hasName ? `Olá, ${contactName}!` : "Olá!";
    /* Primeiro nome para o marcador [NOME]; sem nome conhecido, o vocativo sai
       da frase em vez de enviar um colchete ao cliente. */
    const firstName = hasName ? String(contactName).trim().split(/\s+/)[0] : "";
    const filled = reply.message
      .replaceAll("{saudacao}", greeting)
      .replaceAll("{empresa}", company)
      .replaceAll("[EMPRESA]", company)
      .replaceAll("[SEU NOME]", status?.accountName || userName(currentUser));
    setDraft(
      firstName
        ? filled.replaceAll("[NOME]", firstName)
        : filled
          .replace(/, \[NOME\]/g, "")
          .replace(/\[NOME\], /g, "")
          .replace(/(^|\n)([a-zà-ú])/g, (_, start, letter) => start + letter.toUpperCase())
    );
    setQuickRepliesOpen(false);
  };

  const formatTime = value => {
    if (!value) return "";
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "" : date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  };
  const messageStatusLabel = status => ({
    pending: "aguardando confirmação",
    sent: "enviada ao WhatsApp",
    delivered: "entregue",
    read: "lida",
    played: "reproduzida",
    error: "falha no envio",
  }[status] || status);

  const card = { background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 14 };
  const connected = status?.status === "CONNECTED";
  const hostedWebApp = window.location.hostname === "crm-comercial-kappa.vercel.app";
  const filteredLeads = leads.filter(lead => {
    const term = leadSearch.trim().toLocaleLowerCase("pt-BR");
    if (!term) return true;
    return [lead.contactName, lead.company, lead.whatsapp, lead.phone, lead.city, lead.status]
      .some(value => String(value || "").toLocaleLowerCase("pt-BR").includes(term));
  });
  const normalizeSearch = value => String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("pt-BR");
  /* O vínculo conversa -> lead é a mesma regra usada na tela de Leads
     (findLeadForConversation, no topo do arquivo), só com os leads desta tela. */
  const findConversationLead = item => findLeadForConversation(item, leads);
  const conversationTerm = normalizeSearch(conversationSearch.trim());
  const filteredConversations = conversations.filter(item => {
    if (!conversationTerm) return true;
    const lead = findConversationLead(item);
    return [item.contact?.name, item.contact?.company, item.contact?.phone, item.lastMessage?.content, item.status, lead?.status]
      .some(value => normalizeSearch(value).includes(conversationTerm));
  });
  const conversationRows = filteredConversations.map(item => ({ item, lead: findConversationLead(item) }));
  const activeLead = conversation ? findConversationLead(conversation) : null;
  const statusMeta = conversationStatusMeta(conversation?.status);
  /* Menu de status do chat: botão com emoji + rótulo que abre a lista dos
     estados, cada um com a cor da tabela do ciclo de vida. */
  const statusMenuControl = !conversation ? null : (
    <div className="relative" ref={statusMenuRef}>
      <button
        type="button"
        onClick={toggleStatusMenu}
        aria-haspopup="menu"
        aria-expanded={statusMenuOpen}
        aria-label={`Status desta conversa: ${conversation.status || DEFAULT_CONVERSATION_STATUS}${activeLead ? `, etapa do lead: ${activeLead.status}` : ""}. Clique para mudar`}
        title="Mudar o status da conversa ou a etapa do funil deste lead"
        disabled={savingStatus}
        className="inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full transition-colors disabled:opacity-60"
        style={{ ...TONE_STYLE(CONVERSATION_TONE[conversation.status] || statusMeta.tone), border: "1px solid currentColor" }}
      >
        <span aria-hidden="true">{statusMeta.emoji}</span>
        <span className="font-medium">{conversation.status || DEFAULT_CONVERSATION_STATUS}</span>
        <ChevronDown size={13} />
      </button>
      {statusMenuOpen && statusMenuPos && (
        <div
          role="menu"
          aria-label="Status da conversa e etapa do funil"
          className="rounded-xl"
          style={{ position: "fixed", width: "min(300px, 78vw)", overflowX: "hidden", overflowY: "auto", ...statusMenuPos, background: "var(--surface)", border: "1px solid var(--line)", boxShadow: "0 16px 36px rgba(20,22,26,0.2)", zIndex: 60 }}
        >
          <div className="px-3 py-2 text-[11px] font-semibold uppercase tracking-wide" style={{ background: "var(--surface-sunken)", color: "var(--slate)" }}>
            Status da conversa
          </div>
          {CONVERSATION_STATUSES.map(option => {
            const isActive = option.key === conversation.status;
            return (
              <button
                key={option.key}
                type="button"
                role="menuitemradio"
                aria-checked={isActive}
                onClick={() => changeConversationStatus(option.key)}
                disabled={savingStatus}
                className="w-full text-left px-3 py-2 flex items-start gap-2 transition-colors disabled:opacity-60"
                style={{ background: isActive ? "var(--accent-soft)" : "transparent", borderBottom: "1px solid var(--line)" }}
              >
                <span className="text-sm leading-5 shrink-0" aria-hidden="true">{option.emoji}</span>
                <span className="min-w-0 flex-1">
                  <span className="block text-xs font-semibold" style={{ color: "var(--ink)" }}>{option.key}</span>
                  <span className="block text-[11px] leading-4" style={{ color: "var(--slate)" }}>{option.hint}</span>
                </span>
                <span
                  className="w-2 h-2 rounded-full mt-1.5 shrink-0"
                  aria-hidden="true"
                  style={isActive
                    ? { background: `var(--tone-${option.tone}-fg, var(--slate))` }
                    : { border: "1px solid var(--line-strong)" }}
                />
              </button>
            );
          })}
          {/* Segunda metade do mesmo menu: as seis etapas do funil do lead ligado a
              esta conversa. O status de cima é o do chat (muda sozinho com as
              mensagens); este aqui é a etapa de venda, e gravar por este caminho é
              o mesmo POST da tela de Leads — sai no histórico do lead. */}
          {/* O espaçamento vai no style porque o css/style.css é um Tailwind já
              compilado: classe que não está lá dentro simplesmente não existe
              (pt-2.5 e pb-1.5 não foram geradas no build). */}
          <div
            className="px-3 flex items-center justify-between gap-2"
            style={{ paddingTop: "10px", paddingBottom: "6px", borderTop: "1px solid var(--line-strong)", background: "var(--surface-sunken)" }}
          >
            <span className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>Etapa do funil</span>
            {activeLead && (
              <span className="text-[11px] truncate" style={{ color: "var(--slate)", maxWidth: "58%" }} title={activeLead.company}>
                {activeLead.company}
              </span>
            )}
          </div>
          {activeLead ? STATUS_LIST.map(stage => {
            const isActive = stage === activeLead.status;
            return (
              <button
                key={stage}
                type="button"
                role="menuitemradio"
                aria-checked={isActive}
                onClick={() => changeLeadStage(stage)}
                disabled={savingStatus}
                className="w-full text-left px-3 py-2 flex items-center gap-2 transition-colors disabled:opacity-60"
                style={{ background: isActive ? "var(--accent-soft)" : "transparent", borderBottom: "1px solid var(--line)" }}
              >
                <span className="min-w-0 flex-1 text-xs font-semibold truncate" style={{ color: "var(--ink)" }}>{stage}</span>
                <span
                  className="w-2 h-2 rounded-full shrink-0"
                  aria-hidden="true"
                  style={isActive
                    ? { background: `var(--tone-${STATUS_TONE[stage] || "slate"}-fg, var(--slate))` }
                    : { border: "1px solid var(--line-strong)" }}
                />
              </button>
            );
          }) : (
            <div className="px-3 py-2 text-[11px] leading-4" style={{ color: "var(--slate)" }}>
              Nenhum lead ligado a esta conversa ainda. Ligue o lead pelo quadro de contatos para poder mudar a etapa daqui.
            </div>
          )}
          <div className="px-3 py-2 text-[11px] leading-4" style={{ background: "var(--surface-sunken)", color: "var(--slate)" }}>
            Status da conversa muda sozinho conforme as mensagens; a etapa do funil é sua, e vale igual mudar na tela de Leads.
          </div>
        </div>
      )}
    </div>
  );
  const waitingAuth = ["QR_READY", "PAIRING_READY", "CONNECTING", "RECONNECTING"].includes(status?.status);
  const connectionActive = ["CONNECTED", "CONNECTING", "RECONNECTING", "QR_READY", "PAIRING_READY"].includes(status?.status);

  return (
    <div className="space-y-4">
      <section className="p-4 flex items-center justify-between gap-3 flex-wrap" style={card}>
        <div className="flex items-center gap-3">
          <span className="w-2.5 h-2.5 rounded-full" style={{ background: connected ? "var(--success, #16a34a)" : "var(--slate)" }} />
          <div>
            <div className="font-medium text-sm">
              {connected ? `WhatsApp conectado · ${status.phoneNumber || "número conectado"}` : status?.status === "CONNECTING" ? "Conectando ao WhatsApp…" : status?.status === "RECONNECTING" ? "Reconectando ao WhatsApp…" : waitingAuth ? "Aguardando autenticação do WhatsApp…" : "WhatsApp desconectado"}
            </div>
            <div className="text-xs mt-0.5" style={{ color: "var(--slate)" }}>
              {status?.accountName ? status.accountName : status?.status === "QR_READY" ? "Escaneie o QR Code no WhatsApp do celular." : status?.status === "PAIRING_READY" ? "Digite o código de pareamento no WhatsApp do celular." : status?.status === "CONNECTING" ? "Aguardando resposta do WhatsApp. Se não avançar, cancele e tente novamente." : status?.status === "RECONNECTING" ? "O backend está tentando restabelecer a conexão." : "Conecte seu número para atender as conversas pelo CRM."}
            </div>
          </div>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          {!connected && (!waitingAuth || status?.status === "QR_READY") && (
            <input className="px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)", background: "var(--surface)" }} value={phoneNumber} onChange={e => setPhoneNumber(e.target.value)} placeholder="DDD + número para Pairing Code" aria-label="Número do WhatsApp" />
          )}
          <Button variant="secondary" icon={RefreshCw} onClick={() => refresh()} disabled={loading || !databaseReady}>Atualizar</Button>
          <Button onClick={changeConnection} disabled={!databaseReady || connecting}>
            {connecting ? "Aguarde…" : connected ? "Desconectar" : connectionActive ? "Cancelar conexão" : "Conectar WhatsApp"}
          </Button>
        </div>
      </section>

      {waitingAuth && !connected && (
        <section className="p-4" style={card}>
          <div className="font-medium text-sm mb-2">Autenticação do WhatsApp</div>
          {status?.pairingCode ? (
            <div className="space-y-2">
              <div className="text-xs" style={{ color: "var(--slate)" }}>No celular: WhatsApp → Configurações → Dispositivos conectados → Conectar dispositivo → Conectar com número de telefone.</div>
              <div className="text-2xl font-semibold tracking-[0.35em]" style={{ color: "var(--accent)" }}>{status.pairingCode}</div>
              <div className="text-xs" style={{ color: "var(--slate)" }}>Código de pareamento gerado pelo Baileys.</div>
            </div>
          ) : status?.qrAvailable ? (
            <div className="space-y-2">
              {status.qrImage ? (
                <>
                  <div className="text-sm">No WhatsApp do celular, abra Dispositivos conectados → Conectar dispositivo e escaneie este QR Code.</div>
                  <img src={status.qrImage} alt="QR Code para conectar o WhatsApp ao CRM" width="256" height="256" className="rounded-lg border bg-white p-2" />
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-xs" style={{ color: "var(--slate)" }}>Se o QR for recusado, informe o número com DDI e solicite um código de pareamento:</span>
                    <Button variant="secondary" onClick={switchToPairingCode} disabled={connecting || phoneNumber.replace(/\D/g, "").length < 10}>
                      {connecting ? "Solicitando…" : "Usar código de pareamento"}
                    </Button>
                  </div>
                </>
              ) : (
                <div className="text-sm" style={{ color: "var(--slate)" }}>Gerando a imagem segura do QR Code…</div>
              )}
            </div>
          ) : status?.status === "CONNECTING" ? (
            <div className="text-sm" style={{ color: "var(--slate)" }}>Conectando ao WhatsApp. Se não receber QR Code ou código em até 30 segundos, cancele a conexão e tente novamente.</div>
          ) : status?.status === "RECONNECTING" ? (
            <div className="text-sm" style={{ color: "var(--slate)" }}>Reconectando ao WhatsApp…</div>
          ) : <div className="text-sm" style={{ color: "var(--slate)" }}>Preparando a autenticação…</div>}
        </section>
      )}

      {status?.errors?.length > 0 && (
        <div className="text-sm px-3 py-2 rounded-lg" style={{ background: "var(--danger-bg)", color: "var(--danger)" }} role="alert">
          {status.errors[status.errors.length - 1]}
        </div>
      )}

      {hostedWebApp && (
        <div className="p-3 rounded-lg text-xs" style={{ background: "var(--warning-bg, var(--surface-sunken))", color: "var(--ink-soft)" }} role="note">
          O CRM está online, mas o WhatsApp usa o backend local deste computador. Deixe run-crm.bat aberto e permita o acesso à rede local no navegador. O atendimento só funciona neste computador.
        </div>
      )}

      {error && <div className="text-sm px-3 py-2 rounded-lg" style={{ background: "var(--danger-bg)", color: "var(--danger)" }} role="alert">{error}</div>}

      <div className="grid gap-4 md:grid-cols-[280px_minmax(0,1fr)]">
        <section className="overflow-hidden flex flex-col" style={{ ...card, height: "min(920px, max(500px, calc(100dvh - 260px)))" }} aria-label="Conversas do WhatsApp">
          <div className="p-3 space-y-3" style={{ borderBottom: "1px solid var(--line)" }}>
            <div className="grid grid-cols-2 gap-1 p-1 rounded-lg" style={{ background: "var(--surface-sunken)" }}>
