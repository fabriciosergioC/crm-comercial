function NotificationPanel({ items, onClose, onOpenLead }) {
  const ICONS_BY_TYPE = { followup_overdue: Clock, followup_today: Clock, demo_expiring: Timer, proposal_stale: FileText, hot_no_action: Flame };
  return (
    <div className="absolute right-0 top-11 w-[calc(100vw-1.5rem)] sm:w-80 rounded-xl z-30 gc-pop-in gc-scroll overflow-y-auto" style={{ maxHeight: 420, background: "var(--surface)", border: "1px solid var(--line)", boxShadow: "0 12px 32px rgba(23,25,28,0.12)" }}>
      <div className="px-4 py-3 font-semibold text-sm gc-display" style={{ borderBottom: "1px solid var(--line)" }}>Notificações</div>
      {items.length === 0 ? (
        <div className="p-6 text-sm text-center" style={{ color: "var(--slate)" }}>Tudo em dia por aqui.</div>
      ) : (
        <div>
          {items.map(n => {
            const Icon = ICONS_BY_TYPE[n.type] || AlertTriangle;
            const tone = n.tone === "red" ? "danger" : "warn";
            return (
              <button key={n.id} onClick={() => { onOpenLead(n.leadId, tabForAttentionType(n.type)); onClose(); }} className="w-full text-left px-4 py-3 flex gap-2.5 gc-row-hover" style={{ borderBottom: "1px solid var(--line)" }}>
                <span className="w-7 h-7 rounded-lg flex items-center justify-center shrink-0" style={{ background: `var(--${tone}-bg)`, color: `var(--${tone})` }}>
                  <Icon size={13} />
                </span>
                <span className="min-w-0">
                  <span className="block text-sm font-medium truncate">{n.text}</span>
                  <span className="block text-xs mt-0.5" style={{ color: "var(--slate)" }}>{n.sub}</span>
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Topbar({ db, currentUser, setCurrentUser, onSearch, search, attention, onOpenLead, onMenu, onLogout, searchInputRef, apiStatus, onSeedDemo }) {
  const [notifOpen, setNotifOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const results = useMemo(() => globalSearch(search, db), [search, db]);

  return (
    <div className="sticky top-0 z-20 flex items-center gap-2 md:gap-3 px-3 md:px-6 py-2 md:py-3" style={{ background: "var(--paper)", borderBottom: "1px solid var(--line)" }}>
      <button className="md:hidden w-9 h-9 rounded-lg flex items-center justify-center shrink-0" onClick={onMenu} style={{ color: "var(--ink-soft)" }}>
        <Menu size={20} />
      </button>
      <div className="flex-1 max-w-md relative min-w-0">
        <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: "var(--slate)" }} />
        <input ref={searchInputRef} value={search} onChange={(e) => onSearch(e.target.value)}
          onFocus={() => setSearchOpen(true)} onBlur={() => setTimeout(() => setSearchOpen(false), 150)}
          placeholder="Buscar empresa, contato, cidade, telefone…"
          className="w-full text-sm rounded-lg pl-9 pr-10 py-2 gc-focus" style={{ background: "var(--surface)", border: "1px solid var(--line-strong)" }} />
        <Kbd className="absolute right-2.5 top-1/2 -translate-y-1/2 hidden sm:inline-flex">Ctrl K</Kbd>
        {searchOpen && search.trim() && (
          <div className="absolute left-0 top-11 w-full rounded-xl z-30 gc-pop-in gc-scroll overflow-y-auto" style={{ maxHeight: 320, background: "var(--surface)", border: "1px solid var(--line)", boxShadow: "0 12px 32px rgba(23,25,28,0.14)" }}>
            {results.length === 0 ? (
              <div className="p-4 text-sm text-center" style={{ color: "var(--slate)" }}>Nada encontrado para "{search}"</div>
            ) : results.map(r => (
              <button key={r.id} onMouseDown={() => { onOpenLead(r.leadId, r.tab); onSearch(""); }} className="w-full text-left px-4 py-2.5 flex items-center gap-2.5 gc-row-hover" style={{ borderBottom: "1px solid var(--line)" }}>
                <r.icon size={14} style={{ color: "var(--slate)" }} className="shrink-0" />
                <span className="min-w-0">
                  <span className="block text-sm font-medium truncate">{r.title}</span>
                  <span className="block text-xs truncate" style={{ color: "var(--slate)" }}>{r.sub}</span>
                </span>
              </button>
            ))}
          </div>
        )}
      </div>
      <div className="flex items-center gap-1 sm:gap-2 min-w-0">
        <button
          onClick={() => {
            const current = crmApi.getBaseUrl();
            const next = window.prompt("URL da API do Backend (ex.: https://seu-crm.onrender.com/api):\nDeixe em branco para restaurar localhost.", current);
            if (next !== null) {
              crmApi.setBaseUrl(next);
              window.location.reload();
            }
          }}
          className="gc-pressable gc-focus"
          style={{ background: "transparent", border: "none", padding: 0 }}
          title="Clique para visualizar ou alterar a URL do servidor backend"
        >
          {apiStatus === "connected" ? (
            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium cursor-pointer" style={{ background: "var(--success-bg)", color: "var(--success)" }}>
              <span className="w-2 h-2 rounded-full" style={{ background: "var(--success)" }} />
              <span className="hidden sm:inline">Supabase Conectado</span>
              <span className="sm:hidden">Supabase</span>
            </span>
          ) : apiStatus === "checking" ? (
            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium cursor-pointer" style={{ background: "var(--tone-slate-bg)", color: "var(--slate)" }}>
              <span className="w-2 h-2 rounded-full animate-pulse" style={{ background: "var(--slate)" }} />
              Conectando...
            </span>
          ) : (
            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium cursor-pointer" style={{ background: "var(--warn-bg)", color: "var(--warn)" }}>
              <span className="w-2 h-2 rounded-full" style={{ background: "var(--warn)" }} />
              <span className="hidden sm:inline">Modo Local (Configurar API)</span>
              <span className="sm:hidden">Offline</span>
            </span>
          )}
        </button>
        {apiStatus === "connected" && db.leads.length === 0 && onSeedDemo && (
          <button onClick={onSeedDemo} className="hidden sm:inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-lg gc-focus gc-pressable font-medium" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}>
            Importar dados demo
          </button>
        )}
      </div>
      <div className="relative">
        <IconButton icon={Bell} label="Notificações" active={notifOpen} badge={attention.length} onClick={() => setNotifOpen(v => !v)} />
        {notifOpen && <NotificationPanel items={attention} onClose={() => setNotifOpen(false)} onOpenLead={onOpenLead} />}
      </div>
      <div className="flex items-center gap-1 sm:gap-2 pl-1 sm:pl-2 ml-0 sm:ml-1" style={{ borderLeft: "1px solid var(--line)" }}>
        <button onClick={onLogout} className="flex items-center gap-2 gc-focus rounded-lg px-1 py-1 min-w-0" style={{ background: "transparent", border: "none" }} aria-label="Sair e escolher outro usuário">
          <span className="w-8 h-8 rounded-full flex items-center justify-center font-semibold text-xs shrink-0" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}>
            {userName(currentUser)[0]}
          </span>
          <span className="text-sm font-medium hidden sm:block">{userName(currentUser)}</span>
        </button>
        <button onClick={onLogout} className="w-8 h-8 rounded-lg flex items-center justify-center gc-focus" style={{ color: "var(--slate)" }} aria-label="Trocar usuário">
          <LogOut size={15} />
        </button>
      </div>
    </div>
  );
}

/* =========================================================================
   DASHBOARD — a commercial command center, not a pile of stats. Hierarchy:
   what needs attention now → today's actions & pipeline shape → indicators.
   ========================================================================= */

function StatTile({ label, value, sub, tone, onClick, icon: Icon }) {
  return (
    <button onClick={onClick} className="text-left rounded-xl px-4 py-3.5 gc-focus gc-card gc-card-hover gc-pressable" style={{ background: "var(--surface)", border: "1px solid var(--line)" }}>
      <div className="flex items-center justify-between">
        <div className="gc-mono text-2xl font-medium leading-none" style={{ color: tone ? `var(--${tone})` : "var(--ink)" }}>{value}</div>
        {Icon && <Icon size={15} style={{ color: tone ? `var(--${tone})` : "var(--slate)" }} />}
      </div>
      <div className="text-xs mt-2" style={{ color: "var(--slate)" }}>{label}</div>
      {sub && <div className="text-[11px] mt-0.5 gc-mono" style={{ color: "var(--slate)" }}>{sub}</div>}
    </button>
  );
}

const ATTENTION_ICON = { followup_overdue: Clock, followup_today: Clock, demo_expiring: Timer, proposal_stale: FileText, hot_no_action: Flame };

function AttentionCard({ item, lead, onOpenLead, onCompleteFollowup }) {
  const Icon = ATTENTION_ICON[item.type] || AlertTriangle;
  const tone = item.tone === "red" ? "danger" : "warn";
  return (
    <div className="rounded-xl p-4 gc-card gc-card-hover" style={{ background: "var(--surface)", border: "1px solid var(--line)" }}>
      <div className="flex items-start gap-3">
        <span className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style={{ background: `var(--${tone}-bg)`, color: `var(--${tone})` }}>
          <Icon size={15} />
        </span>
        <button onClick={() => onOpenLead(item.leadId, tabForAttentionType(item.type))} className="min-w-0 flex-1 text-left gc-focus rounded">
          <span className="block text-sm font-semibold truncate">{item.text}</span>
          <span className="block text-xs mt-0.5" style={{ color: "var(--slate)" }}>{item.sub}</span>
        </button>
      </div>
      <div className="flex items-center gap-1.5 flex-wrap mt-3 pl-11">
        {lead?.whatsapp && <QuickAction icon={MessageCircle} label="WhatsApp" href={waLink(lead.whatsapp)} />}
        {lead?.phone && <QuickAction icon={Phone} label="Ligar" href={telLink(lead.phone)} />}
        {item.type === "proposal_stale" && <QuickAction icon={FileText} label="Abrir proposta" onClick={() => onOpenLead(item.leadId, "proposta")} />}
        {(item.type === "followup_overdue" || item.type === "followup_today") && <QuickAction icon={CheckCircle2} label="Concluir" onClick={() => onCompleteFollowup(item)} />}
        {item.type === "hot_no_action" && <QuickAction icon={ArrowRight} label="Definir ação" onClick={() => onOpenLead(item.leadId, "geral")} />}
      </div>
    </div>
  );
}

function PipelineFunnel({ stages, onOpenStage }) {
  const max = Math.max(1, ...stages.map(s => s.count));
  return (
    <SectionCard title="Funil comercial">
      <div className="px-5 py-4 space-y-2.5">
        {stages.map(s => (
          <button key={s.key} onClick={() => onOpenStage(s.key)} className="w-full flex items-center gap-3 gc-focus rounded-lg py-1.5 px-1 -mx-1 gc-row-hover">
            <span className="text-sm w-24 shrink-0 text-left truncate">{s.label}</span>
            <div className="flex-1"><Bar value={s.count} max={max} tone={s.key === "perdido" ? "danger" : s.key === "fechado" ? "success" : "accent"} /></div>
            <span className="gc-mono text-sm w-5 text-right shrink-0">{s.count}</span>
            <span className="gc-mono text-xs w-20 text-right shrink-0 hidden sm:block" style={{ color: "var(--slate)" }}>{s.value > 0 ? fmtMoney(s.value) : ""}</span>
          </button>
        ))}
      </div>
    </SectionCard>
  );
}

function Dashboard({ db, sel, currentUser, onOpenLead, setView, setLeadsFilter, setLeadsViewMode, dispatch, notify }) {
  const tiles = [
    { label: "Leads abertos", value: sel.openLeads.length, icon: Users, onClick: () => { setLeadsFilter({ open: true }); setView("leads"); } },
    { label: "Oportunidades quentes", value: sel.hotLeads.length, tone: sel.hotLeads.length ? "hot" : undefined, icon: Flame, onClick: () => { setLeadsFilter({ temperature: "Quente" }); setView("leads"); } },
    { label: "Propostas em aberto", value: sel.proposalsPending.length, icon: FileText, onClick: () => setView("proposals") },
    { label: "Valor em negociação", value: fmtMoney(sel.negotiationValue), icon: TrendingUp, onClick: () => setView("proposals") },
    { label: "Vendas fechadas", value: sel.closedLeads.length, sub: sel.closedValue > 0 ? fmtMoney(sel.closedValue) : undefined, tone: "success", icon: CheckCircle2, onClick: () => setView("clients") },
  ];

  const todayLabel = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });

  const handleCompleteFollowup = (item) => {
    dispatch({ type: "UPDATE_FOLLOWUP", id: item.refId, patch: { status: "concluido" } });
    notify(`Follow-up concluído — ${item.text}`);
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="gc-display text-xl font-semibold capitalize">{todayLabel}</h1>
        <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>Olá, {userName(currentUser)}. Aqui está o que precisa de você agora.</p>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
        {tiles.map((t, i) => <StatTile key={i} {...t} />)}
      </div>

      <div>
        <h2 className="gc-display text-[15px] font-semibold mb-3">Central de atenção</h2>
        {sel.attention.length === 0 ? (
          <SectionCard><EmptyState icon={CheckCircle2} title="Tudo em dia" hint="Follow-ups atrasados, demos expirando, propostas paradas e leads quentes sem próxima ação aparecem aqui." /></SectionCard>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {sel.attention.map(item => (
              <AttentionCard key={item.id} item={item} lead={sel.leadById[item.leadId]} onOpenLead={onOpenLead} onCompleteFollowup={handleCompleteFollowup} />
            ))}
          </div>
        )}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <SectionCard title="Ações de hoje">
          {sel.todaysActions.length === 0 ? (
            <EmptyState icon={CheckCircle2} title="Nada agendado para hoje" hint="Follow-ups e demos que vencem hoje aparecem aqui." />
          ) : (
            <div>
              {sel.todaysActions.map(a => (
                <button key={`${a.kind}_${a.id}`} onClick={() => onOpenLead(a.leadId, a.kind === "demo" ? "demo" : "followups")} className="w-full flex items-center gap-3 px-5 py-3 text-left gc-row-hover" style={{ borderBottom: "1px solid var(--line)" }}>
                  <span className="gc-mono text-sm font-medium w-12 shrink-0" style={{ color: "var(--accent-ink)" }}>{fmtTime(a.date)}</span>
                  <span className="min-w-0 flex-1">
                    <span className="block text-sm font-medium truncate">{sel.leadById[a.leadId]?.company}</span>
                    <span className="block text-xs mt-0.5 truncate" style={{ color: "var(--slate)" }}>{a.label}</span>
                  </span>
                  {a.kind === "demo" ? <Timer size={14} style={{ color: "var(--slate)" }} /> : <Clock size={14} style={{ color: "var(--slate)" }} />}
                </button>
              ))}
            </div>
          )}
        </SectionCard>

        <PipelineFunnel stages={sel.pipelineStages} onOpenStage={() => { setLeadsViewMode("pipeline"); setView("leads"); }} />
      </div>
    </div>
  );
}

/* =========================================================================
   LEADS — list, filters, creation
   ========================================================================= */

function matchesLead(lead, search) {
  if (!search) return true;
  const q = search.toLowerCase();
  return [lead.company, lead.city, lead.segment, lead.contactName].some(v => (v || "").toLowerCase().includes(q));
}

function FilterChip({ label, active, onClick }) {
  return (
    <button onClick={onClick} className="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap gc-focus"
      style={{ background: active ? "var(--accent)" : "var(--surface)", color: active ? "#fff" : "var(--ink-soft)", border: active ? "none" : "1px solid var(--line-strong)" }}>
      {label}
    </button>
  );
}

function TooltipText({ value, className = "", style = {}, children, nativeTooltip = true, ...props }) {
  const text = value == null ? "" : String(value);
  return (
    <span
      {...props}
      className={className}
      style={style}
      title={nativeTooltip && text ? text : undefined}
      aria-label={text || undefined}
      data-tooltip={text || undefined}
    >
      {children !== undefined ? children : (text || "—")}
    </span>
  );
}

function LeadRow({ lead, onEdit, onDelete, deleting, onCellMouseEnter, onCellMouseMove, onCellMouseLeave, onCellFocus, onCellBlur, gridTemplateColumns, isSelected, onSelect }) {
  const bucket = actionBucket(lead.nextAction?.date);
  const cellTooltipProps = {
    nativeTooltip: false,
    onMouseEnter: onCellMouseEnter,
    onMouseMove: onCellMouseMove,
    onMouseLeave: onCellMouseLeave,
    onFocus: onCellFocus,
    onBlur: onCellBlur,
  };
  return (
    <div
      onClick={() => onEdit && onEdit(lead)}
      className="w-full text-left gc-row-hover px-5 py-3.5 cursor-pointer block"
      style={{ borderBottom: "1px solid var(--line)" }}
      role="button"
      tabIndex={0}
      aria-label={`Editar lead ${lead.company}`}
      onKeyDown={(e) => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); if (onEdit) onEdit(lead); } }}
    >
      {/* Mobile: stacked card */}
      <div className="md:hidden space-y-2">
        <div className="flex items-start justify-between gap-2">
          <div className="flex items-center gap-2 min-w-0">
            <input
              type="checkbox"
              checked={isSelected}
              onClick={(e) => e.stopPropagation()}
              onChange={() => onSelect(lead.id)}
              className="w-4 h-4 rounded accent-accent shrink-0"
              aria-label={`Selecionar ${lead.company}`}
            />
            <span className="min-w-0">
              <TooltipText {...cellTooltipProps} value={lead.company} className="block text-sm font-medium truncate" />
              <TooltipText {...cellTooltipProps} value={`${lead.city} · ${lead.segment}`} className="block text-xs mt-0.5 truncate" style={{ color: "var(--slate)" }} />
            </span>
          </div>
          <div className="flex items-center gap-1.5 shrink-0">
            <TempPill temperature={lead.temperature} />
            {onEdit && (
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onEdit(lead); }}
                className="p-1.5 rounded-md gc-focus hover:opacity-75 transition-opacity"
                style={{ color: "var(--slate)", background: "var(--surface-sunken)" }}
                title="Editar lead"
                aria-label="Editar lead"
              >
                <Edit size={13} />
              </button>
            )}
            {onDelete && <button type="button" disabled={deleting}
              onClick={(e) => { e.stopPropagation(); onDelete(lead); }}
              className="p-1.5 rounded-md text-xs gc-focus disabled:opacity-40"
              style={{ color: "var(--danger)", background: "var(--danger-bg)" }}
              aria-label={`Excluir lead ${lead.company}`}>
              {deleting ? "Excluindo..." : "Excluir"}
            </button>}
          </div>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <StatusPill status={lead.status} />
          <TooltipText {...cellTooltipProps} value={userName(lead.owner)} className="text-xs" style={{ color: "var(--slate)" }} />
        </div>
        {lead.nextAction && (
          <div className="flex items-center gap-1.5 text-xs">
            {bucket === "atrasado" && <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: "var(--danger)" }} />}
            <span className="gc-mono shrink-0" style={{ color: bucket === "atrasado" ? "var(--danger)" : "var(--slate)" }}>{fmtDate(lead.nextAction.date)}</span>
            <TooltipText {...cellTooltipProps} value={lead.nextAction.note} className="truncate" style={{ color: "var(--ink-soft)" }} />
          </div>
        )}
      </div>
      {/* Desktop: grid row */}
      <div className="hidden md:grid items-center gap-3 min-w-0" style={{ gridTemplateColumns }}>
        <span className="min-w-0 flex items-center">
          <input
            type="checkbox"
            checked={isSelected}
            onClick={(e) => e.stopPropagation()}
            onChange={() => onSelect(lead.id)}
            className="w-4 h-4 rounded accent-accent shrink-0"
            aria-label={`Selecionar ${lead.company}`}
          />
        </span>
        <span className="min-w-0">
          <TooltipText {...cellTooltipProps} value={lead.company} className="block text-sm font-medium truncate" />
          <TooltipText {...cellTooltipProps} value={`${lead.city} · ${lead.segment}`} className="block text-xs mt-0.5 truncate" style={{ color: "var(--slate)" }} />
        </span>
        <span className="min-w-0"><StatusPill status={lead.status} /></span>
        <span className="min-w-0"><TempPill temperature={lead.temperature} /></span>
        <TooltipText {...cellTooltipProps} value={userName(lead.owner)} className="text-sm truncate min-w-0" style={{ color: "var(--ink-soft)" }} />
        <span className="min-w-0">
          {lead.nextAction ? (
            <span className="flex items-center gap-1.5 text-sm truncate">
              {bucket === "atrasado" && <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: "var(--danger)" }} />}
              {bucket === "hoje" && <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: "var(--warn)" }} />}
              <span className="gc-mono text-xs shrink-0" style={{ color: bucket === "atrasado" ? "var(--danger)" : "var(--slate)" }}>{fmtDate(lead.nextAction.date)}</span>
              <TooltipText {...cellTooltipProps} value={lead.nextAction.note} className="truncate" style={{ color: "var(--ink-soft)" }} />
            </span>
          ) : <span className="text-sm" style={{ color: "var(--slate)" }}>—</span>}
        </span>
        <TooltipText
          {...cellTooltipProps}
          value={lead.lastContactAt ? fmtDateTime(lead.lastContactAt) : "Sem contato"}
          className="gc-mono text-xs truncate min-w-0"
          style={{ color: "var(--slate)" }}
        />
        <span className="min-w-0 flex justify-end items-center">
          {onEdit && (
            <button
              type="button"
              onClick={(e) => { e.stopPropagation(); onEdit(lead); }}
              className="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium gc-focus hover:opacity-80 transition-opacity"
              style={{ background: "var(--surface-sunken)", color: "var(--ink-soft)", border: "1px solid var(--line)" }}
              title="Editar lead"
            >
              <Edit size={12} />
              <span>Editar</span>
            </button>
          )}
          {onDelete && <button type="button" disabled={deleting}
            onClick={(e) => { e.stopPropagation(); onDelete(lead); }}
            className="ml-1 px-2 py-1 rounded-md text-xs font-medium gc-focus disabled:opacity-40"
            style={{ color: "var(--danger)", background: "var(--danger-bg)" }}
            aria-label={`Excluir lead ${lead.company}`}>
            {deleting ? "Excluindo..." : "Excluir"}
          </button>}
        </span>
      </div>
    </div>
  );
}

function ViewToggle({ mode, setMode }) {
  return (
    <div className="inline-flex items-center rounded-lg p-0.5 shrink-0" style={{ background: "var(--surface-sunken)" }}>
      <button onClick={() => setMode("list")} className="flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium gc-focus gc-pressable"
        style={{ background: mode === "list" ? "var(--surface)" : "transparent", color: mode === "list" ? "var(--ink)" : "var(--slate)", boxShadow: mode === "list" ? "0 1px 2px rgba(23,25,28,0.08)" : "none" }}>
        <List size={13} /> Lista
      </button>
      <button onClick={() => setMode("pipeline")} className="flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium gc-focus gc-pressable"
        style={{ background: mode === "pipeline" ? "var(--surface)" : "transparent", color: mode === "pipeline" ? "var(--ink)" : "var(--slate)", boxShadow: mode === "pipeline" ? "0 1px 2px rgba(23,25,28,0.08)" : "none" }}>
        <LayoutGrid size={13} /> Pipeline
      </button>
    </div>
  );
}

function KanbanCard({ lead, proposal, daysInStage, onClick }) {
  const bucket = actionBucket(lead.nextAction?.date);
  return (
    <button onClick={onClick} className="w-full text-left rounded-xl p-3.5 gc-focus gc-card gc-card-hover gc-pressable space-y-2" style={{ background: "var(--surface)", border: "1px solid var(--line)" }}>
      <div className="flex items-start justify-between gap-2">
        <span className="min-w-0">
          <TooltipText value={lead.company} className="block text-sm font-semibold truncate" />
          <TooltipText value={lead.contactName || lead.segment} className="block text-xs truncate" style={{ color: "var(--slate)" }} />
        </span>
        <TempPill temperature={lead.temperature} />
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <PriorityMark priority={lead.priority} />
        <span className="text-xs" style={{ color: "var(--slate)" }}>· {lead.segment}</span>
      </div>
      {proposal && (
        <div className="gc-mono text-sm font-medium" style={{ color: "var(--accent-ink)" }}>{fmtMoney(proposal.implementationValue)}</div>
      )}
      {lead.nextAction ? (
        <div className="flex items-center gap-1.5 text-xs">
          {bucket === "atrasado" && <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: "var(--danger)" }} />}
          <span className="gc-mono shrink-0" style={{ color: bucket === "atrasado" ? "var(--danger)" : "var(--slate)" }}>{fmtDate(lead.nextAction.date)}</span>
          <TooltipText value={lead.nextAction.note} className="truncate" style={{ color: "var(--ink-soft)" }} />
        </div>
      ) : (
        <div className="text-xs" style={{ color: "var(--slate)" }}>Sem próxima ação</div>
      )}
      <div className="text-[11px] pt-1" style={{ color: "var(--slate)", borderTop: "1px solid var(--line)" }}>
        {daysInStage <= 0 ? "Entrou na etapa hoje" : `${daysInStage} dia(s) nesta etapa`}
      </div>
    </button>
  );
}

function PipelineBoard({ leads, statusHistory, proposalValueByLead, onOpenLead }) {
  const buckets = useMemo(() => STAGE_GROUPS.map(g => ({ ...g, leads: leads.filter(l => g.statuses.includes(l.status)) })), [leads]);
  return (
    <div className="flex gap-3 overflow-x-auto pb-2 gc-scroll -mx-4 px-4 md:mx-0 md:px-0">
      {buckets.map(col => {
        const colValue = col.leads.reduce((sum, l) => sum + (proposalValueByLead[l.id] ? (proposalValueByLead[l.id].implementationValue || 0) : 0), 0);
        return (
          <div key={col.key} className="shrink-0 w-64 flex flex-col rounded-xl" style={{ background: "var(--surface-sunken)" }}>
            <div className="px-3.5 py-3 flex items-center justify-between" style={{ borderBottom: "1px solid var(--line)" }}>
              <span className="text-sm font-semibold">{col.label}</span>
              <span className="gc-mono text-xs" style={{ color: "var(--slate)" }}>{col.leads.length}{colValue > 0 ? ` · ${fmtMoney(colValue)}` : ""}</span>
            </div>
            <div className="flex-1 p-2.5 space-y-2.5 gc-scroll overflow-y-auto" style={{ maxHeight: "calc(100vh - 320px)", minHeight: 120 }}>
              {col.leads.length === 0 ? (
                <div className="text-xs text-center py-6" style={{ color: "var(--slate)" }}>Vazio</div>
              ) : col.leads.map(l => (
                <KanbanCard key={l.id} lead={l} proposal={proposalValueByLead[l.id]} daysInStage={daysInCurrentStage(l, statusHistory)} onClick={() => onOpenLead(l.id)} />
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function SortableHeader({ label, sortKey, sortBy, sortDirection, onSort }) {
  const active = sortBy === sortKey;
  const indicator = active ? (sortDirection === "asc" ? "↑" : "↓") : "↕";
  return (
    <button
      type="button"
      onClick={() => onSort(sortKey)}
      className="w-full flex items-center justify-center gap-1 text-center gc-focus"
      style={{ color: active ? "var(--accent-ink)" : "var(--slate)" }}
      title={`Ordenar por ${label}`}
      aria-label={`Ordenar por ${label}`}
    >
      <span>{label}</span>
      <span className="gc-mono text-[10px]" style={{ color: active ? "var(--accent)" : "var(--slate)" }}>{indicator}</span>
    </button>
  );
}

function ResizableHeader({ label, sortKey, sortBy, sortDirection, onSort, columnIndex, onResizeStart, onResizeKeyDown, children }) {
  return (
    <div className="relative min-w-0 flex items-center justify-center gap-2">
      {children || <SortableHeader label={label} sortKey={sortKey} sortBy={sortBy} sortDirection={sortDirection} onSort={onSort} />}
      <div
        className="gc-column-resize-handle"
        role="separator"
        aria-orientation="vertical"
        aria-label={`Redimensionar coluna ${label}`}
        title="Arraste para redimensionar"
        tabIndex={0}
        onPointerDown={(event) => onResizeStart(event, columnIndex)}
        onKeyDown={(event) => onResizeKeyDown(event, columnIndex)}
      />
    </div>
  );
}

function LeadsView({ db, sel, search, filter, setFilter, onOpenLead, onEditLead, onDeleteLead, deletingLeadId, onCreateLead, currentUser, viewMode, setViewMode, dispatch, notify }) {
  const [sortBy, setSortBy] = useState("next_action");
  const [sortDirection, setSortDirection] = useState("asc");
  const [cellTooltip, setCellTooltip] = useState(null);
  const [filtersOpen, setFiltersOpen] = useState(true);
  const [columnWidths, setColumnWidths] = useState([44, 240, 150, 100, 150, 220, 160, 150]);
  const [selectedLeads, setSelectedLeads] = useState(new Set());
  const [showMassMessageModal, setShowMassMessageModal] = useState(false);
  const [massMessageVariant, setMassMessageVariant] = useState("sites");
  const [massMessageText, setMassMessageText] = useState("Bom dia OU Boa tarde, {{nome}}! Tudo bem? 😊 Aqui é o Erick, trabalho com desenvolvimento de sites e sou de Ipatinga.");
  const [clinicaMessageText, setClinicaMessageText] = useState("Olá, bom dia!!\nConsigo falar com a {{nome}} por esse número?");
  const [personalMessages, setPersonalMessages] = useState({});
  const [activeMassLeadId, setActiveMassLeadId] = useState(null);
  const personalKey = (leadId) => `${massMessageVariant}:${leadId}`;
  const getPersonal = (leadId) => personalMessages[personalKey(leadId)];
  const setPersonal = (leadId, text) => setPersonalMessages(m => ({ ...m, [personalKey(leadId)]: text }));
  const clearPersonal = (leadId) => setPersonalMessages(m => {
    const next = { ...m };
    delete next[personalKey(leadId)];
    return next;
  });

  const columnWidthsRef = useRef([44, 240, 150, 100, 150, 220, 160, 150]);
  const minColumnWidth = 90;
  const maxColumnWidth = 600;
  const gridTemplateColumns = useMemo(() => {
    const fixedColumns = columnWidths.slice(0, -1).map(width => `${width}px`);
    return [...fixedColumns, `minmax(${columnWidths[columnWidths.length - 1]}px, 1fr)`].join(" ");
  }, [columnWidths]);
  const setColumnWidth = useCallback((columnIndex, width) => {
    setColumnWidths(previous => {
      if (columnIndex >= previous.length - 1) return previous;
      const next = [...previous];
      const min = columnIndex === 0 ? 40 : minColumnWidth;
      next[columnIndex] = Math.round(Math.min(maxColumnWidth, Math.max(min, width)));
      columnWidthsRef.current = next;
      return next;
    });
  }, []);
  const startColumnResize = useCallback((event, columnIndex) => {
    if (event.button !== 0 || columnIndex >= columnWidthsRef.current.length - 1) return;
    event.preventDefault();
    event.stopPropagation();
    const startX = event.clientX;
    const startWidth = columnWidthsRef.current[columnIndex];
    const target = event.currentTarget;
    const handleMove = (moveEvent) => {
      setColumnWidth(columnIndex, startWidth + moveEvent.clientX - startX);
    };
    const handleStop = () => {
      window.removeEventListener("pointermove", handleMove);
      window.removeEventListener("pointerup", handleStop);
      window.removeEventListener("pointercancel", handleStop);
    };
    window.addEventListener("pointermove", handleMove);
    window.addEventListener("pointerup", handleStop);
    window.addEventListener("pointercancel", handleStop);
    if (target.setPointerCapture) {
      try { target.setPointerCapture(event.pointerId); } catch (err) { /* pointer sintético/sem captura disponível */ }
    }
  }, [setColumnWidth]);
  const handleResizeKeyDown = useCallback((event, columnIndex) => {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    event.stopPropagation();
    setColumnWidth(columnIndex, columnWidthsRef.current[columnIndex] + (event.key === "ArrowRight" ? 16 : -16));
  }, [setColumnWidth]);
  const bucketRank = { atrasado: 0, hoje: 1, proximo: 2 };

  const showCellTooltip = useCallback((event) => {
    const target = event.currentTarget;
    const text = target.getAttribute("data-tooltip");
    const isTruncated = target.scrollWidth > target.clientWidth + 1;
    if (!text || !isTruncated) {
      setCellTooltip(null);
      return;
    }

    const rect = target.getBoundingClientRect();
    const margin = 8;
    const maxLeft = Math.max(margin, window.innerWidth - 496);
    const left = Math.max(margin, Math.min(rect.left, maxLeft));
    const above = rect.top > 120;
    setCellTooltip({
      text,
      left,
      top: above ? rect.top - margin : rect.bottom + margin,
      above,
    });
  }, []);
  const hideCellTooltip = useCallback(() => setCellTooltip(null), []);

  const getSortValue = (lead, key) => {
    switch (key) {
      case "company":
        return (lead.company || "").toLocaleLowerCase("pt-BR");
      case "status":
        return STATUS_LIST.indexOf(lead.status);
      case "temperature":
        return TEMP_RANK[lead.temperature] ?? -1;
      case "owner":
        return userName(lead.owner).toLocaleLowerCase("pt-BR");
      case "next_action": {
        const date = lead.nextAction?.date;
        if (!date) return null;
        const timestamp = new Date(date).getTime();
        if (Number.isNaN(timestamp)) return null;
        return [bucketRank[actionBucket(date)] ?? 3, timestamp];
      }
      case "last_contact": {
        const timestamp = lead.lastContactAt ? new Date(lead.lastContactAt).getTime() : NaN;
        return Number.isNaN(timestamp) ? null : timestamp;
      }
      default:
        return null;
    }
  };

  const compareSortValues = (a, b) => {
    if (Array.isArray(a) && Array.isArray(b)) return a[0] - b[0] || a[1] - b[1];
    if (typeof a === "number" && typeof b === "number") return a - b;
    return String(a).localeCompare(String(b), "pt-BR", { numeric: true, sensitivity: "base" });
  };

  const handleSort = (key) => {
    if (sortBy === key) {
      setSortDirection(direction => direction === "asc" ? "desc" : "asc");
    } else {
      setSortBy(key);
      setSortDirection("asc");
    }
  };

  const toggleLeadSelection = (leadId) => {
    setSelectedLeads(prev => {
      const next = new Set(prev);
      if (next.has(leadId)) next.delete(leadId);
      else next.add(leadId);
      return next;
    });
  };

  const toggleSelectAll = () => {
    if (selectedLeads.size === filtered.length) {
      setSelectedLeads(new Set());
    } else {
      setSelectedLeads(new Set(filtered.map(l => l.id)));
    }
  };

  const openLeadForEdit = (lead) => {
    onOpenLead(lead.id);
    onEditLead(lead);
  };

  const openMassMessageModal = (variant) => {
    if (selectedLeads.size > 0) {
      setMassMessageVariant(variant);
      setActiveMassLeadId(null);
      setShowMassMessageModal(true);
    }
  };

  const closeMassMessageModal = () => {
    setShowMassMessageModal(false);
    setActiveMassLeadId(null);
    setSelectedLeads(new Set());
  };

  const sendMassMessage = () => {
    const text = massMessageVariant === "clinica" ? clinicaMessageText : massMessageText;
    let updatedCount = 0;
    selectedLeads.forEach(leadId => {
      const lead = db.leads.find(l => l.id === leadId);
      if (lead && lead.whatsapp) {
        const name = lead.contactName || lead.company;
        const override = personalMessages[`${massMessageVariant}:${leadId}`];
        const message = override !== undefined
          ? personalizeOverride(override, name)
          : personalizeMessage(text, name);
        const encodedMessage = encodeURIComponent(message);
        window.open(`https://wa.me/${lead.whatsapp.replace(/\D/g, "")}?text=${encodedMessage}`, "_blank");
        if (lead.status === "Contato pendente") {
          dispatch({ type: "CHANGE_STATUS", id: leadId, status: "Contatado", user: currentUser });
          updatedCount += 1;
        }
      }
    });
    notify(updatedCount > 0
      ? `Mensagens abertas para ${selectedLeads.size} lead(s) no WhatsApp. Status alterado para "Contatado" em ${updatedCount} lead(s).`
      : `Mensagens abertas para ${selectedLeads.size} lead(s) no WhatsApp.`);
    setPersonalMessages({});
    closeMassMessageModal();
  };

  const filtered = useMemo(() => {
    let list = db.leads.filter(l => matchesLead(l, search));
    if (filter.status) list = list.filter(l => l.status === filter.status);
    if (filter.temperature) list = list.filter(l => l.temperature === filter.temperature);
    if (filter.owner) list = list.filter(l => l.owner === filter.owner);
    if (filter.priority) list = list.filter(l => l.priority === filter.priority);
    if (filter.recent) list = list.filter(l => daysSince(l.createdAt) <= 3);
    if (filter.noMovement) list = list.filter(l => sel.noMovement.some(nm => nm.id === l.id));
    if (filter.open) list = list.filter(l => l.status !== "Fechado" && l.status !== "Perdido");

    list = [...list].sort((a, b) => {
      const aValue = getSortValue(a, sortBy);
      const bValue = getSortValue(b, sortBy);
      if (aValue === null && bValue === null) return 0;
      if (aValue === null) return 1;
      if (bValue === null) return -1;
      const comparison = compareSortValues(aValue, bValue);
      return sortDirection === "asc" ? comparison : -comparison;
    });
    return list;
  }, [db.leads, search, filter, sortBy, sortDirection, sel.noMovement]);

  const clearable = Object.values(filter).some(Boolean);
  const activeFilterCount = Object.values(filter).filter(Boolean).length;

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div>
          <h1 className="gc-display text-xl font-semibold">Leads</h1>
          <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>{filtered.length} de {db.leads.length} leads</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap justify-end">
          <button
            type="button"
            onClick={() => setFiltersOpen(open => !open)}
            aria-expanded={filtersOpen}
            aria-controls="leads-filter-panel"
            title={filtersOpen ? "Recolher filtros" : "Expandir filtros"}
            className="inline-flex items-center justify-center gap-1.5 text-sm font-medium rounded-lg px-3.5 py-2 gc-focus"
            style={{ background: "var(--surface)", color: "var(--ink)", border: "1px solid var(--line-strong)" }}
          >
            <Filter size={16} />
            Filtros
            {activeFilterCount > 0 && (
              <span className="min-w-[18px] h-[18px] px-1 rounded-full text-[10px] leading-[18px] font-semibold text-center gc-mono" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}>
                {activeFilterCount}
              </span>
            )}
            <ChevronDown size={14} style={{ transform: filtersOpen ? "rotate(180deg)" : "none", transition: "transform 0.2s ease" }} />
          </button>
          <ViewToggle mode={viewMode} setMode={setViewMode} />
          {selectedLeads.size > 0 && (
            <>
              <Button icon={MessageCircle} variant="primary" onClick={() => openMassMessageModal("sites")}>
                Enviar WhatsApp ({selectedLeads.size})
              </Button>
              <Button icon={MessageCircle} onClick={() => openMassMessageModal("clinica")}>
                Falar c/ proprietária ({selectedLeads.size})
              </Button>
            </>
          )}
          <Button icon={Plus} onClick={onCreateLead}>Novo lead</Button>
        </div>
      </div>

      <div id="leads-filter-panel" className={`gc-collapse${filtersOpen ? "" : " collapsed"}`}>
        <div className="space-y-2">
          <div className="flex items-center gap-2 overflow-x-auto pb-1 gc-scroll">
            <FilterChip label="Todos" active={!clearable} onClick={() => setFilter({})} />
            <FilterChip label="Em andamento" active={!!filter.open} onClick={() => setFilter(f => ({ ...f, open: !f.open }))} />
            {STATUS_LIST.map(s => (
              <FilterChip key={s} label={s} active={filter.status === s} onClick={() => setFilter(f => ({ ...f, status: f.status === s ? null : s }))} />
            ))}
          </div>
          <div className="flex items-center gap-2 overflow-x-auto pb-1 gc-scroll">
            {TEMPERATURES.map(t => (
              <FilterChip key={t} label={t} active={filter.temperature === t} onClick={() => setFilter(f => ({ ...f, temperature: f.temperature === t ? null : t }))} />
            ))}
            <span className="w-px h-5 shrink-0" style={{ background: "var(--line-strong)" }} />
            {USERS.map(u => (
              <FilterChip key={u.id} label={u.name} active={filter.owner === u.id} onClick={() => setFilter(f => ({ ...f, owner: f.owner === u.id ? null : u.id }))} />
            ))}
            <span className="w-px h-5 shrink-0" style={{ background: "var(--line-strong)" }} />
            <FilterChip label="Sem movimentação" active={!!filter.noMovement} onClick={() => setFilter(f => ({ ...f, noMovement: !f.noMovement }))} />
            <div className="ml-auto flex items-center gap-1.5 shrink-0 pl-2">
              <span className="text-xs" style={{ color: "var(--slate)" }}>Ordenar:</span>
              <Select
                value={sortBy}
                onChange={(e) => { setSortBy(e.target.value); setSortDirection("asc"); }}
                style={{ width: "auto", padding: "6px 10px", fontSize: 12 }}
                aria-label="Selecionar coluna para ordenação"
              >
                <option value="company">Empresa</option>
                <option value="status">Status</option>
                <option value="temperature">Temperatura</option>
                <option value="owner">Responsável</option>
                <option value="next_action">Próxima ação</option>
                <option value="last_contact">Último contato</option>
              </Select>
              <Button
                size="sm"
                variant="secondary"
                onClick={() => setSortDirection(direction => direction === "asc" ? "desc" : "asc")}
              >
                {sortDirection === "asc" ? "Crescente" : "Decrescente"}
              </Button>
            </div>
          </div>
        </div>
      </div>

      {viewMode === "pipeline" ? (
        filtered.length === 0 ? (
          <SectionCard><EmptyState icon={Search} title="Nenhum lead encontrado" hint="Ajuste os filtros ou a busca para ver mais resultados." /></SectionCard>
        ) : (
          <PipelineBoard leads={filtered} statusHistory={db.statusHistory} proposalValueByLead={sel.proposalValueByLead} onOpenLead={onOpenLead} />
        )
      ) : (
        <SectionCard>
          <div className="gc-table-scroll">
            <div className="hidden md:grid gap-3 px-5 py-2.5 text-xs font-medium" style={{ gridTemplateColumns, color: "var(--slate)", borderBottom: "1px solid var(--line)" }}>
              <ResizableHeader label="Selecionar" columnIndex={0} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown}>
                <input
                  type="checkbox"
                  checked={selectedLeads.size === filtered.length && filtered.length > 0}
                  indeterminate={selectedLeads.size > 0 && selectedLeads.size < filtered.length}
                  onChange={toggleSelectAll}
                  className="w-4 h-4 rounded accent-accent shrink-0"
                  aria-label="Selecionar todos"
                />
              </ResizableHeader>
              <ResizableHeader label="Empresa" sortKey="company" sortBy={sortBy} sortDirection={sortDirection} onSort={handleSort} columnIndex={1} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown} />
              <ResizableHeader label="Status" sortKey="status" sortBy={sortBy} sortDirection={sortDirection} onSort={handleSort} columnIndex={2} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown} />
              <ResizableHeader label="Temp." sortKey="temperature" sortBy={sortBy} sortDirection={sortDirection} onSort={handleSort} columnIndex={3} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown} />
              <ResizableHeader label="Responsável" sortKey="owner" sortBy={sortBy} sortDirection={sortDirection} onSort={handleSort} columnIndex={4} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown} />
              <ResizableHeader label="Próxima ação" sortKey="next_action" sortBy={sortBy} sortDirection={sortDirection} onSort={handleSort} columnIndex={5} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown} />
              <ResizableHeader label="Último contato" sortKey="last_contact" sortBy={sortBy} sortDirection={sortDirection} onSort={handleSort} columnIndex={6} onResizeStart={startColumnResize} onResizeKeyDown={handleResizeKeyDown} />
              <span className="min-w-0 text-center">Ação</span>
            </div>
            {filtered.length === 0 ? (
              <EmptyState icon={Search} title="Nenhum lead encontrado" hint="Ajuste os filtros ou a busca para ver mais resultados." />
            ) : filtered.map(l => <LeadRow key={l.id} lead={l} onEdit={openLeadForEdit} onDelete={onDeleteLead} deleting={deletingLeadId === l.id} onCellMouseEnter={showCellTooltip} onCellMouseMove={showCellTooltip} onCellMouseLeave={hideCellTooltip} onCellFocus={showCellTooltip} onCellBlur={hideCellTooltip} gridTemplateColumns={gridTemplateColumns} isSelected={selectedLeads.has(l.id)} onSelect={toggleLeadSelection} />)}
          </div>
        </SectionCard>
      )}
      {cellTooltip && (
        <div
          className={`gc-cell-tooltip${cellTooltip.above ? " above" : ""}`}
          style={{ left: cellTooltip.left, top: cellTooltip.top }}
          role="tooltip"
        >
          {cellTooltip.text}
        </div>
      )}
      <MassMessageModal
        isOpen={showMassMessageModal}
        onClose={closeMassMessageModal}
        onSend={sendMassMessage}
        messageText={massMessageVariant === "clinica" ? clinicaMessageText : massMessageText}
        setMessageText={massMessageVariant === "clinica" ? setClinicaMessageText : setMassMessageText}
        selectedCount={selectedLeads}
        leads={db.leads}
        activeLeadId={activeMassLeadId}
        setActiveLeadId={setActiveMassLeadId}
        getPersonal={getPersonal}
        setPersonal={setPersonal}
        clearPersonal={clearPersonal}
      />
    </div>
  );
}

const LEAD_SCORE_FIELDS = [["dor", "Dor"], ["facilidade", "Facilidade de contato"], ["pagamento", "Capacidade de pagamento"], ["recorrencia", "Potencial de recorrência"]];

function LeadFormModal({ onClose, onSave, currentUser, initialLead }) {
  const isEditing = !!initialLead;
  const [expanded, setExpanded] = useState(isEditing);
  const [form, setForm] = useState({
    company: initialLead?.company || "",
    contactName: initialLead?.contactName || "",
    phone: initialLead?.phone || "",
    whatsapp: initialLead?.whatsapp || "",
    instagram: initialLead?.instagram || "",
    gmaps: initialLead?.gmaps || "",
    currentSite: initialLead?.currentSite || "",
    city: initialLead?.city || "",
    neighborhood: initialLead?.neighborhood || "",
    segment: initialLead?.segment || SEGMENTS[0],

  const save = () => {

    onSave({
      ...form,
      status: commercial.status,
      lossReason: commercial.lossReason,

      nextActionNote: commercial.nextActionNote,
      ...(commercial.score ? { score: commercial.score } : {}),

        </div>
        <div className="grid grid-cols-2 gap-3">

          <Field label="Instagram"><TextInput value={form.instagram} onChange={set("instagram")} placeholder="@empresa" /></Field>
        </div>
        <Field label="Cidade"><TextInput value={form.city} onChange={set("city")} placeholder="Ex.: Ipatinga" /></Field>

        {!expanded ? (
          <button type="button" onClick={() => setExpanded(true)} className="text-xs font-medium gc-focus flex items-center gap-1" style={{ color: "var(--accent-ink)" }}>
            <ChevronDown size={13} /> Mostrar mais campos

        ) : (
          <div className="space-y-4 pt-1 gc-fade-in" style={{ borderTop: isEditing ? "none" : "1px solid var(--line)" }}>
            <div className="grid grid-cols-2 gap-3 pt-3">
              <Field label="Telefone"><TextInput value={form.phone} onChange={set("phone")} placeholder="(31) 3000-0000" /></Field>
              <Field label="Site atual"><TextInput value={form.currentSite} onChange={set("currentSite")} placeholder="https://exemplo.com.br" /></Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Bairro"><TextInput value={form.neighborhood} onChange={set("neighborhood")} placeholder="Bairro" /></Field>
              <Field label="Google Maps (link)"><TextInput value={form.gmaps} onChange={set("gmaps")} placeholder="https://maps.app.goo.gl/..." /></Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field label="Responsável interno"><Select value={form.owner} onChange={set("owner")}>{USERS.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</Select></Field>

            </div>
            <Field label="Origem"><Select value={form.source} onChange={set("source")}>{SOURCES.map(s => <option key={s}>{s}</option>)}</Select></Field>

function MassMessageModal({ isOpen, onClose, onSend, messageText, setMessageText, selectedCount, leads, activeLeadId, setActiveLeadId, getPersonal, setPersonal, clearPersonal }) {
  if (!isOpen) return null;

  const selectedLeads = leads.filter(l => selectedCount.has(l.id));
  const leadsWithWhatsApp = selectedLeads.filter(l => l.whatsapp);
  const activeLead = leadsWithWhatsApp.find(l => l.id === activeLeadId) || null;
  const activeName = activeLead ? (activeLead.contactName || activeLead.company) : "";
  const activeOverride = activeLead ? getPersonal(activeLead.id) : undefined;
  const displayText = !activeLead
    ? messageText
    : activeOverride !== undefined
      ? personalizeOverride(activeOverride, activeName)
      : personalizeMessage(messageText, activeName);

  const handleTextChange = (value) => {
    if (activeLead) setPersonal(activeLead.id, value);
    else setMessageText(value);
  };

  return (
    <Modal title={`Enviar WhatsApp em massa — ${leadsWithWhatsApp.length} lead(s) com WhatsApp`} onClose={onClose} width={560}>
      <div className="space-y-4">
        <p className="text-xs -mt-1" style={{ color: "var(--slate)" }}>
          A mensagem será aberta no WhatsApp Web/App para cada lead selecionado que tenha WhatsApp cadastrado.
          O nome do contato entra automaticamente na saudação; use <code className="gc-mono px-1.5 py-0.5 rounded" style={{ background: "var(--surface-sunken)" }}>{"{nome}"}</code> para escolher onde ele aparece.
          Escrevendo <code className="gc-mono px-1.5 py-0.5 rounded" style={{ background: "var(--surface-sunken)" }}>bom dia/boa tarde</code>, a saudação vira bom dia (até 11:59), boa tarde (12:00–17:59) ou boa noite (a partir das 18:00) conforme a hora do envio.
        </p>

        {activeLead && (
          <div className="rounded-lg px-3 py-2 text-xs flex items-center justify-between gap-3" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)", border: "1px solid var(--accent)" }}>
            <span className="truncate">
              Personalizando para <strong>{activeName}</strong>
              {activeOverride !== undefined ? " — individual" : " — padrão com o nome"}
            </span>
            <Button variant="secondary" size="sm" className="shrink-0 whitespace-nowrap" onClick={() => clearPersonal(activeLead.id)} disabled={activeOverride === undefined}>Voltar ao padrão</Button>
          </div>
        )}

        <Field
          label={activeLead ? `Mensagem para ${activeName}` : "Mensagem"}
          required
          hint={activeLead
            ? "Editando a mensagem individual deste lead. Clique no nome novamente na lista para voltar à mensagem padrão."
            : "Use {{nome}} para inserir o nome do contato automaticamente. Clique em um nome da lista para personalizar individualmente."}
        >
          <TextArea
            value={displayText}
            onChange={(e) => handleTextChange(e.target.value)}
            placeholder="Digite sua mensagem..."
            style={{ minHeight: 120, fontFamily: "var(--font-body)" }}
          />
        </Field>

        {leadsWithWhatsApp.length < selectedCount.size && (
          <div className="rounded-lg p-3 text-sm" style={{ background: "var(--warn-bg)", color: "var(--warn)", border: "1px solid var(--line)" }}>
            <strong>⚠ {selectedCount.size - leadsWithWhatsApp.length} lead(s) não têm WhatsApp cadastrado e serão ignorados.</strong>
          </div>
        )}

        {leadsWithWhatsApp.length > 0 && (
          <div className="text-xs" style={{ color: "var(--slate)" }}>
            <div className="mb-2">Leads que receberão a mensagem — clique no nome para personalizar a saudação:</div>
            <ul className="space-y-1 max-h-40 overflow-y-auto">
              {leadsWithWhatsApp.map(l => {
                const isActive = l.id === activeLeadId;
                const isPersonalized = getPersonal(l.id) !== undefined;
                return (
                  <li key={l.id}>
                    <button
                      type="button"
                      onClick={() => setActiveLeadId(isActive ? null : l.id)}
                      className="w-full flex items-center gap-2 rounded-lg px-2 py-1.5 text-left gc-focus"
                      style={{
                        background: isActive ? "var(--accent-soft)" : "transparent",
                        border: `1px solid ${isActive ? "var(--accent)" : "transparent"}`,
                        color: isActive ? "var(--accent-ink)" : "inherit",
                      }}
                      title="Clique para personalizar a mensagem para este lead"
                    >
                      <span className="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-medium shrink-0" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}>
                        {l.contactName?.[0] || l.company?.[0] || "?"}
                      </span>
                      <span className="truncate flex-1">{l.contactName || l.company}</span>
                      {isPersonalized && (
                        <span className="px-1.5 py-0.5 rounded shrink-0" style={{ background: "var(--surface-sunken)", color: "var(--ink-soft)" }}>personalizada</span>
                      )}
                      <span className="gc-mono text-[11px] shrink-0" style={{ color: "var(--slate)" }}>{l.whatsapp}</span>
                    </button>
                  </li>
                );
              })}
            </ul>
          </div>
        )}

        <div className="flex justify-end gap-2 pt-2">
          <Button variant="secondary" onClick={onClose}>Cancelar</Button>
          <Button icon={Send} onClick={onSend} disabled={leadsWithWhatsApp.length === 0}>
            Abrir no WhatsApp ({leadsWithWhatsApp.length})
          </Button>
        </div>
      </div>
    </Modal>
  );

/* Chronological, cross-entity timeline — the brief's explicit ask so the
   whole story of a lead reads without hopping between tabs. Only events we
   actually have real timestamps for are shown (never a fabricated date). */
function buildLeadTimeline(leadId, db) {
  const events = [];
  db.interactions.filter(i => i.leadId === leadId).forEach(i => events.push({ type: "interaction", date: i.date, data: i }));
  db.statusHistory.filter(s => s.leadId === leadId).forEach(s => events.push({ type: "status", date: s.date, data: s }));
  db.followups.filter(f => f.leadId === leadId).forEach(f => events.push({ type: "followup", date: f.dueDate, data: f }));
  db.demos.filter(d => d.leadId === leadId).forEach(d => {
    events.push({ type: "demo_created", date: d.createdAt, data: d });
    if (d.sentAt) events.push({ type: "demo_sent", date: d.sentAt, data: d });
  });
  db.proposals.filter(p => p.leadId === leadId).forEach(p => events.push({ type: "proposal", date: p.proposalDate, data: p }));
  return events.sort((a, b) => new Date(b.date) - new Date(a.date));
}

function dayLabel(date) {
  const d = daysSince(date);
  if (d === 0) return "Hoje";
  if (d === 1) return "Ontem";
  if (d === -1) return "Amanhã";
  if (d < -1) return `Em ${Math.abs(d)} dias`;
  return fmtDateFull(date);
}

function TimelineEvent({ event }) {
  const { type, date, data } = event;
  if (type === "status") {
    return (
      <div className="flex items-center gap-2.5 py-2">
        <span className="w-6 h-6 rounded-full flex items-center justify-center shrink-0" style={{ background: "var(--surface-sunken)", color: "var(--slate)" }}><RotateCcw size={11} /></span>
        <span className="text-xs gc-mono shrink-0" style={{ color: "var(--slate)" }}>{fmtTime(date)}</span>
        <span className="text-xs" style={{ color: "var(--ink-soft)" }}>{userName(data.user)} alterou status: <strong>{data.from}</strong> → <strong>{data.to}</strong></span>
      </div>
    );
  }
  if (type === "followup") {
    const isFuture = new Date(data.dueDate) > new Date();
    return (
      <div className="flex items-start gap-2.5 py-2">
        <span className="w-6 h-6 rounded-full flex items-center justify-center shrink-0" style={{ background: "var(--surface-sunken)", color: "var(--slate)" }}><Clock size={11} /></span>
        <div className="min-w-0">
          <div className="flex items-center gap-2 text-xs" style={{ color: "var(--slate)" }}>
            <span className="gc-mono">{fmtTime(date)}</span>
            <span>{isFuture ? "Follow-up agendado" : "Follow-up"}</span>
            <Pill tone={data.status === "concluido" ? "green" : data.status === "cancelado" ? "slate" : "amber"}>{data.status}</Pill>
          </div>
          <div className="text-sm mt-0.5">{data.note}</div>
        </div>
      </div>
    );
  }
  if (type === "demo_created" || type === "demo_sent") {
    return (
      <div className="flex items-center gap-2.5 py-2">
        <span className="w-6 h-6 rounded-full flex items-center justify-center shrink-0" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}>
          {type === "demo_sent" ? <Send size={11} /> : <Timer size={11} />}
        </span>
        <span className="text-xs gc-mono shrink-0" style={{ color: "var(--slate)" }}>{fmtTime(date)}</span>
        <span className="text-xs" style={{ color: "var(--ink-soft)" }}>{type === "demo_sent" ? "Demo enviada ao cliente" : "Demo criada"} — {userName(data.owner)}</span>
      </div>
    );
  }
  if (type === "proposal") {
    return (
      <div className="flex items-center gap-2.5 py-2">
        <span className="w-6 h-6 rounded-full flex items-center justify-center shrink-0" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}><FileText size={11} /></span>
        <span className="text-xs gc-mono shrink-0" style={{ color: "var(--slate)" }}>{fmtTime(date)}</span>
        <span className="text-xs" style={{ color: "var(--ink-soft)" }}>Proposta enviada — {data.plan} · {fmtMoney(data.implementationValue)}</span>
      </div>
    );
  }
  const Icon = CHANNEL_ICON[data.channel] || MoreHorizontal;
  return (
    <div className="relative py-3" style={{ borderLeft: "2px solid var(--line-strong)", paddingLeft: 14, marginLeft: 11 }}>
      <span className="absolute -left-[7px] top-3.5 w-3 h-3 rounded-full" style={{ background: "var(--accent)", border: "2px solid var(--paper)" }} />
      <div className="flex items-center gap-2 text-xs" style={{ color: "var(--slate)" }}>
        <span className="gc-mono">{fmtTime(date)}</span>
        <span className="font-medium" style={{ color: "var(--ink-soft)" }}>{userName(data.user)}</span>
        <span className="flex items-center gap-1"><Icon size={12} />{data.channel}</span>
        <Pill tone="slate">{data.result}</Pill>
      </div>
      {data.note && <div className="text-sm mt-1.5">{data.note}</div>}
    </div>
  );
}

function UnifiedTimeline({ leadId, db, onAdd }) {
  const events = useMemo(() => buildLeadTimeline(leadId, db), [leadId, db]);
  const grouped = useMemo(() => {
    const groups = [];
    events.forEach(e => {
      const label = dayLabel(e.date);
      let g = groups.find(g => g.label === label);
      if (!g) { g = { label, events: [] }; groups.push(g); }
      g.events.push(e);
    });
    return groups;
  }, [events]);

  return (
    <div className="space-y-4">
      <AddInteractionForm onSave={onAdd} />
      {events.length === 0 ? (
        <EmptyState icon={Clock} title="Nenhum evento registrado" hint="Interações, follow-ups, demos e propostas aparecem aqui em ordem cronológica." />
      ) : (
        <div className="space-y-4">
          {grouped.map((g, gi) => (
            <div key={gi}>
              <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--slate)" }}>{g.label}</div>
              <div className="rounded-xl px-3" style={{ background: "var(--surface)", border: "1px solid var(--line)" }}>
                {g.events.map((e, i) => <TimelineEvent key={i} event={e} />)}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function NewFollowupForm({ onSave }) {
  const [preset, setPreset] = useState("hoje");
  const [customDate, setCustomDate] = useState("");
  const [note, setNote] = useState("");
  const resolveDate = () => {
    if (preset === "hoje") return daysFromNow(0, 17, 0);
    if (preset === "amanha") return daysFromNow(1, 9, 0);
    if (preset === "3dias") return daysFromNow(3, 9, 0);
    return customDate ? new Date(customDate).toISOString() : daysFromNow(0, 17, 0);
  };
  return (
    <div className="rounded-xl p-4 space-y-2.5" style={{ background: "var(--surface-sunken)" }}>
      <Field label="Quando">
        <div className="flex gap-2 flex-wrap">
          {[["hoje", "Hoje"], ["amanha", "Amanhã"], ["3dias", "Em 3 dias"], ["custom", "Data específica"]].map(([id, label]) => (
            <FilterChip key={id} label={label} active={preset === id} onClick={() => setPreset(id)} />
          ))}
        </div>
      </Field>
      {preset === "custom" && <Field label="Data"><TextInput type="datetime-local" value={customDate} onChange={(e) => setCustomDate(e.target.value)} /></Field>}
      <Field label="Lembrete"><TextInput value={note} onChange={(e) => setNote(e.target.value)} placeholder="Ex.: Cobrar resposta da proposta" /></Field>

        <Button size="sm" icon={Plus} onClick={() => { onSave({ dueDate: resolveDate(), note }); setNote(""); }}>Criar follow-up</Button>

}

function FollowupRow({ f, onComplete, onReschedule, onCancel }) {
  const bucket = actionBucket(f.dueDate);
  const done = f.status !== "pendente";
  return (
    <div className="flex items-center gap-3 px-4 py-3" style={{ borderBottom: "1px solid var(--line)", opacity: done ? 0.55 : 1 }}>
      <span className="gc-mono text-xs w-24 shrink-0" style={{ color: bucket === "atrasado" && !done ? "var(--danger)" : "var(--slate)" }}>{fmtDateTime(f.dueDate)}</span>
      <span className={`text-sm flex-1 min-w-0 truncate ${done ? "line-through" : ""}`}>{f.note}</span>
      {!done ? (
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={() => onComplete(f.id)} className="w-7 h-7 rounded-lg flex items-center justify-center gc-focus" style={{ color: "var(--success)" }} aria-label="Concluir"><CheckCircle2 size={16} /></button>
          <button onClick={() => onReschedule(f.id)} className="w-7 h-7 rounded-lg flex items-center justify-center gc-focus" style={{ color: "var(--accent-ink)" }} aria-label="Reagendar"><RotateCcw size={15} /></button>
          <button onClick={() => onCancel(f.id)} className="w-7 h-7 rounded-lg flex items-center justify-center gc-focus" style={{ color: "var(--slate)" }} aria-label="Cancelar"><Ban size={15} /></button>
        </div>
      ) : <Pill tone={f.status === "concluido" ? "green" : f.status === "cancelado" ? "slate" : "amber"}>{f.status}</Pill>}
    </div>
  );
}

function LeadDetail({ leadId, db, onClose, currentUser, dispatch, notify, initialTab, onEditLead }) {
  const [tab, setTab] = useState(initialTab || "geral");
  useEffect(() => { setTab(initialTab || "geral"); }, [leadId]);
  const [showLoss, setShowLoss] = useState(false);
  const [showConvert, setShowConvert] = useState(false);
  const lead = db.leads.find(l => l.id === leadId);
  if (!lead) return null;

  const interactions = db.interactions.filter(i => i.leadId === leadId);
  const followups = db.followups.filter(f => f.leadId === leadId).sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
  const demos = db.demos.filter(d => d.leadId === leadId).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const proposals = db.proposals.filter(p => p.leadId === leadId).sort((a, b) => new Date(b.proposalDate) - new Date(a.proposalDate));
  const client = db.clients.find(c => c.leadId === leadId);

  const changeStatus = (status) => {
    if (status === "Perdido") { setShowLoss(true); return; }
    dispatch({ type: "CHANGE_STATUS", id: leadId, status, user: currentUser });
    notify(`Status alterado para "${status}"`);
    if (status === "Fechado" && !client) setShowConvert(true);
  };

  const addInteraction = (data) => {
    dispatch({ type: "ADD_INTERACTION", leadId, interaction: { id: `i_${Date.now()}`, leadId, date: new Date().toISOString(), user: currentUser, ...data } });
  };

  const markDemoSent = (demo) => {
    const now = new Date().toISOString();
    dispatch({ type: "UPDATE_DEMO", id: demo.id, patch: { sentAt: now, expiresAt: hoursFromNow(demo.validityHours || 24) } });
    addInteraction({ channel: "WhatsApp", result: "Demo enviada", note: "Demonstração enviada." });
    if (lead.status !== "Demo enviada" && lead.status !== "Demo em análise") dispatch({ type: "CHANGE_STATUS", id: leadId, status: "Demo enviada", user: currentUser });
    notify("Demo enviada.");
  };

  const scoreAvg = lead.score ? Math.round(((lead.score.dor + lead.score.facilidade + lead.score.pagamento + lead.score.recorrencia) / 4) * 10) / 10 : null;

  return (
    <Drawer
      title={lead.company}
      subtitle={`${lead.city}${lead.neighborhood ? " · " + lead.neighborhood : ""} · ${lead.segment}`}
      onClose={onClose}
      headerRight={
        <div className="flex items-center gap-2">
          {onEditLead && (
            <Button size="sm" variant="secondary" icon={Edit} onClick={() => onEditLead(lead)}>
              Editar
            </Button>
          )}
          {lead.status === "Fechado" && !client ? <Button size="sm" onClick={() => setShowConvert(true)}>Converter em cliente</Button> : null}
        </div>
      }
    >
      <div className="flex items-center gap-3 flex-wrap mb-4">
        <StatusChanger lead={lead} onChange={changeStatus} />
        <TempPill temperature={lead.temperature} />
        <PriorityMark priority={lead.priority} />
        <span className="text-xs ml-auto" style={{ color: "var(--slate)" }}>Responsável: <strong style={{ color: "var(--ink-soft)" }}>{userName(lead.owner)}</strong></span>
      </div>

      <QuickActionsBar lead={lead} demos={demos} onGoTab={setTab} />
      <NextActionBanner lead={lead} onOpen={() => setTab("geral")} />

      {client && (
        <div className="rounded-xl px-4 py-3 mb-5 flex items-center gap-2 text-sm" style={{ background: "var(--success-bg)", color: "var(--success)" }}>
          <UserCheck size={16} /> Convertido em cliente ativo
        </div>
      )}
      {lead.status === "Perdido" && lead.lossReason && (
        <div className="rounded-xl px-4 py-3 mb-5 flex items-center gap-2 text-sm" style={{ background: "var(--danger-bg)", color: "var(--danger)" }}>
          <Ban size={16} /> Perdido — {lead.lossReason}
        </div>
      )}

      <div className="flex items-center gap-1 overflow-x-auto gc-scroll mb-5" style={{ borderBottom: "1px solid var(--line)" }}>
        {LEAD_TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} className="px-3 py-2.5 text-sm font-medium whitespace-nowrap gc-focus"
            style={{ color: tab === t.id ? "var(--accent-ink)" : "var(--slate)", borderBottom: tab === t.id ? "2px solid var(--accent)" : "2px solid transparent", transition: "color 0.15s ease, border-color 0.15s ease" }}>
            {t.label}
          </button>
        ))}
      </div>

      {tab === "geral" && (
        <div className="space-y-5 gc-fade-in">
          <SectionCard title="Próxima ação">
            <div className="p-4"><NextActionEditor lead={lead} onSave={(na) => dispatch({ type: "SET_NEXT_ACTION", leadId, nextAction: na })} /></div>
          </SectionCard>
          <SectionCard
            title="Contato"
            action={onEditLead ? (
              <button type="button" onClick={() => onEditLead(lead)} className="text-xs font-medium gc-focus flex items-center gap-1 hover:underline" style={{ color: "var(--accent-ink)" }}>
                <Edit size={12} /> Editar
              </button>
            ) : null}
          >
            <div className="px-5 py-2">
              <InfoRow icon={Users} label="Responsável" value={lead.contactName} />
              <InfoRow icon={Phone} label="Telefone" value={lead.phone} />
              <InfoRow icon={MessageCircle} label="WhatsApp" value={lead.whatsapp} href={waLink(lead.whatsapp)} />
              <InfoRow icon={Instagram} label="Instagram" value={lead.instagram} href={igLink(lead.instagram)} />
              <InfoRow icon={Globe} label="Site atual" value={lead.currentSite} href={siteLink(lead.currentSite)} />
              <InfoRow icon={MapPin} label="Google Maps" value={lead.gmaps ? "Ver localização" : ""} href={lead.gmaps} />
            </div>
          </SectionCard>
          <SectionCard
            title="Classificação"
            action={onEditLead ? (
              <button type="button" onClick={() => onEditLead(lead)} className="text-xs font-medium gc-focus flex items-center gap-1 hover:underline" style={{ color: "var(--accent-ink)" }}>
                <Edit size={12} /> Editar
              </button>
            ) : null}
          >
            <div className="px-5 py-4 grid grid-cols-2 gap-y-2 text-sm">
              <span style={{ color: "var(--slate)" }}>Origem</span><span>{lead.source}</span>
              <span style={{ color: "var(--slate)" }}>Cadastrado em</span><span className="gc-mono">{fmtDateFull(lead.createdAt)}</span>
              <span style={{ color: "var(--slate)" }}>Último contato</span><span className="gc-mono">{lead.lastContactAt ? fmtDateTime(lead.lastContactAt) : "—"}</span>
            </div>
            {lead.notes && <div className="px-5 pb-4 text-sm">{lead.notes}</div>}
          </SectionCard>
          {lead.score && (
            <SectionCard title={`Score comercial${scoreAvg !== null ? ` · ${scoreAvg}/5` : ""}`}>
              <div className="px-5 py-4 space-y-3">
                <ScoreBar label="Dor" value={lead.score.dor} onChange={(v) => dispatch({ type: "UPDATE_LEAD", id: leadId, patch: { score: { ...lead.score, dor: v } } })} />
                <ScoreBar label="Facilidade de contato" value={lead.score.facilidade} onChange={(v) => dispatch({ type: "UPDATE_LEAD", id: leadId, patch: { score: { ...lead.score, facilidade: v } } })} />
                <ScoreBar label="Capacidade de pagamento" value={lead.score.pagamento} onChange={(v) => dispatch({ type: "UPDATE_LEAD", id: leadId, patch: { score: { ...lead.score, pagamento: v } } })} />
                <ScoreBar label="Potencial de recorrência" value={lead.score.recorrencia} onChange={(v) => dispatch({ type: "UPDATE_LEAD", id: leadId, patch: { score: { ...lead.score, recorrencia: v } } })} />
              </div>
            </SectionCard>
          )}
        </div>
      )}

      {tab === "historico" && <div className="gc-fade-in"><UnifiedTimeline leadId={leadId} db={db} onAdd={addInteraction} /></div>}

      {tab === "followups" && (
        <div className="space-y-4 gc-fade-in">
          <NewFollowupForm onSave={(data) => { dispatch({ type: "ADD_FOLLOWUP", followup: { id: `f_${Date.now()}`, leadId, status: "pendente", createdBy: currentUser, ...data } }); notify("Follow-up criado."); }} />
          {followups.length === 0 ? <EmptyState icon={Clock} title="Nenhum follow-up para este lead" /> : (
            <SectionCard>
              {followups.map(f => (
                <FollowupRow key={f.id} f={f}
                  onComplete={(id) => dispatch({ type: "UPDATE_FOLLOWUP", id, patch: { status: "concluido" } })}
                  onReschedule={(id) => dispatch({ type: "UPDATE_FOLLOWUP", id, patch: { dueDate: daysFromNow(1, 9, 0), status: "pendente" } })}
                  onCancel={(id) => dispatch({ type: "UPDATE_FOLLOWUP", id, patch: { status: "cancelado" } })} />
              ))}
            </SectionCard>
          )}
        </div>
      )}

      {tab === "demo" && (
        <div className="space-y-4 gc-fade-in">
          <NewDemoForm onSave={({ url, hours, sendNow }) => {
            const now = new Date().toISOString();
            const id = `d_${Date.now()}`;
            if (sendNow) {
              dispatch({ type: "ADD_DEMO", demo: { id, leadId, url, createdAt: now, sentAt: now, validityHours: hours, expiresAt: hoursFromNow(hours), owner: currentUser, deactivated: false, views: null, lastViewedAt: null } });
              addInteraction({ channel: "WhatsApp", result: "Demo enviada", note: "Demonstração enviada." });
              if (lead.status !== "Demo enviada" && lead.status !== "Demo em análise") dispatch({ type: "CHANGE_STATUS", id: leadId, status: "Demo enviada", user: currentUser });
              notify("Demo enviada.");
            } else {
              dispatch({ type: "ADD_DEMO", demo: { id, leadId, url, createdAt: now, sentAt: null, validityHours: hours, expiresAt: null, owner: currentUser, deactivated: false, views: null, lastViewedAt: null } });
              notify("Demo salva como rascunho.");
