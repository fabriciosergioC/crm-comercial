        )}
        <div className="ml-auto flex items-center gap-2">
          {!pago && !cancelado && <Button size="sm" icon={CheckCircle2} onClick={() => onPatch(p, { status: "Pago", paidAt: new Date().toISOString() }, "Recebimento marcado como pago.")}>Marcar pago</Button>}
          {pago && <Button size="sm" variant="secondary" icon={RotateCcw} disabled={!!pedido} onClick={() => onPedir(p, "desfazer")}>Desfazer</Button>}
          {!cancelado && (pago
            ? <Button size="sm" variant="ghost" icon={Ban} disabled={!!pedido} onClick={() => onPedir(p, "cancelar")}>Cancelar</Button>
            : <Button size="sm" variant="ghost" icon={Ban} onClick={() => onPatch(p, { status: "Cancelado" }, "Lançamento cancelado — sai das somas, mas continua aqui.")}>Cancelar</Button>)}
          {cancelado && <Button size="sm" variant="ghost" icon={RotateCcw} onClick={() => onPatch(p, { status: "Pendente" }, "Lançamento reativado.")}>Reativar</Button>}
          <Button size="sm" variant="danger" icon={Trash2} disabled={!!pedido}
            title="Serve só para lançamento digitado errado: pede a sua senha e apaga do banco, sem volta"
            onClick={() => onPedir(p, "excluir")}>Excluir</Button>
        </div>
      </div>

      {/* A confirmação acontece aqui, dentro da linha que ele escolheu, com o nome
          e o valor à vista — é por isso que não existe mais janela no meio da tela. */}
      {pedido && (
        <CampoConfirmacaoSenha pedido={pedido} senha={senha} onSenha={onSenha}
          onConfirmar={onConfirmar} onVoltar={onVoltar} ocupado={ocupado} />
      )}
    </div>
  );
}

function FinanceiroView({ db, dispatch, notify, currentUser, onOpenLead, onRetry, tentandoDeNovo }) {
  const [mes, setMes] = useState(currentMonthKey());
  const [filtro, setFiltro] = useState("mes");
  /* Guia ativa dos recebimentos: foi a forma de parar de misturar a mensalidade
     do mês com a implantação do projeto no mesmo bolo. */
  const [aba, setAba] = useState("mensalidades");
  /* Segunda camada, pedida depois: Vendas, Recebimentos e Comissões cada um na sua
     guia. Com os três empilhados ele dizia que a tela "estava confusa" — agora abre
     numa coisa por vez e os quatro números do topo continuam valendo para todas. */
  const [sec, setSec] = useState("recebimentos");
  const [showVenda, setShowVenda] = useState(false);
  const [showReceb, setShowReceb] = useState(false);
  const [gerando, setGerando] = useState(false);
  const gerandoRef = useRef(false);
  const [pedindo, setPedindo] = useState(null);
  const [senha, setSenha] = useState("");
  const enviandoRef = useRef(false);
  const [enviando, setEnviando] = useState(false);
  const [percentDraft, setPercentDraft] = useState("");
  /* Período da guia Vendas: "mes" = o mês escolhido no topo, e os chips ampliam a
     janela até "todas". É estado de tela, não banco: nada é filtrado no Supabase
     por causa disto. A última janela que ele escolheu volta no dia seguinte —
     lembrada no navegador, como as larguras das colunas dos Leads. */
  const [filtroVendas, setFiltroVendas] = useState(lerFiltroVendasSalvo);
  /* Linha de recebimento a destacar: é para onde a tela salta quando a implantação
     do mês já existe e ele precisa cancelar aquela, em vez de lançar outra. */
  const [focoLancamento, setFocoLancamento] = useState(null);
  const [venda, setVenda] = useState({ company: "", description: "", value: "", kind: "Serviço avulso", saleDate: todayKey(), owner: currentUser, notes: "" });
  const [receb, setReceb] = useState({ alvo: "", description: "", amount: "", kind: "Mensalidade", dueDate: todayKey(), method: "", pago: false, notes: "" });

  const clientes = db.clients || [];
  const clientesAtivos = clientes
    .filter(c => c.status === "Ativo")
    .sort((a, b) => String(a.company || "").localeCompare(String(b.company || ""), "pt-BR"));
  const avulsas = db.financeSales || [];
  const recebimentos = db.financePayments || [];
  const settings = db.financeSettings;
  const percent = Number(settings && settings.commissionPercent != null ? settings.commissionPercent : 10);
  const hoje = todayKey();

  /* Vendas: clientes fechados (lidos da própria ficha) + avulsas lançadas aqui. */
  const deClientes = clientes.filter(c => c.status === "Ativo").map(c => ({
    id: `cliente:${c.id}`,
    origem: "Cliente",
    clientId: c.id,
    company: c.company,
    description: `${c.plan || "Projeto"} — fechamento`,
    value: Number(c.contractedValue) || 0,
    kind: "Implementação",
    saleDate: c.closingDate,
    owner: c.owner,
    status: "Ativa",
    monthlyValue: Number(c.monthlyValue) || 0,
  }));
  const vendas = [...avulsas.map(s => ({ ...s, origem: "Avulsa", value: Number(s.value) || 0, monthlyValue: 0 })), ...deClientes]
    .sort((a, b) => String(b.saleDate || "").localeCompare(String(a.saleDate || "")));
  const vendasAtivas = vendas.filter(s => s.status !== "Cancelada");
  const vendasMes = vendasAtivas.filter(s => monthKeyOf(s.saleDate) === mes);

  /* Período da guia Vendas. Antes a lista mostrava tudo e o mês do topo só mexia
     nos números; agora ela obedece ao período, com quatro janelas de mês. A
     janela é sempre contada a partir do mês escolhido no topo, nunca de hoje,
     para que ele possa voltar em Setembro/2026 e ver Setembro/2026.

     Regra que ele escolheu: venda fechada FORA da janela, mas que tem dinheiro
     nela DENTRO da janela, continua aparecendo — marcada com um aviso do mês do
     recebimento. Assim fechar um cliente em Setembro não faz a venda sumir da
     tela de Outubro quando a implantação dele cai em Outubro.

     Melhoria que ele pediu depois: cada chip diz quantas vendas ele traz (para
     ele escolher pelo número, não no escuro) e a última janela escolhida fica
     salva no navegador — abrir o CRM no dia seguinte volta no período que ele
     deixou, do mesmo jeito que as larguras das colunas dos Leads. */
  const mesDoLancamento = p => monthKeyOf(p.period || p.dueDate || p.paidAt);
  const linhasDaJanela = (filtro) => {
    const janela = mesesDaJanelaVendas(filtro, mes);
    const dentro = chave => !janela || (!!chave && janela.includes(chave));
    return vendas
      .map(s => {
        const fechadaNoPeriodo = dentro(monthKeyOf(s.saleDate));
        return { sale: s, fechadaNoPeriodo, recebimentosNoPeriodo: [] };
      })
      .filter(x => x.fechadaNoPeriodo);
  };
  const vendasDoPeriodo = linhasDaJanela(filtroVendas);
  const noPeriodo = chave => {
    const janela = mesesDaJanelaVendas(filtroVendas, mes);
    return !janela || (!!chave && janela.includes(chave));
  };
  const rotuloPeriodoVendas = filtroVendas === "todas"
    ? "todas as vendas"
    : filtroVendas === "ano" ? `ano de ${String(mes).slice(0, 4)}`
    : filtroVendas === "trimestre" ? `${monthLabelUi(shiftMonthKey(mes, -2))} a ${monthLabelUi(mes)}`
    : monthLabelUi(mes);

  /* Mensalidade pertence ao mÃªs da parcela, mesmo quando foi paga antes do
     vencimento. Assim a parcela de Novembro paga em Outubro aparece em Novembro. */
  const pagasNoMes = recebimentos.filter(p => p.status === "Pago" && monthKeyOf(p.period || p.dueDate || p.paidAt) === mes);
  const emAberto = recebimentos.filter(p => p.status === "Pendente");
  const atrasadas = emAberto.filter(p => dayKeyOf(p.dueDate) && dayKeyOf(p.dueDate) < hoje);
  const canceladas = recebimentos.filter(p => p.status === "Cancelado");
  const doMes = recebimentos.filter(p => p.status !== "Cancelado" && monthKeyOf(p.period || p.dueDate || p.paidAt) === mes);

  const vendidoMes = somaLista(vendasMes, s => s.value);
  const recebidoMes = somaLista(pagasNoMes, p => p.amount);
  const aReceber = somaLista(emAberto, p => p.amount);
  const comissaoMes = (recebidoMes * percent) / 100;

  const COFRE = {
    mes: p => p.status !== "Cancelado" && monthKeyOf(p.period || p.dueDate || p.paidAt) === mes,
    aberto: p => p.status === "Pendente",
    atrasado: p => p.status === "Pendente" && dayKeyOf(p.dueDate) && dayKeyOf(p.dueDate) < hoje,
    pago: p => p.status === "Pago" && monthKeyOf(p.period || p.dueDate || p.paidAt) === mes,
    cancelado: p => p.status === "Cancelado",
    tudo: () => true,
  };
  const FILTROS_UI = [["mes", "Deste mês"], ["aberto", "A receber"], ["atrasado", "Atrasadas"], ["pago", "Pagas"], ["cancelado", "Canceladas"], ["tudo", "Todos"]];
  /* Guia (tipo) e chip (situação) filtram a mesma lista, cada um pelo seu critério.
     O número em cada guia é quantos lançamentos dela aparecem com o filtro atual,
     e o número em cada chip vale só dentro da guia aberta — assim os dois contam
     sempre o que está na tela, em vez de somar o histórico inteiro. */
  const noFiltro = recebimentos.filter(COFRE[filtro] || COFRE.mes);
  const naAba = recebimentos.filter(p => abaDoTipo(p.kind) === aba);
  const lista = naAba.filter(COFRE[filtro] || COFRE.mes)
    .sort((a, b) => (dayKeyOf(a.dueDate || a.period) || "9999-99-99").localeCompare(dayKeyOf(b.dueDate || b.period) || "9999-99-99"));

  /* A soma que ele pediu separada: os três números de cima somam tudo, e esta
     faixa conta só o que está na guia aberta, com as MESMAS regras dos chips
     (Recebido = pago no mês escolhido, A receber = pendente que ainda não
     venceu, Atrasado = pendente vencida). Assim o valor da implantação aparece
     apenas na guia Implantação, em vez de entrar no bolo da mensalidade. */
  const guiaAtrasado = naAba.filter(COFRE.atrasado);
  const somaGuia = {
    recebido: somaLista(naAba.filter(COFRE.pago), p => p.amount),
    pagas: naAba.filter(COFRE.pago).length,
    aReceber: somaLista(naAba.filter(p => COFRE.aberto(p) && !COFRE.atrasado(p)), p => p.amount),
    emAberto: naAba.filter(p => COFRE.aberto(p) && !COFRE.atrasado(p)).length,
    atrasado: somaLista(guiaAtrasado, p => p.amount),
    atrasadas: guiaAtrasado.length,
  };

  /* Responsável do lançamento: de quem é o cliente (ou a venda avulsa) apontada. */
  const ownerDoLancamento = (p) => {
    if (p.clientId) return (clientes.find(c => c.id === p.clientId) || {}).owner || "";
    if (p.saleId) return (avulsas.find(s => s.id === p.saleId) || {}).owner || "";
    return "";
  };
  const porResponsavel = {};
  const linha = (owner) => {
    const chave = owner || "sem";
    if (!porResponsavel[chave]) porResponsavel[chave] = { owner: chave, vendido: 0, recebido: 0 };
    return porResponsavel[chave];
  };
  vendasMes.forEach(s => { linha(s.owner).vendido += Number(s.value) || 0; });
  pagasNoMes.forEach(p => { linha(ownerDoLancamento(p)).recebido += Number(p.amount) || 0; });
  const linhasComissao = Object.keys(porResponsavel)
    .map(k => { const l = porResponsavel[k]; return { ...l, comissao: (l.recebido * percent) / 100 }; })
    .sort((a, b) => b.recebido - a.recebido);

  /* As três guias grandes. Cada número é o que existe DENTRO daquela guia, na
     mesma lógica das guias de tipo: guia = o grupo recortado, nunca o histórico
     inteiro. Recebimentos conta o mês aberto; Vendas conta a lista que a guia
     mostra AGORA, ou seja, o período escolhido na fila dela (fechadas dos
     clientes + avulsas, mais quem tem recebimento no período); Comissões conta
     os responsáveis que têm venda ou recebimento no mês. */
  const SECOES_UI = [
    ["vendas", "Vendas", vendasDoPeriodo.length, `Vendas de ${rotuloPeriodoVendas} — a fila de período está dentro da guia`],
    ["recebimentos", "Recebimentos", doMes.length, `Parcelas e cobranças de ${monthLabelUi(mes)}`],
    ["comissoes", "Comissões", linhasComissao.length, "Quem vendeu, quanto entrou e a comissão de cada um"],
  ];

  const semTabelas = (acao) => {
    if (!db.financeIndisponivel) return false;
    notify("As tabelas do Financeiro ainda não estão no Supabase — " + acao + " só depois de colar a migration 014.", "error");
    return true;
  };

  const patchPagamento = (p, patch, msg) => {
    if (semTabelas("registrar o recebimento")) return;
    dispatch({ type: "UPDATE_FINANCE_PAYMENT", id: p.id, patch });
    if (msg) notify(msg);
  };
  const editarPagamento = (p, campo, valor) => {
    if (!valor) { notify(campo === "dueDate" ? "Escolha o dia do vencimento." : "Escolha um método (PIX, Boleto, Cartão…)."); return; }
    patchPagamento(p, { [campo]: valor }, campo === "dueDate" ? `Vencimento ajustado para ${fmtDateFull(valor)}.` : `Método: ${valor}.`);
  };

  /* Os três atos que mexem em dinheiro que já entrou — Excluir, Desfazer e
     Cancelar de um lançamento pago — abrem o campo de senha na própria linha e
     só chamam a API depois que ele confirma. A senha vai no cabeçalho e o
     backend confere com o serviço do login ANTES de fazer qualquer coisa: sem
     ela o botão seria só um clique a mais na tela. Nada é aplicado na tabela
     local enquanto a API não responde, e a mensagem de erro mostrada é a que o
     servidor mandou (inclusive "Senha não confere"), nunca um texto nosso. */
  const ACAO_SENHA = {
    excluir: { patch: null, tipo: "excluir o lançamento", fallback: "Não foi possível excluir o recebimento — nada foi apagado." },
    desfazer: { patch: { status: "Pendente", paidAt: null }, tipo: "desfazer o recebimento", fallback: "Não foi possível desfazer o pagamento — nada foi alterado." },
    cancelar: { patch: { status: "Cancelado" }, tipo: "cancelar o lançamento", fallback: "Não foi possível cancelar o recebimento — nada foi alterado." },
  };

  const pedirAcao = (p, acao) => {
    if (pedindo && pedindo.id === p.id && pedindo.acao === acao) { setPedindo(null); setSenha(""); return; }
    const nome = p.company || "cliente sem nome";
    const vencimento = dayKeyOf(p.dueDate);
    const valor = fmtMoney(p.amount);
    const textos = {
      excluir: `Apagar o recebimento de ${nome} — ${valor}${vencimento ? `, vencendo em ${fmtDateFull(vencimento)}` : ""}. ` +
        "Ele sai da lista, das somas e das comissões e não tem como recuperar. Se o que você quer é guardar o erro para conferir depois, use “Cancelar”.",
      desfazer: `Desfazer o pagamento de ${nome} — ${valor} volta para “A receber” e para de contar no recebido do mês. O lançamento continua aqui.`,
      cancelar: `Cancelar o recebimento pago de ${nome} — ${valor} sai das somas do mês. A linha fica na tela marcada como “Cancelado”.`,
    };
    const avisos = {
      excluir: `Recebimento de ${nome} excluído.`,
      desfazer: `Pagamento desfeito — ${valor} voltou para a receber.`,
      cancelar: `Lançamento cancelado — ${valor} saiu das somas, mas continua aqui.`,
    };
    setSenha("");
    setPedindo({ id: p.id, acao, texto: textos[acao], msg: avisos[acao] });
  };

  const voltarPedido = () => { setPedindo(null); setSenha(""); };

  const confirmarPedido = async () => {
    const pedido = pedindo;
    if (!pedido || enviandoRef.current) return;
    const plano = ACAO_SENHA[pedido.acao];
    if (!senha) { notify(`Digite a sua senha do CRM para ${plano.tipo}.`, "error"); return; }
    if (semTabelas(plano.tipo)) return;
    enviandoRef.current = true;
    setEnviando(true);
    const credenciais = { senha, usuario: currentUser };
    try {
      const res = pedido.acao === "excluir"
        ? await crmApi.finance.payments.remove(pedido.id, credenciais)
        : await crmApi.finance.payments.update(pedido.id, plano.patch, credenciais);
      if (!res || !res.success) {
        throw new Error((res && (res.message || (res.error && res.error.message))) || plano.fallback);
      }
      if (pedido.acao === "excluir") dispatch({ type: "DELETE_FINANCE_PAYMENT", id: pedido.id });
      else dispatch({ type: "FINANCE_PAYMENT_SECURED", id: pedido.id, patch: plano.patch });
      notify(pedido.msg);
      setPedindo(null);
    } catch (error) {
      const bruto = (error && error.message) || "";
      /* O servidor já diz "nada foi feito" na mensagem da senha; repetir o aviso
         aqui faria a frase ficar cortada em dois lugares. */
      notify(/nada foi/i.test(bruto) ? bruto : `${bruto || plano.fallback}`, "error");
    } finally {
      /* A senha nunca fica guardada: errada ou certa, ela some do campo quando o
         pedido termina. */
      setSenha("");
      enviandoRef.current = false;
      setEnviando(false);
    }
  };

  /* Trocar de guia fecha o pedido de senha que estiver aberto: a linha que ele
     pediu para apagar não está mais na tela, e a senha digitada não pode ficar
     esperando para a próxima linha que aparecer naquele lugar. */
  const trocarAba = (id) => { setAba(id); setPedindo(null); setSenha(""); };
  const trocarMes = (valor) => {
    setMes(valor);
    setFiltroVendas("mes");
    salvarFiltroVendasEscolhido("mes");
    setPedindo(null);
    setSenha("");
  };
  const atualizarDadosDoMes = () => {
    setFiltroVendas("mes");
    salvarFiltroVendasEscolhido("mes");
    onRetry();
  };
  /* Trocar de guia grande também fecha o pedido de senha aberto: o campo vive na
     linha do recebimento, e deixá-lo pendurado para depois, em outra guia, viraria
     um "Confirmar exclusão" fora de contexto. */
  const trocarSecao = (id) => { setSec(id); setPedindo(null); setSenha(""); };

  /* Novo recebimento abre já com o tipo da guia ativa, para o lançamento cair na
     lista que ele está olhando. */
  const alternarFormRecebimento = () => {
    const novo = !showReceb;
    if (novo) setReceb(f => ({ ...f, kind: tipoDaAba(aba) }));
    setShowReceb(novo);
  };
  const abrirFichaDoCliente = (clientId) => {
    const c = clientes.find(x => x.id === clientId);
    if (!c) { notify("Este lançamento aponta para um cliente que não está mais na lista."); return; }
    /* Cliente pode ter sido cadastrado direto na guia Clientes, sem Lead: aí não
       há ficha para abrir e o aviso tem que dizer o nome dele, não "sumiu". */
    if (!c.leadId) { notify(`${c.company} foi cadastrado sem Lead — não há ficha para abrir.`); return; }
    onOpenLead(c.leadId);
  };

  const gerarMensalidades = async () => {
    if (gerandoRef.current) return;
    if (semTabelas("gerar as mensalidades")) return;
    const mesAtual = currentMonthKey();
    if (mes > mesAtual) {
      notify("Parcela anterior ainda não foi fechada.", "error");
      return;
    }
    const mesAnterior = shiftMonthKey(mes, -1);
    const parcelaAnteriorEmAberto = recebimentos.some(p => (
      p.kind === "Mensalidade" &&
      monthKeyOf(p.period || p.dueDate || p.paidAt) === mesAnterior &&
      p.status !== "Pago" &&
      p.status !== "Cancelado"
    ));
    if (parcelaAnteriorEmAberto) {
      notify("Parcela anterior ainda não foi fechada.", "error");
      return;
    }
    gerandoRef.current = true;
    setGerando(true);
    try {
      const res = await crmApi.finance.payments.recorrentes(`${mes}-01`);
      if (!res || !res.success) {
        notify(res && res.message ? res.message : "Não foi possível gerar as mensalidades — o backend não respondeu.", "error");
        return;
      }
      const criadas = (res.data && res.data.created) || [];
      const puladas = (res.data && res.data.skipped) || 0;
      if (criadas.length) dispatch({ type: "ADD_FINANCE_PAYMENTS", payments: criadas });
      const rotuloPuladas = puladas ? `${puladas} cliente${puladas > 1 ? "s" : ""} com lançamento deste mês` : "nenhum cliente ativo com mensalidade";
      /* Plural escrito por extenso nos dois lados: "tinhaam"/"lançamentoes" é o que
         sai quando o +s vem depois de uma palavra que já termina em vogal. */
      notify(criadas.length
        ? `${criadas.length} mensalidade${criadas.length > 1 ? "s" : ""} de ${monthLabelUi(mes)} lançada${criadas.length > 1 ? "s" : ""} (${fmtMoney(somaLista(criadas, p => p.amount))})${puladas ? ` · ${puladas === 1 ? "1 cliente já tinha" : `${puladas} clientes já tinham`} lançamento deste mês` : ""}.`
        : `Nada para gerar em ${monthLabelUi(mes)} — ${rotuloPuladas}.`);
      setFiltro("aberto");
      /* Mensalidade gerada é mensalidade: garante que ele vê as linhas novas. */
      setAba("mensalidades");
    } catch (error) {
      notify("Não foi possível gerar as mensalidades: " + ((error && error.message) || "sem resposta do backend"), "error");
    } finally {
      gerandoRef.current = false;
      setGerando(false);
    }
  };

  const salvarVenda = () => {
    if (semTabelas("lance a venda avulsa")) return;
    const valor = Number(String(venda.value).replace(",", "."));
    if (!String(venda.company).trim()) { notify("Informe o nome de quem comprou esta venda."); return; }
    if (!Number.isFinite(valor) || valor <= 0) { notify("Informe o valor da venda em reais."); return; }
    const mesVenda = monthKeyOf(venda.saleDate || hoje);
    const empresaVenda = String(venda.company).trim().toLowerCase();
    const implementacaoDuplicada = ehImplementacao(venda.kind) && (
      vendas.some(s => (
        s.status !== "Cancelada" &&
        ehImplementacao(s.kind) &&
        monthKeyOf(s.saleDate) === mesVenda &&
        String(s.company || "").trim().toLowerCase() === empresaVenda
      )) ||
      recebimentos.some(p => (
        ehImplementacao(p.kind) &&
        p.status !== "Cancelado" &&
        monthKeyOf(p.period || p.dueDate || p.paidAt) === mesVenda &&
        String(p.company || "").trim().toLowerCase() === empresaVenda
      ))
    );
    if (implementacaoDuplicada) {
      notify(`A implantação de ${monthLabelUi(mesVenda)} já foi lançada para ${venda.company}. Cancele a existente antes de lançar outra.`, "error");
      return;
    }
    const dataVenda = new Date(`${dayKeyOf(venda.saleDate) || hoje}T12:00:00`).toISOString();
    const idVenda = `fs_${Date.now()}`;
    /* Implementação lançada na guia Vendas já nasce como recebimento em aberto.
       Assim, depois da remoção do botão "Receber", o valor não fica solto na
       venda e aparece automaticamente na guia Recebimentos. */
    dispatch({
      type: "ADD_FINANCE_SALE_WITH_PAYMENT",
      sale: {
        id: idVenda,
        company: String(venda.company).trim(),
        description: venda.description,
        value: valor,
        kind: venda.kind,
        saleDate: dataVenda,
        owner: venda.owner,
        status: "Ativa",
        notes: venda.notes,
      },
      payment: {
        id: `rc_${Date.now()}_sale`,
        saleId: idVenda,
        company: String(venda.company).trim(),
        description: venda.description || venda.kind,
        amount: valor,
        kind: venda.kind,
        dueDate: dayKeyOf(venda.saleDate) || hoje,
        status: "Pendente",
        notes: venda.notes,
      },
    });
    /* A guia Vendas agora obedece ao período — se a venda lançada cai num mês de
       fora da janela, ela não apareceria e o botão pareceria quebrado. Então o
       mês do topo vai junto para o mês da venda, e o aviso diz isso. */
    const mesVendaLancada = monthKeyOf(dataVenda);
    const fora = !noPeriodo(mesVendaLancada);
    if (fora) trocarMes(mesVendaLancada);
    /* A venda jÃ¡ cria o recebimento pendente; abre exatamente a guia e o filtro
       onde ele acabou de entrar, sem depender do filtro que estava selecionado. */
    setSec("recebimentos");
    setAba(abaDoTipo(venda.kind));
    setFiltro("aberto");
    notify(fora
      ? `Venda lançada com recebimento em aberto — mostrando ${monthLabelUi(mesVendaLancada)}.`
      : "Venda lançada com recebimento em aberto.");
    setShowVenda(false);
    setVenda({ company: "", description: "", value: "", kind: "Serviço avulso", saleDate: hoje, owner: currentUser, notes: "" });
  };

  const salvarRecebimento = () => {
    if (semTabelas("lance o recebimento")) return;
    const alvo = String(receb.alvo || "");
    const tipo = alvo.split(":")[0];
    const id = alvo.split(":")[1];
    if (!id || (tipo !== "client" && tipo !== "sale")) { notify("Escolha o cliente ou a venda avulsa deste recebimento."); return; }
    const valor = Number(String(receb.amount).replace(",", "."));
    if (!Number.isFinite(valor) || valor <= 0) { notify("Informe o valor recebido em reais."); return; }
    /* O nome vai junto no lançamento (snapshot), igual ao backend grava: sem ele
       a linha otimista nasceria com "—" e só corrigiria depois do F5. */
    const dono = tipo === "client"
      ? clientes.find(c => c.id === id)
      : avulsas.find(s => s.id === id);
    if (!dono) { notify(tipo === "client" ? "Este cliente não está mais na lista." : "Esta venda avulsa não está mais na lista."); return; }
    /* Cinto de segurança: o botão já fica desabilitado e a linha aparece na tela,
       mas se algum caminho chegar aqui sem passar pelo aviso, nada é duplicado. */
    if (duplicadoReceb) {
      setFocoLancamento(duplicadoReceb.id);
      notify(`A implantação de ${monthLabelUi(mesDoNovoLancamento)} de ${dono.company || "este cliente"} já foi lançada (${fmtMoney(duplicadoReceb.amount)}). Cancele a existente para poder lançar outra.`, "error");
      return;
    }
    const pagamento = {
      id: `rc_${Date.now()}`,
      clientId: tipo === "client" ? id : undefined,
      saleId: tipo === "sale" ? id : undefined,
      company: dono.company || "",
      description: receb.description,
      amount: valor,
      kind: receb.kind,
      dueDate: receb.dueDate || undefined,
      /* O mês só trava duplicidade para mensalidade: assim dá para lançar uma
         cobrança extra no mesmo mês do mesmo cliente sem esbarra no índice único. */
      period: receb.kind === "Mensalidade" ? `${mes}-01` : undefined,
      status: receb.pago ? "Pago" : "Pendente",
      paidAt: receb.pago ? new Date().toISOString() : undefined,
      method: receb.method || undefined,
      notes: receb.notes,
    };
    dispatch({ type: "ADD_FINANCE_PAYMENT", payment: pagamento });
    /* Troca para a guia do tipo lançado, senão a linha some de vista e parece
       que o botão não fez nada. */
    setAba(abaDoTipo(receb.kind));
    notify(receb.pago ? "Recebimento lançado como pago." : "Recebimento lançado como a receber.");
    setShowReceb(false);
    setReceb({ alvo: "", description: "", amount: "", kind: "Mensalidade", dueDate: hoje, method: "", pago: false, notes: "" });
  };

  /* O botão "Receber" está na guia Vendas, mas o formulário de lançamento vive na
     guia Recebimentos — então ele troca de guia antes de abrir o formulário, na
     guia de tipo certa (mensalidade ou implantação), senão parece que o botão não
     fez nada. */
  const lancarRecebimentoDe = (alvo, valor, kind) => {
    setReceb(f => ({ ...f, alvo, amount: valor ? String(valor) : "", kind: kind || "Mensalidade", dueDate: hoje }));
    setSec("recebimentos");
    setAba(abaDoTipo(kind));
    setPedindo(null);
    setSenha("");
    setShowReceb(true);
  };

  /* Uma venda avulsa se cobra uma vez só: quando já existe um recebimento dela
     — pago ou a receber — o botão "Receber" sai da linha e dá lugar à pílula do
     que foi lançado, para não duplicar a mesma cobrança. Quem precisar cobrar de
     novo continua podendo: a venda avulsa segue listada no "Novo recebimento" da
     guia Recebimentos. Linha de Cliente fica igual, porque mensalidade se repete. */
  const recebimentosDaAvulsa = saleId => recebimentos.filter(p => p.saleId === saleId && p.status !== "Cancelado");

  /* Implantação se recebe uma vez por mês. Foi a escolha dele: em vez de deixar
     lançar a segunda cobrança e depois conferir a conta, a tela barra e mostra a
     linha que já existe, com o botão "Cancelar implantação" na própria linha da
     guia Vendas — cancelada, o botão "Receber" volta. Vale para o formulário
     também (aviso antes de salvar) e para o servidor (409 na segunda), senão quem
     entra pelo link da equipe duplicaria pela API. Mensalidade fica como estava:
     ela se repete todo mês e o banco já tem índice único por cliente e mês. */
  const implantacaoDoMes = (tipo, id, chave, empresa) => recebimentos.find(p => (
    ehImplementacao(p.kind) && p.status !== "Cancelado" &&
    mesDoLancamento(p) === chave &&
    (tipo === "client"
      ? p.clientId === id
      : p.saleId === id || (empresa && String(p.company || "").trim().toLowerCase() === String(empresa).trim().toLowerCase()))
  ));

  /* Para onde a tela salta quando ele precisa cancelar a implantação que já
     existe: fecha o formulário, vai para Recebimentos, abre a guia do tipo, põe
     "Todos" no filtro (a linha pode estar paga, atrasada ou fora do recorte) e
     acende a linha. */
  const mostrarLancamento = (p) => {
    setShowReceb(false);
    setPedindo(null);
    setSenha("");
    setSec("recebimentos");
    setAba(abaDoTipo(p.kind));
    setFiltro("tudo");
    setFocoLancamento(p.id);
    notify(`Mostrando o lançamento de ${p.company || "este cliente"} — cancele aqui para poder lançar de novo.`);
  };

  const alvoReceb = { tipo: String(receb.alvo || "").split(":")[0], id: String(receb.alvo || "").split(":")[1] };
  /* O mês em que este lançamento vai cair é o mês que a tela e o banco usam para
     contar: mensalidade trava no mês do topo, o resto segue o vencimento. */
  const mesDoNovoLancamento = receb.kind === "Mensalidade" ? mes : monthKeyOf(receb.dueDate || hoje);
  const vendaAlvoReceb = alvoReceb.tipo === "sale" ? avulsas.find(s => s.id === alvoReceb.id) : null;
  const duplicadoReceb = (alvoReceb.tipo === "client" || alvoReceb.tipo === "sale") && ehImplementacao(receb.kind)
    ? implantacaoDoMes(alvoReceb.tipo, alvoReceb.id, mesDoNovoLancamento, vendaAlvoReceb?.company)
    : null;

  /* A linha destacada entra na vista sozinha: senão ele cliqaria em "ver a
     linha", a guia trocaria, e o lançamento continuaria lá embaixo, fora da tela
     — o mesmo tipo de "botão que não faz nada" que ele já reclamou. */
  useEffect(() => {
    if (!focoLancamento) return undefined;
    const timer = setTimeout(() => {
      const el = document.querySelector(`[data-lancamento="${focoLancamento}"]`);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 60);
    return () => clearTimeout(timer);
  }, [focoLancamento, sec, aba, filtro]);

  const salvarComissao = () => {
    if (semTabelas("ajuste o percentual de comissão")) return;
    const n = Number(String(percentDraft).replace(",", "."));
    if (!Number.isFinite(n) || n < 0 || n > 100) { notify("Informe um percentual entre 0 e 100."); return; }
    dispatch({ type: "SET_FINANCE_SETTINGS", settings: { id: "padrao", commissionPercent: n } });
    setPercentDraft("");
    notify(`Comissão ajustada para ${n}% sobre o recebido.`);
  };

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="gc-display text-xl font-semibold">Financeiro</h1>
          <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>Vendas, recebimentos e comissões de {monthLabelUi(mes)}.</p>
        </div>
        <div className="flex items-center gap-1.5">
          <Button variant="secondary" size="sm" icon={ChevronsLeft} onClick={() => trocarMes(shiftMonthKey(mes, -1))} title="Mês anterior" />
          <div className="relative" style={{ width: 188 }}>
            <TextInput
              type="text"
              value={monthLabelUi(mes).replace("/", " de ")}
              readOnly
              aria-label={`Período selecionado: ${monthLabelUi(mes).replace("/", " de ")}`}
              style={{ width: "100%", textAlign: "center", fontWeight: 600, paddingLeft: 10, paddingRight: 10 }}
            />
            <input
              type="month"
              value={mes}
              onChange={(e) => trocarMes(e.target.value || currentMonthKey())}
              aria-label="Escolher mês e ano"
              title="Escolher mês e ano"
              style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0, cursor: "pointer" }}
            />
          </div>
          <Button variant="secondary" size="sm" icon={ChevronsRight} onClick={() => trocarMes(shiftMonthKey(mes, 1))} title="Próximo mês" />
          <Button variant="secondary" size="sm" icon={RefreshCw} onClick={atualizarDadosDoMes} disabled={tentandoDeNovo}
            title="Atualizar os dados do mês selecionado">
            {tentandoDeNovo ? "Atualizando…" : "Atualizar"}
          </Button>
        </div>
      </div>

      {db.financeIndisponivel && (
        <div className="rounded-xl px-4 py-3 space-y-2" style={{ background: "rgba(217,119,6,0.10)", color: "#8A5A12", border: "1px solid rgba(217,119,6,0.28)" }}>
          <div className="flex items-start gap-2 text-sm">
            <AlertTriangle size={16} style={{ marginTop: 3, flexShrink: 0 }} />
            <div>
              <div className="font-semibold">As tabelas do Financeiro ainda não existem no Supabase</div>
              <div className="mt-1">
                Abra o <strong>SQL Editor</strong> do projeto e cole o conteúdo do arquivo{" "}
                <span className="gc-mono">backend/database/migrations/014_financeiro.sql</span>, depois execute e feche e reabra o{" "}
                <span className="gc-mono">run-crm.bat</span>. As vendas dos clientes já aparecem aqui; só o lançamento de recebimento precisa das tabelas.
              </div>
            </div>
          </div>
          <div className="flex justify-end">
            <Button size="sm" variant="secondary" icon={RefreshCw} onClick={onRetry} disabled={tentandoDeNovo}>Tentar de novo</Button>
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <StatTile label="Vendido no mês" value={fmtMoney(vendidoMes)} sub={`${vendasMes.length} venda${vendasMes.length === 1 ? "" : "s"}`} icon={TrendingUp}
          title="Abrir a guia Vendas" onClick={() => trocarSecao("vendas")} />
        <StatTile label="Recebido no mês" value={fmtMoney(recebidoMes)} sub={`${pagasNoMes.length} ${pagasNoMes.length === 1 ? "lançamento" : "lançamentos"}`} tone="success" icon={CheckCircle2}
          title="Abrir a guia Recebimentos já nas pagas do mês" onClick={() => { trocarSecao("recebimentos"); setFiltro("pago"); }} />
        <StatTile
          label="A receber"
          value={fmtMoney(aReceber)}
          sub={atrasadas.length ? `${atrasadas.length} atrasada${atrasadas.length === 1 ? "" : "s"}` : `${emAberto.length} em aberto`}
          tone={atrasadas.length ? "danger" : undefined}
          title="Abrir a guia Recebimentos nos lançamentos em aberto"
          onClick={() => { trocarSecao("recebimentos"); setFiltro("aberto"); }}
          icon={Clock}
        />
        <StatTile label="Comissão do mês" value={fmtMoney(comissaoMes)} sub={`${percent}% do recebido`} icon={Banknote}
          title="Abrir a guia Comissões" onClick={() => trocarSecao("comissoes")} />
      </div>

      {/* As três guias grandes, logo abaixo dos números: uma coisa na tela por vez.
          Os números do topo continuam somando o mês inteiro, em qualquer guia. */}
      <div className="flex items-center gap-2 flex-wrap">
        {SECOES_UI.map(([id, label, qtd, hint]) => {
          const ativa = sec === id;
          return (
            <button key={id} onClick={() => trocarSecao(id)} title={hint}
              className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap gc-focus"
              style={{ background: ativa ? "var(--accent)" : "var(--surface)", color: ativa ? "#fff" : "var(--ink-soft)", border: ativa ? "none" : "1px solid var(--line-strong)" }}>
              {label}
              <span style={{ color: ativa ? "rgba(255,255,255,0.82)" : "var(--slate)" }}>{qtd}</span>
            </button>
          );
        })}
      </div>

      {/* GUIA 1 de 3 — Recebimentos. As guias de tipo (Mensalidades / Implantação /
          Avulsos) continuam dentro dela, então a separação por cobrança não se perdeu. */}
      {sec === "recebimentos" && (
      <SectionCard
        title={`Recebimentos de ${monthLabelUi(mes)} · ${rotuloAba(aba)}`}
        action={
          <div className="flex items-center gap-2 flex-wrap justify-end">
            <Button size="sm" variant="secondary" icon={RefreshCw} onClick={gerarMensalidades} disabled={gerando} title="Lança a mensalidade pendente de cada cliente ativo que ainda não tem parcela neste mês">
              {gerando ? "Gerando…" : `Gerar mensalidades`}
            </Button>
            <Button size="sm" icon={Plus} onClick={alternarFormRecebimento}>Novo recebimento</Button>
          </div>
        }
      >
        {/* Primeira linha = o tipo da cobrança (a guia), segunda = a situação
            dentro daquela guia. Foi assim que parou de misturar mensalidade do
            mês com implantação de projeto na mesma lista. */}
        <div className="px-5 pt-3 pb-2 flex items-center gap-1.5 flex-wrap">
          {ABAS_RECEBIMENTO.map(([id, label]) => {
            const itensDaAba = noFiltro.filter(p => abaDoTipo(p.kind) === id);
            const qtd = itensDaAba.length;
            const subtotal = somaLista(itensDaAba, p => p.amount);
            const ativa = aba === id;
            return (
              <button key={id} onClick={() => trocarAba(id)} title={`Lançamentos do tipo ${label}`}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap gc-focus"
                style={{ background: ativa ? "var(--accent)" : "var(--surface)", color: ativa ? "#fff" : "var(--ink-soft)", border: ativa ? "none" : "1px solid var(--line-strong)" }}>
                {label}
                <span style={{ color: ativa ? "rgba(255,255,255,0.82)" : "var(--slate)" }}>{qtd}</span>
                <span className="gc-mono" style={{ color: ativa ? "rgba(255,255,255,0.9)" : "var(--accent-ink)" }}>{fmtMoney(subtotal)}</span>
              </button>
            );
          })}
        </div>
        <div className="px-5 py-3 flex items-center gap-2 overflow-x-auto gc-scroll" style={{ borderBottom: "1px solid var(--line)" }}>
          {FILTROS_UI.map(([id, label]) => (
            <FilterChip key={id} label={`${label} (${naAba.filter(COFRE[id]).length})`} active={filtro === id} onClick={() => setFiltro(id)} />
          ))}
        </div>

        {/* A faixa de soma da guia, logo abaixo dos filtros, porque é ela que diz
            quanto daquele tipo de cobrança existe — e muda junto com a guia. */}
        {naAba.length > 0 && (
          <div className="px-5 py-2.5 flex items-center gap-3 flex-wrap text-xs gc-fade-in"
            style={{ borderBottom: "1px solid var(--line)", background: "var(--surface-sunken)", color: "var(--ink-soft)" }}>
            <span className="font-medium" style={{ color: "var(--ink)" }}>{`Somas de ${rotuloAba(aba)}`}</span>
            <ItemSomaGuia label={`Recebido em ${monthLabelUi(mes)}`} valor={somaGuia.recebido} qtd={somaGuia.pagas} cor="var(--success)" />
            <ItemSomaGuia label="A receber" valor={somaGuia.aReceber} qtd={somaGuia.emAberto} />
            <ItemSomaGuia label="Atrasado" valor={somaGuia.atrasado} qtd={somaGuia.atrasadas} cor={somaGuia.atrasadas ? "var(--danger)" : undefined} />
          </div>
        )}

        {showReceb && (
          <div className="px-5 py-4 space-y-3 gc-fade-in" style={{ borderBottom: "1px solid var(--line)", background: "var(--surface-sunken)" }}>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              <Field label="Cliente ou venda" required>
                <Select value={receb.alvo} onChange={(e) => setReceb(f => ({ ...f, alvo: e.target.value }))}>
                  <option value="" disabled>Escolher…</option>
                  <optgroup label="Clientes">
                    {clientes.map(c => <option key={c.id} value={`client:${c.id}`}>{c.company}</option>)}
                  </optgroup>
                  <optgroup label="Vendas avulsas">
                    {avulsas.filter(s => s.status !== "Cancelada").map(s => <option key={s.id} value={`sale:${s.id}`}>{s.company}{s.description ? ` — ${s.description}` : ""}</option>)}
                  </optgroup>
                </Select>
              </Field>
              <Field label="Valor (R$)" required>
                <TextInput type="number" min="0" step="1" value={receb.amount} onChange={(e) => setReceb(f => ({ ...f, amount: e.target.value }))} placeholder="Ex.: 497" />
              </Field>
              <Field label="Tipo">
                <Select value={receb.kind} onChange={(e) => setReceb(f => ({ ...f, kind: e.target.value }))}>
                  {FINANCE_KINDS_UI.map(k => <option key={k} value={k}>{k}</option>)}
                </Select>
              </Field>
              <Field label="Vence em">
                <TextInput type="date" value={receb.dueDate} onChange={(e) => setReceb(f => ({ ...f, dueDate: e.target.value }))} />
              </Field>
              <Field label="Método" hint="Dá para ajustar depois, na própria linha.">
                <Select value={receb.method} onChange={(e) => setReceb(f => ({ ...f, method: e.target.value }))}>
                  <option value="" disabled>Escolher…</option>
                  {FINANCE_METHODS_UI.map(m => <option key={m} value={m}>{m}</option>)}
                </Select>
              </Field>
              <Field label="Situação" hint={receb.kind === "Mensalidade" ? `Parcela de ${monthLabelUi(mes)} — o mesmo cliente não repete o mês.` : "Se o dinheiro já caiu, lance como pago."}>
                <div className="flex gap-2">
                  <FilterChip label="A receber" active={!receb.pago} onClick={() => setReceb(f => ({ ...f, pago: false }))} />
                  <FilterChip label="Já recebido" active={receb.pago} onClick={() => setReceb(f => ({ ...f, pago: true }))} />
                </div>
              </Field>
            </div>
            <Field label="Descrição"><TextInput value={receb.description} onChange={(e) => setReceb(f => ({ ...f, description: e.target.value }))} placeholder="Ex.: Mensalidade de Outubro" /></Field>
            <Field label="Observação"><TextArea value={receb.notes} onChange={(e) => setReceb(f => ({ ...f, notes: e.target.value }))} placeholder="Ex.: boleto emitido no dia 5" /></Field>

            {/* A implantação do mês já existe: o aviso aparece antes de ele salvar,
                diz o valor e a situação da linha que está no caminho, e abre ela.
                "Cancelar implantação" é o caminho que ele escolheu para corrigir. */}
            {duplicadoReceb && (
              <div className="rounded-lg px-3 py-2.5 flex items-start gap-2 text-xs"
                style={{ background: "rgba(217,119,6,0.10)", color: "#8A5A12", border: "1px solid rgba(217,119,6,0.28)" }}>
                <AlertTriangle size={14} style={{ marginTop: 2, flexShrink: 0 }} />
                <div className="space-y-2">
                  <div className="font-medium">
                    {`A implantação de ${monthLabelUi(mesDoNovoLancamento)} já foi lançada: ${fmtMoney(duplicadoReceb.amount)} em ${duplicadoReceb.company || "este cliente"} — ` +
                      `${duplicadoReceb.status === "Pago" ? "recebida" : "a receber"}${dayKeyOf(duplicadoReceb.dueDate) ? `, vencendo em ${fmtDateFull(dayKeyOf(duplicadoReceb.dueDate))}` : ""}.`}
                  </div>
                  <div>Implantação não se cobra duas vezes no mesmo mês. Se o valor ou a data estão errados, cancele este lançamento e lance o certo.</div>
                  <div>
                    <Button size="sm" variant="secondary" icon={ArrowRight} onClick={() => mostrarLancamento(duplicadoReceb)}>Ver a linha para cancelar</Button>
                  </div>
                </div>
              </div>
            )}
            <div className="flex items-center justify-end gap-2">
              <Button size="sm" variant="ghost" icon={X} onClick={() => setShowReceb(false)}>Fechar</Button>
              <Button size="sm" icon={Plus} onClick={salvarRecebimento} disabled={!!duplicadoReceb}
                title={duplicadoReceb ? "Cancele a implantação já lançada neste mês para poder lançar outra." : undefined}>Lançar recebimento</Button>
            </div>
          </div>
        )}

        {lista.length === 0 ? (
          <EmptyState icon={Banknote} title="Nenhum recebimento nesta guia" hint={HINT_ABA_RECEBIMENTO[aba]} />
        ) : lista.map(p => (
          <RecebimentoRow key={p.id} p={p} hoje={hoje} onPatch={patchPagamento} onEdit={editarPagamento} onAbrirFicha={abrirFichaDoCliente}
            onPedir={pedirAcao} pedido={pedindo && pedindo.id === p.id ? pedindo : null}
            senha={senha} onSenha={setSenha} onConfirmar={confirmarPedido} onVoltar={voltarPedido}
            ocupado={enviando && !!pedindo && pedindo.id === p.id}
            foco={focoLancamento === p.id} />
        ))}
      </SectionCard>
      )}

      {/* GUIA 2 de 3 — Vendas: os clientes fechados (lidos da ficha, sem copiar
          valor para tabela nenhuma) mais as avulsas lançadas aqui. */}
      {sec === "vendas" && (
      <SectionCard
        title={`Vendas (${vendasDoPeriodo.length})`}
        action={<Button size="sm" icon={Plus} onClick={() => setShowVenda(v => !v)}>Lançar venda avulsa</Button>}
      >
        {/* Fila de período da própria guia. O padrão é o mês do topo; os outros
            chips ampliam a janela a partir DO mês escolhido, então voltar para
            Setembro/2026 e clicar "Este ano" mostra o ano de 2026, não o atual. */}
        <div className="px-5 py-3 flex items-center gap-2 flex-wrap" style={{ borderBottom: "1px solid var(--line)" }}>
          <span className="text-xs font-medium whitespace-nowrap" style={{ color: "var(--ink)" }}>Período:</span>
          {JANELAS_VENDAS_UI.map(([id, label]) => {
            const qtd = linhasDaJanela(id).length;
            return (
              <FilterChip key={id} label={`${label} (${qtd})`} active={filtroVendas === id}
                title={`Mostra ${qtd} ${qtd === 1 ? "venda" : "vendas"} neste período. A última janela escolhida fica salva para a próxima vez que abrir o Financeiro.`}
                onClick={() => { setFiltroVendas(id); salvarFiltroVendasEscolhido(id); }} />
            );
          })}
          <span className="text-xs whitespace-nowrap" style={{ color: "var(--slate)" }}>
            {vendasDoPeriodo.length} de {vendas.length} vendas · {rotuloPeriodoVendas}
          </span>
        </div>

        {showVenda && (
          <div className="px-5 py-4 space-y-3 gc-fade-in" style={{ borderBottom: "1px solid var(--line)", background: "var(--surface-sunken)" }}>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              <Field label="Quem comprou" required>
                <Select value={venda.company} onChange={(e) => setVenda(f => ({ ...f, company: e.target.value }))}>
                  <option value="">{clientesAtivos.length ? "Selecione um cliente ativo" : "Nenhum cliente ativo cadastrado"}</option>
                  {clientesAtivos.map(c => (
                    <option key={c.id} value={c.company}>{c.company}</option>
                  ))}
                </Select>
              </Field>
              <Field label="Valor (R$)" required>
                <TextInput type="number" min="0" step="1" value={venda.value} onChange={(e) => setVenda(f => ({ ...f, value: e.target.value }))} placeholder="Ex.: 1200" />
              </Field>
              <Field label="Tipo">
                <Select value={venda.kind} onChange={(e) => setVenda(f => ({ ...f, kind: e.target.value }))}>
                  {FINANCE_KINDS_UI.map(k => <option key={k} value={k}>{k}</option>)}
                </Select>
              </Field>
              <Field label="Data da venda">
                <TextInput type="date" value={venda.saleDate} onChange={(e) => setVenda(f => ({ ...f, saleDate: e.target.value }))} />
              </Field>
              <Field label="Responsável" hint="Só quem tem cadastro no CRM entra na comissão.">
                <Select value={venda.owner} onChange={(e) => setVenda(f => ({ ...f, owner: e.target.value }))}>
                  {USERS.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                </Select>
              </Field>
            </div>
            <Field label="Descrição"><TextInput value={venda.description} onChange={(e) => setVenda(f => ({ ...f, description: e.target.value }))} placeholder="Ex.: Cartão de visitas digital" /></Field>
            <Field label="Observação"><TextArea value={venda.notes} onChange={(e) => setVenda(f => ({ ...f, notes: e.target.value }))} /></Field>
            <div className="flex items-center justify-end gap-2">
              <Button size="sm" variant="ghost" icon={X} onClick={() => setShowVenda(false)}>Fechar</Button>
              <Button size="sm" icon={Plus} onClick={salvarVenda}>Lançar venda</Button>
            </div>
          </div>
        )}

        {vendasDoPeriodo.length === 0 ? (
          <EmptyState icon={UserCheck} title={`Nenhuma venda em ${rotuloPeriodoVendas}`}
            hint={filtroVendas === "mes"
              ? "Troque o período na fila acima, ou use as setas do mês no topo para ver outro mês. Fechar um lead e convertê-lo em cliente também cria a venda aqui."
              : "Feche um lead e converta em cliente, ou lance uma venda avulsa aqui."} />
        ) : vendasDoPeriodo.map(({ sale: s, fechadaNoPeriodo, recebimentosNoPeriodo }) => {
          const cancelada = s.status === "Cancelada";
          const lancados = s.origem === "Avulsa" ? recebimentosDaAvulsa(s.id) : [];
          const tudoPago = lancados.length > 0 && lancados.every(p => p.status === "Pago");
          const totalLancado = somaLista(lancados, p => Number(p.amount) || 0);
          /* Bloqueia nova cobrança de Implementação quando qualquer recebimento
             de implementação desta venda já foi pago, mesmo se for de outro mês. */
          const recebimentosDaVenda = recebimentos.filter(p => (
            s.origem === "Cliente" ? p.clientId && p.clientId === s.clientId : p.saleId === s.id
          ));
          const implantacoesPagas = recebimentosDaVenda.filter(p => (
            p.kind === "Implementação" && p.status === "Pago"
          ));
          const temImplementacaoPaga = s.kind === "Implementação" && implantacoesPagas.length > 0;
          const mesRec = recebimentosNoPeriodo.length ? mesDoLancamento(recebimentosNoPeriodo[0]) : "";
          const totalNoPeriodo = somaLista(recebimentosNoPeriodo, p => Number(p.amount) || 0);
          /* O botão "Receber" de um cliente sem mensalidade lança implantação com
             vencimento em hoje — então é neste mês que a duplicata barra. */
          const implantacao = !cancelada && s.origem === "Cliente" && !s.monthlyValue
            ? implantacaoDoMes("client", s.clientId, monthKeyOf(hoje))
            : null;
          const implantacaoPaga = !!implantacao && implantacao.status === "Pago";
          const pedidoDaLinha = implantacao && pedindo && pedindo.id === implantacao.id ? pedindo : null;
          return (
            <React.Fragment key={s.id}>
            <div className="px-5 py-3 flex items-start gap-3 flex-wrap" style={{ borderBottom: "1px solid var(--line)" }}>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-sm font-medium truncate">{s.company}</span>
                  <Pill tone={s.origem === "Cliente" ? "blue" : "violet"}>{s.origem}</Pill>
                  {s.kind && <Pill tone="slate">{s.kind}</Pill>}
                  {cancelada && <Pill tone="slate" dot>Cancelada</Pill>}
                  {/* A venda é de outro mês, mas tem dinheiro dela neste período:
                      ela aparece marcada, e não escondida, para ele entender por
                      que ela está na tela. */}
                  {!fechadaNoPeriodo && recebimentosNoPeriodo.length > 0 && (
                    <Pill tone="teal" dot title={`Venda fechada em ${fmtDateFull(s.saleDate)}, fora de ${rotuloPeriodoVendas}. Está aqui porque tem ${recebimentosNoPeriodo.length} recebimento${recebimentosNoPeriodo.length > 1 ? "s" : ""} de ${fmtMoney(totalNoPeriodo)} em ${monthLabelUi(mesRec)}.`}>
                      {`Recebimento em ${monthLabelUi(mesRec)}`}
                    </Pill>
                  )}
                  {implantacao && (
                    <Pill tone={implantacaoPaga ? "green" : "amber"} dot
                      title={`A implantação de ${monthLabelUi(monthKeyOf(hoje))} já está lançada: ${fmtMoney(implantacao.amount)}, ${implantacaoPaga ? "recebida" : "a receber"}${dayKeyOf(implantacao.dueDate) ? `, vencendo em ${fmtDateFull(dayKeyOf(implantacao.dueDate))}` : ""}. Cancele essa linha para poder cobrar de novo.`}>
                      {implantacaoPaga ? "Já recebida" : `Implantação de ${monthLabelUi(monthKeyOf(hoje))} lançada`}
                    </Pill>
                  )}
                </div>
                <div className="text-xs mt-1" style={{ color: "var(--slate)" }}>
                  {s.description || "Sem descrição"} · {fmtDateFull(s.saleDate)} · {s.owner ? userName(s.owner) : "Sem responsável"}
                  {s.monthlyValue ? ` · ${fmtMoney(s.monthlyValue)}/mês` : ""}
                </div>
              </div>
              <span className="gc-mono text-sm font-medium" style={{ color: cancelada ? "var(--slate)" : "var(--ink)" }}>{fmtMoney(s.value)}</span>
              <div className="flex items-center gap-2">
                {s.origem === "Cliente" && s.clientId && (
                  <Button size="sm" variant="ghost" icon={Building2} onClick={() => abrirFichaDoCliente(s.clientId)}>Ver ficha</Button>
                )}
                {!cancelada && lancados.length > 0 && (
                  <Pill tone={tudoPago ? "green" : "amber"} dot title={`${lancados.length} recebimento${lancados.length > 1 ? "s" : ""} de ${fmtMoney(totalLancado)} já lançado${lancados.length > 1 ? "s" : ""} desta venda. Para cobrar de novo, use "Novo recebimento" na guia Recebimentos.`}>{tudoPago ? "Já recebida" : "A receber"}</Pill>
                )}
                {!cancelada && temImplementacaoPaga && lancados.length === 0 && !implantacao && (
                  <Pill tone="green" dot title="Esta venda de Implementação já possui um recebimento com status Pago. Não é possível cobrar novamente.">
                    Já recebida
                  </Pill>
                )}
                {/* A implantação já existe no mês: em vez de um botão que ia dar
                    erro, a linha mostra o caminho — ver o lançamento e cancelar
                    aqui mesmo. Cancelada, o "Receber" volta. */}
                {implantacao && (
                  <Button size="sm" variant="ghost" icon={ArrowRight} onClick={() => mostrarLancamento(implantacao)}>Ver lançamento</Button>
                )}
                {implantacao && implantacaoPaga && (
                  <Button size="sm" variant="ghost" icon={Ban} disabled={!!(pedindo && pedindo.id === implantacao.id)}
                    onClick={() => pedirAcao(implantacao, "cancelar")}>Cancelar implantação</Button>
                )}
                {implantacao && !implantacaoPaga && (
                  <Button size="sm" variant="ghost" icon={Ban}
                    onClick={() => patchPagamento(implantacao, { status: "Cancelado" }, "Implantação cancelada — o botão “Receber” volta para você lançar a certa.")}>Cancelar implantação</Button>
                )}
                {s.origem === "Avulsa" && !cancelada && (
                  <Button size="sm" variant="ghost" icon={Ban} onClick={() => { dispatch({ type: "UPDATE_FINANCE_SALE", id: s.id, patch: { status: "Cancelada" } }); notify("Venda cancelada — sai das somas, mas continua aqui."); }}>Cancelar</Button>
                )}
                {s.origem === "Avulsa" && cancelada && (
                  <Button size="sm" variant="ghost" icon={RotateCcw} onClick={() => { dispatch({ type: "UPDATE_FINANCE_SALE", id: s.id, patch: { status: "Ativa" } }); notify("Venda reativada."); }}>Reativar</Button>
                )}
              </div>
            </div>
            {/* Cancelar uma implantação já recebida é ato mexe em dinheiro que
                entrou: o campo de senha abre aqui, embaixo da linha, sem janela
                por cima da tela. */}
            {pedidoDaLinha && (
              <div className="px-5 pb-3" style={{ borderBottom: "1px solid var(--line)" }}>
                <CampoConfirmacaoSenha pedido={pedidoDaLinha} senha={senha} onSenha={setSenha}
                  onConfirmar={confirmarPedido} onVoltar={voltarPedido}
                  ocupado={enviando && pedindo && pedindo.id === pedidoDaLinha.id} />
              </div>
            )}
            </React.Fragment>
          );
        })}
      </SectionCard>
      )}

      {/* GUIA 3 de 3 — Comissões: uma linha por responsável, e o percentual
          editável fica aqui, porque é daqui que sai o número do mês. */}
      {sec === "comissoes" && (
      <SectionCard
        title="Comissões"
        action={
          <div className="flex items-center gap-2">
            <span className="text-xs" style={{ color: "var(--slate)" }}>% sobre o recebido</span>
            <TextInput type="number" min="0" max="100" step="0.5" value={percentDraft === "" ? percent : percentDraft} onChange={(e) => setPercentDraft(e.target.value)} style={{ width: 84, padding: "6px 8px", fontSize: 13 }} />
            <Button size="sm" variant="secondary" onClick={salvarComissao} disabled={percentDraft === ""}>Salvar</Button>
          </div>
        }
      >
        <div className="px-5 py-4 space-y-2.5">
          <p className="text-xs" style={{ color: "var(--slate)" }}>
            Comissão de {monthLabelUi(mes)}: {percent}% do que efetivamente entrou ({fmtMoney(recebidoMes)}) = <strong style={{ color: "var(--ink-soft)" }}>{fmtMoney(comissaoMes)}</strong>. Venda ainda não recebida não gera comissão.
          </p>
          {linhasComissao.length === 0 ? (
            <div className="text-sm" style={{ color: "var(--slate)" }}>Sem venda nem recebimento em {monthLabelUi(mes)}.</div>
          ) : (
            <div className="space-y-2">
              <div className="grid grid-cols-4 gap-3 text-[11px]" style={{ color: "var(--slate)" }}>
                <span>Responsável</span>
                <span className="text-right">Vendido no mês</span>
                <span className="text-right">Recebido no mês</span>
                <span className="text-right">Comissão</span>
              </div>
              {linhasComissao.map(l => (
                <div key={l.owner} className="grid grid-cols-4 gap-3 text-sm items-center">
                  <span className="truncate">{l.owner === "sem" ? "Sem responsável" : userName(l.owner)}</span>
                  <span className="text-right gc-mono">{fmtMoney(l.vendido)}</span>
                  <span className="text-right gc-mono">{fmtMoney(l.recebido)}</span>
                  <span className="text-right gc-mono font-medium" style={{ color: "var(--success)" }}>{fmtMoney(l.comissao)}</span>
                </div>
              ))}
              <div className="grid grid-cols-4 gap-3 text-sm items-center pt-2" style={{ borderTop: "1px solid var(--line)" }}>
                <span className="font-medium">Total</span>
                <span className="text-right gc-mono">{fmtMoney(vendidoMes)}</span>
                <span className="text-right gc-mono">{fmtMoney(recebidoMes)}</span>
                <span className="text-right gc-mono font-medium" style={{ color: "var(--success)" }}>{fmtMoney(comissaoMes)}</span>
              </div>
            </div>
          )}
        </div>
      </SectionCard>
      )}

      <p className="text-[11px]" style={{ color: "var(--slate)" }}>
        O Financeiro abre em <strong>uma guia por vez</strong>: <strong>Vendas</strong> (os clientes fechados e as avulsas), <strong>Recebimentos</strong> (as parcelas e cobranças) e <strong>Comissões</strong> (uma linha por responsável). Os quatro números de cima somam o mês inteiro e valem para qualquer guia — clicar neles leva direto à guia correspondente. Dentro de Recebimentos continuam as guias de tipo: <strong>Mensalidades</strong>, <strong>Implantação</strong> e <strong>Avulsos</strong>, com a faixa de soma contando <strong>só a guia aberta</strong>, então o valor da implantação não se mistura com o da mensalidade.
        No botão <strong>Receber</strong> de uma venda, a tela pula para Recebimentos já na guia do tipo certo.
        Lançamento digitado errado pode ser <strong>Excluído</strong> de vez: a linha pede a <strong>sua senha</strong>, mostra o nome e o valor, e o backend confere antes de apagar — depois não tem como recuperar.
        <strong>Desfazer</strong> um pagamento (e “Cancelar” de um que já entrou) também pede a senha, pelo mesmo motivo: tira dinheiro do mês.
        Ajustar vencimento, método e marcar como pago continuam sem senha. Se preferir guardar o erro para conferir, use “Cancelar”: a linha continua em “Canceladas”. Venda avulsa errada não é excluída, vira “Cancelada”.
      </p>
    </div>
  );
}

/* =========================================================================
   DESEMPENHO COMERCIAL — prévia explicativa + resultado por empresa
   As datas de cada etapa vêm do histórico de status e das interações, não
   apenas do status atual: um lead que voltou para "Contato pendente" continua
   aparecendo como contatado, porque o contato ficou registrado. Quando não há
   registro de histórico, usamos a última data de contato do lead como
   aproximada e avisamos isso no rodapé — número aproximado nunca é
   apresentado como exato.

   As listas abaixo mantêm "Contatado" e "Respondeu" de propósito: eles foram
   retirados do funil em 12/10/2026, mas seguem aparecendo no histórico já
   gravado. Se saíssem daqui, leads contatados antes dessa data deixariam de
   contar na escada do relatório.
   ========================================================================= */

const PERF_STEPS = [
  {
    key: "contato",
    label: "Contato feito",
    statuses: ["Contatado", "Respondeu", "Demo enviada", "Demo em análise", "Contato pendente", "Proposta enviada", "Negociação", "Fechado"],
    tone: "blue",
    icon: Phone,
  },
  {
    key: "resposta",
    label: "Respondeu",
    statuses: ["Respondeu", "Demo enviada", "Demo em análise", "Contato pendente", "Proposta enviada", "Negociação", "Fechado"],
    tone: "teal",
    icon: MessageCircle,
  },
  {
    key: "demo",
    label: "Demo enviada",
    statuses: ["Demo enviada", "Demo em análise"],
    tone: "violet",
    icon: Eye,
  },
  {
    key: "proposta",
    label: "Proposta enviada",
    statuses: ["Proposta enviada", "Negociação", "Fechado"],
    tone: "amber",
    icon: FileText,
  },
  {
    key: "fechado",
    label: "Venda fechada",
    statuses: ["Fechado"],
    tone: "green",
    icon: CheckCircle2,
  },
];

const PERF_RESULT_LABELS = ["Respondeu", "Atendeu", "Pediu preço", "Pediu proposta", "Demonstrou interesse", "Demo enviada"];

const PERF_PERIODS = [
  { days: 7, label: "7 dias", phrase: "nos últimos 7 dias" },
  { days: 30, label: "30 dias", phrase: "nos últimos 30 dias" },
  { days: 90, label: "90 dias", phrase: "nos últimos 90 dias" },
  { days: 0, label: "Tudo", phrase: "em todo o histórico" },
];

const PERF_FILTERS = [
  { key: "todos", label: "Todas as empresas" },
  { key: "sem_contato", label: "Ainda sem contato" },
  { key: "sem_resposta", label: "Contatadas sem resposta" },
  { key: "com_resposta", label: "Que responderam" },
  { key: "demo", label: "Receberam demo" },
  { key: "proposta", label: "Receberam proposta" },
  { key: "fechadas", label: "Fechadas" },
  { key: "perdidas", label: "Perdidas" },
  { key: "paradas", label: "Paradas há +7 dias" },
];

const PERF_SORTS = [
  { key: "recentes", label: "Mais movimentadas recentemente" },
  { key: "paradas", label: "Mais tempo sem movimentar" },
  { key: "avanco", label: "Etapa mais avançada" },
  { key: "nome", label: "Nome da empresa (A-Z)" },
];

function perfDate(value) {
  if (!value) return null;
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? null : parsed;
}
function perfEarliest(dates) {
  let best = null;
  for (const date of dates) {
    if (!date) continue;
    if (!best || date < best) best = date;
  }
  return best;
}
function perfLatest(dates) {
  let best = null;
  for (const date of dates) {
    if (!date) continue;
    if (!best || date > best) best = date;
  }
  return best;
}
function perfTime(date) { return date ? date.getTime() : 0; }
function perfPct(part, whole) { return whole > 0 ? Math.round((part / whole) * 100) : null; }
function perfCount(n, singular, plural) { return `${n} ${n === 1 ? singular : plural}`; }
function capFirst(text) { return text ? text.charAt(0).toUpperCase() + text.slice(1) : text; }
function perfGroupByLead(rows) {
  const map = new Map();
  for (const row of rows || []) {
    if (!row || !row.leadId) continue;
    const list = map.get(row.leadId);
    if (list) list.push(row);
    else map.set(row.leadId, [row]);
  }
  return map;
}
function perfReached(o, key) { return Boolean(o.steps[key]); }
function perfRank(o) {
  let rank = -1;
  for (const step of PERF_STEPS) if (perfReached(o, step.key)) rank += 1;
  return rank;
}

function perfOutcome(lead, indexes) {
  const history = indexes.history.get(lead.id) || [];
  const interactions = indexes.interactions.get(lead.id) || [];
  const demos = indexes.demos.get(lead.id) || [];
  const proposals = indexes.proposals.get(lead.id) || [];

  const created = perfDate(lead.createdAt);
  const fallback = perfDate(lead.lastContactAt) || created;

  const steps = {};
  let estimated = false;

  for (const step of PERF_STEPS) {
    const fromHistory = perfEarliest(history.filter(h => step.statuses.includes(h.to)).map(h => perfDate(h.date)));
    const evidence = [];
    if (step.key === "contato") evidence.push(...interactions.map(i => perfDate(i.date)));
    if (step.key === "resposta") evidence.push(...interactions.filter(i => PERF_RESULT_LABELS.includes(i.result)).map(i => perfDate(i.date)));
    if (step.key === "demo") evidence.push(...demos.map(d => perfDate(d.sentAt) || perfDate(d.createdAt)));
    if (step.key === "proposta") evidence.push(...proposals.map(p => perfDate(p.proposalDate) || perfDate(p.createdAt)));
    const fromEvidence = perfEarliest(evidence);

    let date = fromHistory || fromEvidence || null;
    if (!date && step.statuses.includes(lead.status)) date = fallback || null;
    if (!date) { steps[step.key] = null; continue; }
    if (!fromHistory && !fromEvidence) estimated = true;
    steps[step.key] = date;
  }

  const reached = PERF_STEPS.filter(step => steps[step.key]);
  const furthest = reached.length ? reached[reached.length - 1] : null;

  const lostHistory = perfEarliest(history.filter(h => h.to === "Perdido").map(h => perfDate(h.date)));
  const lostAt = lostHistory || (lead.status === "Perdido" ? fallback : null);

  const lastActivity = perfLatest([
    created,
    perfDate(lead.lastContactAt),
    ...history.map(h => perfDate(h.date)),
    ...interactions.map(i => perfDate(i.date)),
    ...demos.map(d => perfDate(d.sentAt) || perfDate(d.createdAt)),
    ...proposals.map(p => perfDate(p.proposalDate) || perfDate(p.createdAt)),
  ]);

  const done = lead.status === "Fechado" || lead.status === "Perdido";
  const replyGapDays = steps.contato && steps.resposta ? daysDiff(steps.resposta, steps.contato) : null;
  const proposalValue = proposals.reduce((sum, p) => sum + (Number(p.implementationValue) || 0), 0);

  return {
    id: lead.id,
    company: lead.company || "Sem nome",
    city: lead.city || "",
    segment: lead.segment || "",
    owner: lead.owner,
    status: lead.status,
    temperature: lead.temperature,
    steps,
    furthest: furthest ? furthest.key : null,
    furthestLabel: furthest ? furthest.label : "Sem contato",
    furthestTone: furthest ? furthest.tone : "slate",
    lostAt: lostAt || null,
    /* Fechado/Perdido é o que o lead É hoje — igual ao resto do CRM. Se ele
       passou por "Fechado" e voltou para negociação, a venda não conta como
       fechada, mas a etapa alcançada continua visível na linha. */
    won: lead.status === "Fechado",
    lost: lead.status === "Perdido",
    startAt: perfEarliest([created, ...reached.map(step => steps[step.key])]),
    lastActivity,
    daysIdle: lastActivity ? Math.max(0, daysSince(lastActivity)) : null,
    idle: !done && steps.contato && !steps.resposta && (lastActivity ? daysSince(lastActivity) >= 7 : true),
    replyGapDays,
    proposalValue,
    estimated,
  };
}

function buildPerfOutcomes(db) {
  const indexes = {
    history: perfGroupByLead(db.statusHistory),
    interactions: perfGroupByLead(db.interactions),
    demos: perfGroupByLead(db.demos),
    proposals: perfGroupByLead(db.proposals),
  };
  return (db.leads || []).map(lead => perfOutcome(lead, indexes));
}

function perfInPeriod(outcomes, periodDays) {
  if (!periodDays) return outcomes.slice();
  const limit = new Date(Date.now() - periodDays * 86400000);
  return outcomes.filter(o => o.startAt && o.startAt >= limit);
}

function perfStats(outcomes, periodDays) {
  const scoped = perfInPeriod(outcomes, periodDays);
  const has = (o, key) => perfReached(o, key);
  const contacted = scoped.filter(o => has(o, "contato"));
  const replied = scoped.filter(o => has(o, "resposta"));
  const demoed = scoped.filter(o => has(o, "demo"));
  const proposed = scoped.filter(o => has(o, "proposta"));
  const won = scoped.filter(o => o.won);
  const lost = scoped.filter(o => o.lost);
  const stuck = contacted.filter(o => o.idle);

  const gaps = replied.map(o => o.replyGapDays).filter(g => g !== null && g >= 0).sort((a, b) => a - b);
  let medianReply = null;
  if (gaps.length) {
    medianReply = gaps.length % 2 ? gaps[(gaps.length - 1) / 2] : Math.round((gaps[gaps.length / 2 - 1] + gaps[gaps.length / 2]) / 2);
  }

  const proposedValue = scoped.reduce((sum, o) => sum + o.proposalValue, 0);
  const wonValue = won.reduce((sum, o) => sum + o.proposalValue, 0);

  const values = [scoped.length, contacted.length, replied.length, demoed.length, proposed.length, won.length];
  const ladder = [{ key: "base", label: "Empresas no período", value: scoped.length, tone: "slate", icon: Users, prev: null }]
    .concat(PERF_STEPS.map((step, i) => ({
      key: step.key,
      label: step.label,
      value: values[i + 1],
      tone: step.tone,
      icon: step.icon,
      prev: values[i],
    })));

  let weakest = null;
  for (const row of ladder.slice(1)) {
    /* Menos de 3 empresas na etapa anterior não forma taxa confiável — melhor
       não apontar gargalo com amostra minúscula. */
    if (!row.prev || row.prev < 3) continue;
    const ratio = row.value / row.prev;
    if (!weakest || ratio < weakest.ratio) weakest = { ...row, ratio };
  }

  return {
    periodDays,
    total: scoped.length,
    contacted: contacted.length,
    neverContacted: scoped.length - contacted.length,
    replied: replied.length,
    demoed: demoed.length,
    proposed: proposed.length,
    won: won.length,
    lost: lost.length,
    stuck: stuck.length,
    estimated: scoped.filter(o => o.estimated).length,
    rateReply: perfPct(replied.length, contacted.length),
    rateDemo: perfPct(demoed.length, replied.length),
    rateProposta: perfPct(proposed.length, demoed.length),
    rateFechado: perfPct(won.length, proposed.length),
    rateWon: perfPct(won.length, scoped.length),
    medianReply,
    proposedValue,
    wonValue,
    ladder,
    weakest,
  };
}

/* Texto que explica o número antes dele: o que aconteceu, o que ainda falta
   e onde o processo está travando. Cada linha é uma frase curta. */
function perfNarrative(stats, baseline, period) {
  const lines = [];

  if (!stats.total) {
    lines.push(`${capFirst(period.phrase)} não entrou nenhuma empresa no funil, então ainda não há desempenho para comparar.`);
    return lines;
  }

  lines.push(
    `${capFirst(period.phrase)} o funil teve ${perfCount(stats.total, "empresa", "empresas")}. ` +
    `O primeiro contato foi feito com ${stats.contacted} delas` +
    (stats.neverContacted ? `, e ${perfCount(stats.neverContacted, "empresa ficou", "empresas ficaram")} aguardando uma mensagem` : "") +
    "."
  );

  if (stats.contacted) {
    const oneIn = stats.rateReply ? ` ou seja, 1 a cada ${Math.max(2, Math.round(100 / stats.rateReply))}` : "";
    lines.push(
      `Responderam ${stats.replied} — ${stats.rateReply === null ? "ainda sem taxa calculável" : `${stats.rateReply}% dos contatos,${oneIn}`}. ` +
      `Demos enviadas: ${stats.demoed}. Propostas enviadas: ${stats.proposed}` +
      (stats.proposedValue ? ` (${fmtMoney(stats.proposedValue)} em projetos)` : "") +
      "."
    );
  } else {
    lines.push(`Ainda não houve contato registrado nesse período, então resposta, demo e proposta ficam em zero.`);
  }

  lines.push(
    stats.won
      ? `Fechamento: ${perfCount(stats.won, "venda fechada", "vendas fechadas")}` +
        (stats.wonValue ? `, ${fmtMoney(stats.wonValue)} contratados` : "") +
        ` — ${stats.rateWon}% das empresas do período.`
      : "Ainda não há venda fechada nesse período; o resultado disponível é o avanço de etapa."
  );

  if (stats.lost) {
    lines.push(`Saíram perdidas ${perfCount(stats.lost, "empresa", "empresas")} (${perfPct(stats.lost, stats.total)}% do período).`);
  }

  if (stats.stuck) {
    lines.push(
      `${stats.stuck} ${stats.stuck === 1 ? "empresa foi contatada e está sem responder" : "empresas foram contatadas e estão sem responder"} há mais de uma semana — ${stats.stuck === 1 ? "é" : "são"} o ${stats.stuck === 1 ? "primeiro alvo" : "lote"} da próxima cobrança.`
    );
  }

  if (stats.medianReply !== null) {
    lines.push(`A metade das empresas que respondeu o fez em até ${perfCount(stats.medianReply, "dia", "dias")} depois do primeiro contato.`);
  }

  if (stats.weakest) {
    lines.push(`O gargalo mais forte agora é ${stats.weakest.label}: apenas ${stats.weakest.value} de ${stats.weakest.prev} avançaram (${Math.round(stats.weakest.ratio * 100)}%).`);
  }

  if (baseline && baseline.rateReply !== null && stats.rateReply !== null) {
    const diff = stats.rateReply - baseline.rateReply;
    const verdict = Math.abs(diff) < 3 ? "praticamente igual ao" : diff > 0 ? `${diff} pontos acima do` : `${Math.abs(diff)} pontos abaixo do`;
    lines.push(`Frente a todo o histórico (${baseline.rateReply}% de resposta), este período está ${verdict} desempenho geral.`);
  }

  return lines;
}

const perfFootnote = (stats) =>
  `Prévia: cada linha é uma empresa, não uma conversa. As datas vêm do histórico de status e das interações` +
  (stats.estimated ? `; ${perfCount(stats.estimated, "empresa usa", "empresas usam")} data aproximada porque o status mudou sem registro de histórico.` : " — nenhuma data precisou ser aproximada.");

function PerfLadder({ stats }) {
  const max = Math.max(1, ...stats.ladder.map(row => row.value));
  return (
    <SectionCard title="Escada de conversão">
      <div className="px-5 py-4 space-y-3">
        {stats.ladder.map((row) => {
          const rate = row.prev ? perfPct(row.value, row.prev) : null;
          return (
            <div key={row.key} className="flex items-center gap-3">
              <span className="flex items-center gap-1.5 text-sm w-40 shrink-0" style={{ color: "var(--ink-soft)" }}>
                {React.createElement(row.icon, { size: 13, style: { color: `var(--tone-${row.tone}-fg)` } })}
                <span className="truncate">{row.label}</span>
              </span>
              <div className="flex-1"><Bar value={row.value} max={max} tone={`tone-${row.tone}-fg`} /></div>
              <span className="gc-mono text-sm w-8 text-right shrink-0">{row.value}</span>
              <span className="gc-mono text-xs w-14 text-right shrink-0" style={{ color: "var(--slate)" }}>
                {row.key === "base" ? "base" : row.prev ? `${rate}%` : "sem base"}
              </span>
            </div>
          );
        })}
      </div>
      <div className="px-5 pb-4 pt-1 text-xs leading-relaxed" style={{ color: "var(--slate)" }}>
        Cada barra é uma etapa alcançada, e a porcentagem à direita é a conversão sobre a etapa de cima. Uma empresa perdida continua aparecendo na etapa em que parou.
      </div>
    </SectionCard>
  );
}

function perfMatches(outcome, filter) {
  if (filter === "sem_contato") return !perfReached(outcome, "contato") && !outcome.lost;
  if (filter === "sem_resposta") return perfReached(outcome, "contato") && !perfReached(outcome, "resposta") && !outcome.lost && !outcome.won;
  if (filter === "com_resposta") return perfReached(outcome, "resposta");
  if (filter === "demo") return perfReached(outcome, "demo");
  if (filter === "proposta") return perfReached(outcome, "proposta");
  if (filter === "fechadas") return outcome.won;
  if (filter === "perdidas") return outcome.lost;
  if (filter === "paradas") return outcome.idle;
  return true;
}

function perfSorter(sort) {
  if (sort === "paradas") return (a, b) => perfTime(b.lastActivity) - perfTime(a.lastActivity);
  if (sort === "avanco") return (a, b) => perfRank(b) - perfRank(a) || perfTime(b.lastActivity) - perfTime(a.lastActivity);
  if (sort === "nome") return (a, b) => String(a.company).localeCompare(String(b.company), "pt-BR");
  return (a, b) => perfTime(b.lastActivity) - perfTime(a.lastActivity) || perfRank(b) - perfRank(a);
}

const PERF_COLUMNS = "minmax(0,1.5fr) 1fr 0.55fr 0.7fr 0.5fr 0.7fr";

          </div>

            return (
              <div key={o.id} className="grid gap-2 px-5 py-2.5 text-sm items-center min-w-[720px]" style={{ ...gridCols({ borderTop: "1px solid var(--line)" }) }}>
                <div className="min-w-0">
                  <button onClick={() => onOpenLead(o.id)} className="block w-full text-left truncate font-medium gc-focus rounded hover:underline">
                    {o.company}
                  </button>
                  <span className="block text-[11px] truncate" style={{ color: "var(--slate)" }}>{[o.city, o.segment].filter(Boolean).join(" · ") || "—"}</span>
                </div>

function ReportsView({ db, sel, onOpenLead }) {
  const [periodDays, setPeriodDays] = useState(30);
