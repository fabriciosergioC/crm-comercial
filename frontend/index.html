function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [db, rawDispatch] = useReducer(dbReducer, initialDb);
  const [apiStatus, setApiStatus] = useState("checking");
  const [bootLoading, setBootLoading] = useState(true);
  const [view, setView] = useState("dashboard");
  const [search, setSearch] = useState("");
  const [leadsFilter, setLeadsFilter] = useState({});
  const [leadsViewMode, setLeadsViewMode] = useState("list");
  const [selectedLeadId, setSelectedLeadId] = useState(null);
  const [initialTab, setInitialTab] = useState("geral");
  const [showLeadForm, setShowLeadForm] = useState(false);
  const [editingLead, setEditingLead] = useState(null);
  const [deletingLeadId, setDeletingLeadId] = useState(null);
  const deleteInProgress = useRef(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(() => {
    try {
      return window.localStorage.getItem("crm_sidebar_collapsed") === "1";
    } catch (error) {
      return false;
    }
  });
  const toggleSidebar = () => setSidebarCollapsed(value => {
    const next = !value;
    try {
      window.localStorage.setItem("crm_sidebar_collapsed", next ? "1" : "0");
    } catch (error) {
      return next;
    }
    return next;
  });
  const [, forceTick] = useState(0);
  const searchInputRef = useRef(null);
  const { toasts, notify } = useToastStack();

  const handleLogout = () => {
    clearSessionUserId();
    setCurrentUser(null);
  };

  useEffect(() => {
    if (!currentUser) return undefined;

    let mounted = true;
    async function loadData() {
      setBootLoading(true);
      const health = await crmApi.health();
      if (!mounted) return;
      if (!health.ok) {
        setApiStatus("offline");
        setBootLoading(false);
        return;
      }
      setApiStatus("connected");
      try {
        const remoteDb = await crmApi.loadAll();
        if (!mounted) return;
        if (remoteDb) rawDispatch({ type: "SET_DB", db: remoteDb });
      } catch (err) {
        console.error("Falha ao carregar dados do Supabase:", err);
        if (!mounted) return;
        setApiStatus("offline");
      } finally {
        if (mounted) setBootLoading(false);
      }
    }
    loadData();
    return () => { mounted = false; };
  }, [currentUser]);

  const handleSeedDemo = async () => {
    notify("Importando dados de exemplo para o Supabase...");
    try {
      const freshDb = await crmApi.seedDemoData();
      rawDispatch({ type: "SET_DB", db: freshDb });
      notify("Dados salvos no Supabase com sucesso!");
    } catch (err) {
      notify("Erro na importação: " + err.message, "danger");
    }
  };

  const dispatch = useCallback((action) => {
    // 1. Atualização otimista imediata na interface local
    rawDispatch(action);

    // 2. Persistência assíncrona na API do backend -> Supabase
    (async () => {
      try {
        switch (action.type) {
          case "ADD_LEAD": {
            const res = await crmApi.leads.create(action.lead);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao gravar lead");
            break;
          }
          case "UPDATE_LEAD": {
            const res = await crmApi.leads.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.message || res?.error?.message || "Falha ao atualizar lead");
            break;
          }
          case "CHANGE_STATUS": {
            const res = await crmApi.leads.changeStatus(action.id, action.status, action.user);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao alterar status");
            break;
          }
          case "SET_LOSS_REASON": {
            const res = await crmApi.leads.update(action.id, { lossReason: action.reason });
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar motivo");
            break;
          }
          case "SET_NEXT_ACTION": {
            const res = await crmApi.leads.update(action.leadId, { nextAction: action.nextAction });
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar próxima ação");
            break;
          }
          case "ADD_INTERACTION": {
            const res = await crmApi.leads.addInteraction(action.leadId, action.interaction);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar contato");
            break;
          }
          case "ADD_FOLLOWUP": {
            const res = await crmApi.followups.create(action.followup);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar follow-up");
            break;
          }
          case "UPDATE_FOLLOWUP": {
            const res = await crmApi.followups.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao atualizar follow-up");
            break;
          }
          case "ADD_DEMO": {
            const res = await crmApi.demos.create(action.demo);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar demonstração");
            break;
          }
          case "UPDATE_DEMO": {
            const res = await crmApi.demos.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao atualizar demonstração");
            break;
          }
          case "ADD_PROPOSAL": {
            const res = await crmApi.proposals.create(action.proposal);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar proposta");
            break;
          }
          case "UPDATE_PROPOSAL": {
            const res = await crmApi.proposals.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao atualizar proposta");
            break;
          }
          case "CONVERT_TO_CLIENT": {
            const res = await crmApi.clients.create(action.client);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar cliente");
            break;
          }
          case "ADD_CLIENT_UPDATE": {
            const res = await crmApi.clientUpdates.create(action.update);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar alteração do cliente");
            break;
          }
          default:
            break;
        }
      } catch (err) {
        console.error("Erro de persistência no Supabase:", err);
        notify("Aviso Supabase: " + (err.message || "Erro ao persistir"), "error");
      }
    })();
  }, [notify]);

  /* Re-render periodically so demo countdowns and "atrasado" badges stay live
     without the person needing to refresh. */
  useEffect(() => {
    const id = setInterval(() => forceTick(t => t + 1), 30000);
    return () => clearInterval(id);
  }, []);

  /* Ctrl/Cmd+K jumps straight into the global search — a modern, low-click
     way to reach any lead, client or proposal from anywhere in the app. */
  useEffect(() => {
    function handleKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        searchInputRef.current?.focus();
        searchInputRef.current?.select();
      }
    }
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, []);

  const sel = useSelectors(db);

  if (!currentUser) return <LoginScreen onLogin={setCurrentUser} />;

  if (bootLoading) {
    return (
      <div className="gc-root flex items-center justify-center min-h-screen">
        <Tokens />
        <div className="flex flex-col items-center gap-3">
          <span className="gc-spinner" aria-hidden="true" />
          <p className="text-sm" style={{ color: "var(--ink-soft)" }}>Carregando dados...</p>
        </div>
      </div>
    );
  }

  const openLead = (id, tab) => { setSelectedLeadId(id); setInitialTab(tab || "geral"); };

  const handleCreateLead = (form) => {
    const id = `l_${Date.now()}`;
    const company = (form.company || "").trim();
    const contactName = (form.contactName && form.contactName.trim()) ? form.contactName.trim() : company;
    const leadData = {
      id,
      ...form,
      company,
      contactName,
      status: "Novo",
      createdAt: new Date().toISOString(),
      lastContactAt: null,
      nextAction: { date: daysFromNow(0, 17, 0), note: "Primeiro contato" },
      score: { dor: 0, facilidade: 0, pagamento: 0, recorrencia: 0 },
    };
    dispatch({
      type: "ADD_LEAD",
      lead: leadData,
    });
    setShowLeadForm(false);
    setView("leads");
    notify("Lead salvo no Supabase.");
    openLead(id);
  };

  const handleDeleteLead = async (lead) => {
    if (deleteInProgress.current) return;
    if (db.clients.some(c => c.leadId === lead.id)) {
      notify("Este lead possui um cliente vinculado e não pode ser excluído.", "error");
      return;
    }
    if (!window.confirm(`Excluir definitivamente o lead "${lead.company}"?\n\nO histórico, follow-ups, demos e propostas deste lead também serão apagados. Esta ação não pode ser desfeita.`)) return;
    deleteInProgress.current = true;
    setDeletingLeadId(lead.id);
    try {
      const res = await crmApi.leads.remove(lead.id);
      if (!res?.success) throw new Error(res?.message || "Não foi possível excluir o lead.");
      rawDispatch({ type: "DELETE_LEAD", id: lead.id });
      setSelectedLeadId(id => id === lead.id ? null : id);
      setEditingLead(current => current?.id === lead.id ? null : current);
      notify("Lead excluído definitivamente.");
    } catch (err) {
      notify(err.message || "Não foi possível excluir o lead.", "error");
    } finally {
      deleteInProgress.current = false;
      setDeletingLeadId(null);
    }
  };

  const handleEditLead = (lead) => {
    setEditingLead(lead);
  };

  const handleSaveEditedLead = (form) => {
    if (!editingLead) return;
    const company = (form.company || "").trim();
    const contactName = (form.contactName && form.contactName.trim()) ? form.contactName.trim() : company;
    const { status, lossReason, nextActionDate, nextActionNote, score, ...rest } = form;
    const patch = { ...rest, company, contactName };
    if (score) patch.score = score;
    if (status === "Perdido" && lossReason) patch.lossReason = lossReason;
    dispatch({ type: "UPDATE_LEAD", id: editingLead.id, patch });
    if (status && status !== editingLead.status) {
      dispatch({ type: "CHANGE_STATUS", id: editingLead.id, status, user: currentUser });
    }
    const dateStr = nextActionDate || "";
    const noteStr = (nextActionNote || "").trim();
    const prevDateStr = toLocalDateTimeInput(editingLead.nextAction?.date);
    const prevNoteStr = (editingLead.nextAction?.note || "").trim();
    if (dateStr !== prevDateStr || noteStr !== prevNoteStr) {
      const nextAction = (!dateStr && !noteStr) ? null : { date: dateStr ? new Date(dateStr).toISOString() : null, note: noteStr };
      dispatch({ type: "SET_NEXT_ACTION", leadId: editingLead.id, nextAction });
    }
    setEditingLead(null);
    notify("Lead atualizado com sucesso.");
  };

  const setLeadsFilterAndGo = (patch) => setLeadsFilter(f => ({ ...f, ...patch }));

  let body;
  if (view === "dashboard") {
    body = <Dashboard db={db} sel={sel} currentUser={currentUser} onOpenLead={openLead} setView={setView} setLeadsFilter={setLeadsFilterAndGo} setLeadsViewMode={setLeadsViewMode} dispatch={dispatch} notify={notify} />;
  } else if (view === "leads") {
    body = <LeadsView db={db} sel={sel} search={search} filter={leadsFilter} setFilter={setLeadsFilter} onOpenLead={openLead} onEditLead={handleEditLead} onDeleteLead={handleDeleteLead} deletingLeadId={deletingLeadId} onCreateLead={() => setShowLeadForm(true)} currentUser={currentUser} viewMode={leadsViewMode} setViewMode={setLeadsViewMode} dispatch={dispatch} notify={notify} />;
  } else if (view === "followups") {
    body = <FollowupsView sel={sel} onOpenLead={openLead} dispatch={dispatch} notify={notify} />;
  } else if (view === "demos") {
    body = <DemosView db={db} sel={sel} onOpenLead={openLead} dispatch={dispatch} notify={notify} />;
  } else if (view === "proposals") {
    body = <ProposalsView db={db} sel={sel} onOpenLead={openLead} dispatch={dispatch} notify={notify} />;
  } else if (view === "clients") {
    body = <ClientsView db={db} onOpenLead={openLead} />;
  } else if (view === "reports") {
    body = <ReportsView db={db} sel={sel} />;
  }

  return (
    <div className="gc-root flex">
      <Tokens />
      <Sidebar view={view} setView={setView} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} collapsed={sidebarCollapsed} onToggleCollapse={toggleSidebar} />
      <div className="flex-1 min-w-0">
        <Topbar
          db={db}
          currentUser={currentUser}
          setCurrentUser={setCurrentUser}
          search={search}
          onSearch={setSearch}
          attention={sel.attention}
          onOpenLead={openLead}
          onMenu={() => setMobileOpen(true)}
          onLogout={handleLogout}
          searchInputRef={searchInputRef}
          apiStatus={apiStatus}
          onSeedDemo={handleSeedDemo}
        />
        <main className={`py-4 sm:py-5 ${view === "leads" ? "px-3 sm:px-4 md:px-4 max-w-none" : "px-3 sm:px-4 md:px-6 max-w-[1200px] mx-auto"}`}>{body}</main>
      </div>

      {selectedLeadId && (
        <LeadDetail leadId={selectedLeadId} db={db} onClose={() => setSelectedLeadId(null)} currentUser={currentUser} dispatch={dispatch} notify={notify} initialTab={initialTab} onEditLead={handleEditLead} />
      )}
      {showLeadForm && <LeadFormModal onClose={() => setShowLeadForm(false)} onSave={handleCreateLead} currentUser={currentUser} />}
      {editingLead && <LeadFormModal initialLead={editingLead} onClose={() => setEditingLead(null)} onSave={handleSaveEditedLead} currentUser={currentUser} />}
      <ToastStack toasts={toasts} />
    </div>
  );
}


const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(<App />);

  </script>

<script src="js/boot.js"></script>
</body>
</html>
