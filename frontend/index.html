/* Som de notificação sintetizado via Web Audio (sem arquivo externo).
   O AudioContext só é criado no primeiro play — navegadores exigem gesto do
   usuário, então o som toca a partir da primeira interação com a página. */
const messageSound = (() => {
  let ctx = null;
  function ensureContext() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    if (!ctx) ctx = new AudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, start, duration, gainValue) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(gainValue, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  }
  /* Destrava o áudio no primeiro gesto real do usuário. Sem isso, o Chrome
     mantém o AudioContext "suspended" e o som disparado pelo polling (que não
     vem de um gesto) é bloqueado pela política de autoplay. */
  function unlock() {
    const context = ensureContext();
    if (context && context.state === "suspended") context.resume();
  }
  ["pointerdown", "keydown", "touchstart"].forEach(evt =>
    window.addEventListener(evt, unlock, { once: true, passive: true })
  );
  return {
    play() {
      try {
        const context = ensureContext();
        if (!context) return;
        if (context.state === "suspended") context.resume();
        const now = context.currentTime;
        tone(880, now, 0.16, 0.28);
        tone(1174.66, now + 0.14, 0.22, 0.24);
      } catch (_) { /* som nunca deve quebrar a UI */ }
    },
    get ready() {
      return Boolean(ctx && ctx.state === "running");
    },
  };
})();

      --warm: #93690F; --warm-bg: #FBF0D9;
      --cold: #4C5B6B; --cold-bg: #E7EAEE;

      --danger: #A23E28; --danger-bg: #F7E2DD;
      --success: #2C6B34; --success-bg: #DEEEDD;
      --warn: #93690F; --warn-bg: #FBF0D9;

      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-body: 'IBM Plex Sans', system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);

    }
    .gc-root * { box-sizing: border-box; }
    .gc-display { font-family: var(--font-display); letter-spacing: -0.01em; }

    .gc-scroll::-webkit-scrollbar-track { background: transparent; }

    .gc-row-hover:hover { background: var(--surface-sunken); }
    .gc-focus:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .gc-focus:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .gc-cell-tooltip {
      position: fixed;
      z-index: 1000;
      max-width: min(480px, calc(100vw - 16px));

      font-size: 12px;

      white-space: normal;
      overflow-wrap: anywhere;
      pointer-events: none;
    }
    .gc-cell-tooltip.above { transform: translateY(-100%); }
    .gc-table-scroll { overflow-x: auto; }
    .gc-column-resize-handle {
      position: absolute;
      top: 0;
      right: -6px;
      z-index: 2;
      width: 12px;
      height: 100%;
      cursor: col-resize;
      touch-action: none;
    }
    .gc-column-resize-handle::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 7px;
      height: 16px;
      transform: translate(-50%, -50%);
      border-left: 2px solid var(--line-strong);
      border-right: 2px solid var(--line-strong);
      border-radius: 2px;
      transition: border-color 0.15s ease, height 0.15s ease;
    }
    .gc-column-resize-handle:hover::after,
    .gc-column-resize-handle:focus-visible::after {
      border-color: var(--accent);
      height: 22px;
    }
    .gc-column-resize-handle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .gc-spinner {
      width: 28px;
      height: 28px;

    @keyframes gc-spin { to { transform: rotate(360deg); } }

    .gc-card { transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease; }

    .gc-pressable { transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease; }

    .gc-btn:active { transform: scale(0.97); }

    @keyframes gc-slide-in { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

const USERS = [
  { id: "erick", name: "Erick" },
  { id: "fabricio", name: "Fabrício" },
];

const DEFAULT_PASSWORD = "Crm@2026!Inicial";
const AUTH_STORAGE_PREFIX = "crm_auth_";
const AUTH_SESSION_KEY = "crm_auth_session";

function readAuthRecord(userId) {
  try {
    const value = window.localStorage.getItem(AUTH_STORAGE_PREFIX + userId);
    return value ? JSON.parse(value) : null;
  } catch (error) {
    return null;
  }
}

function writeAuthRecord(userId, record) {
  try {
    window.localStorage.setItem(AUTH_STORAGE_PREFIX + userId, JSON.stringify(record));
  } catch (error) {
    return null;
  }
}

function readSessionUserId() {
  try {
    const value = window.localStorage.getItem(AUTH_SESSION_KEY);
    const session = value ? JSON.parse(value) : null;
    if (!session || typeof session.userId !== "string" || !session.userId) return null;
    /* Não se exige mais que o id esteja em USERS: quando a equipe entra pelo link
       do túnel, o login devolve o nome de quem é e ensureKnownUser() adiciona a
       pessoa na lista. Quem decide o acesso é o token do backend, não esta lista —
       ela só dá os rótulos na tela. */
    return session.userId;
  } catch (error) {
    return null;
  }
}

/* Guarda o nome que o backend devolveu no login, para o responsável aparecer
   com o nome certo em Leads, Agenda e no painel por pessoa. */
function ensureKnownUser(userId, name) {
  if (!userId) return;
  const label = name && String(name).trim() ? String(name).trim() : userId;
  const existing = USERS.find((user) => user.id === userId);
  if (existing) {
    if (name && existing.name !== label) existing.name = label;
    return;
  }
  USERS.push({ id: userId, name: label });
}

function readSessionName(userId) {
  try {
    const session = JSON.parse(window.localStorage.getItem(AUTH_SESSION_KEY) || "null");
    return session && session.userId === userId && session.name ? session.name : "";
  } catch (error) {
    return "";
  }
}

function writeSessionUserId(userId, name) {
  try {
    window.localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({ userId, name: name || "" }));
    ensureKnownUser(userId, name);
  } catch (error) {
    return null;
  }
}

function clearSessionUserId() {
  try {
    window.localStorage.removeItem(AUTH_SESSION_KEY);
  } catch (error) {
    return;
  }
}

function createAuthSalt() {
  const bytes = new Uint8Array(16);
  globalThis.crypto.getRandomValues(bytes);
  return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
}

async function hashPassword(password, salt) {
  const data = new TextEncoder().encode(`${salt}:${password}`);
  const digest = await globalThis.crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
}

async function ensureAuthRecord(userId) {
  const current = readAuthRecord(userId);
  if (current && typeof current.salt === "string" && typeof current.passwordHash === "string") {
    return {
      salt: current.salt,
      passwordHash: current.passwordHash,
      mustChangePassword: current.mustChangePassword !== false,
    };
  }

  const salt = createAuthSalt();
  const record = {
    salt,
    passwordHash: await hashPassword(DEFAULT_PASSWORD, salt),
    mustChangePassword: true,
  };
  writeAuthRecord(userId, record);
  return record;
}

async function verifyPassword(userId, password) {
  const record = await ensureAuthRecord(userId);
  const hash = await hashPassword(password, record.salt);
  return { record, matches: hash === record.passwordHash };
}

async function savePermanentPassword(userId, password) {
  const current = await ensureAuthRecord(userId);
  const record = {
    salt: current.salt,
    passwordHash: await hashPassword(password, current.salt),
    mustChangePassword: false,
  };
  writeAuthRecord(userId, record);
  return record;
}

async function saveLocalPassword(userId, password, mustChangePassword) {
  const current = await ensureAuthRecord(userId);
  const record = {
    salt: current.salt,
    passwordHash: await hashPassword(password, current.salt),
    mustChangePassword,
  };
  writeAuthRecord(userId, record);
  return record;
}

async function authStatusThroughApi(userId) {
  const response = await crmApi.auth.status(userId);
  if (!response.ok || !response.data) return null;
  return response.data;
}

async function loginThroughApi(userId, password) {
  const response = await crmApi.auth.login(userId, password);
  if (response.status === 401 || response.status === 403) {
    return { ok: false, message: response.message || "Usuário ou senha incorretos." };
  }
  if (!response.ok || !response.data) return null;
  /* O backend devolve o token de sessão junto com o login. Guardado aqui, ele sai
     do alcance do resto do código de tela: quem chama a API nem precisa saber. */
  if (response.data.sessionToken && window.CrmSession) window.CrmSession.set(response.data.sessionToken);
  return { ok: true, data: response.data };
}

async function changePasswordThroughApi(userId, currentPassword, newPassword) {
  const response = await crmApi.auth.changePassword(userId, currentPassword, newPassword);
  if (response.status === 401 || response.status === 403) {
    return { ok: false, message: response.message || "Não foi possível alterar a senha." };
  }
  if (!response.ok || !response.data) return null;
  if (response.data.sessionToken && window.CrmSession) window.CrmSession.set(response.data.sessionToken);
  return { ok: true, data: response.data };
}

/* =========================================================================
   VÍNCULO LEAD <-> CONVERSA DE WHATSAPP
   A tabela whatsapp_conversations não tem lead_id, então o cliente é ligado à
   conversa pelo telefone (com nome/empresa como plano B). Uma regra só para as
   duas telas não divergirem: o chat usa para mostrar a etapa do funil, a tela
   de Leads usa para mostrar e mudar o status do atendimento.
   ========================================================================= */
const waDigits = value => String(value || "").replace(/\D/g, "");
const waText = value => String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("pt-BR");
/* Mesmo critério do chat: telefone com 8 a 15 dígitos abre conversa. */
const waLeadPhone = lead => [lead?.whatsapp, lead?.phone]
  .map(waDigits)
  .find(value => value.length >= 8 && value.length <= 15) || "";
/* Um telefone de conversa só vale se tiver 8+ dígitos; a comparação aceita
   prefixo internacional de um dos lados (55 31...  x  (31)...). */
/* Os dois formatos do MESMO celular brasileiro: com e sem o nono dígito. O
   cadastro costuma vir do Google Places sem o 9 e o WhatsApp do cliente é com o
   9. Sem isto, a ficha do cliente apareceria no menu sem a etapa do funil
   (porque o número não batia) mesmo sendo o mesmo cara. Vale só para celular
   (assinante 8/9 na frente); fixo não tem irmão. */
const waLocal = value => {
  const digits = String(value || "").replace(/\D/g, "");
  return (digits.length === 12 || digits.length === 13) && digits.startsWith("55") ? digits.slice(2) : digits;
};
const waIirmaDoNove = value => {
  const br = waLocal(value);
  const comNove = br.match(/^(\d{2})9([89]\d{7})$/);
  if (comNove) return `${comNove[1]}${comNove[2]}`;
  const semNove = br.match(/^(\d{2})([89]\d{7})$/);
  if (semNove) return `${semNove[1]}9${semNove[2]}`;
  return "";
};
const waPhonesMatch = (a, b) => {
  if (a.length < 8 || b.length < 8) return false;
  if (a.endsWith(b) || b.endsWith(a)) return true;
  const localA = waLocal(a);
  const localB = waLocal(b);
  return Boolean(localA) && (waIirmaDoNove(localA) === localB || waIirmaDoNove(localB) === localA);
};

function findLeadForConversation(item, leads) {
  const conversationPhone = waDigits(item?.contact?.phone);
  const byPhone = conversationPhone.length >= 8
    ? (leads || []).find(lead => [lead.whatsapp, lead.phone].map(waDigits).some(value => waPhonesMatch(conversationPhone, value)))
    : null;
  if (byPhone) return byPhone;
  /* Sem telefone compatível, o vínculo é por texto: primeiro a empresa da
     conversa, depois o nome do contato (comparado também com o nome da empresa
     do lead). Só aceita correspondência ÚNICA — nomes genéricos como
     "Proprietario(a)" existem em vários leads e amarrar ao primeiro mostraria
     o status errado na tela. */
  const candidates = [item?.contact?.company, item?.contact?.name].map(waText).filter(Boolean);
  for (const candidate of candidates) {
    const hits = (leads || []).filter(lead =>
      [waText(lead.contactName), waText(lead.company)].filter(Boolean).includes(candidate)
    );
    if (hits.length === 1) return hits[0];
  }
  return null;
}

/* Caminho inverso, para a ficha do lead: qual conversa pertence a este lead. */
function findConversationForLead(lead, conversations) {
  const phones = [lead?.whatsapp, lead?.phone].map(waDigits).filter(Boolean);
  const hits = (conversations || []).filter(item =>
    phones.some(value => waPhonesMatch(waDigits(item?.contact?.phone), value))
  );
  /* A lista chega ordenada por atividade mais recente. */
  return hits[0] || null;
}

/* Mapa leadId -> { id, status, updatedAt }, para a lista de Leads e o Kanban
    mostrarem a pílula do atendimento sem cada linha procurar de novo. O formato
    é o mesmo de um item da lista de conversas, assim a ficha usa as duas fontes
    sem precisar de conversão. */
function conversationStatusByLead(conversations, leads) {
  const map = {};
  for (const item of conversations || []) {
    const lead = findLeadForConversation(item, leads);
    if (lead && !map[lead.id]) {
      map[lead.id] = {
        id: item.id,
        status: item.status || DEFAULT_CONVERSATION_STATUS,
        updatedAt: item.lastMessage?.timestamp || null,
      };
    }
  }
  return map;
}

const pad = (n) => String(n).padStart(2, "0");
const daysAgo = (n, h = 9, m = 0) => { const d = new Date(); d.setDate(d.getDate() - n); d.setHours(h, m, 0, 0); return d.toISOString(); };
const daysFromNow = (n, h = 9, m = 0) => { const d = new Date(); d.setDate(d.getDate() + n); d.setHours(h, m, 0, 0); return d.toISOString(); };
const hoursFromNow = (n) => new Date(Date.now() + n * 3600000).toISOString();
const hoursAgo = (n) => new Date(Date.now() - n * 3600000).toISOString();

/* "2026-11-20" sem hora o JS lê como meia-noite UTC: no fuso de Ipatinga (-03)
   isso cai em 19/11 e a tela mostra o dia errado. As colunas `date` do Postgres
   (vencimento, data da venda, dia do relatório) vêm sempre nesse formato, então
   a chave vira Date do meio-dia local antes de qualquer formatação. */
function asDateLocal(d) {
  if (typeof d === "string") {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d.trim());
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12, 0, 0);
  }
  return new Date(d);
}
function fmtDate(d) { if (!d) return "—"; const dt = asDateLocal(d); return `${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}`; }
function fmtDateFull(d) { if (!d) return "—"; const dt = asDateLocal(d); return `${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}/${dt.getFullYear()}`; }
function fmtTime(d) { if (!d) return ""; const dt = new Date(d); return `${pad(dt.getHours())}:${pad(dt.getMinutes())}`; }
function fmtDateTime(d) { if (!d) return "—"; return `${fmtDate(d)} · ${fmtTime(d)}`; }
function toLocalDateTimeInput(iso) {
  if (!iso) return "";
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return "";
  return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}
function fmtMoney(v) {
  if (v === null || v === undefined || v === "") return "—";
  return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
}
function startOfDay(d) { const dt = new Date(d); dt.setHours(0, 0, 0, 0); return dt; }
function daysDiff(a, b) { return Math.round((startOfDay(a).getTime() - startOfDay(b).getTime()) / 86400000); }
function actionBucket(date) {
  if (!date) return null;
  const diff = daysDiff(date, new Date());
  if (diff < 0) return "atrasado";
  if (diff === 0) return "hoje";
  return "proximo";
}
function daysSince(d) { if (!d) return null; return daysDiff(new Date(), d); }

function demoUrgency(demo) {
  if (demo.deactivated) return "desativada";
  if (!demo.sentAt) return "criada";
  const ms = new Date(demo.expiresAt).getTime() - Date.now();
  if (ms <= 0) return "expirada";
  if (ms <= 3600000) return "critica";
  if (ms <= 6 * 3600000) return "atencao";
  return "ativa";
}
function remainingLabel(demo) {
  if (demo.deactivated) return "Desativada manualmente";
  if (!demo.sentAt) return "Ainda não enviada ao cliente";
  const ms = new Date(demo.expiresAt).getTime() - Date.now();
  const abs = Math.abs(ms);
  const h = Math.floor(abs / 3600000);
  const m = Math.floor((abs % 3600000) / 60000);
  return ms <= 0 ? `Expirou há ${h}h ${pad(m)}min` : `Expira em ${h}h ${pad(m)}min`;
}

function userName(id) { return (USERS.find(u => u.id === id) || {}).name || id; }

/* Most recent status-history entry marks when the lead entered its current
   status; falls back to createdAt for leads that never changed status. */
function daysInCurrentStage(lead, statusHistory) {
  const entries = statusHistory.filter(s => s.leadId === lead.id).sort((a, b) => new Date(b.date) - new Date(a.date));
  const ref = entries.length ? entries[0].date : lead.createdAt;
  return daysSince(ref);
}

/* The "value" of an open opportunity is never invented — it only exists
   once a real proposal has been sent. Picks the most recent proposal. */
function latestProposalForLead(leadId, proposals) {
  const list = proposals.filter(p => p.leadId === leadId).sort((a, b) => new Date(b.proposalDate) - new Date(a.proposalDate));
  return list[0] || null;
}

/* Bump temperature upward only, never automatically downgrade it. */
function suggestTemperature(current, result) {
  const hot = ["Demonstrou interesse", "Pediu preço", "Pediu proposta"];
  const warm = ["Atendeu", "Pediu retorno", "Respondeu", "Demo enviada"];
  let suggested = current;
  if (hot.includes(result)) suggested = "Quente";
  else if (warm.includes(result)) suggested = current === "Frio" ? "Morno" : current;
  return TEMP_RANK[suggested] > TEMP_RANK[current] ? suggested : current;
}

/* =========================================================================
   API CLIENT — SUPABASE (via backend Express http://localhost:3001/api)
   ========================================================================= */

function getApiBaseUrl() {
  if (typeof window !== "undefined") {
    if (window.CRM_API_URL && window.CRM_API_URL.trim()) {
      return window.CRM_API_URL.trim().replace(/\/+$/, "");
    }
    const stored = localStorage.getItem("crm_api_url");
    if (stored && stored.trim()) {
      return stored.trim().replace(/\/+$/, "");
    }
    // Quando aberto diretamente do disco local (file://)
    if (window.location.protocol === "file:") {
      return "http://localhost:3001/api";
    }
    // Desenvolvimento local em porta separada (ex.: Live Server 5500)
    if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
      return window.location.port === "3001" ? "/api" : "http://localhost:3001/api";
    }
    // Na Vercel ou em produção na nuvem: usa caminho relativo /api do mesmo domínio
    return "/api";
  }
  return "/api";
}

let CRM_API_BASE = getApiBaseUrl();

/* Endereço do túnel que você abre com o ABRIR_PARA_A_EQUIPE.bat. Reconhece os
   domínios do ngrok (xxxx.ngrok-free.app, xxxx.ngrok.app e as variações antigas). */
function isTunelNgrok() {
  if (typeof window === "undefined") return false;
  return /(^|\.)ngrok(-free)?\.(app|com|dev|io)$/i.test(String(window.location.hostname || ""));
}

function getWhatsAppApiBaseUrl() {
  if (typeof window === "undefined") return CRM_API_BASE;
  /* Pelo link do túnel, o WhatsApp TEM que vir da mesma origem do site: o próprio
     ngrok encaminha tudo para o seu backend na 3001. Apontar para
     http://localhost:3001 daqui seria duplamente errado — o navegador bloqueia
     página https chamando http, e o "localhost" seria o computador de quem abriu
     o link, não o seu. */
  if (isTunelNgrok()) {
    const base = String(CRM_API_BASE || "");
    if (/^https?:\/\//i.test(base) && base.indexOf(window.location.hostname) < 0) return "/api";
    return base || "/api";
  }
  if (window.CRM_WHATSAPP_API_URL && window.CRM_WHATSAPP_API_URL.trim()) {
    return window.CRM_WHATSAPP_API_URL.trim().replace(/\/+$/, "");
  }
  const stored = localStorage.getItem("crm_whatsapp_api_url");
  if (stored && stored.trim()) return stored.trim().replace(/\/+$/, "");
  if (window.location.hostname === "crm-comercial-kappa.vercel.app") {
    return "http://localhost:3001/api";
  }
  return CRM_API_BASE;
}

/* Cabeçalhos de senha para os dois atos sem volta do Financeiro (excluir um
   recebimento e desfazer um pagamento que já entrou).
   Por que cabeçalho: a URL fica registrada em log de proxy e de navegador, e o
   corpo do PATCH já está ocupado com os campos do lançamento. O backend confere
   essa senha com o mesmo serviço do login antes de fazer qualquer coisa — então
   quem abrir o link da equipe precisa da senha dele também, não adianta mexer no
   site. A senha não fica guardada em lugar nenhum: ela vive só naquele campo,
   desaparece quando a ação termina. */
function cabecalhosSenha(credenciais) {
  const senha = credenciais && credenciais.senha ? String(credenciais.senha) : "";
  const usuario = credenciais && credenciais.usuario ? String(credenciais.usuario) : "";
  const headers = {};
  if (senha) headers["x-crm-senha"] = senha;
  if (usuario) headers["x-crm-usuario"] = usuario;
  return headers;
}

const crmApi = {
  getBaseUrl() {
    return CRM_API_BASE;
  },
  setBaseUrl(url) {
    if (url && url.trim()) {
      const clean = url.trim().replace(/\/+$/, "");
      CRM_API_BASE = clean;
      localStorage.setItem("crm_api_url", clean);
    } else {
      localStorage.removeItem("crm_api_url");
      CRM_API_BASE = getApiBaseUrl();
    }
  },
  async health() {
    /* A resposta deste pedido É o sinal de vida do backend. Devolve o motivo real
       (conexão recusada, HTTP 500, timeout) para a tela mostrar o que aconteceu em
       vez de um "modo local" genérico. */
    const url = `${CRM_API_BASE}/health`;
    try {
      const res = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(6000) });
      if (!res.ok) {
        return { ok: false, status: res.status, url, error: `O backend respondeu HTTP ${res.status} em ${url}.` };
      }
      const data = await res.json();
      return { ok: true, ...data, status: res.status, url };
    } catch (e) {
      const nome = String(e?.name || "");
      const msg = String(e?.message || "");
      const timeout = /timeout|abort/i.test(nome + msg);
      const motivo = timeout
        ? `O backend demorou mais de 6 s para responder em ${url}. Ele está travado ou o banco não terminou a consulta.`
        : `Nenhum backend respondeu em ${url} — a conexão foi recusada, ou seja, o servidor está desligado (${msg || "sem conexão"}).`;
      return { ok: false, status: 0, url, error: motivo, recusa: !timeout };
    }
  },

  whatsapp: {
    async request(path, options = {}) {
      const baseUrl = getWhatsAppApiBaseUrl();
      let response;
      try {
        response = await fetch(`${baseUrl}/whatsapp${path}`, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        });
      } catch (error) {
        const nome = String(error?.name || "");
        const msg = String(error?.message || "");
        const timeout = /timeout|abort/i.test(nome + msg);
        /* Pelo link do túnel o WhatsApp vem do MESMO endereço do site, então falha
           de rede aqui nunca é "libere o acesso à rede local": é o túnel ou o
           run-crm.bat dele que caiu. A frase tem que dizer isso, senão quem abriu o
           link perde tempo mexendo em configuração que não existe. */
        if (isTunelNgrok()) {
          throw new Error(timeout
            ? `O WhatsApp demorou para responder pelo link do túnel (${baseUrl}). O CRM de quem te passou o link está travado ou o celular não respondeu.`
            : "O link do túnel não está chegando no CRM. Recarregue a página; se continuar, peça para quem te passou o link reabrir o ABRIR_PARA_A_EQUIPE.bat — o WhatsApp só funciona com o notebook dele ligado e o run-crm.bat aberto.");
        }
        if (baseUrl.includes("localhost:3001") && window.location.hostname !== "localhost") {
          throw new Error("Não foi possível acessar o WhatsApp neste computador. Confirme que run-crm.bat está aberto; no Chrome/Edge, permita o acesso à rede local para este site (ícone ao lado do endereço → Configurações do site → Acesso à rede local → Permitir) e recarregue a página.");
        }
        /* Conexão recusada / timeout: é o backend fechado, e a frase tem que dizer
           isso em português em vez do "Failed to fetch" do navegador. */
        if (timeout) {
          throw new Error(`O WhatsApp demorou para responder em ${baseUrl}. O backend está travado ou o celular não respondeu.`);
        }
        throw new Error(`Nenhum backend respondeu em ${baseUrl} — a conexão foi recusada, ou seja, o run-crm.bat está fechado (${msg || "sem conexão"}).`);
      }
      /* O ngrok e o backend podem devolver HTML no lugar de JSON (página do túnel,
         erro de proxy). Ler o texto e tentar parsear evita o SyntaxError cru do
         navegador no meio da tela. */
      const texto = await response.text();
      let data = null;
      try {
        data = texto ? JSON.parse(texto) : null;
      } catch (ignorido) {
        data = null;
      }
      if (!data || typeof data !== "object") {
        throw new Error(response.ok
          ? "O backend do WhatsApp respondeu algo que o CRM não consegue ler (provavelmente a página do próprio túnel). Abra o link de novo."
          : `O backend do WhatsApp respondeu HTTP ${response.status} sem explicar o erro.`);
      }
      if (!response.ok || !data.success) {
        throw new Error(data.message || "Falha ao consultar o WhatsApp.");
      }
      return data.data;
    },
    status: () => crmApi.whatsapp.request("/status"),
    connect: (phoneNumber) => crmApi.whatsapp.request("/connect", {
      method: "POST",
      body: JSON.stringify({ phoneNumber: phoneNumber || "" }),
      signal: AbortSignal.timeout(20000),
    }),
    disconnect: () => crmApi.whatsapp.request("/disconnect", { method: "POST" }),
    conversations: () => crmApi.whatsapp.request("/conversations"),
    conversation: id => crmApi.whatsapp.request(`/conversations/${encodeURIComponent(id)}`),
    /* Endereço assinado do áudio que o cliente mandou. Só é pedido no clique em

    audioUrl: (id, messageId) => crmApi.whatsapp.request(
      `/conversations/${encodeURIComponent(id)}/messages/${encodeURIComponent(messageId)}/audio`

    /* Pede ao celular as mensagens ANTERIORES desta conversa. A resposta volta

       mensagens aparecem. */
    fetchHistory: (id, quantity) => crmApi.whatsapp.request(
      `/conversations/${encodeURIComponent(id)}/history`,
      { method: "POST", body: JSON.stringify({ quantity }) }
    ),
    sendText: (id, content, sentBy) =>
      crmApi.whatsapp.request(`/conversations/${encodeURIComponent(id)}/messages`, {
        method: "POST",
        body: JSON.stringify({ content, sentBy }),

    sendMedia: (id, file, kind, caption, sentBy) => {
      const query = new URLSearchParams({ kind, sentBy: sentBy || "Usuário" });
      if (caption) query.set("caption", caption);
      return crmApi.whatsapp.request(
        `/conversations/${encodeURIComponent(id)}/messages/media?${query}`,
        { method: "POST", headers: { "Content-Type": file.type }, body: file }
      );
    },
    async generateAudioPreview(text, profile) {
      const baseUrl = getWhatsAppApiBaseUrl();
      const response = await fetch(`${baseUrl}/whatsapp/tts/preview`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, profile }),
      });
      if (!response.ok) {
        let data = null;
        try { data = await response.json(); } catch (_) {}
        throw new Error(data?.message || "Não foi possível gerar a prévia de áudio.");
      }
      return response.blob();
    },
    /* Perfis de voz vindos do backend ("Rápida" / "Natural"). */
    async voiceProfiles() {
      const baseUrl = getWhatsAppApiBaseUrl();
      const response = await fetch(`${baseUrl}/whatsapp/tts/profiles`, { method: "GET" });
      if (!response.ok) throw new Error("Não foi possível carregar os tipos de voz.");
      const data = await response.json();
      return Array.isArray(data?.data) ? data.data : [];
    },
    /* A IA de sugestões só diz se está ativada — chave e conta nunca aparecem aqui. */
    async suggestStatus() {
      const baseUrl = getWhatsAppApiBaseUrl();
      try {
        const response = await fetch(`${baseUrl}/whatsapp/sugestoes/status`, { method: "GET" });
        if (!response.ok) return { enabled: false, model: "", quantity: 0 };
        const data = await response.json();
        return data?.data || { enabled: false, model: "", quantity: 0 };
      } catch (error) {
        return { enabled: false, model: "", quantity: 0 };

  async authRequest(path, body, method = "POST") {
    try {
      const res = await fetch(`${CRM_API_BASE}${path}`, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body === null ? undefined : JSON.stringify(body),
      });
      let json = null;
      try { json = await res.json(); } catch (error) { json = null; }
      return {
        status: res.status,
        ok: res.ok,
        data: json && json.data ? json.data : null,
        message: json && json.message ? json.message : "",
      };
    } catch (error) {
      return { status: 0, ok: false, data: null, message: error.message };
    }
  },

  async loadAll() {
    /* Cada pedido marca quantos falharam. Se os LEADS (a espinha da tela) não
       vierem, isto é erro e não "lista vazia": sem essa diferença o CRM mostrar
       um dia inteiro sem nenhum lead e ninguém saberia que o backend adoeceu. */
    let falhas = 0;
    let leadsFalharam = false;
    let semSessao = false;
    /* O Financeiro pode falhar sozinho (tabelas da migration 014 ainda não
       existem, ou o backend está rodando sem a rota nova). Isso não é motivo
       para esconder as outras telas — é motivo para a tela dele explicar o que
       falta. Daí esta marca separada. */
    let financeiroFalhou = false;
    let leadsErroServidor = "";
    const total = 12;
    const fetchJson = (path, essencial = false, doFinanceiro = false) => {
      const falhar = (mensagem = "") => {
        falhas++;
        if (essencial) {
          leadsFalharam = true;
          if (mensagem && !leadsErroServidor) leadsErroServidor = mensagem;
        }
        if (doFinanceiro) financeiroFalhou = true;
        return { data: [] };
      };
      return fetch(`${CRM_API_BASE}${path}`, { cache: "no-store" })
        .then(async (r) => {
          /* 401 tem causa e remédio diferentes de "backend doente": aqui quem
             falta é a senha, não o servidor. */
          if (r.status === 401) semSessao = true;
          if (!r.ok) {
            const body = await r.json().catch(() => null);
            return falhar(body && body.message ? body.message : `HTTP ${r.status}`);
          }
          return r.json().catch(() => falhar());
        })
        .catch(falhar);
    };

    const [leads, statusHistory, interactions, followups, agendaEvents, demos, proposals, clients, clientUpdates, financeSales, financePayments, financeSettings] =
      await Promise.all([
        fetchJson("/leads", true),
        fetchJson("/status-history"),
        fetchJson("/interactions"),
        fetchJson("/followups"),
        fetchJson("/agenda"),
        fetchJson("/demos"),
        fetchJson("/proposals"),
        fetchJson("/clients"),
        fetchJson("/client-updates"),
        fetchJson("/finance/sales", false, true),
        fetchJson("/finance/payments", false, true),
        fetchJson("/finance/settings", false, true),
      ]);

    if (semSessao && leadsFalharam) {
      const erro = new Error("Este navegador não tem sessão válida no momento.");
      erro.sessionExpired = true;
      throw erro;
    }

    if (leadsFalharam) {
      if (leadsErroServidor && leadsErroServidor !== `HTTP 401`) {
        throw new Error(leadsErroServidor);
      }
      throw new Error(`O servidor respondeu ${total - falhas} de ${total} pedidos, e os leads não vieram (HTTP ou banco indisponível).`);
    }

    return {
      leads: leads.data || [],
      statusHistory: statusHistory.data || [],
      interactions: interactions.data || [],
      followups: followups.data || [],
      agendaEvents: agendaEvents.data || [],
      demos: demos.data || [],
      proposals: proposals.data || [],
      clients: clients.data || [],
      clientUpdates: clientUpdates.data || [],
      financeSales: financeSales.data || [],
      financePayments: financePayments.data || [],
      /* /finance/settings devolve um objeto; no erro vira a lista vazia de
         reserva, que não é configuração nenhuma. */
      financeSettings: Array.isArray(financeSettings.data) ? null : (financeSettings.data || null),
      financeIndisponivel: financeiroFalhou,
    };
  },

/* =========================================================================
   DATA LAYER
   ---------------------------------------------------------------------
   Every mutation goes through this reducer for instant optimistic UI update,
   mirrored asynchronously by crmApi to Supabase.
   ========================================================================= */

// Os dados cadastrais vêm do lead; os dados do contrato continuam no cliente.
function syncClientsWithLeads(db) {
  const leadsById = new Map(db.leads.map(lead => [lead.id, lead]));
  return {
    ...db,
    clients: db.clients.map(client => {
      const lead = leadsById.get(client.leadId);
      if (!lead) return client;
      const patch = {};
      for (const field of ["company", "contactName", "owner"]) {
        if (lead[field] !== undefined) patch[field] = lead[field];
      }
      return { ...client, ...patch };
    }),
  };
}

function dbReducer(db, action) {
  switch (action.type) {
    case "SET_DB": {
      return syncClientsWithLeads({ ...db, ...action.db });
    }
    case "ADD_LEAD": {
      return { ...db, leads: [action.lead, ...db.leads] };
    }
    case "DELETE_LEAD": {
      if (db.clients.some(c => c.leadId === action.id)) return db;
      const next = { ...db, leads: db.leads.filter(l => l.id !== action.id) };
      for (const collection of ["statusHistory", "interactions", "followups", "agendaEvents", "demos", "proposals"]) {
        next[collection] = db[collection].filter(item => item.leadId !== action.id);
      }
      return next;
    }
    case "UPDATE_LEAD": {
      return syncClientsWithLeads({ ...db, leads: db.leads.map(l => l.id === action.id ? { ...l, ...action.patch } : l) });
    }
    case "CHANGE_STATUS": {
      const lead = db.leads.find(l => l.id === action.id);
      if (!lead) return db;
      const entry = { id: `sh_${Date.now()}`, leadId: action.id, from: lead.status, to: action.status, date: new Date().toISOString(), user: action.user };
      return {
        ...db,
        leads: db.leads.map(l => l.id === action.id ? { ...l, status: action.status } : l),
        statusHistory: [entry, ...db.statusHistory],
      };
    }
    case "ADD_INTERACTION": {
      const lead = db.leads.find(l => l.id === action.leadId);
      const nextTemp = lead ? suggestTemperature(lead.temperature, action.interaction.result) : undefined;
      return {
        ...db,
        interactions: [action.interaction, ...db.interactions],
        leads: db.leads.map(l => l.id === action.leadId
          ? { ...l, lastContactAt: action.interaction.date, temperature: nextTemp }
          : l),
      };
    }
    case "SET_NEXT_ACTION": {
      return { ...db, leads: db.leads.map(l => l.id === action.leadId ? { ...l, nextAction: action.nextAction } : l) };
    }
    case "ADD_FOLLOWUP": {
      return { ...db, followups: [action.followup, ...db.followups] };
    }
    case "UPDATE_FOLLOWUP": {
      return { ...db, followups: db.followups.map(f => f.id === action.id ? { ...f, ...action.patch } : f) };
    }
    case "ADD_AGENDA_EVENT": {
      return { ...db, agendaEvents: [action.event, ...db.agendaEvents] };
    }
    case "UPDATE_AGENDA_EVENT": {
      return { ...db, agendaEvents: db.agendaEvents.map(event => event.id === action.id ? { ...event, ...action.patch } : event) };
    }
    case "ADD_DEMO": {
      return { ...db, demos: [action.demo, ...db.demos] };
    }
    case "UPDATE_DEMO": {
      return { ...db, demos: db.demos.map(d => d.id === action.id ? { ...d, ...action.patch } : d) };
    }
    case "ADD_PROPOSAL": {
      return { ...db, proposals: [action.proposal, ...db.proposals] };
    }
    case "UPDATE_PROPOSAL": {
      return { ...db, proposals: db.proposals.map(p => p.id === action.id ? { ...p, ...action.patch } : p) };
    }
    case "CONVERT_TO_CLIENT": {
      return { ...db, clients: [action.client, ...db.clients] };
    }
    case "UPDATE_CLIENT": {
      return { ...db, clients: db.clients.map(c => c.id === action.id ? { ...c, ...action.patch } : c) };
    }
    case "ADD_CLIENT_UPDATE": {
      return { ...db, clientUpdates: [action.update, ...db.clientUpdates] };
    }
    /* ------------------------------ Financeiro ----------------------------
       Tudo entra aqui já com o eco do servidor? Não: igual ao resto do app, a
       tela responde na hora (otimista) e o dispatch grava atrás. */
    case "ADD_FINANCE_SALE": {
      return { ...db, financeSales: [action.sale, ...db.financeSales], financeIndisponivel: false };
    }
    case "ADD_FINANCE_SALE_WITH_PAYMENT": {
      return {
        ...db,
        financeSales: [action.sale, ...db.financeSales],
        financePayments: [action.payment, ...db.financePayments],
        financeIndisponivel: false,
      };
    }
    case "UPDATE_FINANCE_SALE": {
      return { ...db, financeSales: db.financeSales.map(s => s.id === action.id ? { ...s, ...action.patch } : s) };
    }
    case "ADD_FINANCE_PAYMENT": {
      return { ...db, financePayments: [action.payment, ...db.financePayments], financeIndisponivel: false };
    }
    /* Várias de uma vez é o "gerar mensalidades do mês": o servidor devolve
       exatamente as linhas que criou, então nada é duplicado aqui. */
    case "ADD_FINANCE_PAYMENTS": {
      return { ...db, financePayments: [...action.payments, ...db.financePayments], financeIndisponivel: false };
    }
    case "UPDATE_FINANCE_PAYMENT": {
      return { ...db, financePayments: db.financePayments.map(p => p.id === action.id ? { ...p, ...action.patch } : p) };
    }
    /* Desfazer o pagamento / cancelar um lançamento que já entrou: o pedido com a
       senha já foi feito pelo botão da linha, aqui só pinta a tela. Se esse case
       entrasse no "UPDATE_FINANCE_PAYMENT" normal, o espelho do banco reenviaria
       o mesmo PATCH sem a senha e o backend responderia 401 — a linha voltaria
       para o lugar certo na hora errada. */
    case "FINANCE_PAYMENT_SECURED": {
      return { ...db, financePayments: db.financePayments.map(p => p.id === action.id ? { ...p, ...action.patch } : p) };
    }
    /* Só o recebimento errado pode sumir mesmo (o "Excluir" da tela, depois da
       confirmação com nome e valor). Venda avulsa continua virando 'Cancelada'. */
    case "DELETE_FINANCE_PAYMENT": {
      return { ...db, financePayments: db.financePayments.filter(p => p.id !== action.id) };
    }
    case "SET_FINANCE_SETTINGS": {
      return { ...db, financeSettings: action.settings, financeIndisponivel: false };
    }
    case "SET_LOSS_REASON": {
      return { ...db, leads: db.leads.map(l => l.id === action.id ? { ...l, lossReason: action.reason } : l) };
    }
    default:
      return db;
  }
}

/* =========================================================================
   UI PRIMITIVES
   ========================================================================= */

const TONE_STYLE = (tone) => ({ background: `var(--tone-${tone}-bg, var(--tone-slate-bg))`, color: `var(--tone-${tone}-fg, var(--tone-slate-fg))` });

function Pill({ tone = "slate", children, dot = false, title }) {
  return (
    <span title={title} className="inline-flex items-center gap-1.5 rounded-full text-xs font-medium px-2 py-1 whitespace-nowrap" style={TONE_STYLE(tone)}>
      {dot && <span className="w-1.5 h-1.5 rounded-full" style={{ background: `var(--tone-${tone}-fg)` }} />}
      {children}
    </span>
  );
}

function TempPill({ temperature }) {
  const tone = TEMP_TONE[temperature] || "cold";
  const Icon = temperature === "Quente" ? Flame : temperature === "Morno" ? Thermometer : Snowflake;
  return (
    <span className="inline-flex items-center gap-1 rounded-full text-xs font-medium px-2 py-1 whitespace-nowrap" style={{ background: `var(--${tone}-bg)`, color: `var(--${tone})` }}>
      <Icon size={12} strokeWidth={2.5} />
      {temperature}
    </span>
  );
}

function StatusPill({ status }) {
  return <Pill tone={STATUS_TONE[status] || "slate"}>{status}</Pill>;
}

/* Pílula só de leitura do status do atendimento, para as listas (Leads e
   Kanban). O menu para mudar fica na ficha do lead; aqui a lista acompanha o
   chat, com o mesmo emoji e a mesma cor do menu do WhatsApp. */
function ConversationBadge({ conversation }) {
  if (!conversation?.status) return null;
  const meta = conversationStatusMeta(conversation.status);
  return (
    <span
      className="inline-flex items-center gap-1 rounded-full text-[11px] font-medium px-2 py-0.5 whitespace-nowrap"
      style={TONE_STYLE(meta.tone)}
      title={`Status do atendimento (chat) — ${meta.hint}`}
    >
      <span aria-hidden="true">{meta.emoji}</span>
      {conversation.status}
    </span>
  );
}

function PriorityMark({ priority }) {
  const tone = priority === "Alta" ? "hot" : priority === "Média" ? "warm" : "cold";
  return (
    <span className="inline-flex items-center gap-1.5 text-xs" style={{ color: `var(--${tone})` }}>
      <span className="w-1.5 h-1.5 rounded-full" style={{ background: `var(--${tone})` }} />
      {priority}
    </span>
  );
}

function Button({ children, variant = "primary", size = "md", icon: Icon, onClick, type = "button", disabled, className = "", title }) {
  const base = "inline-flex items-center justify-center gap-1.5 font-medium rounded-lg transition-colors gc-focus disabled:opacity-40 disabled:cursor-not-allowed";
  const sizes = { md: "text-sm px-3.5 py-2", sm: "text-xs px-2.5 py-1.5", lg: "text-sm px-4 py-2.5" };
  const styles = {
    primary: { background: "var(--accent)", color: "#fff" },
    secondary: { background: "var(--surface)", color: "var(--ink)", border: "1px solid var(--line-strong)" },
    ghost: { background: "transparent", color: "var(--ink-soft)" },
    danger: { background: "var(--danger-bg)", color: "var(--danger)" },
  };
  return (
    <button type={type} onClick={onClick} disabled={disabled} title={title} className={`${base} ${sizes[size]} ${className}`} style={styles[variant]}>
      {Icon && <Icon size={size === "sm" ? 14 : 16} />}
      {children}
    </button>
  );
}

function IconButton({ icon: Icon, onClick, label, active = false, badge }) {
  return (
    <button type="button" onClick={onClick} aria-label={label} className="relative w-9 h-9 rounded-lg inline-flex items-center justify-center gc-focus"
      style={{ background: active ? "var(--accent-soft)" : "transparent", color: active ? "var(--accent-ink)" : "var(--ink-soft)" }}>

function Modal({ title, onClose, children, width = 480, draggable = false }) {
  const [position, setPosition] = useState(null);
  const dragState = useRef(null);

  useEffect(() => {
    const handleKeyDown = (event) => {
      if (event.key === "Escape") onClose();
    };
    document.addEventListener("keydown", handleKeyDown);
    return () => document.removeEventListener("keydown", handleKeyDown);
  }, [onClose]);

  useEffect(() => {
    if (!draggable) return undefined;

    const handlePointerMove = (event) => {
      if (!dragState.current) return;
      const { offsetX, offsetY, width: modalWidth, height: modalHeight } = dragState.current;
      const maxLeft = Math.max(0, window.innerWidth - modalWidth);
      const maxTop = Math.max(0, window.innerHeight - modalHeight);
      setPosition({
        left: Math.max(0, Math.min(maxLeft, event.clientX - offsetX)),
        top: Math.max(0, Math.min(maxTop, event.clientY - offsetY)),
      });
    };
    const handlePointerUp = () => {
      dragState.current = null;
    };

    window.addEventListener("pointermove", handlePointerMove);
    window.addEventListener("pointerup", handlePointerUp);
    window.addEventListener("pointercancel", handlePointerUp);
    return () => {
      window.removeEventListener("pointermove", handlePointerMove);
      window.removeEventListener("pointerup", handlePointerUp);
      window.removeEventListener("pointercancel", handlePointerUp);
    };
  }, [draggable]);

  const startDragging = (event) => {
    if (!draggable || event.button !== 0 || event.target.closest("button")) return;
    event.preventDefault();

    const rect = event.currentTarget.parentElement.getBoundingClientRect();
    const left = position?.left ?? rect.left;
    const top = position?.top ?? rect.top;
    dragState.current = {
      offsetX: event.clientX - left,
      offsetY: event.clientY - top,
      width: rect.width,
      height: rect.height,
    };
    setPosition({ left, top });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 gc-fade-in" style={{ background: "rgba(23,25,28,0.4)" }}>
      <div
        className="w-full rounded-2xl gc-scroll overflow-y-auto"
        style={{
          position: position ? "fixed" : "relative",
          left: position?.left,
          top: position?.top,
          maxWidth: width,
          width: `min(${width}px, calc(100vw - 24px))`,
          maxHeight: "88vh",
          background: "var(--surface)",
        }}
      >
        <div
          className={`flex items-center justify-between px-5 py-4 sticky top-0 z-10${draggable ? " cursor-grab select-none" : ""}`}
          onPointerDown={startDragging}
          style={{ background: "var(--surface)", borderBottom: "1px solid var(--line)", touchAction: draggable ? "none" : undefined }}
        >
          <h3 className="gc-display font-semibold text-base">{title}</h3>
          <button onClick={onClose} className="w-8 h-8 rounded-lg inline-flex items-center justify-center gc-focus" style={{ color: "var(--slate)" }} aria-label="Fechar">
            <X size={18} />
          </button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

/* Copia texto para a área de transferência e mostra um toast de confirmação.
   `feminino` só muda a concordância do aviso ("Cidade copiada!" em vez de
   "Endereço copiado!"), porque o rótulo vem pronto de quem chama. */
async function copyToClipboard(text, label, notify, feminino = false) {
  const rotulo = label || "Texto";
  const participa = feminino ? "copiada" : "copiado";
  const artigo = feminino ? "a" : "o";
  const aviso = () => { if (notify) notify(`${rotulo} ${participa}!`, "success"); };
  /* 1) API oficial da área de transferência. */
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      aviso();
      return;
    }
  } catch (_) { /* cai no caminho antigo */ }
  /* 2) Fallback com caixa escondida: é o que funciona quando o CRM é aberto pelo
     arquivo (file://) ou quando o navegador nega a API. Sem isto o botão fica
     mudo e ele acha que o endereço não foi copiado. */
  try {
    const caixa = document.createElement("textarea");
    caixa.value = text;
    caixa.setAttribute("readonly", "");
    caixa.style.position = "fixed";
    caixa.style.top = "-1000px";
    caixa.style.opacity = "0";
    document.body.appendChild(caixa);
    caixa.select();
    caixa.setSelectionRange(0, String(text).length);
    const copiou = document.execCommand("copy");
    document.body.removeChild(caixa);
    if (!copiou) throw new Error("o navegador recusou a cópia");
    aviso();
  } catch (_) {
    if (notify) notify(`Não foi possível copiar ${artigo} ${rotulo.toLowerCase()}. Selecione o texto e use Ctrl+C.`, "error");
  }
}

function currentGreeting() {
  const hour = new Date().getHours();
  if (hour < 12) return { lower: "bom dia", upper: "Bom dia" };
  if (hour < 18) return { lower: "boa tarde", upper: "Boa tarde" };
  return { lower: "boa noite", upper: "Boa noite" };
}

function resolveGreeting(text) {
  if (!text) return "";
  const greeting = currentGreeting();
  return text.replace(/bom dia\s*(?:\/|ou)\s*boa tarde(?:\s*(?:\/|ou)\s*boa noite)?/gi, (match) =>
    match.charAt(0) === match.charAt(0).toUpperCase() ? greeting.upper : greeting.lower
  );
}

function personalizeMessage(text, name) {
  if (!text) return "";
  const out = resolveGreeting(text);
  const contact = (name || "").trim();
  if (out.includes("{{nome}}")) return out.replace(/\{\{nome\}\}/g, contact);
  if (!contact) return out;
  const breakIdx = out.indexOf("\n");
  const firstLine = breakIdx >= 0 ? out.slice(0, breakIdx) : out;
  const rest = breakIdx >= 0 ? out.slice(breakIdx) : "";
  if (/(ol[aá]|oi|bom dia|boa tarde|boa noite)/i.test(firstLine) && firstLine.includes(",")) {
    const comma = firstLine.indexOf(",");
    return `${firstLine.slice(0, comma)}, ${contact}${firstLine.slice(comma)}${rest}`;
  }
  return out;
}

/* =========================================================================

function useToastStack() {

    setToasts((t) => [...t.slice(-2), { id, message, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3000);
  };
  return { toasts, notify };
}

function ToastStack({ toasts }) {
  if (toasts.length === 0) return null;

      {toasts.map((t) => {

        const Icon = t.tone === "error" ? AlertTriangle : CheckCircle2;

            style={{ background: "var(--surface)", color: "var(--ink)", border: "1px solid var(--line-strong)", boxShadow: "0 12px 28px rgba(0,0,0,0.25)" }}>

            <span className="truncate">{t.message}</span>

/* =========================================================================
   SELECTORS — derived data, computed fresh from `db` on every render.
   Nothing here is stored; counts/statuses are always calculated so the UI
   never gets out of sync with the underlying records.
   ========================================================================= */

/* =========================================================================
   AGENDA — fonte única dos itens que aparecem no menu Agenda e no Dashboard.
   Junta eventos da agenda com os retornos de follow-up, exatamente como o
   menu sempre fez, para os dois lugares mostrarem as mesmas informações.
   ========================================================================= */

const byEventAt = (a, b) => new Date(a.eventAt) - new Date(b.eventAt);

function agendaEntriesOf(db) {
  return [
    ...(db.agendaEvents || []).map(event => ({ ...event, source: "agenda", eventStatus: event.status || "agendado" })),
    ...(db.followups || []).map(followup => ({
      id: followup.id,
      type: "retorno",
      title: followup.note || "Retorno",
      eventAt: followup.dueDate,
      leadId: followup.leadId,
      owner: followup.createdBy,
      notes: "",
      source: "followup",
      eventStatus: followup.status === "concluido" ? "concluido" : followup.status === "cancelado" ? "cancelado" : "agendado",
    })),
  ].filter(entry => entry.eventAt);
}

/* Mesmos critérios dos filtros do menu Agenda. */
function isAgendaToday(entry) { return new Date(entry.eventAt).toDateString() === new Date().toDateString(); }
function isAgendaOverdue(entry) { return entry.eventStatus === "agendado" && startOfDay(entry.eventAt) < startOfDay(new Date()); }
function isAgendaWithinWeek(entry) {
  if (entry.eventStatus !== "agendado") return false;
  const end = new Date();
  end.setDate(end.getDate() + 7);
  return new Date(entry.eventAt) >= startOfDay(new Date()) && new Date(entry.eventAt) <= end;
}

function agendaTypeLabel(type) { return (AGENDA_TYPES.find(t => t.id === type) || {}).label || "Evento"; }
function agendaTypeTone(type) {
  return type === "retorno" ? "amber" : type === "demonstracao" ? "violet" : type === "reuniao" ? "blue" : "slate";
}

/* Concluir / cancelar / reabrir um item — vale para evento da agenda e para
   retorno de follow-up, que é como o menu Agenda trata as duas origens. */
function setAgendaEntryStatus(dispatch, notify, entry, status) {
  if (entry.source === "followup") {
    dispatch({ type: "UPDATE_FOLLOWUP", id: entry.id, patch: { status: status === "agendado" ? "pendente" : status } });
  } else {
    dispatch({ type: "UPDATE_AGENDA_EVENT", id: entry.id, patch: { status } });
  }
  notify(status === "concluido" ? "Evento concluído." : status === "cancelado" ? "Evento cancelado." : "Evento reaberto.");
}

function useSelectors(db) {
  return useMemo(() => {
    const leadById = Object.fromEntries(db.leads.map(l => [l.id, l]));
    const openLeads = db.leads.filter(l => l.status !== "Fechado" && l.status !== "Perdido");

    const pendingFollowups = db.followups.filter(f => f.status === "pendente");
    const followupsToday = pendingFollowups.filter(f => actionBucket(f.dueDate) === "hoje");
    const followupsOverdue = pendingFollowups.filter(f => actionBucket(f.dueDate) === "atrasado");
    const followupsUpcoming = pendingFollowups.filter(f => actionBucket(f.dueDate) === "proximo");

    const demosActive = db.demos.filter(d => ["ativa", "atencao"].includes(demoUrgency(d)));
    const demosExpiringSoon = db.demos.filter(d => demoUrgency(d) === "atencao" || demoUrgency(d) === "critica");
    const demosExpired = db.demos.filter(d => demoUrgency(d) === "expirada");
    const demosDraft = db.demos.filter(d => demoUrgency(d) === "criada");

    const proposalsPending = db.proposals.filter(p => ["Enviada", "Em negociação"].includes(p.status));
    const proposalsStale = proposalsPending.filter(p => daysSince(p.proposalDate) >= 4);

    const hotLeads = openLeads.filter(l => l.temperature === "Quente");
    const hotNoNextAction = hotLeads.filter(l => !l.nextAction);
    const closedLeads = db.leads.filter(l => l.status === "Fechado");
    const lostLeads = db.leads.filter(l => l.status === "Perdido");
    const newLeads = db.leads.filter(l => daysSince(l.createdAt) <= 3);

    const noMovement = openLeads.filter(l => {
      const ref = l.lastContactAt || l.createdAt;
      return daysSince(ref) >= 4;
    });

    /* Opportunity value never gets invented — it only exists once a real
       proposal has been sent, so leads without one simply carry no value. */
    const proposalValueByLead = {};
    db.leads.forEach(l => {
      const p = latestProposalForLead(l.id, db.proposals);
      if (p) proposalValueByLead[l.id] = p;
    });
    const negotiationValue = db.proposals
      .filter(p => ["Enviada", "Em negociação"].includes(p.status))
      .reduce((sum, p) => sum + (p.implementationValue || 0), 0);
    const closedValue = db.clients.reduce((sum, c) => sum + (c.contractedValue || 0), 0);

    /* Shared by the Dashboard funnel and the Pipeline (Kanban) view. */
    const pipelineStages = STAGE_GROUPS.map(g => {
      const stageLeads = db.leads.filter(l => g.statuses.includes(l.status));
      const value = stageLeads.reduce((sum, l) => {
        const p = proposalValueByLead[l.id];
        return sum + (p ? (p.implementationValue || 0) : 0);
      }, 0);
      return { ...g, leads: stageLeads, count: stageLeads.length, value };
    });

    /* "Ações de hoje" — every dated commitment due today, ordered by time. */
    const todaysActions = [
      ...followupsToday.map(f => ({ kind: "followup", id: f.id, leadId: f.leadId, date: f.dueDate, label: f.note })),
      ...db.demos.filter(d => demoUrgency(d) !== "expirada" && demoUrgency(d) !== "desativada" && demoUrgency(d) !== "criada" && new Date(d.expiresAt).toDateString() === new Date().toDateString())
        .map(d => ({ kind: "demo", id: d.id, leadId: d.leadId, date: d.expiresAt, label: `Demo de ${leadById[d.leadId]?.company || "lead"} expira` })),
    ].sort((a, b) => new Date(a.date) - new Date(b.date));

    /* Agenda para o Dashboard: os mesmos itens do menu Agenda, agrupados por
       quando acontecem. Pendente = ainda não concluído nem cancelado. */
    const agendaEntries = agendaEntriesOf(db);
    const agendaPending = agendaEntries.filter(e => e.eventStatus === "agendado");
    const agendaOverdue = agendaPending.filter(isAgendaOverdue).sort(byEventAt);
    const agendaToday = agendaPending.filter(isAgendaToday).sort(byEventAt);
    const agendaUpcoming = agendaPending.filter(e => !isAgendaToday(e) && isAgendaWithinWeek(e)).sort(byEventAt);
    const agendaCompletedToday = agendaEntries.filter(e => e.eventStatus === "concluido" && isAgendaToday(e)).sort(byEventAt);
    /* Ordem do bloco do Dashboard: o que é hoje vem primeiro (é o que ele tem
       que fazer agora), depois a semana, e os atrasados por último — os
       atrasados de follow-up já aparecem na Central de atenção logo acima. */
    const agendaHighlights = [...agendaToday, ...agendaUpcoming, ...agendaOverdue];

    /* "Central de atenção" — the five categories called out in the brief,
       each carrying enough context for the UI to offer a one-tap action. */
    const attention = [
      ...followupsOverdue.map(f => ({ id: `fu_${f.id}`, type: "followup_overdue", tone: "red", text: leadById[f.leadId]?.company || "Lead removido", sub: `Follow-up atrasado há ${Math.abs(daysDiff(f.dueDate, new Date()))} dia(s) — ${f.note}`, leadId: f.leadId, refId: f.id })),
      ...followupsToday.map(f => ({ id: `ft_${f.id}`, type: "followup_today", tone: "amber", text: leadById[f.leadId]?.company || "Lead removido", sub: `Follow-up hoje às ${fmtTime(f.dueDate)} — ${f.note}`, leadId: f.leadId, refId: f.id })),
      ...demosExpiringSoon.map(d => ({ id: `dc_${d.id}`, type: "demo_expiring", tone: demoUrgency(d) === "critica" ? "red" : "amber", text: leadById[d.leadId]?.company || "Lead removido", sub: `Demo próxima de expirar — ${remainingLabel(d)}`, leadId: d.leadId, refId: d.id })),
      ...proposalsStale.map(p => ({ id: `pp_${p.id}`, type: "proposal_stale", tone: "amber", text: leadById[p.leadId]?.company || "Lead removido", sub: `Proposta sem retorno há ${daysSince(p.proposalDate)} dias`, leadId: p.leadId, refId: p.id })),
      ...hotNoNextAction.map(l => ({ id: `hn_${l.id}`, type: "hot_no_action", tone: "amber", text: l.company, sub: "Lead quente sem próxima ação definida", leadId: l.id })),
    ];
    const attentionSorted = [...attention].sort((a, b) => (a.tone === "red" ? 0 : 1) - (b.tone === "red" ? 0 : 1));

    const bySegment = groupCount(db.leads, l => l.segment);
    const byCity = groupCount(db.leads, l => l.city);
    const byOwner = groupCount(db.leads, l => userName(l.owner));
    const bySource = groupCount(db.leads, l => l.source);

    const funnel = [
      { label: "Leads", value: db.leads.length },
      { label: "Contatados", value: db.leads.filter(l => db.interactions.some(i => i.leadId === l.id)).length },
      { label: "Respostas", value: db.leads.filter(l => db.interactions.some(i => i.leadId === l.id && ["Respondeu", "Atendeu", "Pediu preço", "Pediu proposta", "Demonstrou interesse"].includes(i.result))).length },
      { label: "Demos enviadas", value: db.demos.filter(d => d.sentAt).length },
      { label: "Propostas", value: db.proposals.length },
      { label: "Fechados", value: closedLeads.length },
    ];

    const lossByReason = groupCount(db.leads.filter(l => l.status === "Perdido"), l => l.lossReason || "Não informado");

    const channelStats = CHANNELS.map(ch => {
      const total = db.interactions.filter(i => i.channel === ch).length;
      const responded = db.interactions.filter(i => i.channel === ch && ["Respondeu", "Atendeu", "Pediu preço", "Pediu proposta", "Demonstrou interesse", "Demo enviada"].includes(i.result)).length;
      return { channel: ch, total, responded };
    }).filter(c => c.total > 0);

    const perOwner = USERS.map(u => {
      const leads = db.leads.filter(l => l.owner === u.id);
      const contacts = db.interactions.filter(i => i.user === u.id).length;
      const responses = db.interactions.filter(i => i.user === u.id && ["Respondeu", "Atendeu", "Pediu preço", "Pediu proposta", "Demonstrou interesse"].includes(i.result)).length;
      const proposals = db.proposals.filter(p => leads.some(l => l.id === p.leadId)).length;
      const closed = leads.filter(l => l.status === "Fechado").length;
      return { user: u.name, leads: leads.length, contacts, responses, proposals, closed, conversion: leads.length ? Math.round((closed / leads.length) * 100) : 0 };
    });

    return {
      leadById, openLeads, pendingFollowups, followupsToday, followupsOverdue, followupsUpcoming,
      demosActive, demosExpiringSoon, demosExpired, demosDraft, proposalsPending, proposalsStale,
      hotLeads, hotNoNextAction, closedLeads, lostLeads, newLeads, noMovement, todaysActions,
      agendaEntries, agendaPending, agendaToday, agendaOverdue, agendaUpcoming,
      agendaCompletedToday, agendaHighlights,
      attention: attentionSorted, proposalValueByLead, negotiationValue, closedValue, pipelineStages,
      bySegment, byCity, byOwner, bySource, funnel, lossByReason, channelStats, perOwner,
    };
  }, [db]);
}

function groupCount(items, keyFn) {
  const map = {};
  items.forEach(item => { const k = keyFn(item) || "—"; map[k] = (map[k] || 0) + 1; });
  return Object.entries(map).sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value }));
}

/* Which lead-detail tab an alert or search result should land on. */
function tabForAttentionType(type) {
  if (type === "demo_expiring") return "demo";
  if (type === "proposal_stale") return "proposta";
  if (type === "followup_overdue" || type === "followup_today") return "followups";
  return "geral";
}

/* Global search across the entities the brief calls out explicitly:
   empresa, contato, cidade, telefone, proposta, cliente. */
function globalSearch(query, db) {
  const q = (query || "").trim().toLowerCase();
  if (q.length < 1) return [];
  const results = [];
  db.leads.forEach(l => {
    const hay = [l.company, l.contactName, l.city, l.phone, l.whatsapp, l.segment].filter(Boolean).join(" ").toLowerCase();
    if (hay.includes(q)) results.push({ id: `sl_${l.id}`, leadId: l.id, tab: "geral", title: l.company, sub: `${l.city} · ${l.segment}`, icon: Building2 });
  });
  db.clients.forEach(c => {
    if ((c.company || "").toLowerCase().includes(q) && !results.some(r => r.leadId === c.leadId)) {
      results.push({ id: `sc_${c.id}`, leadId: c.leadId, tab: "geral", title: c.company, sub: "Cliente ativo", icon: UserCheck });
    }
  });
  db.proposals.forEach(p => {
    if ((p.plan || "").toLowerCase().includes(q)) {
      const lead = db.leads.find(l => l.id === p.leadId);
      if (lead) results.push({ id: `sp_${p.id}`, leadId: p.leadId, tab: "proposta", title: lead.company, sub: `Proposta — ${p.plan}`, icon: FileText });
    }
  });
  return results.slice(0, 8);
}

function LoginScreen({ onLogin, apiProblem, sessaoExpirada, onTentarAgora, tentando }) {
  const [selectedUser, setSelectedUser] = useState(null);
  const [password, setPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [changeError, setChangeError] = useState("");
  const [loading, setLoading] = useState(false);
  const [changingPassword, setChangingPassword] = useState(false);
  const [requiresPasswordChange, setRequiresPasswordChange] = useState(false);
  const [manualPasswordChange, setManualPasswordChange] = useState(false);
  const [registering, setRegistering] = useState(false);
  const [registerName, setRegisterName] = useState("");
  const [registerId, setRegisterId] = useState("");
  const [adminUserId, setAdminUserId] = useState("fabricio");
  const [adminPassword, setAdminPassword] = useState("");
  /* Lista de quem pode entrar. Começa com os dois de sempre e, se o backend
     responder, recebe também os usuários criados no banco — é assim que uma
     terceira pessoa da equipe aparece na tela sem mexer em código: um INSERT na
     tabela users e pronto. Sem backend de pé, a lista antiga continua na tela. */
  const [pessoas, setPessoas] = useState(() => USERS.map((user) => ({ ...user })));

  useEffect(() => {
    let vivo = true;
    crmApi.auth
      .users()
      .then((lista) => {
        if (!vivo || !Array.isArray(lista) || !lista.length) return;
        lista.forEach((user) => ensureKnownUser(user.id, user.name));
        setPessoas(USERS.map((user) => ({ ...user })));
      })
      .catch(() => { /* sem resposta: mantém a lista local */ });
    return () => { vivo = false; };
  }, []);

  const chooseUser = async (user) => {
    setSelectedUser(user);
    setPassword("");
    setNewPassword("");
    setConfirmPassword("");
    setError("");
    setChangeError("");
    setChangingPassword(false);
    setRequiresPasswordChange(false);
    setManualPasswordChange(false);
    if (!user) return;
    try {
      const apiStatus = await authStatusThroughApi(user.id);
      if (apiStatus) {
        setRequiresPasswordChange(apiStatus.mustChangePassword);
      } else {
        const record = await ensureAuthRecord(user.id);
        setRequiresPasswordChange(record.mustChangePassword);
          }
    } catch (err) {
      const record = await ensureAuthRecord(user.id);
      setRequiresPasswordChange(record.mustChangePassword);
      }
  };

  const handleLogin = async (event) => {
    event.preventDefault();
    if (!selectedUser) return;
    setLoading(true);
    setError("");
    try {
      const apiResult = await loginThroughApi(selectedUser.id, password);
      if (apiResult === null) {
        const result = await verifyPassword(selectedUser.id, password);
        if (!result.matches) {
          setError("Senha incorreta.");
          return;
        }
        if (result.record.mustChangePassword) {
          setRequiresPasswordChange(true);
          setManualPasswordChange(false);
          setChangingPassword(true);
          return;
        }
        writeSessionUserId(selectedUser.id, selectedUser.name);
        onLogin(selectedUser.id);
        return;
      }
      if (!apiResult.ok) {
        setError(apiResult.message || "Usuário ou senha incorretos.");
        return;
      }
      if (apiResult.data.mustChangePassword) {
        setRequiresPasswordChange(true);
        setManualPasswordChange(false);
        setChangingPassword(true);
        return;
      }
      const logado = apiResult.data.user || {};
      writeSessionUserId(logado.id || selectedUser.id, logado.name || selectedUser.name);
      onLogin(logado.id || selectedUser.id);
    } catch (err) {
      setError("Não foi possível validar o acesso. Tente novamente.");
      console.error("Erro no login:", err);
    } finally {
      setLoading(false);
    }
  };

  const handleRegister = async (event) => {
    event.preventDefault();
    const id = registerId.trim().toLowerCase().replace(/\s+/g, "-");
    const name = registerName.trim();
    if (name.length < 2) { setError("Informe o nome do novo usuário."); return; }
    if (id.length < 3) { setError("Informe um identificador com pelo menos 3 caracteres."); return; }
    if (!adminPassword) { setError("Informe a senha do administrador."); return; }
    setLoading(true);
    setError("");
    try {
      const result = await crmApi.auth.register(id, name, adminUserId, adminPassword);
      if (!result.ok || !result.data) {
        setError(result.message || "Não foi possível cadastrar o usuário.");
        return;
      }
      const novo = result.data;
      ensureKnownUser(novo.id, novo.name);
      setPessoas(USERS.map((user) => ({ ...user })));
      setRegistering(false);
      setRegisterName("");
      setRegisterId("");
      setAdminPassword("");
      setError(`Usuário cadastrado. A senha inicial é ${DEFAULT_PASSWORD}.`);
    } catch (err) {
      setError(err.message || "Não foi possível cadastrar o usuário.");
    } finally {
      setLoading(false);
    }
  };

  const handleChangePassword = async (event) => {
    event.preventDefault();
    if (!selectedUser) return;
    if (newPassword.length < 8) {
      setChangeError("A nova senha deve ter pelo menos 8 caracteres.");
      return;
    }
    if (!password) {
      setChangeError("Informe sua senha atual.");
      return;
    }
    if (newPassword !== confirmPassword) {
      setChangeError("A confirmação da senha não coincide.");
      return;
    }
    setLoading(true);
    setChangeError("");
    try {
      const apiResult = await changePasswordThroughApi(selectedUser.id, password, newPassword);
      if (apiResult === null) {
        const result = await verifyPassword(selectedUser.id, password);
        if (!result.matches) {
          setChangeError("Senha atual incorreta.");
          return;
        }
        await savePermanentPassword(selectedUser.id, newPassword);
      } else if (!apiResult.ok) {
        setChangeError(apiResult.message || "Não foi possível alterar a senha.");
        return;
      }
      const novoLogado = (apiResult && apiResult.data && apiResult.data.user) || {};
      writeSessionUserId(novoLogado.id || selectedUser.id, novoLogado.name || selectedUser.name);
      onLogin(novoLogado.id || selectedUser.id);
    } catch (err) {
      setChangeError("Não foi possível salvar a nova senha. Tente novamente.");
      console.error("Erro ao trocar senha:", err);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="gc-root gc-login-shell min-h-screen flex items-center justify-center px-4 py-8">
      <Tokens />
      <div className="w-full max-w-sm gc-login-card">
        {sessaoExpirada && (
          <div className="rounded-xl px-4 py-3 text-sm"
            style={{ background: "rgba(217,119,6,0.10)", border: "1px solid rgba(217,119,6,0.35)", color: "#8A5A12", marginBottom: "24px" }}>
            <strong className="block">Precisa entrar de novo</strong>
            <span className="block mt-1" style={{ color: "var(--ink-soft)" }}>{sessaoExpirada}</span>
          </div>
        )}
        {apiProblem && (
          <div className="rounded-xl px-4 py-3 text-sm"
            style={{ background: "rgba(220,38,38,0.08)", border: "1px solid rgba(220,38,38,0.35)", color: "var(--danger)", marginBottom: "24px" }}>
            <strong className="block">{/banco/.test(apiProblem.tipo || "") ? "O banco de dados não está respondendo" : "O backend não está respondendo"}</strong>
            <span className="block mt-1" style={{ color: "var(--ink-soft)" }}>{apiProblem.motivo}</span>
            {apiProblem.tipo === "banco-fora" && (
              /endereço|DNS/i.test(apiProblem.motivo || "") ? (
                <span className="block mt-1 text-xs" style={{ color: "var(--slate)" }}>
                  O run-crm.bat não tem culpa aqui: ele respondeu. Abra dashboard.supabase.com e veja se o projeto está Paused (Restaure) ou se sumiu da lista.
                </span>
              ) : (
                <span className="block mt-1 text-xs" style={{ color: "var(--slate)" }}>
                  O banco está respondendo, só que vazio: cole o conteúdo de backend\database\banco_novo.sql no SQL Editor do projeto e clique em Run. Depois use "Tentar agora" — não precisa recarregar.
                </span>
              )
            )}
            <span className="block mt-1 text-xs" style={{ color: "var(--slate)" }}>
              Nada aparece na tela enquanto ele não voltar. Nova tentativa a cada 5 s.
            </span>
            <button type="button" onClick={onTentarAgora} disabled={tentando}
              className="mt-2 text-xs gc-focus rounded"
              style={{ color: "var(--danger)", background: "transparent", border: "none", padding: 0, cursor: "pointer", textDecoration: "underline", textUnderlineOffset: "2px" }}>
              {tentando ? "Testando..." : "Tentar agora"}
            </button>
          </div>
        )}
        <div className="mb-7 text-center">
          <div className="gc-login-logo w-14 h-14 rounded-2xl mx-auto mb-4 flex items-center justify-center gc-display text-lg font-semibold text-white" style={{ background: "var(--accent)" }}>GC</div>
          <h1 className="gc-display text-xl font-semibold">Gestão Comercial</h1>
          <p className="text-sm mt-1" style={{ color: "var(--slate)" }}>
            {changingPassword ? "Altere sua senha" : selectedUser ? "Informe seus dados de acesso" : "Quem está acessando?"}
          </p>
        </div>

        {!selectedUser && !registering ? (
          <>
            <div className="space-y-2">
              {pessoas.map((user) => (
                <label key={user.id} onClick={() => chooseUser(user)}
                  className="gc-login-user w-full flex items-center gap-3 px-4 py-3.5 rounded-xl gc-focus text-left cursor-pointer"
                  style={{ background: "var(--surface)", border: "1px solid var(--line)" }}>
                  <span className="w-9 h-9 rounded-full flex items-center justify-center font-semibold text-sm" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)" }}>
                    {user.name[0]}
                  </span>
                  <span className="font-medium text-sm flex-1">{user.name}</span>
                </label>
              ))}
            </div>
            <div className="gc-login-divider my-5">ou</div>
            <div className="flex gap-2">
              <Button type="button" variant="secondary" className="flex-1" onClick={() => { setRegistering(true); setError(""); }}>
                Cadastrar
              </Button>
              <Button type="button" className="flex-1" disabled={!pessoas.length} onClick={() => chooseUser(pessoas[0])}>
                Entrar
              </Button>
            </div>
            {error && <div className="text-sm text-center mt-3" style={{ color: "var(--accent-ink)" }}>{error}</div>}
          </>
        ) : registering ? (
          <form onSubmit={handleRegister} className="space-y-4">
            <div className="rounded-xl px-4 py-3 text-sm" style={{ background: "var(--accent-soft)", color: "var(--accent-ink)", border: "1px solid var(--accent-soft-strong)" }}>
              Cadastro protegido por Fabricio ou Erick.
            </div>
            <Field label="Nome do novo usuário" required>
              <TextInput value={registerName} onChange={(e) => setRegisterName(e.target.value)} autoFocus placeholder="Ex.: Ana Souza" />

            <Field label="Identificador de acesso" required hint="Use letras, números ou hífen.">
              <TextInput value={registerId} onChange={(e) => setRegisterId(e.target.value)} placeholder="Ex.: ana" autoComplete="username" />

            <Field label="Administrador" required>
              <Select value={adminUserId} onChange={(e) => setAdminUserId(e.target.value)}>
                <option value="fabricio">Fabricio</option>
                <option value="erick">Erick</option>
              </Select>
            </Field>
            <Field label="Senha do administrador" required>
              <TextInput type="password" value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} placeholder="Senha de Fabricio ou Erick" autoComplete="current-password" />
            </Field>
            {error && <div className="text-sm text-center" style={{ color: "var(--danger)" }}>{error}</div>}
            <Button type="submit" className="w-full" disabled={loading || !registerName || !registerId || !adminPassword}>
              {loading ? "Cadastrando..." : "Cadastrar"}
            </Button>
            <button type="button" onClick={() => { setRegistering(false); setError(""); }} className="w-full text-center text-sm gc-focus rounded py-1" style={{ color: "var(--slate)" }}>
              Entrar

              <Field label="Senha atual" required>
                <TextInput type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoFocus placeholder="Digite sua senha atual" autoComplete="current-password" />
              </Field>

            <Field label="Nova senha" required hint="Mínimo de 8 caracteres.">
              <TextInput type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} autoFocus={!manualPasswordChange} placeholder="Digite a nova senha" autoComplete="new-password" />
            </Field>

              <TextInput type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} placeholder="Repita a nova senha" autoComplete="new-password" />
            </Field>
            {changeError && <div className="text-sm text-center" style={{ color: "var(--danger)" }}>{changeError}</div>}
            <Button type="submit" className="w-full" disabled={loading || (manualPasswordChange && !password) || !newPassword || !confirmPassword}>
              {loading ? "Salvando..." : manualPasswordChange ? "Salvar nova senha" : "Salvar senha e acessar"}
            </Button>
            <button type="button" onClick={() => { setChangingPassword(false); setManualPasswordChange(false); setPassword(""); setNewPassword(""); setConfirmPassword(""); setError(""); setChangeError(""); }} className="w-full text-center text-sm gc-focus rounded py-1" style={{ color: "var(--slate)" }}>

            </button>
          </form>
        )}

        <p className="text-xs text-center mt-6" style={{ color: "var(--slate)" }}>
          O cadastro de novos usuários exige a senha de Fabricio ou Erick.
        </p>
      </div>
    </div>
  );
}
