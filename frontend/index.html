              <button type="button" onClick={() => setSidebarView("conversations")} className="rounded-md px-2 py-1.5 text-xs font-medium" style={{ background: sidebarView === "conversations" ? "var(--surface)" : "transparent", color: "var(--ink)" }}>Conversas ({conversations.length})</button>
              <button type="button" onClick={() => setSidebarView("leads")} className="rounded-md px-2 py-1.5 text-xs font-medium" style={{ background: sidebarView === "leads" ? "var(--surface)" : "transparent", color: "var(--ink)" }}>Leads ({leads.length})</button>
            </div>
            {sidebarView === "conversations" && <div className="relative">
              <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: "var(--slate)" }} />
              <input value={conversationSearch} onChange={event => setConversationSearch(event.target.value)} placeholder="Buscar conversa" title="Busca por nome, empresa, telefone ou trecho da mensagem" aria-label="Buscar conversa" className="w-full pl-9 pr-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)", background: "var(--surface)" }} />
            </div>}
            {sidebarView === "leads" && <div className="flex gap-2">
              <input value={leadSearch} onChange={event => setLeadSearch(event.target.value)} placeholder="Buscar lead ou telefone" aria-label="Buscar lead para conversar" className="min-w-0 flex-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)", background: "var(--surface)" }} />
              <Button variant="secondary" icon={RefreshCw} onClick={loadLeads} disabled={loadingLeads}>Atualizar</Button>
            </div>}
          </div>
          {sidebarView === "conversations" ? (
            loading ? <div className="p-4 text-sm" style={{ color: "var(--slate)" }}>Carregando conversas…</div> : conversations.length === 0 ? <div className="p-4 text-sm" style={{ color: "var(--slate)" }}>Nenhuma conversa ainda. Abra a aba Leads para escolher um contato cadastrado ou aguarde uma nova mensagem recebida.</div> : conversationRows.length === 0 ? <div className="p-4 text-sm" style={{ color: "var(--slate)" }}>{`Nenhuma conversa encontrada para “${conversationSearch.trim()}”. Limpe a busca para ver todas as conversas.`}</div> : <div className="flex-1 min-h-0 overflow-y-auto">{conversationRows.map(({ item, lead }) => (
            <div key={item.id} className="relative"><button type="button" onClick={() => selectConversation(item.id)} className="w-full text-left px-4 py-3 pr-10 transition-colors" style={{ background: freshIds.has(item.id) ? "var(--accent-soft-strong)" : conversation?.id === item.id ? "var(--accent-soft)" : item.unreadCount > 0 ? "var(--accent-soft)" : "transparent", borderBottom: "1px solid var(--line)", boxShadow: freshIds.has(item.id) ? "inset 4px 0 0 var(--accent)" : item.unreadCount > 0 ? "inset 3px 0 0 var(--accent)" : "none", fontWeight: freshIds.has(item.id) || item.unreadCount > 0 ? 600 : undefined }}>
              <div className="flex items-center justify-between gap-2"><span className="font-medium text-sm truncate">{item.contact.name}</span><span className="text-[11px] shrink-0" style={{ color: "var(--slate)" }}>{formatTime(item.lastMessage?.timestamp)}</span></div>
              <div className="text-xs mt-0.5 truncate" style={{ color: "var(--slate)" }}>{item.contact.company} · {item.contact.phone}</div>
              <div className="flex items-center gap-1.5 flex-wrap mt-1.5">
                {freshIds.has(item.id) && <span className="inline-flex items-center gap-1 rounded-full text-[11px] font-semibold px-2 py-0.5" style={{ background: "var(--accent)", color: "#fff" }}>Nova mensagem</span>}
                {lead && <span className="inline-flex items-center rounded-full text-[11px] font-medium px-2 py-0.5" style={TONE_STYLE(STATUS_TONE[lead.status] || "slate")} title={`Etapa do funil de ${lead.contactName || lead.company}`}>{lead.status || "Sem etapa"}</span>}
                <span className="inline-flex items-center gap-1 rounded-full text-[11px] font-medium px-2 py-0.5" style={TONE_STYLE(CONVERSATION_TONE[item.status] || conversationStatusMeta(item.status).tone)} title={conversationStatusMeta(item.status).hint}>
                  <span aria-hidden="true">{conversationStatusMeta(item.status).emoji}</span>
                  {item.status || DEFAULT_CONVERSATION_STATUS}
                </span>
              </div>
              <div className="flex items-center justify-between gap-2 mt-1.5"><span className="text-xs truncate" style={{ color: "var(--ink-soft)" }}>{item.lastMessage?.content || "Sem mensagens"}</span>{item.unreadCount > 0 && <span className="text-[10px] rounded-full px-1.5 py-0.5" style={{ background: "var(--accent)", color: "white" }}>{item.unreadCount}</span>}</div>
            </button>
            <button type="button" onClick={() => removeConversation(item)} disabled={removingConversationId !== null} aria-label={`Excluir conversa de ${item.contact?.name || item.contact?.phone || ""}`} title="Excluir esta conversa da lista" className="absolute rounded-md p-1 transition-colors disabled:opacity-40" style={{ right: 8, top: 10, color: "var(--slate)", background: "var(--surface-sunken)" }}><Trash2 size={14} /></button>
            </div>
            ))}</div>
          ) : loadingLeads ? <div className="p-4 text-sm" style={{ color: "var(--slate)" }}>Carregando leads…</div> : filteredLeads.length === 0 ? <div className="p-4 text-sm" style={{ color: "var(--slate)" }}>{leads.length ? "Nenhum lead encontrado para esta busca." : "Nenhum lead cadastrado."}</div> : <div className="flex-1 min-h-0 overflow-y-auto">{filteredLeads.map(lead => {
            const phoneValue = [lead.whatsapp, lead.phone].find(value => {
              const digits = String(value || "").replace(/\D/g, "");
              return digits.length >= 8 && digits.length <= 15;
            });
            const phone = String(phoneValue || "").replace(/\D/g, "");
            const canOpen = Boolean(phone);
            return <button key={lead.id} type="button" onClick={() => openLeadConversation(lead)} disabled={!canOpen || openingLeadId !== null} className="w-full text-left px-4 py-3 transition-colors disabled:opacity-60" style={{ borderBottom: "1px solid var(--line)" }} title={canOpen ? "Abrir conversa com este lead" : "Cadastre um telefone ou WhatsApp válido no lead"}>
              <div className="flex items-center justify-between gap-2"><span className="font-medium text-sm truncate">{lead.contactName || lead.company || "Lead sem nome"}</span><MessageCircle size={15} className="shrink-0" style={{ color: "var(--accent)" }} /></div>
              <div className="text-xs mt-0.5 truncate" style={{ color: "var(--slate)" }}>{lead.company || "Empresa não informada"} · {lead.status || "Sem etapa"}</div>
              <div className="text-xs mt-1 truncate" style={{ color: canOpen ? "var(--ink-soft)" : "var(--danger)" }}>{canOpen ? phoneValue : "Sem telefone/WhatsApp válido"}</div>
              {openingLeadId === lead.id && <div className="text-[11px] mt-1" style={{ color: "var(--accent)" }}>Abrindo conversa…</div>}
            </button>;
          })}</div>}
        </section>

        <section className="overflow-hidden flex flex-col" style={{ ...card, height: "min(920px, max(500px, calc(100dvh - 260px)))" }} aria-label="Mensagens do WhatsApp">
          {conversation ? <>
            <header className="px-4 py-3 flex items-center justify-between gap-3" style={{ borderBottom: "1px solid var(--line)" }}><div className="min-w-0"><div className="font-medium text-sm truncate">{conversation.contact.name}</div><div className="text-xs mt-0.5 truncate" style={{ color: "var(--slate)" }}>{conversation.contact.company} · {conversation.contact.phone}</div></div><div className="flex items-center gap-2 shrink-0">{activeLead && <Pill tone={STATUS_TONE[activeLead.status] || "slate"}>{activeLead.status}</Pill>}{connected && <button type="button" onClick={puxarMensagensAntigas} disabled={historico.buscando} title="Pedir ao celular as mensagens anteriores desta conversa" aria-label="Puxar mensagens antigas" className="rounded-md transition-colors" style={{ color: "var(--slate)", background: "var(--surface-sunken)", padding: 6, opacity: historico.buscando ? 0.4 : 1, cursor: historico.buscando ? "not-allowed" : "pointer" }}><History size={15} /></button>}{statusMenuControl}</div></header>
            {(historico.aviso || historico.erro || historico.buscando) && (
              <div className="px-4 py-2 text-xs" style={{ borderBottom: "1px solid var(--line)", background: "var(--surface-sunken)", color: historico.erro ? "var(--danger)" : "var(--ink-soft)" }}>
                {historico.buscando ? "Buscando as mensagens antigas…" : (historico.erro || historico.aviso)}
              </div>
            )}
            <div className="flex-1 min-h-0 p-4 space-y-3 overflow-y-auto">{conversation.messages.map(message => <div key={message.id} className={`flex ${message.direction === "outgoing" ? "justify-end" : "justify-start"}`}><div className="max-w-[85%] rounded-xl px-3 py-2" style={{ background: message.direction === "outgoing" ? "var(--accent-soft)" : "var(--surface-sunken)", color: "var(--ink)" }}>{message.hasAudio ? <VoiceNote conversationId={conversation.id} message={message} /> : <div className="text-sm whitespace-pre-wrap break-words">{message.content}</div>}<div className="text-[10px] text-right mt-1" style={{ color: "var(--slate)" }}>{formatTime(message.timestamp)} · {messageStatusLabel(message.status)}{message.direction === "outgoing" && message.sentBy === ENVIADA_PELO_CELULAR ? " · pelo celular" : ""}</div></div></div>)}<div ref={messagesEndRef} /></div>
            <form onSubmit={send} className="p-3 space-y-2" style={{ borderTop: "1px solid var(--line)" }}>
              <input
                ref={imageInputRef}
                type="file"
                accept="image/jpeg,image/png,image/webp"
                className="hidden"
                aria-label="Selecionar imagem"
                onChange={event => { selectAttachment(event.target.files?.[0], "image"); event.target.value = ""; }}
              />
              <input
                ref={audioInputRef}
                type="file"
                accept="audio/ogg,audio/mpeg,audio/mp4,audio/webm,audio/wav,audio/aac"
                className="hidden"
                aria-label="Selecionar áudio"
                onChange={event => { selectAttachment(event.target.files?.[0], "audio"); event.target.value = ""; }}
              />
              {attachment && (
                <div className={`${attachment.type.startsWith("image/") ? "inline-flex w-fit max-w-full" : "flex w-full"} items-center gap-3 rounded-lg border p-2`} style={{ borderColor: "var(--line)", background: "var(--surface-sunken)" }}>
                  {attachment.type.startsWith("image/")
                    ? <img src={attachmentPreviewUrl} alt="Prévia da imagem para envio" className="h-12 w-12 shrink-0 rounded-md object-contain" style={{ background: "var(--surface)" }} />
                    : <audio src={attachmentPreviewUrl} controls className="min-w-0 flex-1" aria-label="Prévia do áudio para envio" />}
                  <div className="min-w-0 flex-1">
                    <div className="truncate text-xs font-medium">{attachment.name}</div>
                    <div className="text-[11px]" style={{ color: "var(--slate)" }}>{(attachment.size / 1024 / 1024).toFixed(2)} MB · {attachment.type.startsWith("image/") ? "Imagem" : "Áudio"}</div>
                  </div>
                  <button type="button" onClick={() => setAttachment(null)} className="rounded-md p-1.5" style={{ color: "var(--slate)" }} aria-label="Remover anexo"><X size={16} /></button>
                </div>
              )}
              <div className="flex flex-nowrap items-center gap-2 overflow-x-auto">
                <Button type="button" variant="secondary" size="sm" icon={ImageIcon} onClick={() => imageInputRef.current?.click()} disabled={!connected || sending} className="shrink-0">Imagem</Button>
                <Button type="button" variant="secondary" size="sm" icon={Paperclip} onClick={() => audioInputRef.current?.click()} disabled={!connected || sending} className="shrink-0">Áudio</Button>
                <Button type="button" variant={recording ? "danger" : "secondary"} size="sm" icon={Mic} onClick={toggleAudioRecording} disabled={!connected || sending} className="shrink-0">{recording ? "Parar gravação" : "Gravar áudio"}</Button>
                {recording && <span className="text-xs" style={{ color: "var(--danger)" }} role="status">Gravando…</span>}
                <button
                  type="button"
                  onClick={() => setQuickRepliesOpen(open => !open)}
                  aria-expanded={quickRepliesOpen}
                  aria-controls="whatsapp-quick-replies"
                  disabled={!connected || sending}
                  className="inline-flex shrink-0 items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-medium transition-colors disabled:opacity-40"
                  style={{ color: "var(--accent-ink)", background: "var(--accent-soft)", border: "1px solid var(--line)" }}
                >
                  <MessageCircle size={14} />
                  Respostas rápidas
                  <ChevronDown size={13} style={{ transform: quickRepliesOpen ? "rotate(180deg)" : "none" }} />
                </button>
                <button
                  type="button"
                  onClick={requestSuggestions}
                  aria-busy={suggesting}
                  aria-controls="whatsapp-ia-sugestoes"
                  aria-expanded={suggestionsOpen}
                  disabled={suggesting || sending || generatingAudio || sendingGeneratedAudio}
                  title={aiInfo && aiInfo.enabled === false
                    ? "IA ainda não ativada: dê dois cliques em CONFIGURAR_IA_GROQ.bat e cole a chave gratuita da Groq."
                    : "Ler a última mensagem e sugerir respostas curtas no seu tom"}
                  className="inline-flex shrink-0 items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-medium transition-colors disabled:opacity-40"
                  style={{ color: "var(--accent-ink)", background: "var(--accent-soft)", border: "1px solid var(--line)" }}
                >
                  <Sparkles size={14} />
                  {suggesting ? "Lendo a conversa…" : "Outras respostas"}
                </button>
              </div>
              {quickRepliesOpen && (
                <div id="whatsapp-quick-replies" className="rounded-lg border p-2 space-y-1" style={{ borderColor: "var(--line)", background: "var(--surface-sunken)" }} role="group" aria-label="Modelos de resposta rápida">
                  <div className="px-2 pb-1 text-[11px]" style={{ color: "var(--slate)" }}>Escolha um modelo para preencher a mensagem; revise antes de enviar.</div>
                  {WHATSAPP_QUICK_REPLIES.map(reply => (
                    <button
                      key={reply.label}
                      type="button"
                      onClick={() => selectQuickReply(reply)}
                      className="w-full rounded-md px-2 py-1.5 text-left text-xs transition-colors hover:opacity-80"
                      style={{ color: "var(--ink)", background: "var(--surface)" }}
                    >
                      {reply.label}
                    </button>
                  ))}
                </div>
              )}
              {suggestionsOpen && (
                <div id="whatsapp-ia-sugestoes" className="rounded-lg border p-2 space-y-1" style={{ borderColor: "var(--line)", background: "var(--surface-sunken)" }} role="group" aria-label="Sugestões de resposta da IA">
                  <div className="flex items-center justify-between gap-2 px-2 pb-1">
                    <span className="text-[11px]" style={{ color: "var(--slate)" }}>
                      {suggesting
                        ? "A IA está lendo a última mensagem…"
                        : "Clique numa sugestão para jogá-la no campo. Nenhuma delas é enviada sozinha."}
                    </span>
                    <button type="button" onClick={() => setSuggestionsOpen(false)} className="rounded-md p-1.5 shrink-0" style={{ color: "var(--slate)" }} aria-label="Fechar sugestões da IA"><X size={14} /></button>
                  </div>
                  {suggestions.map((text, index) => (
                    <button
                      key={`${index}-${text.slice(0, 16)}`}
                      type="button"
                      onClick={() => useSuggestion(text)}
                      className="w-full rounded-md px-2 py-1.5 text-left text-xs whitespace-pre-wrap transition-colors hover:opacity-80"
                      style={{ color: "var(--ink)", background: "var(--surface)" }}
                    >
                      {text}
                    </button>
                  ))}
                  {!suggesting && !suggestions.length && (
                    <div className="px-2 py-1.5 text-xs" style={{ color: "var(--slate)" }}>
                      A IA não devolveu sugestões. Clique em "Outras respostas" de novo.
                    </div>
                  )}
                </div>
              )}
              <TextArea value={draft} onChange={event => { setDraft(event.target.value); setGeneratedAudioUrl(""); setGeneratedAudioBlob(null); }} onKeyDown={event => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send(); } }} placeholder={attachment?.type.startsWith("image/") ? "Legenda da imagem (opcional)…" : "Digite uma mensagem…"} rows={2} maxLength={4000} disabled={!connected || sending || generatingAudio || sendingGeneratedAudio} aria-label={attachment?.type.startsWith("image/") ? "Legenda da imagem" : "Mensagem"} />
              {/* Geração de áudio por IA ocultada temporariamente. */}
              {generatedAudioUrl && (
                <div className="flex flex-wrap items-center gap-2 rounded-lg border p-2" style={{ borderColor: "var(--line)", background: "var(--surface-sunken)" }}>
                  <audio src={generatedAudioUrl} controls className="min-w-0 flex-1" aria-label="Prévia do áudio gerado por IA" />
                  <Button type="button" icon={Mic} onClick={sendGeneratedDraftAudio} disabled={!connected || sending || generatingAudio || sendingGeneratedAudio}>
                    {sendingGeneratedAudio ? "Enviando voz…" : "Enviar nota de voz"}
                  </Button>
                </div>
              )}
              <div className="flex items-center justify-between gap-2 flex-wrap"><span className="text-xs" style={{ color: "var(--slate)" }}>Mensagens recebidas aparecem automaticamente.</span><Button type="submit" icon={Send} disabled={!connected || sending || generatingAudio || sendingGeneratedAudio || (!draft.trim() && !attachment)}>{sending ? "Enviando…" : "Enviar"}</Button></div>
            </form>
          </> : <div className="flex-1 flex items-center justify-center p-6"><EmptyState icon={MessageCircle} title="Selecione uma conversa" hint={connected ? "Envie uma mensagem nova para o WhatsApp conectado; o histórico anterior não é importado automaticamente." : "Depois que o WhatsApp estiver conectado, as novas mensagens recebidas serão sincronizadas aqui."} /></div>}
        </section>
      </div>
    </div>
  );
}

/* A tela do backend fora do ar. Não é aviso que fecha nem "modo local": ela
   troca o conteúdo inteiro, porque com o servidor desligado não existe dado
   nenhum para mostrar. Some sozinha no instante em que o /health volta a
   responder (a tentativa é a cada 5 s, e também quando ele traz a aba de volta). */
function BackendProblemScreen({ problema, onTentarAgora, tentando }) {
  const semSupabase = problema.tipo === "sem-supabase";
  /* Banco configurado no .env, mas o endereço dele não responde: é outro
     problema, com outra solução, e as instruções de "abra o run-crm.bat"
     levariam a pessoa a reiniciar um servidor que está perfeito. */
  const bancoFora = problema.tipo === "banco-fora";
  const hora = problema.em ? problema.em.toLocaleTimeString("pt-BR") : "--:--:--";
  return (
    <div className="gc-root min-h-screen flex items-center justify-center px-4">
      <Tokens />
      <div className="w-full" style={{ maxWidth: "620px" }} role="alert" aria-live="assertive">
        <div className="rounded-2xl" style={{ background: "var(--surface)", border: `1px solid var(--line)`, boxShadow: "0 12px 32px rgba(23,25,28,0.12)", padding: "28px" }}>
          <div className="flex items-start" style={{ gap: "12px" }}>
            <span className="shrink-0 rounded-full" style={{ width: "34px", height: "34px", background: (semSupabase || bancoFora) ? "var(--warn-bg)" : "var(--danger-bg)", display: "flex", alignItems: "center", justifyContent: "center", color: (semSupabase || bancoFora) ? "var(--warn)" : "var(--danger)", fontWeight: 700 }}>
              !
            </span>
            <div className="min-w-0">
              <h1 className="gc-display" style={{ fontSize: "20px", fontWeight: 600, color: "var(--ink)" }}>
                {semSupabase ? "O backend está de pé, mas o banco não está configurado"
                  : bancoFora ? "O backend está de pé, mas o banco não responde"
                  : "O backend não está rodando"}
              </h1>
              <p style={{ marginTop: "10px", fontSize: "15px", lineHeight: 1.5, color: "var(--ink-soft)", wordBreak: "break-word" }}>
                {problema.motivo}
              </p>
            </div>
          </div>

          <div style={{ marginTop: "20px", padding: "14px 16px", borderRadius: "12px", background: "var(--surface-sunken)", border: "1px solid var(--line)" }}>
            <p style={{ fontSize: "13px", fontWeight: 600, color: "var(--slate)", letterSpacing: "0.02em" }}>O QUE FAZER</p>
            {bancoFora ? (
              /endereço|DNS/i.test(problema.motivo || "") ? (
              <ol className="space-y-1" style={{ marginTop: "8px", fontSize: "14px", lineHeight: 1.55, color: "var(--ink-soft)", paddingLeft: "18px", listStyleType: "decimal" }}>
                <li>O <strong>run-crm.bat está certo</strong> — ele respondeu ao teste. Não precisa reiniciar nada.</li>
                <li>Abra <strong>dashboard.supabase.com</strong> e veja o projeto do banco: se estiver <strong>Paused</strong>, clique em <strong>Restore/Resume</strong>; se não estiver mais na lista, ele foi apagado ou arquivado.</li>
                <li>Copie a <strong>Project URL</strong> atual do painel e confira se é a mesma linha <strong>SUPABASE_URL</strong> do arquivo <strong>backend\\.env</strong>. Se mudou, cole a nova, feche e abra o run-crm.bat de novo.</li>
                <li>Se o projeto for outro (novo), rode <strong>backend/database/banco_novo.sql</strong> no SQL Editor dele para criar as tabelas antes de entrar.</li>
              </ol>
              ) : (
              <ol className="space-y-1" style={{ marginTop: "8px", fontSize: "14px", lineHeight: 1.55, color: "var(--ink-soft)", paddingLeft: "18px", listStyleType: "decimal" }}>
                <li>O backend e o banco estão falando um com o outro. O que falta é a <strong>estrutura</strong>: este projeto do Supabase ainda não tem as tabelas do CRM.</li>
                <li>Abra <strong>dashboard.supabase.com</strong> → projeto atual → <strong>SQL Editor</strong>.</li>
                <li>Cole o conteúdo inteiro de <strong>backend\database\banco_novo.sql</strong> e clique em <strong>Run</strong>. No fim ele mostra quantas tabelas e usuários existem.</li>
                <li>Clique em <strong>Tentar agora</strong> aqui nesta tela (não precisa recarregar a página) e entre com a senha inicial.</li>
              </ol>
              )
            ) : (
              <ol className="space-y-1" style={{ marginTop: "8px", fontSize: "14px", lineHeight: 1.55, color: "var(--ink-soft)", paddingLeft: "18px", listStyleType: "decimal" }}>
                <li>Procure a janela preta <strong>“Backend CRM - API”</strong>. Se ela estiver fechada, é isso: o servidor foi desligado.</li>
                <li>Abre o <strong>run-crm.bat</strong> de novo e deixe a janela aberta.</li>
                <li>Não precisa recarregar esta página. Assim que o backend responder, os seus dados aparecem sozinhos.</li>
              </ol>
            )}
          </div>

          <div className="flex items-center justify-between flex-wrap" style={{ gap: "12px", marginTop: "20px" }}>
            <span style={{ fontSize: "13px", color: "var(--slate)" }}>
              {tentando ? "Testando de novo agora..." : `Nova tentativa automática a cada 5 s · último teste às ${hora}${problema.tentativas > 1 ? ` (${problema.tentativas} tentativas)` : ""}`}
            </span>
            <div className="flex items-center" style={{ gap: "8px" }}>
              <Button onClick={onTentarAgora} disabled={tentando}>Tentar agora</Button>
              <button type="button" onClick={() => window.location.reload()} className="gc-focus gc-pressable rounded-lg" style={{ fontSize: "13px", color: "var(--slate)", background: "transparent", border: "none", padding: "8px 10px", textDecoration: "underline", textUnderlineOffset: "2px" }}>
                Recarregar a página
              </button>
            </div>
          </div>

          <p style={{ marginTop: "16px", fontSize: "12px", color: "var(--slate)", wordBreak: "break-all" }}>
            Endereço que o app está tentando usar: {problema.url}
            <button
              type="button"
              className="gc-focus"
              style={{ marginLeft: "8px", fontSize: "12px", color: "var(--accent-ink)", background: "transparent", border: "none", padding: 0, cursor: "pointer", textDecoration: "underline", textUnderlineOffset: "2px" }}
              onClick={() => {
                const url = window.prompt("Endereço do backend (deixe em branco para usar o padrão desta máquina):", crmApi.getBaseUrl());
                if (url === null) return;
                crmApi.setBaseUrl(url);
                onTentarAgora();
              }}
            >
              mudar endereço
            </button>
          </p>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   ROOT APP
   ========================================================================= */

function App() {
  const [currentUser, setCurrentUser] = useState(() => {
    const id = readSessionUserId();
    /* Readota o nome guardado no login anterior, para quem entrou pelo link da
       equipe continuar com o rótulo certo depois de recarregar a página. */
    if (id) ensureKnownUser(id, readSessionName(id));
    return id;
  });
  const [db, rawDispatch] = useReducer(dbReducer, initialDb);
  const [apiStatus, setApiStatus] = useState("checking");
  /* O problema real com o backend (desligado, HTTP 500, timeout, Supabase sem
     chave) guarda aqui: motivo, endereço e a hora da última tentativa. Enquanto
     este estado existir, nenhuma tela de dados é mostrada. */
  const [apiProblem, setApiProblem] = useState(null);
  const tentativasRef = useRef(0);
  const [bootLoading, setBootLoading] = useState(true);
  const [view, setView] = useState("dashboard");
  const [search, setSearch] = useState("");
  const [leadsFilter, setLeadsFilter] = useState({});
  const [leadsViewMode, setLeadsViewMode] = useState("list");
  /* Status do atendimento (os 8 estados do menu do chat) para a tela de Leads.
     A fonte é a conversa de WhatsApp, então aqui só se lê a lista resumida —
     nenhuma coluna nova é criada no lead. */
  const [waConversations, setWaConversations] = useState([]);
  const waPolling = useRef(false);
  const [selectedLeadId, setSelectedLeadId] = useState(null);
  const [initialTab, setInitialTab] = useState("geral");
  const [showLeadForm, setShowLeadForm] = useState(false);
  const leadFormOpenedFromEnrichment = useRef(false);
  const [showLeadImport, setShowLeadImport] = useState(false);
  const [deletingLeadId, setDeletingLeadId] = useState(null);
  const deleteInProgress = useRef(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(() => {
    try {
      return window.localStorage.getItem("crm_sidebar_collapsed") === "1";
    } catch (error) {
      return false;
    }
  });
  const toggleSidebar = () => setSidebarCollapsed(value => {
    const next = !value;
    try {
      window.localStorage.setItem("crm_sidebar_collapsed", next ? "1" : "0");
    } catch (error) {
      return next;
    }
    return next;
  });
  const [, forceTick] = useState(0);
  const searchInputRef = useRef(null);
  const { toasts, notify } = useToastStack();

  /* Aviso na tela de entrada quando o backend devolve 401 numa chamada de dados:
       sessão vencida, ou navegador que ainda não digitou a senha. */
  const [sessaoExpirada, setSessaoExpirada] = useState("");
  const logadoRef = useRef(Boolean(currentUser));
  useEffect(() => {
    logadoRef.current = Boolean(currentUser);
  }, [currentUser]);

  const handleLogout = () => {
    /* Sai de verdade: apaga o token guardado e pede para o backend limpar o
       cookie. Assim o mesmo computador, depois de sair, exige a senha de novo. */
    if (window.CrmSession) window.CrmSession.clear();
    crmApi.auth.logout();
    clearSessionUserId();
    setSessaoExpirada("");
    setSenhaInicialPendente(false);
    setAvisoSenhaDispensado(false);
    setCurrentUser(null);
  };

  /* Quem ainda está com a SENHA INICIAL compartilhada vê uma faixa no topo de
     todas as telas, com botão para criar a senha própria. A fonte do "ainda
     está com a senha inicial" é o backend (must_change_password do usuário);
     sem backend — modo local — é o registro que o navegador guarda.
     A faixa é aviso, não portão: ninguém é bloqueado de usar o CRM, e "Agora
     não" só esconde ela até a próxima vez que a pessoa entrar. */
  const [senhaInicialPendente, setSenhaInicialPendente] = useState(false);
  const [avisoSenhaDispensado, setAvisoSenhaDispensado] = useState(false);

  const conferirSenhaInicial = useCallback(async (userId) => {
    if (!userId) return false;
    const status = await authStatusThroughApi(userId);
    if (status && typeof status.mustChangePassword === "boolean") return status.mustChangePassword;
    const registro = readAuthRecord(userId);
    return Boolean(registro && registro.mustChangePassword !== false);
  }, []);

  useEffect(() => {
    if (!currentUser) {
      setSenhaInicialPendente(false);
      return undefined;
    }
    let vivo = true;
    conferirSenhaInicial(currentUser)
      .then((pendente) => { if (vivo) setSenhaInicialPendente(pendente); })
      .catch(() => { if (vivo) setSenhaInicialPendente(false); });
    return () => { vivo = false; };
  }, [currentUser, conferirSenhaInicial]);

  /* Usado pelo painel do nome e pela faixa: a senha mudou, então o aviso sai e
     a pessoa continua na mesma tela, logada com a sessão nova que o backend
     devolveu junto com a resposta. */
  const senhaTrocada = () => {
    setSenhaInicialPendente(false);
    setAvisoSenhaDispensado(false);
    notify("Senha alterada. Você continua usando o CRM.");
  };

  /* Quando o portão de sessão fecha, o fetch global (js/session.js) emite este
     evento. O app devolve a pessoa para a tela de entrada com a explicação, em vez
     de deixar uma tela de dados vazia ou um aviso vermelho de "backend offline". */
  useEffect(() => {
    if (!window.CrmSession || typeof window.CrmSession.onUnauthorized !== "function") return undefined;
    return window.CrmSession.onUnauthorized(() => {
      if (!logadoRef.current) return;
      if (window.CrmSession) window.CrmSession.clear();
      clearSessionUserId();
      setSessaoExpirada("Sua sessão do CRM terminou. Digite a senha de novo para voltar aos dados.");
      setCurrentUser(null);
    });
  }, []);

  /* Uma rodada com o backend: pergunta o /health, só pede os dados se ele
     respondeu, e guarda o MOTIVO quando não respondeu (conexão recusada, HTTP
     500, timeout, Supabase sem chave). A mesma função serve para a abertura da
     tela, para a sincronização de 5 s e para a nova tentativa automática do
     aviso — é por ela que o aviso sai da sozinho quando o backend volta. */
  const tentaBackend = useCallback(async ({ silencioso = false } = {}) => {
    if (!silencioso) setBootLoading(true);
    const health = await crmApi.health();
    const falha = (tipo, motivo) => {
      tentativasRef.current += 1;
      setApiStatus(tipo === "sem-supabase" ? "unconfigured" : "offline");
      setApiProblem({ tipo, motivo, url: health.url, em: new Date(), tentativas: tentativasRef.current });
      /* Banco limpo: sem o backend de pé não existe dado nenhum para mostrar, e
         é exatamente isso que a tela de erro diz. */
      rawDispatch({ type: "SET_DB", db: { ...initialDb } });
      if (!silencioso) setBootLoading(false);
      return false;
    };
    if (!health.ok) return falha("offline", health.error || `Nenhum backend respondeu em ${health.url}.`);
    if (health.database !== "configurado") {
      return falha("sem-supabase", "O backend está de pé, mas o banco dele não está configurado. Abra o arquivo backend\\.env e confira SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY; depois feche e abra o run-crm.bat de novo.");
    }
    /* O backend está de pé e o .env tem as duas linhas, mas a consulta de
       teste do /health não passou no banco. É aqui que a tela para de mandar
       reiniciar o run-crm.bat: o servidor estava ótimo, quem caiu foi o
       projeto do Supabase (pausado, apagado, ou URL de outro projeto). */
    if (health.dbCheck && health.dbCheck.ok === false) {
      return falha("banco-fora", `O backend consultou o banco e não conseguiu falar com ele: ${health.dbCheck.motivo}`);
    }
    /* Ainda não entrou? Então não há dados para pedir: o portão de sessão devolve
       401 em tudo, e chamar loadAll() aqui produziria o aviso vermelho "o backend
       não está respondendo" na tela de entrada — mentira. O backend está de pé,
       quem falta é a senha. A partir daqui a tela só mostra o formulário. */
    if (!logadoRef.current) {
      setApiStatus("connected");
      setApiProblem(null);
      tentativasRef.current = 0;
      return true;
    }
    try {
      const remoteDb = await crmApi.loadAll();
      rawDispatch({ type: "SET_DB", db: remoteDb || { ...initialDb } });
      setApiStatus("connected");
      setApiProblem(null);
      tentativasRef.current = 0;
      return true;
    } catch (error) {
      if (error && error.sessionExpired) {
        /* A sessão venceu no meio do uso (ou o link foi aberto sem senha): volta
           para a entrada com o aviso de senha, e não com o "backend não
           responde", que seria mentira — ele está respondendo muito bem. */
        if (window.CrmSession) window.CrmSession.clear();
        clearSessionUserId();
        rawDispatch({ type: "SET_DB", db: { ...initialDb } });
        setApiStatus("connected");
        setApiProblem(null);
        tentativasRef.current = 0;
        setCurrentUser(null);
        setSessaoExpirada("Sua sessão do CRM terminou. Digite a senha de novo para voltar aos dados.");
        return false;
      }
      console.error("Falha ao carregar dados do Supabase:", error);
      /* Se a mensagem carrega o motivo do banco (ver falhaBanco no backend), a
         tela é de banco, não de servidor: as instruções deixam de falar em
         run-crm.bat, que neste caso não tem culpa nenhuma. */
      const msg = error?.message || "falha inesperada";
      const eBanco = /motivo:|no banco|banco de dados/i.test(msg);
      return falha(eBanco ? "banco-fora" : "offline", eBanco
        ? `O backend está de pé, mas o banco dele não respondeu: ${msg}`
        : `O backend respondeu ao /health, mas não devolveu os leads (${msg}).`);
    } finally {
      if (!silencioso) setBootLoading(false);
    }
  }, []);

  /* Botão "Tentar agora" do aviso: faz uma rodada silenciosa e mostra o spinner
     do botão enquanto o /health não responde. */
  const [tentandoAgora, setTentandoAgora] = useState(false);
  const retryNow = useCallback(() => {
    setTentandoAgora(true);
    Promise.resolve(tentaBackend({ silencioso: true })).finally(() => setTentandoAgora(false));
  }, [tentaBackend]);

  useEffect(() => {
    if (currentUser) {
      tentaBackend();
      return undefined;
    }
    /* Antes do login também conferimos: se o backend está desligado, a tela de
       entrada já mostra o aviso real em vez de deixar ele descobrir depois. */
    tentaBackend({ silencioso: true });
    return undefined;
  }, [currentUser, tentaBackend]);

  useEffect(() => {
    if (!currentUser || apiStatus !== "connected") return undefined;

    let syncing = false;
    const syncSilently = async () => {
      if (syncing || document.visibilityState !== "visible") return;
      syncing = true;
      /* A sincronização também é a vigilância: se o backend cair com a tela
         aberta, tentaBackend devolve false e o aviso volta para o lugar. */
      try { await tentaBackend({ silencioso: true }); } finally { syncing = false; }
    };
    const intervalId = window.setInterval(syncSilently, 5000);
    document.addEventListener("visibilitychange", syncSilently);
    return () => {
      window.clearInterval(intervalId);
      document.removeEventListener("visibilitychange", syncSilently);
    };
  }, [currentUser, apiStatus, tentaBackend]);

  /* O aviso fica na tela até o backend responder de novo: a cada 5 s, e também no
     instante em que ele volta para esta aba, uma tentativa é feita. Quando dá
     certo, o próprio tentaBackend limpa o estado e as telas aparecem cheias. */
  useEffect(() => {
    if (!apiProblem) return undefined;
    let tentando = false;
    const retenta = async () => {
      if (tentando) return;
      tentando = true;
      try { await tentaBackend({ silencioso: true }); } finally { tentando = false; }
    };
    const intervalId = window.setInterval(retenta, 5000);
    const onVisible = () => { if (document.visibilityState === "visible") retenta(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      window.clearInterval(intervalId);
      document.removeEventListener("visibilitychange", onVisible);
    };
  }, [apiProblem, tentaBackend]);

  /* Lista resumida das conversas, para a tela de Leads mostrar o status do
     atendimento. É o mesmo pedido que o chat já faz a cada 2,5 s; aqui a
     cadência pode ser mais calma porque a tela só precisa acompanhar o chat.
     Sem WhatsApp conectado o pedido falha e a tela de Leads segue igual. */
  const refreshWaStatuses = useCallback(async () => {
    if (waPolling.current || document.visibilityState !== "visible") return;
    waPolling.current = true;
    try {
      const next = await crmApi.whatsapp.conversations();
      setWaConversations(Array.isArray(next) ? next : []);
    } catch (error) {
      /* Silencioso de propósito: o erro do WhatsApp não pertence à tela de
         Leads e não deve aparecer como aviso por cima dos leads. */
    } finally {
      waPolling.current = false;
    }
  }, []);

  useEffect(() => {
    if (!currentUser || apiStatus !== "connected") return undefined;
    refreshWaStatuses();
    const intervalId = window.setInterval(refreshWaStatuses, 8000);
    const onVisible = () => { if (document.visibilityState === "visible") refreshWaStatuses(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      window.clearInterval(intervalId);
      document.removeEventListener("visibilitychange", onVisible);
    };
  }, [currentUser, apiStatus, refreshWaStatuses]);

  const waStatusByLead = useMemo(
    () => conversationStatusByLead(waConversations, db.leads),
    [waConversations, db.leads]
  );

  /* Mudar o status na ficha do lead é mudar na conversa: a mesma chamada do menu
     do chat, então o chat mostra o novo status no próximo clique e a próxima
     mensagem continua mandando a transição automática sozinha. */
  const changeLeadConversationStatus = async (lead, status) => {
    try {
      /* O lead pode ainda não ter conversa (nunca trocou mensagem): ela é aberta
         pelo telefone do próprio lead, exatamente como o botão verde da lista. */
      let current = waStatusByLead[lead.id]
        ? waConversations.find(item => item.id === waStatusByLead[lead.id].id) || waStatusByLead[lead.id]
        : findConversationForLead(lead, waConversations);
      if (!current?.id) current = await crmApi.whatsapp.openLeadConversation(lead.id);
      if (!current?.id) throw new Error("Este lead não tem um número de WhatsApp ou telefone válido cadastrado.");
      const updated = current.status === status
        ? current
        : await crmApi.whatsapp.updateConversationStatus(current.id, status);
      const summary = {
        id: updated.id,
        contact: updated.contact,
        status: updated.status,
        unreadCount: updated.unreadCount || 0,
        lastMessage: updated.lastMessage || null,
      };
      setWaConversations(previous => [summary, ...previous.filter(item => item.id !== summary.id)]);
      notify(`Atendimento: ${summary.status}`);
    } catch (error) {
      notify(error.message || "Não foi possível alterar o status do atendimento.", "error");
    }
  };

  const handleSeedDemo = async () => {
    notify("Importando dados de exemplo para o Supabase...");
    try {
      const freshDb = await crmApi.seedDemoData();
      rawDispatch({ type: "SET_DB", db: freshDb });
      notify("Dados salvos no Supabase com sucesso!");
    } catch (err) {
      notify("Erro na importação: " + err.message, "danger");
    }
  };

  const dispatch = useCallback((action) => {
    // 1. Atualização otimista imediata na interface local
    rawDispatch(action);

    // 2. Persistência assíncrona na API do backend -> Supabase
    if (apiStatus !== "connected") return;
    (async () => {
      try {
        switch (action.type) {
          case "ADD_LEAD": {
            const res = await crmApi.leads.create(action.lead);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao gravar lead");
            break;
          }
          case "UPDATE_LEAD": {
            const res = await crmApi.leads.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.message || res?.error?.message || "Falha ao atualizar lead");
            break;
          }
          case "CHANGE_STATUS": {
            const res = await crmApi.leads.changeStatus(action.id, action.status, action.user);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao alterar status");
            break;
          }
          case "SET_LOSS_REASON": {
            const res = await crmApi.leads.update(action.id, { lossReason: action.reason });
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar motivo");
            break;
          }
          case "SET_NEXT_ACTION": {
            const res = await crmApi.leads.update(action.leadId, { nextAction: action.nextAction });
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar próxima ação");
            break;
          }
          case "ADD_INTERACTION": {
            const res = await crmApi.leads.addInteraction(action.leadId, action.interaction);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar contato");
            break;
          }
          case "ADD_FOLLOWUP": {
            const res = await crmApi.followups.create(action.followup);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar follow-up");
            break;
          }
          case "UPDATE_FOLLOWUP": {
            const res = await crmApi.followups.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao atualizar follow-up");
            break;
          }
          case "ADD_AGENDA_EVENT": {
            const res = await crmApi.agenda.create(action.event);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar evento da agenda");
            break;
          }
          case "UPDATE_AGENDA_EVENT": {
            const res = await crmApi.agenda.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao atualizar evento da agenda");
            break;
          }
          case "ADD_DEMO": {
            const res = await crmApi.demos.create(action.demo);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar demonstração");
            break;
          }
          case "UPDATE_DEMO": {
            const res = await crmApi.demos.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao atualizar demonstração");
            break;
          }
          case "ADD_PROPOSAL": {
            const res = await crmApi.proposals.create(action.proposal);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar proposta");
            break;
          }
          case "UPDATE_PROPOSAL": {
            const res = await crmApi.proposals.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao atualizar proposta");
            break;
          }
          case "CONVERT_TO_CLIENT": {
            const res = await crmApi.clients.create(action.client);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar cliente");
            break;
          }
          case "UPDATE_CLIENT": {
            const res = await crmApi.clients.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.error?.message || res?.message || "Falha ao atualizar cliente");
            break;
          }
          case "ADD_CLIENT_UPDATE": {
            const res = await crmApi.clientUpdates.create(action.update);
            if (!res || !res.success) throw new Error(res?.error?.message || "Falha ao salvar alteração do cliente");
            break;
          }
          case "ADD_FINANCE_SALE": {
            const res = await crmApi.finance.sales.create(action.sale);
            if (!res || !res.success) throw new Error(res?.message || res?.error?.message || "Falha ao lançar a venda avulsa");
            break;
          }
          case "ADD_FINANCE_SALE_WITH_PAYMENT": {
            const saleRes = await crmApi.finance.sales.create(action.sale);
            if (!saleRes || !saleRes.success) throw new Error(saleRes?.message || saleRes?.error?.message || "Falha ao lançar a venda avulsa");
            const paymentRes = await crmApi.finance.payments.create(action.payment);
            if (!paymentRes || !paymentRes.success) throw new Error(paymentRes?.message || paymentRes?.error?.message || "Falha ao lançar o recebimento");
            break;
          }
          case "UPDATE_FINANCE_SALE": {
            const res = await crmApi.finance.sales.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.message || res?.error?.message || "Falha ao atualizar a venda avulsa");
            break;
          }
          case "ADD_FINANCE_PAYMENT": {
            const res = await crmApi.finance.payments.create(action.payment);
            if (!res || !res.success) throw new Error(res?.message || res?.error?.message || "Falha ao lançar o recebimento");
            break;
          }
          /* ADD_FINANCE_PAYMENTS (as mensalidades do mês) fica fora desta lista de
             propósito: quem chama a API é o botão da tela, que recebe do servidor
             exatamente as linhas criadas e as entrega prontas para o reducer.
             Passar por aqui gravaria cada mensalidade duas vezes. */
          case "UPDATE_FINANCE_PAYMENT": {
            const res = await crmApi.finance.payments.update(action.id, action.patch);
            if (!res || !res.success) throw new Error(res?.message || res?.error?.message || "Falha ao atualizar o recebimento");
            break;
          }
          case "SET_FINANCE_SETTINGS": {
            const res = await crmApi.finance.settings.save(action.settings.commissionPercent);
            if (!res || !res.success) throw new Error(res?.message || res?.error?.message || "Falha ao salvar o percentual de comissão");
            break;
          }
          default:
            break;
        }
      } catch (err) {
        console.error("Erro de persistência no Supabase:", err);
        notify("Aviso Supabase: " + (err.message || "Erro ao persistir"), "error");
      }
    })();
  }, [apiStatus, notify]);

  /* Re-render periodically so demo countdowns and "atrasado" badges stay live
     without the person needing to refresh. */
  useEffect(() => {
    const id = setInterval(() => forceTick(t => t + 1), 30000);
    return () => clearInterval(id);
  }, []);

  /* Ctrl/Cmd+K jumps straight into the global search — a modern, low-click
     way to reach any lead, client or proposal from anywhere in the app. */
  useEffect(() => {
    function handleKey(e) {
      const isNewLeadShortcut = (e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === "n";
      const isNewLeadFallback = e.ctrlKey && e.altKey && e.key.toLowerCase() === "n";
      if (isNewLeadShortcut || isNewLeadFallback) {
        e.preventDefault();
        e.stopPropagation();
        if (currentUser && !bootLoading && !showLeadForm) {
          setShowLeadForm(true);
        }
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        searchInputRef.current?.focus();
        searchInputRef.current?.select();
      }
    }
    window.addEventListener("keydown", handleKey, true);
    return () => window.removeEventListener("keydown", handleKey, true);
  }, [bootLoading, currentUser, showLeadForm]);

  const sel = useSelectors(db);

  if (!currentUser) return <LoginScreen onLogin={(id) => { setSessaoExpirada(""); setCurrentUser(id); }} apiProblem={apiProblem} sessaoExpirada={sessaoExpirada} onTentarAgora={retryNow} tentando={tentandoAgora} />;

  if (bootLoading) {
    return (
      <div className="gc-root flex items-center justify-center min-h-screen">
        <Tokens />
        <div className="flex flex-col items-center gap-3">
          <span className="gc-spinner" aria-hidden="true" />
          <p className="text-sm" style={{ color: "var(--ink-soft)" }}>Carregando dados...</p>
        </div>
      </div>
    );
  }

  /* Backend não respondeu (ou respondeu sem banco): nenhuma tela de dados aparece.
     O aviso ocupa o lugar inteiro e só sai quando o /health voltar a responder. */
  if (apiProblem) {
    return <BackendProblemScreen problema={apiProblem} onTentarAgora={retryNow} tentando={tentandoAgora} />;
  }

  /* Abrir a ficha também puxa o status do atendimento na hora: assim o que ele
     acabou de mudar no chat já aparece, sem esperar o próximo ciclo de 8 s. */
  const openLead = (id, tab) => { setSelectedLeadId(id); setInitialTab(tab || "geral"); refreshWaStatuses(); };

  const handleCreateLead = (form) => {
    leadFormOpenedFromEnrichment.current = false;
    const id = `l_${Date.now()}`;
    /* A tela única manda também os campos comerciais; aqui eles viram as
       colunas do lead. Score começa zerado e só é ajustável na edição. */
    const { status, lossReason, nextActionDate, nextActionNote, score, ...rest } = form;
    const company = (rest.company || "").trim();
    const contactName = (rest.contactName && rest.contactName.trim()) ? rest.contactName.trim() : company;
    const actionDate = (nextActionDate || "").trim();
    const actionNote = (nextActionNote || "").trim();
    const leadData = {
      id,
      ...rest,
      company,
      contactName,
      status: status || "Contato pendente",
      ...(status === "Perdido" && lossReason ? { lossReason } : {}),
      createdAt: new Date().toISOString(),
      lastContactAt: null,
      nextAction: (!actionDate && !actionNote)
        ? null
        : { date: actionDate ? new Date(actionDate).toISOString() : null, note: actionNote },
      score: score || { dor: 0, facilidade: 0, pagamento: 0, recorrencia: 0 },
    };
    dispatch({
      type: "ADD_LEAD",
      lead: leadData,
    });
    /* Salvar fecha SOMENTE o formulário. Antes disso a rotina ainda trocava para
       a tela de leads e abria a ficha do lead novo — quem abria o cadastro pelo
       Ctrl+N dentro de outra tela era jogado de volta para o início da lista. */
    setShowLeadForm(false);
    notify("Lead salvo no Supabase.");
  };

  const handleImportLeads = async (records) => {
    const failures = [];
    let succeeded = 0;
    for (const [index, record] of records.entries()) {
      const ownerValue = (record.owner || currentUser).trim();
      const owner = USERS.find(user => user.id.toLowerCase() === ownerValue.toLowerCase() || user.name.toLowerCase() === ownerValue.toLowerCase())?.id || ownerValue;
      const company = record.company.trim();
      const lead = {
        id: `l_${Date.now()}_${index}`,
        company,
        contactName: (record.contactName || "").trim() || company,
        phone: record.phone || "",
        whatsapp: record.whatsapp || "",
        instagram: record.instagram || "",
        gmaps: record.gmaps || "",
        currentSite: record.currentSite || "",
        city: record.city || "",
        neighborhood: record.neighborhood || "",
        segment: record.segment || SEGMENTS[0],
        notes: record.notes || "",
        owner,
        priority: record.priority || "Média",
        temperature: "Frio",
        source: record.source || SOURCES[0],
        status: "Contato pendente",
        createdAt: new Date().toISOString(),
        lastContactAt: null,
        nextAction: { date: daysFromNow(0, 17, 0), note: "Primeiro contato" },
        score: { dor: 0, facilidade: 0, pagamento: 0, recorrencia: 0 },
      };
      try {
        const response = await crmApi.leads.create(lead);
        if (!response?.success) throw new Error(response?.message || response?.error?.message || "Falha ao cadastrar lead.");
        succeeded += 1;
      } catch (error) {
        failures.push({ row: record.row, message: error.message || "Falha ao cadastrar lead." });
      }
    }
    try {
      const refreshedDb = await crmApi.loadAll();
      rawDispatch({ type: "SET_DB", db: refreshedDb });
    } catch (error) {
      notify("Leads cadastrados, mas não foi possível atualizar a lista. Recarregue a página.", "error");
    }
    if (succeeded) {
      setView("leads");
      notify(`${succeeded} ${succeeded === 1 ? "lead cadastrado" : "leads cadastrados"}.`);
    }
    return { succeeded, failures };
  };

  const handleDeleteLead = async (lead) => {
    if (deleteInProgress.current) return;
    if (db.clients.some(c => c.leadId === lead.id)) {
      notify("Este lead possui um cliente vinculado e não pode ser excluído.", "error");
      return;
    }
    if (!window.confirm(`Excluir definitivamente o lead "${lead.company}"?\n\nO histórico, follow-ups, demos e propostas deste lead também serão apagados. Esta ação não pode ser desfeita.`)) return;
    deleteInProgress.current = true;
    setDeletingLeadId(lead.id);
    try {
      const res = await crmApi.leads.remove(lead.id);
      if (!res?.success) throw new Error(res?.message || "Não foi possível excluir o lead.");
      rawDispatch({ type: "DELETE_LEAD", id: lead.id });
      setSelectedLeadId(id => id === lead.id ? null : id);
      /* Não existe estado separado de "lead em edição": a edição é a própria
         ficha, que acabamos de fechar acima. (Aqui havia um
         setEditingLead(...) herdado de outra versão do app — sem estado
         correspondente, ele dava ReferenceError e o aviso de sucesso nunca
         aparecia, só "setEditingLead is not defined".) */
      notify("Lead excluído definitivamente.");
    } catch (err) {
      notify(err.message || "Não foi possível excluir o lead.", "error");
    } finally {
      deleteInProgress.current = false;
      setDeletingLeadId(null);
    }
  };

  /* Editar não abre mais modal: a ficha do lead É a tela de edição, então o
     botão "Editar" da lista só leva para a aba Visão geral da ficha. */
  const handleEditLead = (lead) => {
    openLead(lead.id, "geral");
  };

  const setLeadsFilterAndGo = (patch) => setLeadsFilter(f => ({ ...f, ...patch }));

  /* A conversa da ficha vem do mapa (leadId -> conversa) e, se o lead acabou de
     ser cadastrado ou_editado e ainda não está no mapa, do telefone dele. */
  const selectedLead = selectedLeadId ? db.leads.find(lead => lead.id === selectedLeadId) : null;
  const selectedLeadWaConversation = selectedLead
    ? waStatusByLead[selectedLead.id] || findConversationForLead(selectedLead, waConversations)
    : null;

  let body;
  if (view === "dashboard") {
    body = <Dashboard db={db} sel={sel} currentUser={currentUser} onOpenLead={openLead} setView={setView} setLeadsFilter={setLeadsFilterAndGo} setLeadsViewMode={setLeadsViewMode} dispatch={dispatch} notify={notify} />;
  } else if (view === "leads") {
    body = <LeadsView db={db} sel={sel} search={search} filter={leadsFilter} setFilter={setLeadsFilter} onOpenLead={openLead} onEditLead={handleEditLead} onDeleteLead={handleDeleteLead} deletingLeadId={deletingLeadId} onCreateLead={() => { leadFormOpenedFromEnrichment.current = false; setShowLeadForm(true); }} onImportLeads={() => setShowLeadImport(true)} currentUser={currentUser} viewMode={leadsViewMode} setViewMode={setLeadsViewMode} dispatch={dispatch} waStatusByLead={waStatusByLead} onChangeWaStatus={changeLeadConversationStatus} />;
  } else if (view === "agenda") {
    body = <AgendaView db={db} currentUser={currentUser} onOpenLead={openLead} dispatch={dispatch} notify={notify} />;
  } else if (view === "followups") {
    body = <FollowupsView sel={sel} onOpenLead={openLead} dispatch={dispatch} notify={notify} />;
  } else if (view === "demos") {
    body = <DemosView db={db} sel={sel} onOpenLead={openLead} dispatch={dispatch} notify={notify} />;
  } else if (view === "proposals") {
    body = <ProposalsView db={db} sel={sel} onOpenLead={openLead} dispatch={dispatch} notify={notify} />;
  } else if (view === "clients") {
    body = <ClientsView db={db} onOpenLead={openLead} dispatch={dispatch} notify={notify} />;
  } else if (view === "finance") {
    body = <FinanceiroView db={db} dispatch={dispatch} notify={notify} currentUser={currentUser} onOpenLead={openLead} onRetry={retryNow} tentandoDeNovo={tentandoAgora} />;
  } else if (view === "whatsapp") {
    body = <WhatsAppView currentUser={currentUser} />;
  } else if (view === "enrichment") {
    body = <EnrichmentView
      currentUser={currentUser}
      onImportRecords={handleImportLeads}
      onCreateLead={() => {
        leadFormOpenedFromEnrichment.current = true;
        setShowLeadForm(true);
      }}
      notify={notify}
    />;
  } else if (view === "reports") {
    body = <ReportsView db={db} sel={sel} onOpenLead={openLead} />;
  }

  return (
    <div className="gc-root flex">
      <Tokens />
      <Sidebar view={view} setView={setView} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} collapsed={sidebarCollapsed} onToggleCollapse={toggleSidebar} />
      <div className="flex-1 min-w-0">
        <Topbar
          db={db}
          currentUser={currentUser}
          setCurrentUser={setCurrentUser}
          search={search}
          onSearch={setSearch}
          attention={sel.attention}
          onOpenLead={openLead}
          onMenu={() => setMobileOpen(true)}
          onLogout={handleLogout}
          searchInputRef={searchInputRef}
          apiStatus={apiStatus}
          onSeedDemo={handleSeedDemo}
          onPasswordChanged={senhaTrocada}
        />
        {senhaInicialPendente && !avisoSenhaDispensado && (
          <div className={`pt-3 ${(view === "leads" || view === "enrichment") ? "px-3 sm:px-4 md:px-4 max-w-none" : "px-3 sm:px-4 md:px-6 max-w-[1200px] mx-auto"}`}>
            <AvisoSenhaInicial
              currentUser={currentUser}
              onDismissed={() => setAvisoSenhaDispensado(true)}
              onPasswordChanged={senhaTrocada}
            />
          </div>
        )}
        <main className={`py-4 sm:py-5 ${(view === "leads" || view === "enrichment") ? "px-3 sm:px-4 md:px-4 max-w-none" : "px-3 sm:px-4 md:px-6 max-w-[1200px] mx-auto"}`}>{body}</main>
      </div>

      {selectedLeadId && (
        <LeadDetail leadId={selectedLeadId} db={db} onClose={() => setSelectedLeadId(null)} currentUser={currentUser} dispatch={dispatch} notify={notify} initialTab={initialTab} onEditLead={handleEditLead} onDeleteLead={handleDeleteLead} waConversation={selectedLeadWaConversation} onChangeWaStatus={changeLeadConversationStatus} />
      )}
      {showLeadImport && <LeadImportModal onClose={() => setShowLeadImport(false)} onImport={handleImportLeads} />}
      {/* Único formulário de lead que abre em janela: cadastro novo. A edição
          acontece dentro da ficha (aba Visão geral), sem modal. */}
      {showLeadForm && (
        <LeadFormModal
          onClose={() => { leadFormOpenedFromEnrichment.current = false; setShowLeadForm(false); }}
          onSave={handleCreateLead}
          currentUser={currentUser}
        />
      )}
      <ToastStack toasts={toasts} />
    </div>
  );
}


const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(<App />);

  </script>

<script src="js/boot.js"></script>
</body>
</html>
